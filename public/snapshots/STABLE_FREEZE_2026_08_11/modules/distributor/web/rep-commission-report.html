<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="/core/pwa-init.js?v=1"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rep Commission Report - DIGIBIZ</title>
    <style>html.digibiz-sidebar-reserved body{margin-left:260px;}@media(max-width:768px){html.digibiz-sidebar-reserved body{margin-left:0;}}</style>
    <script>document.documentElement.classList.add('digibiz-sidebar-reserved');</script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="/core/firebase-init.js?v=100"></script>
    <script src="/scripts/admin-impersonation.js?v=100"></script>
    <script src="/core/dashboard-core.js?v=46"></script>
    <script src="/core/distributor-lorry-stock.js?v=1"></script>
    <script src="/core/auth-roles.js?v=120"></script>
    <script src="/core/sidebar.js?v=2001"></script>
    <script src="/modules/distributor/web/rep-commission-report.js?v=1"></script>
    <style>
        body{font-family:Inter,system-ui,sans-serif;background:#f3f4f6;margin:0;}
        .wrap{padding:22px;}
        .card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:16px;margin-bottom:12px;}
        .filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end;}
        input,select,button{font:inherit;} input,select{width:100%;padding:8px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;}
        button{padding:8px 12px;border:0;border-radius:8px;cursor:pointer;}
        .btn{background:#10b981;color:#fff;} .btn.alt{background:#e5e7eb;color:#111827;}
        table{width:100%;border-collapse:collapse;} th,td{padding:10px;border-bottom:1px solid #e5e7eb;font-size:13px;text-align:left;} th{background:#f9fafb;}
        .num{text-align:right;}
    </style>
</head>
<body>
<div id="sidebar-container"></div>
<div class="wrap">
    <div class="card"><h2 style="margin:0 0 6px;">Rep Commission Report</h2><p id="gateMsg" style="margin:0;color:#6b7280;font-size:13px;">Summary and per-order commission with payment status.</p></div>
    <div class="card">
        <div class="filters">
            <div><label>From</label><input id="fFrom" type="date"></div>
            <div><label>To</label><input id="fTo" type="date"></div>
            <div style="display:flex;gap:8px;"><button class="btn" id="btnCsv">Export CSV</button><button class="btn alt" id="btnPrint">Print</button></div>
        </div>
    </div>
    <div class="card">
        <h3 style="margin-top:0;">Summary by Rep</h3>
        <table><thead><tr><th>Rep</th><th class="num">Total Sales</th><th class="num">Total Commission</th><th class="num">Paid</th><th class="num">Pending</th></tr></thead><tbody id="sumRows"><tr><td colspan="5">Loading...</td></tr></tbody></table>
    </div>
    <div class="card">
        <h3 style="margin-top:0;">Order-Level Details</h3>
        <table><thead><tr><th>Order</th><th>Rep</th><th>Date</th><th class="num">Order Total</th><th class="num">Rate</th><th class="num">Commission</th><th>Status</th><th>Action</th></tr></thead><tbody id="detailRows"><tr><td colspan="8">Loading...</td></tr></tbody></table>
    </div>
</div>
</body>
</html>
