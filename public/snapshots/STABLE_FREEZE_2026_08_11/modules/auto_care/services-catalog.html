<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="/core/pwa-init.js?v=1"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repair & Services Master Catalog - DIGIBIZ Auto Care</title>
    <style>html.digibiz-sidebar-reserved body{margin-left:260px;}@media (max-width:768px){html.digibiz-sidebar-reserved body{margin-left:0;}}</style>
    <script>document.documentElement.classList.add('digibiz-sidebar-reserved');</script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="autocare-theme.css?v=3">
    
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
    
    <script src="/core/firebase-init.js?v=100"></script>
    <script src="/scripts/admin-impersonation.js?v=100"></script>
    <script src="/core/event-validation.js?v=3"></script>
    <script src="/core/event-bus.js?v=3"></script>
    <script src="/core/accounts-core.js?v=3"></script>
    <script src="/core/auth-roles.js?v=120"></script>
    <script src="/core/business-types.js?v=4"></script>
    <script src="/core/dashboard-core.js?v=3"></script>
    <script src="/core/subscription-manager.js?v=3"></script>
    <script src="/core/sidebar.js?v=2001"></script>
    <script src="autocare-utils.js?v=2"></script>
    
    <style>
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .controls-card { background: rgba(30, 41, 59, 0.85); border-radius: 16px; padding: 16px 20px; border: 1px solid #334155; margin-bottom: 25px; display: flex; gap: 15px; align-items: center; }
        .search-box { flex: 1; position: relative; }
        .search-box input { width: 100%; padding: 10px 14px 10px 40px; }
        .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #64748b; }
    </style>
</head>
<body>

    <div class="header-bar">
        <div>
            <h2 style="color:#38bdf8; font-size:24px; font-weight:800;"><i class="fa-solid fa-screwdriver-wrench"></i> Repair & Services Master Catalog</h2>
            <p style="color:#94a3b8; font-size:14px; margin-top:4px;">වැඩපළෙහි සිදුකරන අලුත්වැඩියා, සේවා පැකේජ සහ ඒවායේ මිල ගණන් පාලනය</p>
        </div>
        <button class="btn btn-primary" onclick="openServiceModal()"><i class="fa-solid fa-plus"></i> Add New Repair Service</button>
    </div>

    <div class="controls-card">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="serviceSearch" placeholder="Search Service Name, Category or Description..." onkeyup="renderServicesTable()">
        </div>
        <select id="catFilter" onchange="renderServicesTable()">
            <option value="ALL">All Categories</option>
            <option value="General Service">General Service</option>
            <option value="Engine & Mechanical">Engine & Mechanical</option>
            <option value="Brakes & Suspension">Brakes & Suspension</option>
            <option value="Auto Electrical & AC">Auto Electrical & AC</option>
            <option value="Tuning & Diagnostics">Tuning & Diagnostics</option>
        </select>
    </div>

    <div class="table-card" style="padding:0; overflow:hidden;">
        <table>
            <thead>
                <tr>
                    <th>Service Name & Category</th>
                    <th>Estimated Duration</th>
                    <th>Standard Price (LKR)</th>
                    <th>Service Notes</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="servicesBody">
                <!-- JS Populated -->
            </tbody>
        </table>
    </div>

    <!-- Modal Add/Edit Service Package -->
    <div class="modal" id="serviceModal" style="display:none;">
        <div class="modal-content" style="max-width:550px; padding:24px; border-radius:20px;">
            <h3 style="margin-bottom:15px; color:#38bdf8;" id="modalHeading">🛠️ Repair Service Package</h3>
            <form onsubmit="saveServicePackage(event)">
                <input type="hidden" id="srvId">
                <div style="display:flex; flex-direction:column; gap:12px;">
                    <div>
                        <label>Service / Repair Name *</label>
                        <input type="text" id="srvName" required placeholder="e.g. Full Oil & Filter Service" style="width:100%;">
                    </div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                        <div>
                            <label>Category *</label>
                            <select id="srvCat" style="width:100%;">
                                <option value="General Service">General Service</option>
                                <option value="Engine & Mechanical">Engine & Mechanical</option>
                                <option value="Brakes & Suspension">Brakes & Suspension</option>
                                <option value="Auto Electrical & AC">Auto Electrical & AC</option>
                                <option value="Tuning & Diagnostics">Tuning & Diagnostics</option>
                            </select>
                        </div>
                        <div>
                            <label>Estimated Hours</label>
                            <input type="text" id="srvDuration" placeholder="e.g. 1.5 Hours" style="width:100%;">
                        </div>
                    </div>
                    <div>
                        <label>Standard Labor Price (LKR) *</label>
                        <input type="number" id="srvPrice" required value="0" style="width:100%;">
                    </div>
                    <div>
                        <label>Service Description & Notes</label>
                        <textarea id="srvDesc" rows="3" placeholder="Details of work included in this service..." style="width:100%;"></textarea>
                    </div>
                </div>
                <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
                    <button type="button" class="btn btn-outline" onclick="document.getElementById('serviceModal').style.display='none'">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Service Package</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let servicesCatalog = [];

        function getBizId() {
            return window.AutoCareUtils ? window.AutoCareUtils.getBizId() : 'DEFAULT_BIZ';
        }

        function loadServicesCatalog() {
            const bizId = getBizId();
            const storageKey = `autocare_services_catalog_${bizId}`;
            const cached = localStorage.getItem(storageKey);

            if (cached) {
                try { servicesCatalog = JSON.parse(cached); } catch(e) { servicesCatalog = []; }
            } else {
                servicesCatalog = [
                    { id: 'SRV-1', name: 'Full Synthetic Engine Oil Service', cat: 'General Service', duration: '1 Hour', price: 4500, desc: 'Oil drain, filter replacement & 20 point safety check' },
                    { id: 'SRV-2', name: 'Front & Rear Brake Pad Replacement & Disc Lathe', cat: 'Brakes & Suspension', duration: '2 Hours', price: 6500, desc: 'Brake pad fitting, disc resurfacing & fluid top up' },
                    { id: 'SRV-3', name: 'High-Tech Computerized Engine Scan & Tuning', cat: 'Tuning & Diagnostics', duration: '1.5 Hours', price: 3500, desc: 'Full ECU OBD-II scan, error code reset & sensor checks' }
                ];
            }

            renderServicesTable();
        }

        function renderServicesTable() {
            const tbody = document.getElementById('servicesBody');
            const search = document.getElementById('serviceSearch').value.toLowerCase();
            const cat = document.getElementById('catFilter').value;

            tbody.innerHTML = '';
            const filtered = servicesCatalog.filter(s => {
                const matchSearch = (s.name||'').toLowerCase().includes(search) || (s.desc||'').toLowerCase().includes(search);
                const matchCat = cat === 'ALL' || s.cat === cat;
                return matchSearch && matchCat;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:40px; color:#64748b;">තවම කිසිදු සේවා හෝ අලුත්වැඩියා පැකේජයක් ඇතුළත් කර නොමැත. (No repair services cataloged)</td></tr>`;
                return;
            }

            filtered.forEach(s => {
                tbody.innerHTML += `
                    <tr>
                        <td><strong style="color:#ffffff;">${s.name}</strong><br><small style="color:#38bdf8;">${s.cat}</small></td>
                        <td>${s.duration || '-'}</td>
                        <td><strong style="color:#34d399; font-size:15px;">Rs. ${(s.price || 0).toLocaleString()}</strong></td>
                        <td><small style="color:#94a3b8;">${s.desc || '-'}</small></td>
                        <td>
                            <button class="btn btn-outline" style="padding:4px 8px; font-size:12px;" title="Edit" onclick="editService('${s.id}')"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button class="btn-danger-icon" title="Delete" onclick="deleteService('${s.id}')"><i class="fa-solid fa-trash-can"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        function openServiceModal() {
            document.getElementById('srvId').value = '';
            document.getElementById('modalHeading').innerText = '🛠️ Add New Repair Service';
            document.getElementById('srvName').value = '';
            document.getElementById('srvCat').value = 'General Service';
            document.getElementById('srvDuration').value = '1 Hour';
            document.getElementById('srvPrice').value = '0';
            document.getElementById('srvDesc').value = '';
            document.getElementById('serviceModal').style.display = 'flex';
        }

        function saveServicePackage(e) {
            e.preventDefault();
            const id = document.getElementById('srvId').value || 'SRV-' + Date.now();
            const name = document.getElementById('srvName').value.trim();
            const cat = document.getElementById('srvCat').value;
            const duration = document.getElementById('srvDuration').value.trim();
            const price = parseFloat(document.getElementById('srvPrice').value) || 0;
            const desc = document.getElementById('srvDesc').value.trim();

            const obj = { id, name, cat, duration, price, desc };
            const idx = servicesCatalog.findIndex(x => x.id === id);

            if (idx >= 0) servicesCatalog[idx] = obj;
            else servicesCatalog.unshift(obj);

            const bizId = getBizId();
            localStorage.setItem(`autocare_services_catalog_${bizId}`, JSON.stringify(servicesCatalog));

            document.getElementById('serviceModal').style.display = 'none';
            renderServicesTable();
            alert('✅ Repair Service Package saved to master catalog!');
        }

        function editService(id) {
            const s = servicesCatalog.find(x => x.id === id);
            if (!s) return;

            document.getElementById('srvId').value = s.id;
            document.getElementById('modalHeading').innerText = `✏️ Edit Service: ${s.name}`;
            document.getElementById('srvName').value = s.name;
            document.getElementById('srvCat').value = s.cat;
            document.getElementById('srvDuration').value = s.duration || '';
            document.getElementById('srvPrice').value = s.price || 0;
            document.getElementById('srvDesc').value = s.desc || '';
            document.getElementById('serviceModal').style.display = 'flex';
        }

        function deleteService(id) {
            if (confirm('ඔබට මෙම සේවා පැකේජය (Repair Service) මකා දැමීමට අවශ්‍ය බව තහවුරු කරන්න?')) {
                servicesCatalog = servicesCatalog.filter(x => x.id !== id);
                const bizId = getBizId();
                localStorage.setItem(`autocare_services_catalog_${bizId}`, JSON.stringify(servicesCatalog));
                renderServicesTable();
                alert('✅ Repair Service deleted!');
            }
        }

        window.onload = loadServicesCatalog;
    </script>
</body>
</html>
