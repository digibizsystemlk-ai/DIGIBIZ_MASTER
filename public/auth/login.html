<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <script src="/core/pwa-init.js?v=1"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DIGIBIZ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap&v=4" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css?v=4">
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
    <script src="../core/firebase-init.js?v=46"></script>
    <script src="../core/finalization-engine.js?v=1"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#10b981 0%,#059669 100%);min-height:100vh;display:flex;justify-content:center;align-items:center;}
        .login-card{background:white;border-radius:24px;padding:40px;width:100%;max-width:400px;box-shadow:0 20px 40px rgba(0,0,0,0.2);text-align:center;}
        h1{color:#1a1a2e;margin-bottom:8px;}
        .sub{color:#64748b;margin-bottom:24px;}
        input{width:100%;padding:12px;margin-bottom:16px;border:1px solid #e9ecef;border-radius:10px;font-size:14px;}
        button{width:100%;padding:14px;background:#10b981;color:white;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;margin-bottom:12px;}
        button:hover{background:#059669;}
        button:disabled{opacity:0.75;cursor:not-allowed;}
        .google-btn{background:#fff;color:#1a1a2e;border:1px solid #e9ecef;display:flex;align-items:center;justify-content:center;gap:10px;}
        .google-btn:hover{background:#f8f9fa;}
        .error{color:#ef4444;margin-bottom:16px;font-size:14px;}
        .register-link{text-align:center;margin-top:20px;}
        .forgot-link{display:block;text-align:right;font-size:12px;color:#0f766e;margin-top:-8px;margin-bottom:12px;cursor:pointer;}
        .reset-box{display:none;background:#f8fafc;border:1px solid #e2e8f0;padding:12px;border-radius:10px;margin-bottom:12px;text-align:left;}
        .reset-box.visible{display:block;}
        .reset-box p{font-size:12px;color:#475569;margin:0 0 8px;}
        .reset-inline{display:flex;gap:8px;}
        .reset-inline input{margin:0;}
        .reset-inline button{width:auto;padding:10px 12px;margin:0;}
        a{color:#10b981;text-decoration:none;}
        hr{margin:20px 0;border:1px solid #e9ecef;}
    </style>
</head>
<body>
    <div class="login-card">
        <h1>🔐 Welcome Back</h1>
        <p class="sub">Login to your account</p>
        <div id="error" class="error"></div>
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="password" placeholder="Password">
        <a id="forgotPasswordLink" class="forgot-link">Forgot Password?</a>
        <div id="resetBox" class="reset-box">
            <p>Enter your email to receive a password reset link.</p>
            <div class="reset-inline">
                <input type="email" id="resetEmail" placeholder="you@example.com">
                <button id="sendResetBtn" type="button">Send Link</button>
            </div>
        </div>
        <button id="loginBtn">Login</button>
        <hr>
        <button id="googleBtn" class="google-btn"><i class="fab fa-google"></i> Continue with Google</button>
        <div class="register-link">Don't have an account? <a href="register.html">Sign up</a></div>
    </div>

    <script src="../core/auth-utils.js?v=1"></script>
    <script>
        const loginBtn = document.getElementById('loginBtn');
        const googleBtn = document.getElementById('googleBtn');
        const errorDiv = document.getElementById('error');
        const forgotPasswordLink = document.getElementById('forgotPasswordLink');
        const resetBox = document.getElementById('resetBox');
        const sendResetBtn = document.getElementById('sendResetBtn');
        const loginBtnDefaultText = loginBtn.textContent;

        auth.onAuthStateChanged((user) => {
            if (user && window.AuthUI) {
                window.AuthUI.routeToUniversalDashboard(user);
            }
        });
        
        loginBtn.addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                errorDiv.textContent = 'Please enter email and password';
                return;
            }
            
            try {
                loginBtn.disabled = true;
                loginBtn.innerHTML = '⏳ Logging in...';
                await auth.signInWithEmailAndPassword(email, password);
                if (window.AuthUI) {
                    await window.AuthUI.routeToUniversalDashboard(auth.currentUser);
                }
            } catch (error) {
                if (error.code === 'auth/user-not-found') {
                    errorDiv.textContent = 'No account found. Please register first.';
                } else if (error.code === 'auth/wrong-password') {
                    errorDiv.textContent = 'Incorrect password';
                } else {
                    errorDiv.textContent = error.message;
                }
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = loginBtnDefaultText;
            }
        });
        
        googleBtn.addEventListener('click', async () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                const result = await auth.signInWithPopup(provider);
                const user = result.user;
                
                // Check if user exists in Firestore
                const userDoc = await db.collection('users').doc(user.uid).get();
                if (!userDoc.exists) {
                    // New Google user - redirect to complete registration
                    window.location.href = 'register.html?google=true';
                } else {
                    // Existing user - redirect to Universal Dashboard
                    if (window.AuthUI) {
                        await window.AuthUI.routeToUniversalDashboard(user);
                    }
                }
            } catch (error) {
                errorDiv.textContent = error.message;
            }
        });

        forgotPasswordLink.addEventListener('click', (e) => {
            e.preventDefault();
            resetBox.classList.toggle('visible');
            document.getElementById('resetEmail').value = document.getElementById('email').value || '';
        });

        sendResetBtn.addEventListener('click', async () => {
            const email = String(document.getElementById('resetEmail').value || '').trim();
            if (!email) {
                errorDiv.textContent = 'Please enter your email for password reset.';
                return;
            }
            try {
                sendResetBtn.disabled = true;
                sendResetBtn.textContent = 'Sending...';
                await auth.sendPasswordResetEmail(email);
                errorDiv.style.color = '#059669';
                errorDiv.textContent = 'Password reset link sent. Check your inbox.';
            } catch (error) {
                errorDiv.style.color = '#ef4444';
                errorDiv.textContent = error.message || 'Failed to send reset link.';
            } finally {
                sendResetBtn.disabled = false;
                sendResetBtn.textContent = 'Send Link';
            }
        });
    </script>
</body>
</html>
