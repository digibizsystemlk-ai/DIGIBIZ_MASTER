<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="/core/pwa-init.js?v=1"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales — DIGIBIZ</title>
    <style>html.digibiz-sidebar-reserved body{margin-left:260px;}@media (max-width:768px){html.digibiz-sidebar-reserved body{margin-left:0;}}</style>
    <script>document.documentElement.classList.add(\'digibiz-sidebar-reserved\');</script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="/core/firebase-init.js?v=100"></script>
    <script src="/scripts/admin-impersonation.js?v=100"></script>
    <script src="/core/auth-roles.js?v=120"></script>
    <script src="/core/dashboard-core.js?v=46"></script>
    <script src="/core/sidebar.js?v=2001"></script>
    <style>
        body{font-family:Inter,system-ui,sans-serif;background:#f3f4f6;margin:0;}
        .wrap{padding:24px;max-width:1200px;}
        h1{font-size:22px;color:#111827;}
        .sub{color:#64748b;font-size:13px;margin-bottom:16px;}
        .filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px;}
        .filters input,.filters select{padding:8px;border:1px solid #e5e7eb;border-radius:8px;}
        table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);}
        th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #e5e7eb;font-size:13px;}
        th{background:#f9fafb;font-weight:600;}
        .num{text-align:right;}
        .mode-grid{display:grid;grid-template-columns:repeat(3,minmax(120px,1fr));gap:10px;margin-bottom:12px;}
        .mode-card{background:#fff;border-radius:10px;padding:10px;border:1px solid #e5e7eb;}
        .mode-card h3{font-size:12px;color:#6b7280;margin-bottom:6px;}
        .mode-card p{font-size:15px;font-weight:700;margin:0;}
        .table-responsive { overflow-x: auto; }
    </style>
</head>
<body>
    <div class="wrap">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:12px;">
            <div>
                <h1 style="margin:0;">Sales (successful orders)</h1>
                <p class="sub" style="margin:4px 0 0 0;">Payment categories: Cash, Credit, Cheque (legacy “Bank” orders are shown as Credit).</p>
            </div>
            <a href="/modules/distributor/web/sales-history.html" style="background:#0f766e; color:#fff; padding:10px 18px; border-radius:10px; font-weight:700; text-decoration:none; font-size:13px; display:inline-flex; align-items:center; gap:6px;">📊 Product Sales History Report ➔</a>
        </div>
        <div class="filters">
            <input type="date" id="fromDate">
            <input type="date" id="toDate">
            <input type="text" id="repFilter" placeholder="Rep name">
            <input type="text" id="customerFilter" placeholder="Customer">
            <select id="paymentFilter">
                <option value="">Payment: All</option>
                <option value="CASH">Cash</option>
                <option value="CREDIT">Credit</option>
                <option value="CHEQUE">Cheque</option>
            </select>
            <select id="statusFilter">
                <option value="">Status: All</option>
                <option value="approved">approved</option>
                <option value="dispatched">dispatched</option>
                <option value="delivered">delivered</option>
            </select>
        </div>
        <div class="mode-grid" id="modeSummary"></div>
        <div id="out" class="table-responsive">Loading…</div>
    </div>
    <script>
        const allRows = [];
        function esc(s){return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
        function money(n){return 'Rs ' + (Number(n) || 0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});}
        function normalizePaymentMode(o){
            const raw = String(o.paymentMethod || o.paymentMode || '').trim().toUpperCase();
            if (raw.includes('CHEQUE') || raw.includes('CHECK')) return 'CHEQUE';
            if (raw.includes('CREDIT')) return 'CREDIT';
            if (raw === 'BANK' || raw === 'BANK_TRANSFER' || raw.includes('BANK')) return 'CREDIT';
            return 'CASH';
        }
        /** Order row time (ms) for sort/filter: orderDate (any shape) or createdAt. */
        function mwSalesRowSortMs(o) {
            const od = o.orderDate;
            if (od && typeof od.toDate === 'function') {
                const d = od.toDate();
                if (d && !isNaN(d.getTime())) return d.getTime();
            }
            if (od && typeof od.seconds === 'number') {
                return od.seconds * 1000 + Math.floor((od.nanoseconds || 0) / 1e6);
            }
            if (typeof od === 'string' && od) {
                const p = new Date(String(od).slice(0, 10) + 'T12:00:00');
                if (!isNaN(p.getTime())) return p.getTime();
            }
            const ca = o.createdAt;
            if (ca && typeof ca.toDate === 'function') {
                const d2 = ca.toDate();
                if (d2 && !isNaN(d2.getTime())) return d2.getTime();
            }
            if (ca && typeof ca.seconds === 'number') {
                return ca.seconds * 1000 + Math.floor((ca.nanoseconds || 0) / 1e6);
            }
            return 0;
        }
        /** Numeric key from orderNumber (higher = newer invoice); fallback digits from doc id. */
        function salesOrderSortKey(o, docId) {
            const raw = o.orderNumber;
            if (raw != null && raw !== '') {
                if (typeof raw === 'number' && !isNaN(raw)) return raw;
                const digits = String(raw).replace(/\D/g, '');
                if (digits) {
                    const slice = digits.length > 15 ? digits.slice(-15) : digits;
                    const n = parseInt(slice, 10);
                    if (!isNaN(n)) return n;
                }
            }
            const fb = String(docId || '').replace(/\D/g, '');
            if (fb) {
                const n2 = parseInt(fb.length > 15 ? fb.slice(-15) : fb, 10);
                if (!isNaN(n2)) return n2;
            }
            return 0;
        }
        /** Chunked doc().get() — huge Promise.all (100+ reps/shops) hung the page / hit Firestore limits. */
        async function fetchDocsAsMap(collectionName, ids) {
            const uniq = [...new Set((ids || []).filter(Boolean))];
            const map = {};
            const chunkSize = 12;
            for (let i = 0; i < uniq.length; i += chunkSize) {
                const chunk = uniq.slice(i, i + chunkSize);
                await Promise.all(chunk.map(async (id) => {
                    try {
                        const snap = await db.collection(collectionName).doc(id).get();
                        if (snap.exists) map[id] = snap.data();
                    } catch (e) { /* ignore per-doc */ }
                }));
            }
            return map;
        }
        function renderRows(){
            const from = document.getElementById('fromDate').value;
            const to = document.getElementById('toDate').value;
            const repQ = String(document.getElementById('repFilter').value || '').trim().toLowerCase();
            const cusQ = String(document.getElementById('customerFilter').value || '').trim().toLowerCase();
            const payQ = document.getElementById('paymentFilter').value;
            const stQ = document.getElementById('statusFilter').value;
            const fromD = from ? new Date(from + 'T00:00:00') : null;
            const toD = to ? new Date(to + 'T23:59:59') : null;
            const rows = allRows.filter((r) => {
                const t = Number(r.rowDateMs) || 0;
                if (fromD && (!t || t < fromD.getTime())) return false;
                if (toD && (!t || t > toD.getTime())) return false;
                if (repQ && !String(r.rep || '').toLowerCase().includes(repQ)) return false;
                if (cusQ && !String(r.customer || '').toLowerCase().includes(cusQ)) return false;
                if (payQ && r.pay !== payQ) return false;
                if (stQ && r.st !== stQ) return false;
                return true;
            });
            const modeTotals = rows.reduce((acc, row) => {
                acc[row.pay] = (acc[row.pay] || 0) + Number(row.total || 0);
                return acc;
            }, { CASH: 0, CREDIT: 0, CHEQUE: 0 });
            document.getElementById('modeSummary').innerHTML = ['CASH', 'CREDIT', 'CHEQUE']
                .map((mode) => `<div class="mode-card"><h3>${mode}</h3><p>${money(modeTotals[mode] || 0)}</p></div>`)
                .join('');
            document.getElementById('out').innerHTML = `
                <table>
                    <thead><tr><th>Invoice / Order</th><th>Customer</th><th class="num">Total</th><th>Rep</th><th>Payment</th><th>Status</th><th>Date</th></tr></thead>
                    <tbody>
                        ${rows.length ? rows.map((r) => `<tr><td>${esc(r.inv)}</td><td>${esc(r.customer)}</td><td class="num">${money(r.total)}</td><td>${esc(r.rep)}</td><td>${esc(r.pay)}</td><td>${esc(r.st)}</td><td>${esc(r.dt)}</td></tr>`).join('') : '<tr><td colspan="7">No matching successful orders.</td></tr>'}
                    </tbody>
                </table>`;
        }
        ['fromDate','toDate','repFilter','customerFilter','paymentFilter','statusFilter'].forEach((id)=>{
            document.getElementById(id).addEventListener('input', renderRows);
            document.getElementById(id).addEventListener('change', renderRows);
        });
        firebase.auth().onAuthStateChanged(async (user) => {
            if (!user) { window.location.href = '/'; return; }
            const outEl = document.getElementById('out');
            try {
                let bid = localStorage.getItem('currentBusinessId') || sessionStorage.getItem('currentBusinessId');
                if (!bid && window.dashboardCore && typeof window.dashboardCore.getContext === 'function') {
                    const ctx = await window.dashboardCore.getContext(user).catch(() => null);
                    bid = ctx && ctx.businessId ? ctx.businessId : '';
                }
                if (!bid) { outEl.textContent = 'No business selected.'; return; }
                localStorage.setItem('currentBusinessId', bid);
                sessionStorage.setItem('currentBusinessId', bid);
                localStorage.setItem('currentBusinessType', 'distributor');
                sessionStorage.setItem('currentBusinessType', 'distributor');
                const ri = await window.getUserRole(user.uid, bid);
                const snap = await db.collection('orders').where('businessId', '==', bid).limit(200).get();
                allRows.length = 0;
                const pending = [];
                for (const doc of snap.docs) {
                    const o = doc.data();
                    const st = String(o.status || '').toLowerCase();
                    if (!['approved', 'dispatched', 'delivered'].includes(st)) continue;
                    pending.push({ doc, o });
                }
                const repIds = pending.map((p) => p.o.repId).filter(Boolean);
                const shopIds = pending.map((p) => p.o.shopId).filter(Boolean);
                const [repMap, shopMap] = await Promise.all([
                    fetchDocsAsMap('reps', repIds),
                    fetchDocsAsMap('shops', shopIds)
                ]);
                for (const { doc, o } of pending) {
                    const st = String(o.status || '').toLowerCase();
                    let repName = o.repName || o.repId;
                    const rd = o.repId && repMap[o.repId];
                    if (rd && rd.name) repName = rd.name;
                    let customer = o.shopName || o.shopId;
                    const sd = o.shopId && shopMap[o.shopId];
                    if (sd && sd.name) customer = sd.name;
                    const dateObj = o.orderDate && o.orderDate.toDate ? o.orderDate.toDate() : null;
                    const rowDateMs = mwSalesRowSortMs(o);
                    const dt = dateObj ? dateObj.toLocaleString() : (rowDateMs ? new Date(rowDateMs).toLocaleString() : '—');
                    const row = {
                        inv: o.orderNumber || doc.id,
                        customer,
                        total: o.totalAmount || 0,
                        rep: repName,
                        dt,
                        st,
                        pay: normalizePaymentMode(o),
                        dateObj,
                        rowDateMs,
                        orderSortKey: salesOrderSortKey(o, doc.id)
                    };
                    allRows.push(row);
                }
                allRows.sort((a, b) => {
                    const ord = (Number(b.orderSortKey) || 0) - (Number(a.orderSortKey) || 0);
                    if (ord !== 0) return ord;
                    const ms = (Number(b.rowDateMs) || 0) - (Number(a.rowDateMs) || 0);
                    if (ms !== 0) return ms;
                    return String(b.inv || '').localeCompare(String(a.inv || ''), undefined, { numeric: true, sensitivity: 'base' });
                });
                renderRows();
            } catch (err) {
                console.error('Sales load failed', err);
                outEl.textContent = 'Could not load sales: ' + (err && err.message ? err.message : String(err));
            }
        });
    </script>
</body>
</html>
