
<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
            color: #212529;
            -webkit-print-color-adjust: exact;
        }
        .invoice-box {
            max-width: 800px;
            margin: auto;
            padding: 30px;
            border: 1px solid #eee;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
            background-color: white;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 30px;
        }
        .header .company-details h1 {
            margin: 0 0 5px;
            font-size: 28px;
            font-weight: 700;
        }
        .header .company-details .company-logo {
            width: 100px;
            margin-bottom: 15px;
        }
        .invoice-details table {
            width: 100%;
            text-align: right;
        }
        .invoice-details td {
            padding: 2px 0;
            font-size: 14px;
        }
        .invoice-details td:first-child {
            font-weight: 500;
            padding-right: 15px;
            color: #495057;
        }
        .customer-details {
            margin-bottom: 30px;
        }
        .customer-details h2 {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 5px;
            color: #495057;
        }
        .items-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }
        .items-table th, .items-table td {
            border-bottom: 1px solid #dee2e6;
            padding: 10px;
            text-align: left;
        }
        .items-table th {
            background-color: #f8f9fa;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
        }
        .items-table .num {
            text-align: right;
        }
        .totals-section {
            display: flex;
            justify-content: flex-end;
        }
        .totals-table {
            width: 100%;
            max-width: 300px;
        }
        .totals-table td {
            padding: 8px 5px;
            font-size: 14px;
        }
        .totals-table td:first-child {
            font-weight: 700;
            color: #495057;
        }
        .totals-table .num {
            text-align: right;
        }
        .totals-table .grand-total td {
            font-size: 18px;
            font-weight: 700;
            border-top: 2px solid #212529;
            padding-top: 10px;
        }
        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 14px;
            color: #6c757d;
        }
        @media print {
            body {
                background-color: white;
            }
            .invoice-box {
                box-shadow: none;
                border: none;
                padding: 0;
            }
            .print-button {
                display: none;
            }
        }
        .print-button-container {
            text-align: center;
            margin-top: 20px;
        }
        .print-button {
            padding: 12px 25px;
            font-size: 16px;
            background-color: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="/core/firebase-init.js?v=100"></script>
    <script src="/scripts/admin-impersonation.js?v=100"></script>

    <div class="invoice-box">
        <div class="header">
            <div class="company-details" id="companyHeaderWrap">
                <img src="" alt="Logo" class="company-logo" id="companyLogo" style="display:none;">
                <h1 id="companyNameDisplay">BUSINESS NAME</h1>
                <div id="invoiceType" style="font-size: 18px; font-weight: 600; margin-top:10px;"></div>
            </div>
            <div class="invoice-details">
                <table>
                    <tr><td>Invoice Number:</td><td id="invoiceNo"></td></tr>
                    <tr><td>Invoice Date:</td><td id="invoiceDate"></td></tr>
                    <tr><td>Due Date:</td><td id="dueDate"></td></tr>
                </table>
            </div>
        </div>

        <div class="customer-details">
            <h2>Billing Address:</h2>
            <p id="customerName"></p>
            <h2>Customer Mobile:</h2>
            <p id="customerPhone"></p>
        </div>

        <table class="items-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th class="num">Quantity</th>
                    <th class="num">Unit Price</th>
                    <th class="num">Total</th>
                </tr>
            </thead>
            <tbody id="itemsTbody">
            </tbody>
        </table>

        <div class="totals-section">
            <table class="totals-table">
                <tr><td>Total</td><td class="num" id="summaryTotal"></td></tr>
                <tr><td>Paid</td><td class="num" id="summaryPaid"></td></tr>
                <tr><td>Balance Due</td><td class="num" id="summaryBalance"></td></tr>
                <tr class="grand-total"><td>Total Due</td><td class="num" id="summaryTotalDue"></td></tr>
            </table>
        </div>

        <div class="footer" id="invoiceFooter">
            <p>Thank you for your business!</p>
        </div>
    </div>
    <div class="print-button-container">
        <button class="print-button" onclick="window.print()">Print Invoice</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            const data = JSON.parse(sessionStorage.getItem('currentInvoiceData'));
            if (!data) {
                document.body.innerHTML = '<h1>No invoice data found. Please complete a sale first.</h1>';
                return;
            }

            const bid = localStorage.getItem('currentBusinessId') || sessionStorage.getItem('currentBusinessId');
            if (bid && window.db) {
                try {
                    const bizDoc = await window.db.collection('businesses').doc(bid).get();
                    if (bizDoc.exists) {
                        const bizData = bizDoc.data();
                        const allS = bizData.documentSettings || {};
                        // New structure: allS['invoice']. Legacy structure: allS (root fields)
                        const ds = allS['invoice'] || {};
                        const headerOverride = ds.header || allS.invoiceHeaderOverride || '';
                        const agentText = ds.agent || allS.agentText || '';
                        const footerText = ds.footer || allS.invoiceFooterText || '';
                        const showLogo = ds.showLogo !== undefined ? ds.showLogo : (allS.showLogo !== false);

                        const name = headerOverride || bizData.name || 'BUSINESS NAME';
                        document.getElementById('companyNameDisplay').textContent = name;
                        
                        if (showLogo && bizData.logoUrl) {
                            const l = document.getElementById('companyLogo');
                            l.src = bizData.logoUrl;
                            l.style.display = 'block';
                        }

                        if (footerText) {
                            document.getElementById('invoiceFooter').innerHTML = `<p>${footerText.replace(/\n/g, '<br>')}</p>`;
                        } else {
                            document.getElementById('invoiceFooter').innerHTML = `<p>Thank you for your business!</p>`;
                        }

                        if (agentText) {
                            const agentDiv = document.createElement('div');
                            agentDiv.style.textAlign = 'center';
                            agentDiv.style.fontSize = '14px';
                            agentDiv.style.fontWeight = '700';
                            agentDiv.style.marginBottom = '15px';
                            agentDiv.textContent = agentText;
                            document.getElementById('companyHeaderWrap').appendChild(agentDiv);
                        }
                    }
                } catch (e) {
                    console.warn('Could not load business settings for invoice:', e);
                }
            }

            const formatCurrency = (amt) => 'Rs ' + (amt || 0).toLocaleString('en-LK', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            
            // Populate Invoice Details
            document.getElementById('invoiceNo').textContent = data.invoiceNo || 'N/A';
            document.getElementById('invoiceDate').textContent = data.createdAt ? new Date(data.createdAt.seconds * 1000).toLocaleDateString('en-CA') : 'N/A';
            document.getElementById('dueDate').textContent = data.dueDate ? new Date(data.dueDate.seconds * 1000).toLocaleDateString('en-CA') : 'N/A';
            document.getElementById('invoiceType').textContent = data.orderType || 'General Sale';

            // Populate Customer Details
            document.getElementById('customerName').textContent = data.customer ? data.customer.name : 'N/A';
            document.getElementById('customerPhone').textContent = data.customer ? data.customer.phone : 'N/A';

            // Populate Items Table
            const itemsTbody = document.getElementById('itemsTbody');
            let itemsHtml = '';
            if (data.items && data.items.length > 0) {
                data.items.forEach((item, index) => {
                    const total = (item.price || 0) * (item.quantity || 0);
                    itemsHtml += `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${item.name || 'N/A'}</td>
                            <td class="num">${item.quantity || 0}</td>
                            <td class="num">${formatCurrency(item.price)}</td>
                            <td class="num">${formatCurrency(total)}</td>
                        </tr>
                    `;
                });
            }
            itemsTbody.innerHTML = itemsHtml;

            // Populate Totals
            const totalDue = (data.total || 0);
            const amountPaid = data.amountPaid || 0;
            const balance = totalDue - amountPaid;
            
            document.getElementById('summaryTotal').textContent = formatCurrency(data.total);
            document.getElementById('summaryPaid').textContent = formatCurrency(amountPaid);
            document.getElementById('summaryBalance').textContent = formatCurrency(balance);
            document.getElementById('summaryTotalDue').textContent = formatCurrency(totalDue);
        });
    </script>

</body>
</html>
