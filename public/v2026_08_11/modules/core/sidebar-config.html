<!DOCTYPE html>
<html lang="si">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Configuration | DigiBiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --success: #10b981;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding-left: 260px;
        }

        @media (max-width: 992px) {
            body {
                padding-left: 0;
            }
        }

        .config-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 40px;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-light);
            font-size: 14px;
        }

        .card {
            background: var(--card);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .config-list {
            list-style: none;
        }

        .config-item {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            background: #fff;
            cursor: grab;
            transition: background 0.2s;
            user-select: none;
        }

        .config-item:last-child {
            border-bottom: none;
        }

        .config-item:hover {
            background: #f1f5f9;
        }

        .config-item.dragging {
            opacity: 0.5;
            background: #e2e8f0;
        }

        .drag-handle {
            color: var(--text-light);
            margin-right: 16px;
            cursor: grab;
            font-size: 18px;
        }

        .config-icon {
            font-size: 20px;
            margin-right: 12px;
            width: 24px;
            text-align: center;
        }

        .config-name {
            flex: 1;
            font-weight: 600;
            font-size: 15px;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #cbd5e1;
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: var(--success);
        }

        input:checked+.slider:before {
            transform: translateX(20px);
        }

        .footer-actions {
            margin-top: 30px;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            position: sticky;
            bottom: 20px;
            background: rgba(248, 250, 252, 0.8);
            backdrop-filter: blur(8px);
            padding: 10px 0;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: var(--text);
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .btn:hover {
            transform: translateY(-1px);
            opacity: 0.9;
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #statusMessage {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            display: none;
            z-index: 10006;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
            }

            to {
                transform: translateX(0);
            }
        }

        .config-badge {
            background: var(--success);
            color: white;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 8px;
            font-weight: 900;
        }
    </style>
</head>

<body>
    <div id="statusMessage"></div>
    <div id="sidebar-container"></div>

    <div class="config-container">
        <div class="header">
            <h1>Sidebar Configuration</h1>
            <p>ඔබගේ Sidebar එකේ දිස්විය යුතු මෙනු සහ ඒවායේ අනුපිළිවෙල මෙතැනින් වෙනස් කරන්න.</p>
        </div>

        <div class="card">
            <ul id="menuList" class="config-list">
                <!-- Items will be loaded here -->
                <li style="padding: 40px; text-align: center; color: var(--text-light);">Loading menus...</li>
            </ul>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" onclick="window.location.href='/modules/core/dashboard.html'">Dashboard
                වෙත</button>
            <button id="saveBtn" class="btn btn-primary" onclick="saveConfig()">වෙනස්කම් සුරකින්න</button>
        </div>
    </div>

    <!-- Core Dependencies -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="/core/firebase-init.js?v=100"></script>
    <script src="/scripts/admin-impersonation.js?v=100"></script>
    <script src="/core/sidebar.js?v=2001"></script>

    <script>
        let businessId = null;

        firebase.auth().onAuthStateChanged(async (user) => {
            console.log('Sidebar Config: Auth state changed, user:', user ? user.uid : 'null');
            if (!user) {
                window.location.href = '/';
                return;
            }

            try {
                console.log('Sidebar Config: Loading business data...');
                const userDoc = await db.collection('users').doc(user.uid).get();
                const userData = userDoc.exists ? userDoc.data() : {};
                businessId = userData.businessId || user.uid;

                const bizDoc = await db.collection('businesses').doc(businessId).get();
                const bizData = bizDoc.exists ? bizDoc.data() : {};

                // [GATE] Business Type Check
                const MW_BID = 'YRMbB6aq4CMevSrLWkQvoVMtc8b2';
                const SPRANZA_BID = 'SPRANZA_PVT_LTD';
                const bizType = String(bizData.businessType || userData.businessType || '').toLowerCase();
                const isDistributor = bizType === 'distributor' || bizType === 'scrap_collection_center' || businessId === MW_BID || businessId === SPRANZA_BID;

                if (!isDistributor) {
                    const listEl = document.getElementById('menuList');
                    listEl.innerHTML = `
                        <li style="padding: 40px; text-align: center; color: var(--text-light);">
                            <div style="font-size: 40px; margin-bottom: 15px;">🚧</div>
                            <p>මෙම පහසුකම දැනට ඔබගේ ව්‍යාපාර වර්ගය (${bizType}) සඳහා ලබාගත නොහැක.</p>
                            <p style="font-size: 12px; margin-top: 10px;">මෙය දැනට Distributor ව්‍යාපාර සඳහා පමණක් සීමා කර ඇත.</p>
                        </li>
                    `;
                    document.getElementById('saveBtn').disabled = true;
                    return;
                }

                const savedConfig = bizData.sidebarConfig || [];
                
                // Define Scrap Menu Pool (Including Shared Menus)
                const SCRAP_MENU_POOL = [
                    { id: 'scrap_bill', icon: '🧾', name: 'BILL', link: '/modules/admin/scrap-buying.html' },
                    { id: 'scrap_revenue', icon: '📈', name: 'REVENUE', link: '/modules/admin/scrap-revenue.html' },
                    { id: 'scrap_expenses', icon: '📉', name: 'EXPENSES', link: '/modules/admin/scrap-expenses.html' },
                    { id: 'scrap_sell', icon: '💸', name: 'SELL', link: '/modules/admin/scrap-sell.html' },
                    { id: 'scrap_sms', icon: '📲', name: 'Scrap SMS', link: '/modules/admin/scrap-sms-settings.html' },
                    { id: 'scrap_stock', icon: '📦', name: 'STOCK', link: '/modules/admin/scrap-workbench.html?view=STOCK' },
                    { id: 'scrap_buy', icon: '📚', name: 'Buying History', link: '/modules/admin/scrap-workbench.html?view=BUY' },
                    { id: 'scrap_history', icon: '📜', name: 'Selling History', link: '/modules/admin/scrap-selling-history.html' },
                    { id: 'scrap_advance', icon: '🏦', name: 'ADVANCE', link: '/modules/admin/scrap-advance.html' },
                    { id: 'scrap_dailytr', icon: '📘', name: 'DAILYTR', link: '/modules/admin/scrap-workbench.html?view=DAILYTR' },
                    // Shared Crosscut Menus
                    { id: 'shared_customers', icon: '👥', name: 'Customers', link: '/modules/core/customers.html' },
                    { id: 'shared_finance', icon: '💳', name: 'Finance', link: '/modules/core/finance-ledger.html' },
                    { id: 'shared_accounting', icon: '📁', name: 'Accounting', link: '/modules/accounts/advanced-accounting-dashboard.html' },
                    { id: 'shared_reports', icon: '📈', name: 'Reports', link: '/modules/reports/index.html' },
                    { id: 'shared_loans', icon: '💸', name: 'Loans', link: '/modules/core/loans.html' }
                ];

                // Select the correct pool
                let activePool = [];
                if (bizType === 'scrap_collection_center') {
                    activePool = SCRAP_MENU_POOL;
                } else if (typeof DISTRIBUTOR_MENU_POOL !== 'undefined') {
                    activePool = DISTRIBUTOR_MENU_POOL;
                }

                if (activePool.length > 0) {
                    renderMenuList(activePool, savedConfig);
                } else {
                    console.log('Sidebar Config: Retrying pool load in 500ms...');
                    setTimeout(() => {
                        let retryPool = (bizType === 'scrap_collection_center') ? SCRAP_MENU_POOL : (typeof DISTRIBUTOR_MENU_POOL !== 'undefined' ? DISTRIBUTOR_MENU_POOL : []);
                        renderMenuList(retryPool, savedConfig);
                    }, 500);
                }
            } catch (err) {
                console.error('Load error:', err);
                showStatus('දත්ත ලබා ගැනීමේ දෝෂයකි', '#ef4444');
            }
        });

        function renderMenuList(pool, savedConfig) {
            const listEl = document.getElementById('menuList');
            if (!pool || !pool.length) {
                listEl.innerHTML = '<li style="padding:20px; color:red;">Error: Menu pool not loaded.</li>';
                return;
            }

            const configMap = new Map();
            savedConfig.forEach((item, index) => {
                if (typeof item === 'string') configMap.set(item, { visible: true, order: index });
                else if (item && item.id) configMap.set(item.id, { visible: item.visible !== false, order: index });
            });

            const merged = pool.map(m => {
                const cfg = configMap.get(m.id);
                return {
                    ...m,
                    visible: cfg ? cfg.visible : true,
                    order: cfg ? (cfg.order ?? 9999) : 9999,
                    isNew: !cfg
                };
            });

            merged.sort((a, b) => a.order - b.order);

            listEl.innerHTML = merged.map(m => `
                <li class="config-item" draggable="true" data-id="${m.id}">
                    <span class="drag-handle">☰</span>
                    <span class="config-icon">${m.icon}</span>
                    <span class="config-name">${m.name}${m.isNew ? '<span class="config-badge">NEW</span>' : ''}</span>
                    <label class="toggle-switch">
                        <input type="checkbox" ${m.visible ? 'checked' : ''}>
                        <span class="slider"></span>
                    </label>
                </li>
            `).join('');

            initDragAndDrop();
        }

        async function saveConfig() {
            if (!businessId) return;
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = true;
            saveBtn.textContent = 'සුරකිමින්...';

            const items = Array.from(document.querySelectorAll('.config-item'));
            const config = items.map(el => ({
                id: el.dataset.id,
                visible: el.querySelector('input').checked
            }));

            try {
                await db.collection('businesses').doc(businessId).update({
                    sidebarConfig: config,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                showStatus('සාර්ථකව සුරැකුණි!', '#10b981');

                if (window.sidebar && typeof window.sidebar.render === 'function') {
                    window.sidebar.sidebarConfig = config;
                    window.sidebar.render();
                    window.sidebar.attachEvents();
                }
            } catch (err) {
                console.error('Save error:', err);
                showStatus('සුරැකීමේ දෝෂයකි: ' + err.message, '#ef4444');
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = 'වෙනස්කම් සුරකින්න';
            }
        }

        function showStatus(msg, color) {
            const el = document.getElementById('statusMessage');
            el.textContent = msg;
            el.style.backgroundColor = color;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 3000);
        }

        function initDragAndDrop() {
            const list = document.getElementById('menuList');
            let draggingItem = null;

            list.addEventListener('dragstart', (e) => {
                draggingItem = e.target.closest('.config-item');
                draggingItem.classList.add('dragging');
            });

            list.addEventListener('dragend', () => {
                draggingItem.classList.remove('dragging');
                draggingItem = null;
            });

            list.addEventListener('dragover', (e) => {
                e.preventDefault();
                const afterElement = getDragAfterElement(list, e.clientY);
                if (afterElement == null) {
                    list.appendChild(draggingItem);
                } else {
                    list.insertBefore(draggingItem, afterElement);
                }
            });
        }

        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('.config-item:not(.dragging)')];
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }
    </script>
</body>

</html>
