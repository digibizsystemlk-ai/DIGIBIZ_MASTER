<!DOCTYPE html>
<html>
<head>
    <title>Cash Debug</title>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
    <script src="/core/firebase-init.js?v=100"></script>
    <script src="/scripts/admin-impersonation.js?v=100"></script>
</head>
<body>
    <h1>Cash Ledger Debug</h1>
    <div id="out">Loading...</div>
    <script>
        auth.onAuthStateChanged(async (user) => {
            if (!user) { document.getElementById('out').textContent = 'Not logged in'; return; }
            const userDoc = await db.collection('users').doc(user.uid).get();
            const bid = userDoc.data().businessId || user.uid;
            
            const snap = await db.collection('journal').doc(bid).collection('entries')
                .orderBy('date', 'desc').limit(50).get();
            
            let html = '<table border="1"><tr><th>Date</th><th>Desc</th><th>Debit</th><th>Credit</th></tr>';
            snap.forEach(doc => {
                const data = doc.data();
                data.entries.forEach(e => {
                    if (e.accountCode === '1-1010-01') {
                        html += `<tr>
                            <td>${data.date.toDate().toLocaleString()}</td>
                            <td>${data.description}</td>
                            <td>${e.debit}</td>
                            <td>${e.credit}</td>
                        </tr>`;
                    }
                });
            });
            html += '</table>';
            document.getElementById('out').innerHTML = html;
        });
    </script>
</body>
</html>
