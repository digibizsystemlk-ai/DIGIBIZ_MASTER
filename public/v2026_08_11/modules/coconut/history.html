<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <script src="/core/pwa-init.js?v=1"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity History & Audit Trail</title>
    <style>html.digibiz-sidebar-reserved body{margin-left:260px;}@media (max-width:768px){html.digibiz-sidebar-reserved body{margin-left:0;}}</style>
    <script>document.documentElement.classList.add('digibiz-sidebar-reserved');</script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-storage-compat.js"></script>
    <script src="/core/firebase-init.js?v=100"></script>
    <script src="/scripts/admin-impersonation.js?v=100"></script>
    <script src="/core/event-validation.js?v=4"></script>
    <script src="/core/event-bus.js?v=4"></script>
    <script src="/core/accounts-core.js?v=4"></script>
    <script src="/core/auth-roles.js?v=120"></script>
    <script src="/core/business-types.js?v=74"></script>
    <script src="/core/dashboard-core.js?v=74"></script>
    <script src="/core/subscription-manager.js?v=4"></script>
    <script src="/core/sidebar.js?v=2002"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="coconut.css">
    <script src="coconut-common.js"></script>
</head>
<body>

    <main class="c-container">
        <div class="c-header">
            <div class="c-header-left">
                <h1>📜 Operational Audit & Activity History (ක්‍රියාකාරකම් ඉතිහාසය)</h1>
                <p>Consolidated chronological audit log across procurement, grading, manufacturing, sales, payments, and expenses.</p>
            </div>
            <div class="c-header-actions">
                <button type="button" class="c-btn c-btn-primary" id="btnExportCsv">📥 Export to CSV</button>
            </div>
        </div>

        <!-- Filter Bar -->
        <div class="c-filter-bar">
            <div class="c-form-group">
                <label>Stream Filter</label>
                <select id="historyTypeFilter" class="c-select">
                    <option value="ALL">All Event Types</option>
                    <option value="COCONUT_PURCHASE">Coconut Purchases</option>
                    <option value="HUSK_PURCHASE">Husk Purchases</option>
                    <option value="PRODUCTION">Production Runs</option>
                    <option value="SALE">Sales Invoices</option>
                    <option value="EXPENSE">Expenses</option>
                    <option value="PAYMENT">Payments & Receipts</option>
                </select>
            </div>

            <div class="c-form-group" style="flex:1;">
                <label>Search Keyword</label>
                <input type="text" id="historySearchInput" class="c-input" placeholder="Search reference, party name, notes...">
            </div>
        </div>

        <!-- Consolidated History Table -->
        <div class="c-card">
            <div class="c-table-wrapper">
                <table class="c-table">
                    <thead>
                        <tr>
                            <th>Date & Time</th>
                            <th>Event Category</th>
                            <th>Reference / ID</th>
                            <th>Description</th>
                            <th class="text-right">Financial Value (LKR)</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody">
                        <tr><td colspan="5" class="text-center" style="padding:24px;">Loading activity history...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="history.js"></script>
</body>
</html>
