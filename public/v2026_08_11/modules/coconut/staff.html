<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <script src="/core/pwa-init.js?v=1"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff & Team Management</title>
    <style>html.digibiz-sidebar-reserved body{margin-left:260px;}@media (max-width:768px){html.digibiz-sidebar-reserved body{margin-left:0;}}</style>
    <script>document.documentElement.classList.add('digibiz-sidebar-reserved');</script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-storage-compat.js"></script>
    <script src="/core/firebase-init.js?v=100"></script>
    <script src="/scripts/admin-impersonation.js?v=100"></script>
    <script src="/core/event-validation.js?v=4"></script>
    <script src="/core/event-bus.js?v=4"></script>
    <script src="/core/accounts-core.js?v=4"></script>
    <script src="/core/auth-roles.js?v=120"></script>
    <script src="/core/business-types.js?v=74"></script>
    <script src="/core/dashboard-core.js?v=74"></script>
    <script src="/core/subscription-manager.js?v=4"></script>
    <script src="/core/sidebar.js?v=2002"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="coconut.css">
    <script src="coconut-common.js"></script>
</head>
<body>

    <main class="c-container">
        <div class="c-header">
            <div class="c-header-left">
                <h1>👷 Staff & Yard Operations Team (කාර්ය මණ්ඩලය)</h1>
                <p>Manage yard supervisors, sorting operators, machine operators, drivers, and cashiers.</p>
            </div>
            <div class="c-header-actions">
                <button type="button" class="c-btn c-btn-primary" id="btnOpenNewStaff">➕ Add Team Member</button>
            </div>
        </div>

        <!-- Staff List Table -->
        <div class="c-card">
            <div class="c-card-header">
                <div class="c-card-title">📋 Active Personnel Roster</div>
            </div>
            <div class="c-table-wrapper">
                <table class="c-table">
                    <thead>
                        <tr>
                            <th>Staff Member</th>
                            <th>Role / Designation</th>
                            <th>Phone Number</th>
                            <th>NIC / ID</th>
                            <th>Daily Wage / Salary (LKR)</th>
                            <th class="text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="staffTableBody">
                        <tr><td colspan="6" class="text-center" style="padding:20px;">Loading team members...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Add/Edit Staff Modal -->
    <div class="c-modal-overlay" id="staffModal">
        <div class="c-modal">
            <div class="c-modal-header">
                <h3 id="staffModalTitle">➕ Add Team Member</h3>
                <button type="button" class="c-modal-close" id="btnCloseStaffModal">×</button>
            </div>
            <form id="staffForm">
                <input type="hidden" id="stEditId">
                <div class="c-form-group" style="margin-bottom:12px;">
                    <label>Full Name (නම) *</label>
                    <input type="text" id="stName" class="c-input" placeholder="e.g. K. M. Priyantha" required>
                </div>
                <div class="c-form-row">
                    <div class="c-form-group">
                        <label>Role / Position *</label>
                        <select id="stRole" class="c-select" required>
                            <option value="Yard Supervisor">Yard Supervisor (පිට්ටනි පාලක)</option>
                            <option value="Grading Sorter">Grading Sorter (තෝරන්නා)</option>
                            <option value="Machine Operator">Machine Operator (යන්ත්‍ර ක්‍රියාකරු)</option>
                            <option value="Lorry Driver">Lorry Driver (රියදුරු)</option>
                            <option value="Cashier / Clerk">Cashier / Billing Clerk</option>
                            <option value="General Labor">General Labor (සාමාන්‍ය සේවක)</option>
                        </select>
                    </div>
                    <div class="c-form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="stPhone" class="c-input" placeholder="07X-XXXXXXX">
                    </div>
                </div>
                <div class="c-form-row">
                    <div class="c-form-group">
                        <label>National Identity Card (NIC)</label>
                        <input type="text" id="stNic" class="c-input" placeholder="NIC #">
                    </div>
                    <div class="c-form-group">
                        <label>Daily Wage Rate (Rs)</label>
                        <input type="number" id="stRate" class="c-input" min="0" step="50" placeholder="e.g. 2500.00">
                    </div>
                </div>
                <div class="c-modal-footer">
                    <button type="button" class="c-btn c-btn-secondary" id="btnCancelStaff">Cancel</button>
                    <button type="submit" class="c-btn c-btn-primary">Save Member</button>
                </div>
            </form>
        </div>
    </div>

    <script src="staff.js"></script>
</body>
</html>
