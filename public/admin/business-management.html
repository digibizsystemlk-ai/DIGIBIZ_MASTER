<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="/core/pwa-init.js?v=1"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Management - DIGIBIZ</title>
    <style>html.digibiz-sidebar-reserved body{margin-left:260px;}@media (max-width:768px){html.digibiz-sidebar-reserved body{margin-left:0;}}</style>
    <script>document.documentElement.classList.add('digibiz-sidebar-reserved');</script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-functions-compat.js"></script>
    <script src="/core/firebase-init.js?v=60"></script>
    <script src="/core/sidebar.js?v=61"></script>
    <link rel="stylesheet" href="/admin/admin.css?v=1">
</head>
<body>
<div class="admin-wrap">
    <div class="top">
        <div><h1>Business Management</h1><p>Manage business subscriptions and credits</p></div>
    </div>

    <section class="panel active">
        <div class="container">
            <div class="search-container">
                <input type="email" id="email-search" placeholder="Search by owner's email">
                <button id="search-btn">Search</button>
            </div>

            <div id="business-details" class="details-container" style="display: none;">
                <h2 id="business-name"></h2>
                <p><strong>Owner:</strong> <span id="owner-name"></span></p>
                <p><strong>Phone:</strong> <span id="owner-phone"></span></p>
                <p><strong>Subscription:</strong> <span id="subscription-status"></span></p>

                <div class="action-container">
                    <h3>Actions</h3>
                    <div class="action">
                        <label for="extend-pro">Extend Pro (days):</label>
                        <input type="number" id="extend-pro" value="30">
                        <button id="extend-pro-btn">Extend Pro</button>
                    </div>
                    <div class="action">
                        <button id="extend-trial-btn">Extend Trial (7 days)</button>
                    </div>
                    <div class="action">
                        <label for="add-sms">Add SMS Credits:</label>
                        <input type="number" id="add-sms" value="1000">
                        <button id="add-sms-btn">Add SMS</button>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>

<script src="/admin/business-management.js"></script>

</body>
</html>
