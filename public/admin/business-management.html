<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Management</title>
    <script src="/core/firebase-init.js"></script>
    <script src="/core/auth-roles.js?v=4"></script>
    <script src="/core/business-types.js?v=4"></script>
    <script src="/core/dashboard-core.js?v=4"></script>
    <script src="/core/subscription-manager.js?v=4"></script>
    <script src="/core/sidebar.js?v=31"></script>
    <link rel="stylesheet" href="admin.css">
    <style>
        body {
            padding-left: 280px; /* Space for sidebar */
        }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>

    <div class="main-content">
        <h1>Business Management</h1>

        <div class="container">
            <div class="search-container">
                <input type="email" id="email-search" placeholder="Search by email">
                <button id="search-btn">Search</button>
            </div>

            <div id="business-details" class="details-container" style="display: none;">
                <h2 id="business-name"></h2>
                <p><strong>Owner:</strong> <span id="owner-name"></span></p>
                <p><strong>Phone:</strong> <span id="owner-phone"></span></p>
                <p><strong>Subscription:</strong> <span id="subscription-status"></span></p>

                <div class="action-container">
                    <h3>Actions</h3>
                    <div class="action">
                        <label for="extend-pro">Extend Pro (days):</label>
                        <input type="number" id="extend-pro" value="30">
                        <button id="extend-pro-btn">Extend Pro</button>
                    </div>
                    <div class="action">
                        <button id="extend-trial-btn">Extend Trial (7 days)</button>
                    </div>
                    <div class="action">
                        <label for="add-sms">Add SMS Credits:</label>
                        <input type="number" id="add-sms" value="1000">
                        <button id="add-sms-btn">Add SMS</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="business-management.js"></script>
</body>
</html>
