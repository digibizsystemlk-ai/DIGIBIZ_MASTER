<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="/core/pwa-init.js?v=1"></script>
    <title>Setup Super Admin - DIGIBIZ</title>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
    <script src="../core/firebase-init.js"></script>
    <style>
        body{font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh;background:linear-gradient(135deg,#10b981,#059669);}
        .card{background:white;padding:40px;border-radius:20px;width:400px;}
        input{width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:8px;}
        button{width:100%;padding:12px;background:#10b981;color:white;border:none;border-radius:8px;cursor:pointer;}
        .error{color:red;margin-top:10px;}
        .success{color:green;margin-top:10px;}
    </style>
</head>
<body>
    <div class="card">
        <h2>🔐 Setup Super Admin</h2>
        <p>Create the master administrator account</p>
        <input type="text" id="name" placeholder="Full Name">
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <button id="setupBtn">Create Super Admin</button>
        <div id="message"></div>
    </div>
    <script>
        document.getElementById('setupBtn').onclick = async () => {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');
            
            try {
                const userCred = await auth.createUserWithEmailAndPassword(email, password);
                await db.collection('users').doc(userCred.user.uid).set({
                    name: name,
                    email: email,
                    role: 'SUPER_ADMIN',
                    createdAt: new Date()
                });
                messageDiv.innerHTML = '<div class="success">✅ Super Admin created! You can now login.</div>';
                setTimeout(() => { window.location.href = '../auth/login.html'; }, 2000);
            } catch (error) {
                messageDiv.innerHTML = '<div class="error">❌ ' + error.message + '</div>';
            }
        };
    </script>
</body>
</html>
