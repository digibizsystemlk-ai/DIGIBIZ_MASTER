<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="/core/pwa-init.js?v=1"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Care Suppliers Management - DIGIBIZ</title>
    <style>html.digibiz-sidebar-reserved body{margin-left:260px;}@media (max-width:768px){html.digibiz-sidebar-reserved body{margin-left:0;}}</style>
    <script>document.documentElement.classList.add('digibiz-sidebar-reserved');</script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="autocare-theme.css?v=3">
    
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
    
    <script src="/core/firebase-init.js?v=100"></script>
    <script src="/scripts/admin-impersonation.js?v=100"></script>
    <script src="../../core/event-validation.js?v=3"></script>
    <script src="../../core/event-bus.js?v=3"></script>
    <script src="../../core/accounts-core.js?v=3"></script>
    <script src="../../core/auth-roles.js?v=115"></script>
    <script src="../../core/business-types.js?v=4"></script>
    <script src="../../core/dashboard-core.js?v=3"></script>
    <script src="../../core/subscription-manager.js?v=3"></script>
    <script src="../../core/sidebar.js?v=1015"></script>
    <script src="autocare-utils.js?v=2"></script>
    
    <style>
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .controls-card { background: rgba(30, 41, 59, 0.85); border-radius: 16px; padding: 16px 20px; border: 1px solid #334155; margin-bottom: 25px; display: flex; gap: 15px; align-items: center; }
        .search-box { flex: 1; position: relative; }
        .search-box input { width: 100%; padding: 10px 14px 10px 40px; }
        .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #64748b; }
    </style>
</head>
<body>

    <div class="header-bar">
        <div>
            <h2 style="color:#38bdf8; font-size:24px; font-weight:800;"><i class="fa-solid fa-truck-field"></i> Workshop Suppliers Management</h2>
            <p style="color:#94a3b8; font-size:14px; margin-top:4px;">අමතර කොටස් සහ ද්‍රව්‍ය සපයන සැපයුම්කරුවන්ගේ විස්තර සහ ගෙවීම් පාලනය</p>
        </div>
        <div style="display:flex; gap:10px;">
            <a href="purchases.html" class="btn btn-outline"><i class="fa-solid fa-cart-flatbed"></i> Stock Purchases / GRN</a>
            <button class="btn btn-primary" onclick="openAddSupplierModal()"><i class="fa-solid fa-plus"></i> Add New Supplier</button>
        </div>
    </div>

    <div class="controls-card">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="supSearch" placeholder="Search Supplier Name, Category, Contact Person or Phone..." onkeyup="renderSuppliersTable()">
        </div>
    </div>

    <div class="table-card" style="padding:0; overflow:hidden;">
        <table>
            <thead>
                <tr>
                    <th>Supplier Name & Category</th>
                    <th>Contact Person</th>
                    <th>Phone / Email</th>
                    <th>Address</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="suppliersBody">
                <!-- JS Populated -->
            </tbody>
        </table>
    </div>

    <!-- Modal Add/Edit Supplier -->
    <div class="modal" id="supModal" style="display:none;">
        <div class="modal-content" style="max-width:550px; padding:24px; border-radius:20px;">
            <h3 style="margin-bottom:15px; color:#38bdf8;" id="modalHeading">🚚 Supplier Details</h3>
            <form onsubmit="saveSupplier(event)">
                <input type="hidden" id="supId">
                <div style="display:flex; flex-direction:column; gap:12px;">
                    <div>
                        <label>Supplier Company Name *</label>
                        <input type="text" id="sName" required style="width:100%;">
                    </div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                        <div>
                            <label>Category</label>
                            <input type="text" id="sCat" placeholder="e.g. Lubricants / Body Parts" style="width:100%;">
                        </div>
                        <div>
                            <label>Contact Person</label>
                            <input type="text" id="sPerson" placeholder="e.g. Mr. Sunil" style="width:100%;">
                        </div>
                    </div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                        <div>
                            <label>Phone Number *</label>
                            <input type="text" id="sPhone" required style="width:100%;">
                        </div>
                        <div>
                            <label>Email Address</label>
                            <input type="email" id="sEmail" style="width:100%;">
                        </div>
                    </div>
                    <div>
                        <label>Company Address</label>
                        <input type="text" id="sAddress" placeholder="e.g. Colombo 10" style="width:100%;">
                    </div>
                </div>
                <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
                    <button type="button" class="btn btn-outline" onclick="document.getElementById('supModal').style.display='none'">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Supplier</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let suppliers = [];

        function getBizId() {
            return window.AutoCareUtils ? window.AutoCareUtils.getBizId() : 'DEFAULT_BIZ';
        }

        function loadSuppliers() {
            const bizId = getBizId();
            const storageKey = `autocare_suppliers_${bizId}`;
            const cached = localStorage.getItem(storageKey);

            if (cached) {
                try { suppliers = JSON.parse(cached); } catch(e) { suppliers = []; }
            } else {
                suppliers = [
                    { id: 'SUP-1', name: 'Toyota Lanka (Pvt) Ltd', cat: 'Genuine Spare Parts', person: 'Mr. Perera', phone: '0112345678', email: 'sales@toyotalanka.lk', address: 'Wattala' },
                    { id: 'SUP-2', name: 'Castrol Lubricants Distributor', cat: 'Oils & Fluids', person: 'Mr. Fernando', phone: '0778901234', email: 'info@castrol.lk', address: 'Colombo 03' }
                ];
            }

            renderSuppliersTable();
        }

        function renderSuppliersTable() {
            const tbody = document.getElementById('suppliersBody');
            const search = document.getElementById('supSearch').value.toLowerCase();
            tbody.innerHTML = '';

            const filtered = suppliers.filter(s => 
                (s.name||'').toLowerCase().includes(search) || 
                (s.cat||'').toLowerCase().includes(search) || 
                (s.person||'').toLowerCase().includes(search) || 
                (s.phone||'').includes(search)
            );

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:40px; color:#64748b;">තවම කිසිදු සැපයුම්කරුවෙකු ඇතුළත් කර නොමැත. (No suppliers found)</td></tr>`;
                return;
            }

            filtered.forEach(s => {
                tbody.innerHTML += `
                    <tr>
                        <td><strong style="color:#ffffff;">${s.name}</strong><br><small style="color:#38bdf8;">${s.cat || '-'}</small></td>
                        <td>${s.person || '-'}</td>
                        <td><i class="fa-solid fa-phone" style="color:#64748b;"></i> ${s.phone}<br><small style="color:#94a3b8;">${s.email || ''}</small></td>
                        <td>${s.address || '-'}</td>
                        <td>
                            <button class="btn btn-outline" style="padding:4px 8px; font-size:12px;" title="Edit Supplier" onclick="editSupplier('${s.id}')"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button class="btn-danger-icon" title="Delete Supplier" onclick="deleteSupplier('${s.id}')"><i class="fa-solid fa-trash-can"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        function openAddSupplierModal() {
            document.getElementById('supId').value = '';
            document.getElementById('modalHeading').innerText = '🚚 Add New Supplier';
            document.getElementById('sName').value = '';
            document.getElementById('sCat').value = '';
            document.getElementById('sPerson').value = '';
            document.getElementById('sPhone').value = '';
            document.getElementById('sEmail').value = '';
            document.getElementById('sAddress').value = '';
            document.getElementById('supModal').style.display = 'flex';
        }

        function saveSupplier(e) {
            e.preventDefault();
            const id = document.getElementById('supId').value || 'SUP-' + Date.now();
            const name = document.getElementById('sName').value.trim();
            const cat = document.getElementById('sCat').value.trim();
            const person = document.getElementById('sPerson').value.trim();
            const phone = document.getElementById('sPhone').value.trim();
            const email = document.getElementById('sEmail').value.trim();
            const address = document.getElementById('sAddress').value.trim();

            const idx = suppliers.findIndex(x => x.id === id);
            const obj = { id, name, cat, person, phone, email, address };

            if (idx >= 0) suppliers[idx] = obj;
            else suppliers.unshift(obj);

            const bizId = getBizId();
            localStorage.setItem(`autocare_suppliers_${bizId}`, JSON.stringify(suppliers));

            document.getElementById('supModal').style.display = 'none';
            renderSuppliersTable();
            alert('✅ Supplier details saved successfully!');
        }

        function editSupplier(id) {
            const s = suppliers.find(x => x.id === id);
            if(!s) return;

            document.getElementById('supId').value = s.id;
            document.getElementById('modalHeading').innerText = `✏️ Edit Supplier: ${s.name}`;
            document.getElementById('sName').value = s.name;
            document.getElementById('sCat').value = s.cat || '';
            document.getElementById('sPerson').value = s.person || '';
            document.getElementById('sPhone').value = s.phone;
            document.getElementById('sEmail').value = s.email || '';
            document.getElementById('sAddress').value = s.address || '';
            document.getElementById('supModal').style.display = 'flex';
        }

        function deleteSupplier(id) {
            if(confirm('ඔබට මෙම සැපයුම්කරුගේ දත්ත මකා දැමීමට අවශ්‍ය බව තහවුරු කරන්න?')) {
                suppliers = suppliers.filter(x => x.id !== id);
                const bizId = getBizId();
                localStorage.setItem(`autocare_suppliers_${bizId}`, JSON.stringify(suppliers));
                renderSuppliersTable();
                alert('✅ Supplier deleted!');
            }
        }

        window.onload = loadSuppliers;
    </script>
</body>
</html>
