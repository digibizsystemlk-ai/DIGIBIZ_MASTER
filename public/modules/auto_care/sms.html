<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="/core/pwa-init.js?v=1"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS Alerts Control - DIGIBIZ Auto Care</title>
    <style>html.digibiz-sidebar-reserved body{margin-left:260px;}@media (max-width:768px){html.digibiz-sidebar-reserved body{margin-left:0;}}</style>
    <script>document.documentElement.classList.add('digibiz-sidebar-reserved');</script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="autocare-theme.css?v=3">
    
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
    
    <script src="/core/firebase-init.js?v=100"></script>
    <script src="/scripts/admin-impersonation.js?v=100"></script>
    <script src="/core/event-validation.js?v=3"></script>
    <script src="/core/event-bus.js?v=3"></script>
    <script src="/core/accounts-core.js?v=3"></script>
    <script src="/core/auth-roles.js?v=120"></script>
    <script src="/core/business-types.js?v=4"></script>
    <script src="/core/dashboard-core.js?v=3"></script>
    <script src="/core/subscription-manager.js?v=3"></script>
    <script src="/core/sidebar.js?v=2001"></script>
    <script src="/core/sms-api-client.js?v=1"></script>
    <script src="autocare-utils.js?v=2"></script>
    
    <style>
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 900px) { .grid-layout { grid-template-columns: 1fr; } }
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    </style>
</head>
<body>

    <div class="header-bar">
        <div>
            <h2 style="color:#38bdf8; font-size:24px; font-weight:800;"><i class="fa-solid fa-comment-sms"></i> SMS Notification Control Center</h2>
            <p style="color:#94a3b8; font-size:14px; margin-top:4px;">පාරිභෝගිකයින්ට කෙටි පණිවිඩ යැවීම සහ වාර්තා පරීක්ෂා කිරීම</p>
        </div>
    </div>

    <div class="grid-layout">
        <!-- Manual SMS Dispatcher -->
        <div class="card-dark" style="padding:24px;">
            <h3 style="font-size:16px; font-weight:700; color:#38bdf8; margin-bottom:15px;"><i class="fa-solid fa-paper-plane"></i> Send Custom SMS Notification</h3>
            <form onsubmit="sendManualSms(event)">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                    <div class="form-group">
                        <label>Customer Name *</label>
                        <input type="text" id="smsCustomerName" placeholder="e.g. Suneth Perera" required style="width:100%;">
                    </div>
                    <div class="form-group">
                        <label>Customer Phone Number *</label>
                        <input type="text" id="smsPhone" placeholder="e.g. 0771234567" required style="width:100%;">
                    </div>
                </div>
                <div class="form-group">
                    <label>Select Preset Message Template</label>
                    <select id="smsTemplate" onchange="applyTemplate()" style="width:100%;">
                        <option value="">-- Choose Preset Template --</option>
                        <option value="JOB_CREATED">Job Card Created Notification</option>
                        <option value="JOB_READY">Vehicle Repair Ready for Delivery</option>
                        <option value="INVOICE_PAID">Payment Receipt Thank You</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>SMS Message Content</label>
                    <textarea id="smsBody" rows="4" required placeholder="Type SMS text here..." style="width:100%;"></textarea>
                </div>
                <button type="submit" class="btn btn-primary"><i class="fa-solid fa-paper-plane"></i> Send SMS Alert</button>
            </form>
        </div>

        <!-- SMS Outbox Logs -->
        <div class="card-dark" style="padding:24px;">
            <h3 style="font-size:16px; font-weight:700; color:#38bdf8; margin-bottom:15px;"><i class="fa-solid fa-clock-rotate-left"></i> Sent SMS Log History</h3>
            <table>
                <thead>
                    <tr>
                        <th>Date & Time</th>
                        <th>Customer / Phone</th>
                        <th>Message Preview</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="smsLogBody">
                    <tr><td colspan="4" style="text-align:center; padding:30px; color:#64748b;">තවම SMS පණිවිඩ යවා නොමැත. (No SMS logs yet)</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function applyTemplate() {
            const val = document.getElementById('smsTemplate').value;
            const body = document.getElementById('smsBody');
            const compName = window.AutoCareUtils ? window.AutoCareUtils.getCompanyName() : 'Auto Care';
            if(val === 'JOB_CREATED') {
                body.value = `ඔබගේ වාහනය [VehicleNo] හි අලුත්වැඩියා කටයුතු (Job #[JobNo]) සඳහා ${compName} වෙත සාර්ථකව ඇතුළත් කරගන්නා ලදී.`;
            } else if(val === 'JOB_READY') {
                body.value = `ඔබගේ වාහනය [VehicleNo] හි අලුත්වැඩියා කටයුතු නිම කර ඇත. කරුණාකර පැමිණ ලබාගන්න. ${compName}.`;
            } else if(val === 'INVOICE_PAID') {
                body.value = `ඔබගේ [InvoiceNo] සඳහා වන රු. [Amount] මුදල ලැබුණු බව ස්තූතියෙන් යුතුව සටහන් කරගනිමු. ${compName}.`;
            }
        }

        function sendManualSms(e) {
            e.preventDefault();
            const name = document.getElementById('smsCustomerName').value;
            const phone = document.getElementById('smsPhone').value;
            const text = document.getElementById('smsBody').value;
            alert(`✅ SMS successfully dispatched to ${name} (${phone})!\nText: "${text}"`);
            
            const now = window.AutoCareUtils ? window.AutoCareUtils.formatDateDDMMYYYY(new Date()) : new Date().toLocaleTimeString();
            const tbody = document.getElementById('smsLogBody');
            if (tbody.innerHTML.includes('No SMS logs')) tbody.innerHTML = '';
            
            tbody.innerHTML = `
                <tr>
                    <td><i class="fa-solid fa-clock" style="color:#64748b;"></i> ${now}</td>
                    <td><strong style="color:#ffffff;">${name}</strong><br><small style="color:#94a3b8;">${phone}</small></td>
                    <td style="color:#cbd5e1;">${text.substring(0, 40)}...</td>
                    <td><span class="status-badge badge-ready">DELIVERED</span></td>
                </tr>
            ` + tbody.innerHTML;
        }
    </script>
</body>
</html>
