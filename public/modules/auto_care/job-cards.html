<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="/core/pwa-init.js?v=1"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Cards Management - DIGIBIZ Auto Care</title>
    <style>html.digibiz-sidebar-reserved body{margin-left:260px;}@media (max-width:768px){html.digibiz-sidebar-reserved body{margin-left:0;}}</style>
    <script>document.documentElement.classList.add('digibiz-sidebar-reserved');</script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="autocare-theme.css?v=3">
    
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
    
    <script src="../../core/firebase-init.js?v=3"></script>
    <script src="../../core/event-validation.js?v=3"></script>
    <script src="../../core/event-bus.js?v=3"></script>
    <script src="../../core/accounts-core.js?v=3"></script>
    <script src="../../core/auth-roles.js?v=3"></script>
    <script src="../../core/business-types.js?v=4"></script>
    <script src="../../core/dashboard-core.js?v=3"></script>
    <script src="../../core/subscription-manager.js?v=3"></script>
    <script src="../../core/sidebar.js?v=1010"></script>
    <script src="../../core/sms-api-client.js?v=1"></script>
    <script src="autocare-utils.js?v=2"></script>
    
    <style>
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
        .controls-card { background: rgba(30, 41, 59, 0.85); border-radius: 16px; padding: 16px 20px; border: 1px solid #334155; margin-bottom: 25px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .search-box { flex: 1; min-width: 250px; position: relative; }
        .search-box input { width: 100%; padding: 10px 14px 10px 40px; border: 1px solid #334155; border-radius: 10px; font-size: 14px; }
        .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #64748b; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full { grid-column: span 2; }
    </style>
</head>
<body>

    <div class="header-bar">
        <div>
            <h2 style="color:#38bdf8; font-size:24px; font-weight:800;"><i class="fa-solid fa-address-card"></i> Job Cards Management</h2>
            <p style="color:#94a3b8; font-size:14px; margin-top:4px;">රැකියා කාඩ්පත් සාදන, සංස්කරණය කරන (Edit) සහ මකා දමන (Delete) පද්ධතිය</p>
        </div>
        <button class="btn btn-primary" onclick="openNewJobModal()"><i class="fa-solid fa-plus"></i> Create New Job Card</button>
    </div>

    <!-- Search & Filter Controls -->
    <div class="controls-card">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search Job No, Vehicle Reg No, Customer Name or Phone..." onkeyup="filterJobs()">
        </div>
        <select id="statusFilter" onchange="filterJobs()" style="padding:10px 14px; border-radius:10px; background:#0f172a; border:1px solid #334155; color:#ffffff;">
            <option value="ALL">All Statuses (සියලුම තත්ත්ව)</option>
            <option value="PENDING">Pending (පොරොත්තුවෙන්)</option>
            <option value="INSPECTION">Inspection (පරීක්ෂාවේ)</option>
            <option value="IN_PROGRESS">In Progress (වැඩ කෙරෙමින්)</option>
            <option value="READY">Ready (අවසන්)</option>
            <option value="DELIVERED">Delivered (භාර දුන්නා)</option>
        </select>
        <button class="btn btn-outline" onclick="loadJobs()"><i class="fa-solid fa-arrows-rotate"></i> Refresh</button>
    </div>

    <!-- Job Cards Table -->
    <div class="table-card" style="padding:0; overflow:hidden;">
        <table>
            <thead>
                <tr>
                    <th>Job No / Date</th>
                    <th>Vehicle Reg, Brand & Model</th>
                    <th>Customer Name & Phone</th>
                    <th>Assigned Tech</th>
                    <th>Mileage / Fuel</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="jobTableBody">
                <!-- JS render -->
            </tbody>
        </table>
    </div>

    <!-- New / Edit Job Card Modal -->
    <div class="modal" id="jobModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; justify-content:center; align-items:center; z-index:2000;">
        <div class="modal-content" style="width:100%; max-width:800px; max-height:90vh; overflow-y:auto; padding:28px; border-radius:20px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h3 id="modalTitle" style="color:#38bdf8; font-size:20px; font-weight:800;">📋 New Job Card (නව රැකියා කාඩ්පත)</h3>
                <button class="close-btn" onclick="closeModal()" style="background:none; border:none; font-size:24px; cursor:pointer; color:#94a3b8;">&times;</button>
            </div>
            <form id="jobForm" onsubmit="saveJobCard(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Job Card Reference Number (රැකියා අංකය) *</label>
                        <input type="text" id="jobId" required style="font-weight:700; color:#38bdf8;" title="Manual paper book override supported">
                    </div>
                    <div class="form-group">
                        <label>Vehicle Reg Number (වාහන අංකය) *</label>
                        <input type="text" id="vehicleRegNo" placeholder="e.g. CAB-8921" required style="text-transform:uppercase;">
                    </div>
                    <div class="form-group">
                        <label>Vehicle Brand (වාහන සන්නාමය) *</label>
                        <input type="text" id="vehicleBrand" list="brandList" placeholder="e.g. Toyota, Honda, Nissan, Suzuki..." required>
                        <datalist id="brandList"></datalist>
                    </div>
                    <div class="form-group">
                        <label>Vehicle Model (වාහන මාදිලිය) *</label>
                        <input type="text" id="vehicleModel" list="modelList" placeholder="e.g. Prius, Axio, Vezel, WagonR..." required>
                        <datalist id="modelList"></datalist>
                    </div>
                    <div class="form-group">
                        <label>Current Odometer / Mileage (කිලෝමීටර ගණන)</label>
                        <input type="number" id="mileage" placeholder="e.g. 78500">
                    </div>
                    <div class="form-group">
                        <label>Fuel Level (ඉන්ධන මට්ටම)</label>
                        <select id="fuelLevel">
                            <option value="Reserve">Reserve / Empty</option>
                            <option value="1/4">1/4 Tank</option>
                            <option value="1/2" selected>1/2 Tank</option>
                            <option value="3/4">3/4 Tank</option>
                            <option value="Full">Full Tank</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Customer Name (පාරිභෝගිකයාගේ නම) *</label>
                        <input type="text" id="customerName" list="customerNameList" placeholder="e.g. Suneth Perera" required>
                        <datalist id="customerNameList"></datalist>
                    </div>
                    <div class="form-group">
                        <label>Customer Phone (දුරකථන අංකය) *</label>
                        <input type="text" id="customerPhone" list="customerPhoneList" placeholder="e.g. 0771234567" required>
                        <datalist id="customerPhoneList"></datalist>
                    </div>
                    <div class="form-group">
                        <label>Assigned Technician (පැවරුණු කාර්මික ශිල්පියා) *</label>
                        <input type="text" id="assignedTech" list="techList" placeholder="Select or type Technician Name (e.g. Nimal Kumara)" required>
                        <datalist id="techList">
                            <!-- Populated dynamically -->
                        </datalist>
                    </div>
                    <div class="form-group">
                        <label>Job Status (තත්ත්වය)</label>
                        <select id="jobStatus">
                            <option value="PENDING">Pending (පොරොත්තුවෙන්)</option>
                            <option value="INSPECTION">Inspection (පරීක්ෂාවේ)</option>
                            <option value="IN_PROGRESS">In Progress (වැඩ කෙරෙමින්)</option>
                            <option value="READY">Ready (අවසන්)</option>
                            <option value="DELIVERED">Delivered (භාර දුන්නා)</option>
                        </select>
                    </div>
                    <div class="form-group full">
                        <label>Customer Reported Issues & Requested Work (පාරිභෝගිකයා සඳහන් කළ දෝෂ සහ අවශ්‍ය සේවා)</label>
                        <textarea id="requestedServices" rows="3" placeholder="e.g. Full engine oil & filter service, brake noise inspection, AC filter check..."></textarea>
                    </div>
                </div>
                <div style="display:flex; justify-content:flex-end; gap:12px;">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save Job Card</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Print / View Sheet Modal -->
    <div class="modal" id="printModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; justify-content:center; align-items:center; z-index:2000;">
        <div class="modal-content" style="max-width:700px; padding:24px; border-radius:20px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h3 style="color:#38bdf8;">📜 Job Card Print Preview</h3>
                <button class="close-btn" onclick="document.getElementById('printModal').style.display='none'" style="background:none; border:none; font-size:24px; cursor:pointer; color:#94a3b8;">&times;</button>
            </div>
            <div id="printableJobCard" style="border:1px solid #334155; padding:24px; border-radius:12px; background:#0f172a; color:#ffffff;">
                <!-- JS populated printable format -->
            </div>
            <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:20px;">
                <button class="btn btn-outline" onclick="sendSmsAlert()"><i class="fa-solid fa-comment-sms" style="color:#38bdf8;"></i> Send Customer SMS</button>
                <button class="btn btn-primary" onclick="window.print()"><i class="fa-solid fa-print"></i> Print Job Card</button>
            </div>
        </div>
    </div>

    <script>
        let currentJobs = [];
        let activeJobForPrint = null;

        function getBizId() {
            return window.AutoCareUtils ? window.AutoCareUtils.getBizId() : 'DEFAULT_BIZ';
        }

        function loadJobs() {
            const bizId = getBizId();
            const storageKey = `autocare_jobs_${bizId}`;
            const cached = localStorage.getItem(storageKey);

            if (cached) {
                try { currentJobs = JSON.parse(cached); } catch(e) { currentJobs = []; }
            } else {
                currentJobs = [];
            }

            renderJobTable();
        }

        function renderJobTable() {
            const tbody = document.getElementById('jobTableBody');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;

            tbody.innerHTML = '';

            const filtered = currentJobs.filter(job => {
                const searchStr = (job.id + ' ' + job.regNo + ' ' + (job.brand||'') + ' ' + (job.model||'') + ' ' + (job.customerName||job.customer||'') + ' ' + (job.customerPhone||job.phone||'')).toLowerCase();
                const matchSearch = searchStr.includes(search);
                const matchStatus = statusFilter === 'ALL' || job.status === statusFilter;
                return matchSearch && matchStatus;
            });

            if(filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" style="text-align:center; padding:40px; color:#64748b;">
                            <i class="fa-solid fa-folder-open" style="font-size:32px; color:#334155; margin-bottom:10px; display:block;"></i>
                            <strong style="color:#cbd5e1;">තවම කිසිදු Job Card එකක් සටහන් කර නොමැත. (No Job Cards found)</strong><br>
                            <small style="color:#64748b;">නව Job Card එකක් සෑදීමට ඉහළ ඇති "Create New Job Card" ක්ලික් කරන්න.</small>
                        </td>
                    </tr>`;
                return;
            }

            filtered.forEach(j => {
                let badgeClass = 'badge-pending';
                if(j.status === 'INSPECTION') badgeClass = 'badge-inspection';
                if(j.status === 'IN_PROGRESS') badgeClass = 'badge-progress';
                if(j.status === 'READY') badgeClass = 'badge-ready';
                if(j.status === 'DELIVERED') badgeClass = 'badge-delivered';

                const formattedDate = window.AutoCareUtils ? window.AutoCareUtils.formatDateDDMMYYYY(j.date) : j.date;
                const cName = j.customerName || j.customer || '-';
                const cPhone = j.customerPhone || j.phone || '-';
                const brand = j.brand || '';
                const model = j.model || '';

                tbody.innerHTML += `
                    <tr>
                        <td><strong style="color:#38bdf8;">#${j.id}</strong><br><small style="color:#94a3b8;"><i class="fa-solid fa-calendar-days"></i> ${formattedDate}</small></td>
                        <td><strong style="font-size:14px; color:#ffffff;">${j.regNo}</strong><br><small style="color:#cbd5e1;">${brand} ${model}</small></td>
                        <td><strong style="color:#ffffff;">${cName}</strong><br><small style="color:#94a3b8;"><i class="fa-solid fa-phone"></i> ${cPhone}</small></td>
                        <td><span style="font-weight:600; color:#38bdf8;"><i class="fa-solid fa-user-gear"></i> ${j.tech}</span></td>
                        <td>${j.mileage}<br><small style="color:#94a3b8;">Fuel: ${j.fuel}</small></td>
                        <td><span class="status-badge ${badgeClass}">${j.status}</span></td>
                        <td>
                            <button class="btn btn-outline" style="padding:5px 10px; font-size:12px;" title="Print Job Card" onclick="viewPrintModal('${j.id}')"><i class="fa-solid fa-print"></i></button>
                            <button class="btn btn-outline" style="padding:5px 10px; font-size:12px;" title="Edit Job Card" onclick="editJob('${j.id}')"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button class="btn-danger-icon" title="Delete Job Card" onclick="deleteJobCard('${j.id}')"><i class="fa-solid fa-trash-can"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        function filterJobs() { renderJobTable(); }

        function populateAutoDatalists() {
            const techList = document.getElementById('techList');
            if (techList) {
                const techs = window.AutoCareUtils ? window.AutoCareUtils.getTechnicians() : [];
                techList.innerHTML = techs.map(t => `<option value="${t}"></option>`).join('');
            }
            const brandList = document.getElementById('brandList');
            if (brandList) {
                const brands = window.AutoCareUtils ? window.AutoCareUtils.getVehicleBrands() : [];
                brandList.innerHTML = brands.map(b => `<option value="${b}"></option>`).join('');
            }
            const modelList = document.getElementById('modelList');
            if (modelList) {
                const models = window.AutoCareUtils ? window.AutoCareUtils.getVehicleModels() : [];
                modelList.innerHTML = models.map(m => `<option value="${m}"></option>`).join('');
            }
            const nameList = document.getElementById('customerNameList');
            const phoneList = document.getElementById('customerPhoneList');
            if (nameList || phoneList) {
                const customers = window.AutoCareUtils ? window.AutoCareUtils.getCustomers() : [];
                if (nameList) nameList.innerHTML = customers.map(c => `<option value="${c.name}">${c.phone ? '(' + c.phone + ')' : ''}</option>`).join('');
                if (phoneList) phoneList.innerHTML = customers.filter(c => c.phone).map(c => `<option value="${c.phone}">${c.name}</option>`).join('');
            }
        }

        let isEditingMode = false;

        function openNewJobModal() {
            populateAutoDatalists();
            isEditingMode = false;
            const form = document.getElementById('jobForm');
            if (form) form.reset();
            const nextNo = window.AutoCareUtils ? window.AutoCareUtils.getNextJobNumber() : 'JOB-00001';
            document.getElementById('jobId').value = nextNo;
            document.getElementById('modalTitle').innerText = '📋 New Job Card (නව රැකියා කාඩ්පත)';
            const modal = document.getElementById('jobModal');
            if (modal) modal.style.display = 'flex';
        }

        function closeModal() {
            const modal = document.getElementById('jobModal');
            if (modal) modal.style.display = 'none';
        }

        function editJob(id) {
            populateAutoDatalists();
            isEditingMode = true;
            const j = currentJobs.find(item => item.id === id);
            if(!j) return;
            document.getElementById('jobId').value = j.id;
            document.getElementById('modalTitle').innerText = '✏️ Edit Job Card #' + j.id;
            document.getElementById('vehicleRegNo').value = j.regNo;
            document.getElementById('vehicleBrand').value = j.brand || '';
            document.getElementById('vehicleModel').value = j.model || '';
            document.getElementById('mileage').value = (j.mileage || '').replace(' km', '');
            document.getElementById('fuelLevel').value = j.fuel;
            document.getElementById('customerName').value = j.customerName || j.customer || '';
            document.getElementById('customerPhone').value = j.customerPhone || j.phone || '';
            document.getElementById('assignedTech').value = j.tech;
            document.getElementById('jobStatus').value = j.status;
            document.getElementById('requestedServices').value = j.services;

            document.getElementById('jobModal').style.display = 'flex';
        }

        function saveJobCard(e) {
            e.preventDefault();
            let id = document.getElementById('jobId').value || (window.AutoCareUtils ? window.AutoCareUtils.getNextJobNumber() : 'JOB-' + Date.now());
            const regNo = document.getElementById('vehicleRegNo').value.toUpperCase().trim();
            const brand = document.getElementById('vehicleBrand').value.trim();
            const model = document.getElementById('vehicleModel').value.trim();
            const mileage = document.getElementById('mileage').value ? document.getElementById('mileage').value + ' km' : 'N/A';
            const fuel = document.getElementById('fuelLevel').value;
            const customerName = document.getElementById('customerName').value.trim();
            const customerPhone = document.getElementById('customerPhone').value.trim();
            const tech = document.getElementById('assignedTech').value.trim();
            const status = document.getElementById('jobStatus').value;
            const services = document.getElementById('requestedServices').value.trim();

            if (!regNo) {
                alert('⚠️ Please enter Vehicle Reg Number (වාහන අංකය).');
                return;
            }

            // Auto-remember technician, brand, model, and customer details for future autocomplete!
            if (window.AutoCareUtils) {
                if (tech) window.AutoCareUtils.saveTechnician(tech);
                if (brand) window.AutoCareUtils.saveVehicleBrand(brand);
                if (model) window.AutoCareUtils.saveVehicleModel(model);
                if (customerName) window.AutoCareUtils.saveCustomerMemory(customerName, customerPhone, regNo, brand, model);
            }

            const existingIndex = currentJobs.findIndex(j => j.id === id);

            // If creating a new job card and there is a collision, generate fresh number
            if (!isEditingMode && existingIndex >= 0) {
                if (window.AutoCareUtils) window.AutoCareUtils.saveJobCounter();
                id = (window.AutoCareUtils ? window.AutoCareUtils.getNextJobNumber() : 'JOB-' + Date.now());
            }

            const newObj = {
                id, date: new Date().toISOString().split('T')[0],
                regNo, brand, model, customerName, customerPhone, tech, mileage, fuel, status, services
            };

            if (isEditingMode && existingIndex >= 0) {
                currentJobs[existingIndex] = newObj;
            } else {
                currentJobs.unshift(newObj);
                if (window.AutoCareUtils) {
                    window.AutoCareUtils.saveJobCounter();
                }
            }

            const bizId = getBizId();
            localStorage.setItem(`autocare_jobs_${bizId}`, JSON.stringify(currentJobs));

            closeModal();
            renderJobTable();
            alert('✅ Job Card #' + id + ' saved successfully!');
        }

        function editJob(id) {
            populateAutoDatalists();
            const j = currentJobs.find(item => item.id === id);
            if(!j) return;
            document.getElementById('jobId').value = j.id;
            document.getElementById('modalTitle').innerText = '✏️ Edit Job Card #' + j.id;
            document.getElementById('vehicleRegNo').value = j.regNo;
            document.getElementById('vehicleBrand').value = j.brand || '';
            document.getElementById('vehicleModel').value = j.model || '';
            document.getElementById('mileage').value = (j.mileage || '').replace(' km', '');
            document.getElementById('fuelLevel').value = j.fuel;
            document.getElementById('customerName').value = j.customerName || j.customer || '';
            document.getElementById('customerPhone').value = j.customerPhone || j.phone || '';
            document.getElementById('assignedTech').value = j.tech;
            document.getElementById('jobStatus').value = j.status;
            document.getElementById('requestedServices').value = j.services;

            document.getElementById('jobModal').style.display = 'flex';
        }

        function deleteJobCard(id) {
            if (confirm(`ඔබට #${id} රැකියා කාඩ්පත මකා දැමීමට අවශ්‍ය බව තහවුරු කරන්න? (Delete Job Card #${id}?)`)) {
                currentJobs = currentJobs.filter(j => j.id !== id);
                const bizId = getBizId();
                localStorage.setItem(`autocare_jobs_${bizId}`, JSON.stringify(currentJobs));
                renderJobTable();
                alert(`✅ Job Card #${id} deleted successfully!`);
            }
        }

        function viewPrintModal(id) {
            const j = currentJobs.find(item => item.id === id);
            if(!j) return;
            activeJobForPrint = j;

            const companyName = window.AutoCareUtils ? window.AutoCareUtils.getCompanyName() : "DIGIBIZ Auto Care";
            const formattedDate = window.AutoCareUtils ? window.AutoCareUtils.formatDateDDMMYYYY(j.date) : j.date;

            const container = document.getElementById('printableJobCard');
            container.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:3px solid #0284c7; padding-bottom:16px; margin-bottom:20px;">
                    <div style="display:flex; align-items:center; gap:16px;">
                        <div id="jobLogoContainer" style="width:60px; height:60px; background:linear-gradient(135deg, #0284c7 0%, #0369a1 100%); border-radius:12px; display:flex; align-items:center; justify-content:center; color:#ffffff; font-size:26px; box-shadow:0 4px 12px rgba(2,132,199,0.3); flex-shrink:0;">
                            <i class="fa-solid fa-wrench"></i>
                        </div>
                        <div>
                            <h2 style="color:#0284c7; font-size:20px; font-weight:900; margin:0; text-transform:uppercase; letter-spacing:0.5px;">${companyName}</h2>
                            <p style="color:#475569; font-size:13px; font-weight:600; margin:3px 0 0 0;"><i class="fa-solid fa-gears" style="color:#0284c7;"></i> Workshop Operations & Maintenance Division</p>
                        </div>
                    </div>
                    <div style="text-align:right;">
                        <div style="display:inline-block; background:rgba(2, 132, 199, 0.15); border:1px solid #0284c7; color:#0284c7; font-size:11px; font-weight:800; padding:4px 12px; border-radius:20px; text-transform:uppercase; letter-spacing:1px; margin-bottom:6px;">
                            JOB CARD SHEET
                        </div>
                        <h3 style="font-size:16px; font-weight:900; color:#0f172a; margin:0;">JOB CARD #${j.id}</h3>
                        <p style="font-size:12px; color:#475569; margin-top:2px;">Date: ${formattedDate}</p>
                    </div>
                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; background:#1e293b; padding:14px; border-radius:10px; border:1px solid #334155;">
                    <div>
                        <p style="font-size:11px; color:#38bdf8; font-weight:700;">VEHICLE DETAILS</p>
                        <p style="font-size:16px; font-weight:800; color:#ffffff;">${j.regNo}</p>
                        <p style="font-size:13px; color:#cbd5e1;">Brand: <strong>${j.brand || '-'}</strong> | Model: <strong>${j.model || '-'}</strong></p>
                        <p style="font-size:12px; color:#94a3b8;">Odometer: <strong>${j.mileage}</strong> | Fuel: <strong>${j.fuel}</strong></p>
                    </div>
                    <div>
                        <p style="font-size:11px; color:#38bdf8; font-weight:700;">CUSTOMER & TECHNICIAN</p>
                        <p style="font-size:14px; font-weight:700; color:#ffffff;">Customer: ${j.customerName || j.customer || '-'}</p>
                        <p style="font-size:12px; color:#cbd5e1;">Phone: ${j.customerPhone || j.phone || '-'}</p>
                        <p style="font-size:12px; color:#cbd5e1;">Assigned Tech: <strong>${j.tech}</strong></p>
                    </div>
                </div>

                <div style="margin-bottom:16px;">
                    <h4 style="font-size:13px; font-weight:700; color:#38bdf8; border-bottom:1px solid #334155; padding-bottom:4px; margin-bottom:8px;">REQUESTED SERVICES & REPAIRS</h4>
                    <p style="font-size:13px; color:#cbd5e1; line-height:1.6; background:#1e293b; padding:10px; border-radius:6px; border:1px solid #334155;">${j.services || 'General Vehicle Service & Checkup'}</p>
                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:30px; font-size:12px; color:#94a3b8;">
                    <div style="border-top:1px dashed #475569; text-align:center; padding-top:6px;">Customer Signature</div>
                    <div style="border-top:1px dashed #475569; text-align:center; padding-top:6px;">Supervisor / Tech Signature</div>
                </div>
            `;
            if (window.AutoCareUtils) window.AutoCareUtils.renderCompanyLogo('jobLogoContainer', 'fa-solid fa-wrench');
            document.getElementById('printModal').style.display = 'flex';
        }

        function sendSmsAlert() {
            if(!activeJobForPrint) return;
            const cName = activeJobForPrint.customerName || activeJobForPrint.customer || '';
            const cPhone = activeJobForPrint.customerPhone || activeJobForPrint.phone || '';
            alert(`💬 SMS Notification disptached to ${cName} (${cPhone}):\n"ඔබගේ වාහනය ${activeJobForPrint.regNo} හි අලුත්වැඩියා කටයුතු (Job #${activeJobForPrint.id}) සඳහා ස්තූතියි."`);
        }

        window.openNewJobModal = openNewJobModal;
        window.closeModal = closeModal;
        window.saveJobCard = saveJobCard;
        window.editJob = editJob;
        window.deleteJobCard = deleteJobCard;
        window.viewPrintModal = viewPrintModal;

        window.onload = function() {
            loadJobs();
            const urlParams = new URLSearchParams(window.location.search);
            if(urlParams.get('action') === 'new') {
                openNewJobModal();
            }
        };
    </script>

    <style>
        @media print {
            .header-bar, .controls-card, .table-card, #jobModal, .no-print, .retail-navbar, .digibiz-mobile-topbar, .digibiz-mobile-menu-toggle, .trial-sidebar-banner { display: none !important; }
            #printModal {
                position: relative !important;
                display: block !important;
                background: #ffffff !important;
                width: 100% !important;
                height: auto !important;
                left: 0 !important;
                top: 0 !important;
                padding: 0 !important;
                box-shadow: none !important;
            }
            #printModal .modal-content {
                background: #ffffff !important;
                color: #000000 !important;
                border: 1px solid #cbd5e1 !important;
                box-shadow: none !important;
                max-width: 100% !important;
                padding: 20px !important;
            }
            #printableJobCard div, #printableJobCard p, #printableJobCard h2, #printableJobCard h3, #printableJobCard h4, #printableJobCard strong {
                color: #000000 !important;
            }
            #printableJobCard h2 {
                color: #0284c7 !important;
            }
            #printableJobCard div[style*="background:#1e293b"], #printableJobCard p[style*="background:#1e293b"] {
                background: #f8fafc !important;
                border: 1px solid #cbd5e1 !important;
            }
        }
    </style>

</body>
</html>
