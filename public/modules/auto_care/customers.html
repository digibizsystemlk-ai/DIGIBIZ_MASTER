<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="/core/pwa-init.js?v=1"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers & Vehicle History - DIGIBIZ Auto Care</title>
    <style>html.digibiz-sidebar-reserved body{margin-left:260px;}@media (max-width:768px){html.digibiz-sidebar-reserved body{margin-left:0;}}</style>
    <script>document.documentElement.classList.add('digibiz-sidebar-reserved');</script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="autocare-theme.css?v=3">
    
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
    
    <script src="/core/firebase-init.js?v=100"></script>
    <script src="/scripts/admin-impersonation.js?v=100"></script>
    <script src="../../core/event-validation.js?v=3"></script>
    <script src="../../core/event-bus.js?v=3"></script>
    <script src="../../core/accounts-core.js?v=3"></script>
    <script src="../../core/auth-roles.js?v=120"></script>
    <script src="../../core/business-types.js?v=4"></script>
    <script src="../../core/dashboard-core.js?v=3"></script>
    <script src="../../core/subscription-manager.js?v=3"></script>
    <script src="../../core/sidebar.js?v=2000"></script>
    <script src="autocare-utils.js?v=2"></script>
    
    <style>
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .search-card { background: rgba(30, 41, 59, 0.85); border-radius: 16px; padding: 16px 20px; border: 1px solid #334155; margin-bottom: 25px; display: flex; gap: 15px; }
        .search-box { flex: 1; position: relative; }
        .search-box input { width: 100%; padding: 10px 14px 10px 40px; }
        .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #64748b; }

        .grid-layout { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        @media (max-width: 900px) { .grid-layout { grid-template-columns: 1fr; } }

        .customer-item { padding: 14px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 10px; cursor: pointer; transition: all 0.2s; display: flex; justify-content: space-between; align-items: center; background: #0f172a; }
        .customer-item:hover, .customer-item.active { background: #1e293b; border-color: #38bdf8; }

        .timeline { border-left: 2px solid #334155; margin-left: 10px; padding-left: 20px; margin-top: 20px; }
        .timeline-event { position: relative; margin-bottom: 25px; }
        .timeline-event::before { content: ''; position: absolute; left: -27px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: #38bdf8; }
    </style>
</head>
<body>

    <div class="header-bar">
        <div>
            <h2 style="color:#38bdf8; font-size:24px; font-weight:800;"><i class="fa-solid fa-users-gear"></i> Customer Directory & Vehicle History</h2>
            <p style="color:#94a3b8; font-size:14px; margin-top:4px;">පාරිභෝගික තොරතුරු ඇතුළත් කිරීම, සංස්කරණය (Edit) සහ මකා දැමීම (Delete)</p>
        </div>
        <button class="btn btn-primary" onclick="openCustomerModal()"><i class="fa-solid fa-user-plus"></i> Add New Customer</button>
    </div>

    <div class="search-card">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="cSearch" placeholder="Search Vehicle Reg Plate, Customer Name or Phone Number..." onkeyup="filterCustomers()">
        </div>
    </div>

    <div class="grid-layout">
        <!-- Customer Directory List -->
        <div class="card-dark" style="padding:24px;">
            <h3 style="font-size:16px; font-weight:700; color:#38bdf8; margin-bottom:15px;"><i class="fa-solid fa-users"></i> Registered Customers</h3>
            <div id="customerList">
                <!-- JS Rendered -->
            </div>
        </div>

        <!-- Vehicle History Timeline View -->
        <div class="card-dark" style="padding:24px;">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #334155; padding-bottom:12px;">
                <div>
                    <h3 style="font-size:18px; font-weight:800; color:#ffffff;" id="hName">Select a customer</h3>
                    <p style="font-size:13px; color:#94a3b8;" id="hVeh">Vehicle details</p>
                </div>
                <div style="text-align:right;">
                    <span style="font-size:12px; color:#94a3b8;">Total Lifetime Spend</span>
                    <h3 style="color:#34d399; font-size:20px; font-weight:800;" id="hSpent">Rs. 0</h3>
                </div>
            </div>

            <h4 style="margin-top:20px; font-size:14px; font-weight:700; color:#38bdf8;"><i class="fa-solid fa-clock-rotate-left"></i> Service & Repair History Timeline</h4>
            <div class="timeline" id="historyTimeline">
                <p style="color:#64748b; font-size:13px;">No history records for selected customer.</p>
            </div>
        </div>
    </div>

    <!-- Modal Add/Edit Customer -->
    <div class="modal" id="custModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; justify-content:center; align-items:center; z-index:2000;">
        <div class="modal-content" style="width:90%; max-width:550px; padding:24px; border-radius:20px;">
            <h3 style="margin-bottom:15px; color:#38bdf8;" id="modalHeading">👤 Customer Details</h3>
            <form onsubmit="saveCustomer(event)">
                <input type="hidden" id="cId">
                <div style="display:flex; flex-direction:column; gap:12px;">
                    <div>
                        <label>Customer Name *</label>
                        <input type="text" id="cName" required style="width:100%;">
                    </div>
                    <div>
                        <label>Customer Phone Number *</label>
                        <input type="text" id="cPhone" required style="width:100%;">
                    </div>
                    <div>
                        <label>Vehicle Reg Number *</label>
                        <input type="text" id="cReg" required placeholder="e.g. CAB-8921" style="width:100%; text-transform:uppercase;">
                    </div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                        <div>
                            <label>Vehicle Brand *</label>
                            <input type="text" id="cBrand" list="brandList" placeholder="e.g. Toyota" style="width:100%;">
                            <datalist id="brandList"></datalist>
                        </div>
                        <div>
                            <label>Vehicle Model *</label>
                            <input type="text" id="cModel" list="modelList" placeholder="e.g. Prius 2018" style="width:100%;">
                            <datalist id="modelList"></datalist>
                        </div>
                    </div>
                </div>
                <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
                    <button type="button" class="btn btn-outline" onclick="document.getElementById('custModal').style.display='none'">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Customer</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let customers = [];
        let activeCustId = null;

        function getBizId() {
            return window.AutoCareUtils ? window.AutoCareUtils.getBizId() : 'DEFAULT_BIZ';
        }

        function loadCustomers() {
            const bizId = getBizId();
            const storageKey = `autocare_customers_${bizId}`;
            const cached = localStorage.getItem(storageKey);

            if (cached) {
                try { customers = JSON.parse(cached); } catch(e) { customers = []; }
            } else {
                customers = [];
            }

            renderCustomers();
        }

        function renderCustomers() {
            const list = document.getElementById('customerList');
            const query = document.getElementById('cSearch').value.toLowerCase();

            list.innerHTML = '';

            const filtered = customers.filter(c => (c.name||'').toLowerCase().includes(query) || (c.phone||'').includes(query) || (c.reg||'').toLowerCase().includes(query));

            if (filtered.length === 0) {
                list.innerHTML = `<p style="padding:20px; text-align:center; color:#64748b; font-size:13px;">තවම කිසිදු පාරිභෝගිකයෙකු ඇතුළත් කර නැත. (No customers recorded)</p>`;
                return;
            }

            filtered.forEach(c => {
                const isActive = c.id === activeCustId ? 'active' : '';
                const brand = c.brand || '';
                const model = c.model || '';
                list.innerHTML += `
                    <div class="customer-item ${isActive}" onclick="selectCustomer('${c.id}')">
                        <div>
                            <strong style="font-size:15px; color:#ffffff;">${c.name}</strong>
                            <p style="font-size:12px; color:#cbd5e1; margin-top:2px;"><i class="fa-solid fa-phone"></i> ${c.phone}</p>
                            <p style="font-size:12px; color:#38bdf8; font-weight:700; margin-top:4px;">Vehicle: ${c.reg} (${brand} ${model})</p>
                        </div>
                        <div style="display:flex; gap:6px;">
                            <button class="btn btn-outline" style="padding:4px 8px; font-size:11px;" title="Edit Customer" onclick="editCustomer('${c.id}', event)"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button class="btn-danger-icon" title="Delete Customer" onclick="deleteCustomer('${c.id}', event)"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                `;
            });

            if (!activeCustId && filtered.length > 0) {
                selectCustomer(filtered[0].id);
            }
        }

        function selectCustomer(id) {
            activeCustId = id;
            const c = customers.find(x => x.id === id);
            if (!c) return;

            document.getElementById('hName').innerText = c.name;
            document.getElementById('hVeh').innerText = `Vehicle: ${c.reg} (${c.brand||''} ${c.model||''})`;
            document.getElementById('hSpent').innerText = `Rs. ${(c.totalSpent || 0).toLocaleString()}`;

            const timeline = document.getElementById('historyTimeline');
            if (c.history && c.history.length > 0) {
                timeline.innerHTML = c.history.map(h => `
                    <div class="timeline-event">
                        <div style="display:flex; justify-content:space-between;">
                            <strong style="font-size:14px; color:#38bdf8;">${h.title}</strong>
                            <span style="font-size:12px; color:#94a3b8;">${window.AutoCareUtils ? window.AutoCareUtils.formatDateDDMMYYYY(h.date) : h.date}</span>
                        </div>
                        <p style="font-size:13px; color:#cbd5e1; margin-top:4px;">Odometer: ${h.mileage} | Tech: ${h.tech}</p>
                        <p style="font-size:12px; color:#94a3b8; background:#0f172a; padding:8px; border-radius:6px; margin-top:6px; border:1px solid #334155;">${h.notes}</p>
                    </div>
                `).join('');
            } else {
                timeline.innerHTML = `<p style="color:#64748b; font-size:13px;">No past service history records for this vehicle.</p>`;
            }
            renderCustomers();
        }

        function filterCustomers() { renderCustomers(); }

        function populateAutoDatalists() {
            const brandList = document.getElementById('brandList');
            if (brandList) {
                const brands = window.AutoCareUtils ? window.AutoCareUtils.getVehicleBrands() : [];
                brandList.innerHTML = brands.map(b => `<option value="${b}"></option>`).join('');
            }
            const modelList = document.getElementById('modelList');
            if (modelList) {
                const models = window.AutoCareUtils ? window.AutoCareUtils.getVehicleModels() : [];
                modelList.innerHTML = models.map(m => `<option value="${m}"></option>`).join('');
            }
        }

        function openCustomerModal() {
            populateAutoDatalists();
            document.getElementById('cId').value = '';
            document.getElementById('modalHeading').innerText = '👤 Add New Customer';
            document.getElementById('cName').value = '';
            document.getElementById('cPhone').value = '';
            document.getElementById('cReg').value = '';
            document.getElementById('cBrand').value = '';
            document.getElementById('cModel').value = '';
            document.getElementById('custModal').style.display = 'flex';
        }

        function saveCustomer(e) {
            e.preventDefault();
            const id = document.getElementById('cId').value || 'CUST-' + Date.now();
            const name = document.getElementById('cName').value.trim();
            const phone = document.getElementById('cPhone').value.trim();
            const reg = document.getElementById('cReg').value.toUpperCase().trim();
            const brand = document.getElementById('cBrand').value.trim();
            const model = document.getElementById('cModel').value.trim();

            if (window.AutoCareUtils) {
                if (brand) window.AutoCareUtils.saveVehicleBrand(brand);
                if (model) window.AutoCareUtils.saveVehicleModel(model);
            }

            const existingIndex = customers.findIndex(x => x.id === id);
            if (existingIndex >= 0) {
                customers[existingIndex].name = name;
                customers[existingIndex].phone = phone;
                customers[existingIndex].reg = reg;
                customers[existingIndex].brand = brand;
                customers[existingIndex].model = model;
            } else {
                customers.unshift({ id, name, phone, reg, brand, model, totalSpent: 0, history: [] });
            }

            const bizId = getBizId();
            localStorage.setItem(`autocare_customers_${bizId}`, JSON.stringify(customers));

            document.getElementById('custModal').style.display = 'none';
            renderCustomers();
            alert('✅ Customer details saved!');
        }

        function editCustomer(id, e) {
            if (e) e.stopPropagation();
            const c = customers.find(x => x.id === id);
            if (!c) return;

            document.getElementById('cId').value = c.id;
            document.getElementById('modalHeading').innerText = `✏️ Edit Customer: ${c.name}`;
            document.getElementById('cName').value = c.name;
            document.getElementById('cPhone').value = c.phone;
            document.getElementById('cReg').value = c.reg;
            document.getElementById('cBrand').value = c.brand || '';
            document.getElementById('cModel').value = c.model || '';
            document.getElementById('custModal').style.display = 'flex';
        }

        function deleteCustomer(id, e) {
            if (e) e.stopPropagation();
            if (confirm(`ඔබට මෙම පාරිභෝගිකයාගේ දත්ත මකා දැමීමට අවශ්‍ය බව තහවුරු කරන්න? (Delete Customer?)`)) {
                customers = customers.filter(c => c.id !== id);
                if (activeCustId === id) activeCustId = null;
                const bizId = getBizId();
                localStorage.setItem(`autocare_customers_${bizId}`, JSON.stringify(customers));
                renderCustomers();
                alert(`✅ Customer deleted successfully!`);
            }
        }

        window.onload = loadCustomers;
    </script>
</body>
</html>
