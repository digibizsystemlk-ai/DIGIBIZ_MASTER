<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="/core/pwa-init.js?v=1"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Service History Records - DIGIBIZ Auto Care</title>
    <style>html.digibiz-sidebar-reserved body{margin-left:260px;}@media (max-width:768px){html.digibiz-sidebar-reserved body{margin-left:0;}}</style>
    <script>document.documentElement.classList.add('digibiz-sidebar-reserved');</script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="autocare-theme.css?v=3">
    
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
    
    <script src="/core/firebase-init.js?v=100"></script>
    <script src="/scripts/admin-impersonation.js?v=100"></script>
    <script src="/core/event-validation.js?v=3"></script>
    <script src="/core/event-bus.js?v=3"></script>
    <script src="/core/accounts-core.js?v=3"></script>
    <script src="/core/auth-roles.js?v=120"></script>
    <script src="/core/business-types.js?v=4"></script>
    <script src="/core/dashboard-core.js?v=3"></script>
    <script src="/core/subscription-manager.js?v=3"></script>
    <script src="/core/sidebar.js?v=2001"></script>
    <script src="autocare-utils.js?v=2"></script>
    
    <style>
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .search-card { background: rgba(30, 41, 59, 0.85); border-radius: 16px; padding: 20px; border: 1px solid #334155; margin-bottom: 25px; }
        .search-box { position: relative; width: 100%; }
        .search-box input { width: 100%; padding: 14px 14px 14px 44px; font-size: 16px !important; }
        .search-box i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #38bdf8; font-size: 18px; }

        .timeline { border-left: 2px solid #334155; margin-left: 15px; padding-left: 25px; margin-top: 20px; }
        .timeline-event { position: relative; margin-bottom: 25px; background: #0f172a; padding: 18px; border-radius: 14px; border: 1px solid #334155; }
        .timeline-event::before { content: ''; position: absolute; left: -32px; top: 20px; width: 12px; height: 12px; border-radius: 50%; background: #38bdf8; border: 2px solid #0f172a; }
    </style>
</head>
<body>

    <div class="header-bar">
        <div>
            <h2 style="color:#38bdf8; font-size:24px; font-weight:800;"><i class="fa-solid fa-file-shield"></i> Vehicle Service History Records Engine</h2>
            <p style="color:#94a3b8; font-size:14px; margin-top:4px;">වාහන ලියාපදිංචි අංකය, පාරිභෝගික නම හෝ දුරකථන අංකය මගින් සියලුම සේවා ඉතිහාසය එකම තැනකින් සෙවීම</p>
        </div>
        <button class="btn btn-primary" onclick="openRecordModal()"><i class="fa-solid fa-plus"></i> Register New Service Record</button>
    </div>

    <!-- Search Engine Input -->
    <div class="search-card">
        <label style="font-size:13px; font-weight:700; color:#38bdf8; margin-bottom:8px; display:block;">🔍 Instant Vehicle Service History Search (සෙවුම් යන්ත්‍රය)</label>
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="recordSearch" placeholder="Type Vehicle Reg Plate (e.g. CAB-8921), Customer Name or Phone Number..." onkeyup="searchServiceRecords()">
        </div>
    </div>

    <!-- Search Results Header -->
    <div class="card-dark" style="padding:22px; margin-bottom:25px;" id="resHeader">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>
                <h3 style="color:#ffffff; font-size:18px;" id="vTitle">All Vehicle Service Records</h3>
                <p style="color:#94a3b8; font-size:13px;" id="vSub">Enter vehicle registration plate above for instant history timeline.</p>
            </div>
            <div style="text-align:right;">
                <span style="font-size:12px; color:#94a3b8;">Total Records Found</span>
                <h3 style="color:#38bdf8; font-size:22px;" id="recordCount">0</h3>
            </div>
        </div>
    </div>

    <!-- Timeline View -->
    <div class="timeline" id="recordsTimeline">
        <!-- JS Rendered -->
    </div>

    <!-- Modal Log Service Record -->
    <div class="modal" id="recordModal" style="display:none;">
        <div class="modal-content" style="max-width:600px; padding:24px; border-radius:20px;">
            <h3 style="margin-bottom:15px; color:#38bdf8;" id="modalHeading"><i class="fa-solid fa-clipboard-list"></i> Register Vehicle Service Record</h3>
            <form onsubmit="saveServiceRecord(event)">
                <input type="hidden" id="recId">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                    <div>
                        <label>Vehicle Reg Number *</label>
                        <input type="text" id="rReg" required placeholder="e.g. CAB-8921" style="width:100%; text-transform:uppercase;">
                    </div>
                    <div>
                        <label>Service Date *</label>
                        <input type="date" id="rDate" required style="width:100%;">
                    </div>
                    <div>
                        <label>Customer Name *</label>
                        <input type="text" id="rCustName" list="customerNameList" required style="width:100%;">
                        <datalist id="customerNameList"></datalist>
                    </div>
                    <div>
                        <label>Customer Phone *</label>
                        <input type="text" id="rCustPhone" list="customerPhoneList" required style="width:100%;">
                        <datalist id="customerPhoneList"></datalist>
                    </div>
                    <div>
                        <label>Odometer / Mileage (KM)</label>
                        <input type="number" id="rMileage" placeholder="e.g. 78500" style="width:100%;">
                    </div>
                    <div>
                        <label>Assigned Technician</label>
                        <input type="text" id="rTech" list="techList" placeholder="e.g. Nimal Kumara" style="width:100%;">
                        <datalist id="techList"></datalist>
                    </div>
                    <div style="grid-column: span 2;">
                        <label>Services Completed & Spare Parts Replaced *</label>
                        <textarea id="rServices" rows="3" required placeholder="e.g. Full engine synthetic oil change, oil filter replacement, brake lathe, AC gas refill..." style="width:100%;"></textarea>
                    </div>
                    <div>
                        <label>Total Service Cost (LKR)</label>
                        <input type="number" id="rCost" value="0" style="width:100%;">
                    </div>
                    <div>
                        <label>Job / Bill Reference Number</label>
                        <input type="text" id="rRef" placeholder="e.g. JOB-00012" style="width:100%;">
                    </div>
                </div>
                <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
                    <button type="button" class="btn btn-outline" onclick="document.getElementById('recordModal').style.display='none'">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Service Record</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let serviceRecords = [];

        function getBizId() {
            return window.AutoCareUtils ? window.AutoCareUtils.getBizId() : 'DEFAULT_BIZ';
        }

        function loadServiceRecords() {
            const bizId = getBizId();
            const storageKey = `autocare_service_records_${bizId}`;
            const cached = localStorage.getItem(storageKey);

            if (cached) {
                try { serviceRecords = JSON.parse(cached); } catch(e) { serviceRecords = []; }
            } else {
                serviceRecords = [];
            }

            searchServiceRecords();
        }

        function searchServiceRecords() {
            const query = document.getElementById('recordSearch').value.toLowerCase().trim();
            const timeline = document.getElementById('recordsTimeline');
            timeline.innerHTML = '';

            const filtered = serviceRecords.filter(r => 
                (r.reg||'').toLowerCase().includes(query) || 
                (r.custName||'').toLowerCase().includes(query) || 
                (r.custPhone||'').includes(query) ||
                (r.services||'').toLowerCase().includes(query)
            );

            document.getElementById('recordCount').innerText = filtered.length;

            if (filtered.length === 0) {
                timeline.innerHTML = `<p style="color:#64748b; font-size:14px; padding:30px; text-align:center;">සෙවූ වාහනයට හෝ පාරිභෝගිකයාට අදාළ සේවා වාර්තා කිසිවක් හමු නොවීය. (No service history records found)</p>`;
                return;
            }

            filtered.forEach(r => {
                const dateStr = window.AutoCareUtils ? window.AutoCareUtils.formatDateDDMMYYYY(r.date) : r.date;
                timeline.innerHTML += `
                    <div class="timeline-event">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <div>
                                <strong style="font-size:16px; color:#38bdf8;">${r.reg}</strong>
                                <span style="font-size:12px; color:#94a3b8; margin-left:10px;"><i class="fa-solid fa-user"></i> ${r.custName} (${r.custPhone})</span>
                            </div>
                            <div style="display:flex; gap:10px; align-items:center;">
                                <span style="font-size:12px; color:#94a3b8;"><i class="fa-solid fa-calendar-days"></i> ${dateStr}</span>
                                <button class="btn btn-outline" style="padding:3px 8px; font-size:11px;" title="Edit" onclick="editRecord('${r.id}')"><i class="fa-solid fa-pen-to-square"></i></button>
                                <button class="btn-danger-icon" title="Delete" onclick="deleteRecord('${r.id}')"><i class="fa-solid fa-trash-can"></i></button>
                            </div>
                        </div>
                        <div style="margin-top:10px; padding:10px; background:#1e293b; border-radius:8px; border:1px solid #334155;">
                            <p style="font-size:13.5px; color:#ffffff;">${r.services}</p>
                            <div style="display:flex; justify-content:space-between; font-size:12px; color:#94a3b8; margin-top:8px;">
                                <span>Odometer: <strong style="color:#cbd5e1;">${r.mileage ? r.mileage + ' KM' : 'N/A'}</strong> | Tech: <strong style="color:#cbd5e1;">${r.tech || '-'}</strong> | Ref: <strong style="color:#38bdf8;">${r.ref || '-'}</strong></span>
                                <strong style="color:#34d399; font-size:14px;">Rs. ${(r.cost || 0).toLocaleString()}</strong>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function populateDatalists() {
            const nameList = document.getElementById('customerNameList');
            const phoneList = document.getElementById('customerPhoneList');
            const techList = document.getElementById('techList');

            if (nameList || phoneList) {
                const custs = window.AutoCareUtils ? window.AutoCareUtils.getCustomers() : [];
                if (nameList) nameList.innerHTML = custs.map(c => `<option value="${c.name}">${c.phone ? '('+c.phone+')' : ''}</option>`).join('');
                if (phoneList) phoneList.innerHTML = custs.filter(c => c.phone).map(c => `<option value="${c.phone}">${c.name}</option>`).join('');
            }
            if (techList) {
                const techs = window.AutoCareUtils ? window.AutoCareUtils.getTechnicians() : [];
                techList.innerHTML = techs.map(t => `<option value="${t}"></option>`).join('');
            }
        }

        function openRecordModal() {
            populateDatalists();
            document.getElementById('recId').value = '';
            document.getElementById('modalHeading').innerText = '📋 Register Vehicle Service Record';
            document.getElementById('rReg').value = '';
            document.getElementById('rDate').valueAsDate = new Date();
            document.getElementById('rCustName').value = '';
            document.getElementById('rCustPhone').value = '';
            document.getElementById('rMileage').value = '';
            document.getElementById('rTech').value = '';
            document.getElementById('rServices').value = '';
            document.getElementById('rCost').value = '0';
            document.getElementById('rRef').value = '';
            document.getElementById('recordModal').style.display = 'flex';
        }

        function saveServiceRecord(e) {
            e.preventDefault();
            const id = document.getElementById('recId').value || 'REC-' + Date.now();
            const reg = document.getElementById('rReg').value.toUpperCase().trim();
            const date = document.getElementById('rDate').value;
            const custName = document.getElementById('rCustName').value.trim();
            const custPhone = document.getElementById('rCustPhone').value.trim();
            const mileage = document.getElementById('rMileage').value.trim();
            const tech = document.getElementById('rTech').value.trim();
            const services = document.getElementById('rServices').value.trim();
            const cost = parseFloat(document.getElementById('rCost').value) || 0;
            const ref = document.getElementById('rRef').value.trim();

            if (window.AutoCareUtils) {
                window.AutoCareUtils.saveCustomerMemory(custName, custPhone, reg);
                if (tech) window.AutoCareUtils.saveTechnician(tech);
            }

            const obj = { id, reg, date, custName, custPhone, mileage, tech, services, cost, ref };
            const idx = serviceRecords.findIndex(x => x.id === id);

            if (idx >= 0) serviceRecords[idx] = obj;
            else serviceRecords.unshift(obj);

            const bizId = getBizId();
            localStorage.setItem(`autocare_service_records_${bizId}`, JSON.stringify(serviceRecords));

            document.getElementById('recordModal').style.display = 'none';
            searchServiceRecords();
            alert('✅ Service Record saved successfully!');
        }

        function editRecord(id) {
            populateDatalists();
            const r = serviceRecords.find(x => x.id === id);
            if (!r) return;

            document.getElementById('recId').value = r.id;
            document.getElementById('modalHeading').innerText = '✏️ Edit Service Record';
            document.getElementById('rReg').value = r.reg;
            document.getElementById('rDate').value = r.date;
            document.getElementById('rCustName').value = r.custName;
            document.getElementById('rCustPhone').value = r.custPhone;
            document.getElementById('rMileage').value = r.mileage || '';
            document.getElementById('rTech').value = r.tech || '';
            document.getElementById('rServices').value = r.services;
            document.getElementById('rCost').value = r.cost || 0;
            document.getElementById('rRef').value = r.ref || '';
            document.getElementById('recordModal').style.display = 'flex';
        }

        function deleteRecord(id) {
            if (confirm('ඔබට මෙම සේවා වාර්තාව (Service Record) මකා දැමීමට අවශ්‍ය බව තහවුරු කරන්න?')) {
                serviceRecords = serviceRecords.filter(x => x.id !== id);
                const bizId = getBizId();
                localStorage.setItem(`autocare_service_records_${bizId}`, JSON.stringify(serviceRecords));
                searchServiceRecords();
                alert('✅ Service Record deleted!');
            }
        }

        window.onload = loadServiceRecords;
    </script>
</body>
</html>
