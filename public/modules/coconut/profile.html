<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <script src="/core/pwa-init.js?v=1"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Profile — Coconut Vertical</title>
    <style>html.digibiz-sidebar-reserved body{margin-left:260px;}@media (max-width:768px){html.digibiz-sidebar-reserved body{margin-left:0;}}</style>
    <script>document.documentElement.classList.add('digibiz-sidebar-reserved');</script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-storage-compat.js"></script>
    <script src="/core/firebase-init.js?v=100"></script>
    <script src="/scripts/admin-impersonation.js?v=100"></script>
    <script src="/core/event-validation.js?v=4"></script>
    <script src="/core/event-bus.js?v=4"></script>
    <script src="/core/accounts-core.js?v=4"></script>
    <script src="/core/auth-roles.js?v=120"></script>
    <script src="/core/business-types.js?v=74"></script>
    <script src="/core/dashboard-core.js?v=74"></script>
    <script src="/core/subscription-manager.js?v=4"></script>
    <script src="/core/sidebar.js?v=2002"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="coconut.css">
    <script src="coconut-common.js"></script>
</head>
<body>

    <main class="c-container">
        <div class="c-header">
            <div class="c-header-left">
                <h1>🏢 Business Profile & Mill Information (වියාපාර තොරතුරු)</h1>
                <p>Manage mill identity, contact details, registration information, and invoice header branding.</p>
            </div>
            <div class="c-header-actions">
                <a href="/modules/company/settings.html" class="c-btn c-btn-secondary">⚙️ Platform Core Settings</a>
            </div>
        </div>

        <div class="c-card" style="max-width:760px; margin:0 auto;">
            <div class="c-card-header">
                <div class="c-card-title">📝 Coconut Enterprise Profile</div>
            </div>

            <form id="profileForm">
                <div class="c-form-group" style="margin-bottom:14px;">
                    <label>Enterprise / Mill Name *</label>
                    <input type="text" id="profName" class="c-input" required>
                </div>

                <div class="c-form-row">
                    <div class="c-form-group">
                        <label>Business Type (Vertical)</label>
                        <input type="text" id="profType" class="c-input" value="Coconut Wholesale & Husk Products" disabled>
                    </div>
                    <div class="c-form-group">
                        <label>Owner / Manager Name</label>
                        <input type="text" id="profOwner" class="c-input">
                    </div>
                </div>

                <div class="c-form-row">
                    <div class="c-form-group">
                        <label>Contact Phone Number</label>
                        <input type="tel" id="profPhone" class="c-input">
                    </div>
                    <div class="c-form-group">
                        <label>Business Registration (BR) Number</label>
                        <input type="text" id="profBr" class="c-input">
                    </div>
                </div>

                <div class="c-form-group" style="margin-bottom:16px;">
                    <label>Mill / Yard Address</label>
                    <textarea id="profAddress" class="c-input" rows="3"></textarea>
                </div>

                <div style="display:flex; justify-content:flex-end;">
                    <button type="submit" class="c-btn c-btn-primary c-btn-lg" id="btnSaveProfile">
                        💾 Save Profile Changes
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script src="profile.js"></script>
</body>
</html>
