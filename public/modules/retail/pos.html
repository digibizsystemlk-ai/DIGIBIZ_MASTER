<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <script src="/core/pwa-init.js?v=1"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced POS - DIGIBIZ Retail</title>
    <style>html.digibiz-sidebar-reserved body{margin-left:260px;}@media (max-width:768px){html.digibiz-sidebar-reserved body{margin-left:0;}}</style>
    <script>document.documentElement.classList.add('digibiz-sidebar-reserved');</script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    
    <script src="../../core/firebase-init.js?v=3"></script>
    <script src="../../core/event-validation.js?v=3"></script>
    <script src="../../core/event-bus.js?v=3"></script>
    <script src="../../core/auth-roles.js?v=3"></script>
    <script src="../../core/business-types.js?v=3"></script>
    <script src="../../core/dashboard-core.js?v=3"></script>
    <script src="../../core/subscription-manager.js?v=3"></script>
    <script src="../../core/ui-helpers.js?v=1"></script>
    <script src="../../core/sidebar.js?v=30"></script>
    
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',sans-serif;background:#f5f6fa;color:#1a1a2e;overflow-x:hidden;}
        .main-content{padding:30px 35px;min-height:100vh;}
        @media (max-width:768px){.main-content{padding:20px;}}
        .pos-container{display:grid;grid-template-columns:1fr 380px;gap:25px;}
        @media (max-width:1000px){.pos-container{grid-template-columns:1fr;}}
        .search-bar{background:white;border-radius:16px;padding:15px;margin-bottom:20px;display:flex;gap:12px;border:1px solid #e9ecef;}
        .search-bar input{flex:1;padding:12px;border:1px solid #e9ecef;border-radius:10px;font-size:14px;}
        .order-type-box{background:#fff;border:1px solid #e9ecef;border-radius:14px;padding:12px 14px;margin-bottom:14px}
        .category-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
        .category-btn{background:white;border:1px solid #e9ecef;padding:8px 16px;border-radius:30px;cursor:pointer;font-size:13px;}
        .category-btn.active{background:#10b981;color:white;border-color:#10b981;}
        .products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:15px;max-height:500px;overflow-y:auto;padding:5px;}
        .product-card:hover{transform:translateY(-3px);box-shadow:0 5px 20px rgba(0,0,0,0.1);border-color:#10b981;}
        .cart-panel{background:white;border-radius:20px;border:1px solid #e9ecef;display:flex;flex-direction:column;height:fit-content;position:sticky;top:30px;}
        .cart-items{max-height:350px;overflow-y:auto;}
        .cart-summary{padding:16px;border-top:1px solid #e9ecef;background:#fafbfc;}
        .summary-row{display:flex;justify-content:space-between;margin-bottom:10px;font-size:14px;}
        .summary-row.total{font-size:18px;font-weight:700;margin-top:10px;padding-top:10px;border-top:1px solid #e9ecef;}
        .cart-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px;border-top:1px solid #e9ecef;}
        .btn-primary{background:#10b981;color:white;border:none;padding:12px;border-radius:10px;cursor:pointer;font-weight:500;}
        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:2000;justify-content:center;align-items:center;}
        .modal-content{background:white;border-radius:24px;padding:32px;width:90%;max-width:450px;}
        .modal-content input,.modal-content select{width:100%;padding:12px;margin-bottom:15px;border:1px solid #e9ecef;border-radius:10px;}
        .modal-buttons{display:flex;gap:12px;justify-content:flex-end;margin-top:15px;}
        .toast{position:fixed;bottom:30px;right:30px;background:#1a1a2e;color:white;padding:12px 20px;border-radius:10px;z-index:3000;display:none;align-items:center;gap:10px;}
        .toast.show{display:flex;animation:slideIn 0.3s;}
        @keyframes slideIn{from{transform:translateX(100%);opacity:0;}to{transform:translateX(0);opacity:1;}}
        .recent-sales-section { display: none; margin-top: 30px; background: #fff; border-radius: 16px; padding: 20px; border: 1px solid #e9ecef; }
        .recent-sales-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .recent-sales-table th, .recent-sales-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #f1f3f5; font-size: 13px; }
        .status-pill { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
        .status-paid { background-color: #dcfce7; color: #166534; }
        .status-unpaid { background-color: #fee2e2; color: #991b1b; }
        .row-today { background-color: #e0f2fe; }
        .row-overdue { background-color: #fef9c3; font-weight: 500; }
        footer{text-align:center;padding:25px;color:#adb5bd;font-size:12px;margin-top:20px;}
    </style>
</head>
<body>
    <div class="main-content">
        <div class="pos-container">
            <div>
                <div class="order-type-box" id="orderTypeBox">
                     <div class="order-type-row">
                        <strong>Order Type:</strong>
                        <label><input type="radio" name="orderType" value="Tea Lounge"> 🍵 Tea Lounge</label>
                        <label><input type="radio" name="orderType" value="General Sales" checked> 📋 General Sales</label>
                    </div>
                </div>
                <div class="search-bar"><input type="text" id="productSearch" placeholder="🔍 Search..."></div>
                <div class="category-tabs" id="categoryTabs"></div>
                <div class="products-grid" id="productsGrid"><div>Loading...</div></div>
            </div>
            <div class="cart-panel">
                <div class="cart-header"><h3><i class="fas fa-shopping-cart"></i> Current Sale</h3></div>
                <div class="cart-items" id="cartItems"><div style="text-align:center;padding:40px;color:#adb5bd;">Cart is empty</div></div>
                <div class="cart-summary">
                    <div class="summary-row"><span>Subtotal</span><span id="subtotal">Rs. 0</span></div>
                    <div class="summary-row"><span>Discount</span><span id="discountAmount">Rs. 0</span></div>
                    <div class="summary-row total"><span>Total</span><span id="totalAmount">Rs. 0</span></div>
                </div>
                <div class="cart-actions">
                    <button class="btn-outline" id="clearCartBtn"><i class="fas fa-trash"></i> Clear</button>
                    <button class="btn-primary" id="checkoutBtn"><i class="fas fa-credit-card"></i> Checkout</button>
                </div>
            </div>
        </div>
        <div id="recentSalesSection" class="recent-sales-section">
            <h2>Recent Sales (Last 30 Days)</h2>
            <table class="recent-sales-table">
                <thead><tr><th>Invoice</th><th>Customer</th><th>Total</th><th>Balance</th><th>Status</th><th>Due Date</th></tr></thead>
                <tbody id="recentSalesBody"></tbody>
            </table>
        </div>
        <footer><p>© 2025 DIGIBIZ Universal POS</p></footer>
    </div>
    <div id="customerModal" class="modal"><div class="modal-content"><h3>Customer Details</h3><div style="display:flex;gap:14px;align-items:center;margin-bottom:10px;"><label><input type="radio" name="customerType" value="existing" checked> Existing</label><label><input type="radio" name="customerType" value="new"> New</label></div><div id="existingCustomerDiv"><select id="existingCustomer"><option>Select</option></select></div><div id="newCustomerDiv" style="display:none;"><input type="text" id="newCustomerName" placeholder="Name"><input type="tel" id="newCustomerPhone" placeholder="Mobile"></div><div class="modal-buttons"><button class="btn-outline" id="closeCustomerModal">Cancel</button><button class="btn-primary" id="confirmCustomerBtn">Continue</button></div></div></div>
    <div id="paymentModal" class="modal"><div class="modal-content"><h3>Payment</h3><div class="summary-row total" style="margin-bottom:15px;"><span>Total Amount</span><span id="payTotal">Rs. 0</span></div><select id="paymentMethod"><option value="cash">Cash</option><option value="card">Card</option><option value="credit">Credit</option></select><div id="cashDiv"><input type="number" id="cashAmount" placeholder="Amount Received"></div><div id="creditFieldsDiv" style="display:none;"><label for="creditDueDate">Due Date:</label><input type="date" id="creditDueDate"></div><div id="changeDiv" style="display:none;margin-top:10px;font-size:18px;font-weight:700;color:#10b981;"></div><div class="modal-buttons"><button class="btn-outline" id="closePaymentModal">Cancel</button><button class="btn-primary" id="completePaymentBtn">Complete</button></div></div></div>
    <div id="toast" class="toast"><i class="fas fa-check-circle"></i><span id="toastMsg"></span></div>

    <script>
        let currentBusinessId = null, products = [], cart = [], selectedCustomer = null;
        const KUBUKA_BID = '0Uled5estVeQVN8cChmMTNRDNIE3';
        const KUBUKA_ACCOUNTS = {
            CASH: 'AC-10100',
            BANK: 'AC-10200',
            ACCOUNTS_RECEIVABLE: 'AC-10500',
            SALES_REVENUE: 'AC-40100'
        };
        
        const showToast = (msg, isError=false) => { const t = document.getElementById('toast'); t.querySelector('span').innerHTML = msg; t.style.background = isError ? '#ef4444' : '#10b981'; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 3000); };
        const formatCurrency = (amt) => 'Rs. ' + (amt||0).toLocaleString('en-LK', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const amountNumber = (v) => Number(String(v||'').replace(/[^0-9\.-]+/g, '')) || 0;
        const isKubukaTenant = () => String(currentBusinessId || '') === KUBUKA_BID;
        const formatDate = (d) => d ? new Date(d.seconds * 1000).toISOString().slice(0,10) : 'N/A';

        async function createJournalEntryForSale(orderData, orderRefId) {
            const { paymentMethod, total, customer, invoiceNo } = orderData;
            let debitAccount = null;
            let memo = `Sale to ${customer.name || 'customer'}. Invoice: ${invoiceNo}`;

            if (paymentMethod === 'cash') {
                debitAccount = KUBUKA_ACCOUNTS.CASH;
            } else if (paymentMethod === 'card') {
                debitAccount = KUBUKA_ACCOUNTS.BANK;
            } else if (paymentMethod === 'credit') {
                debitAccount = KUBUKA_ACCOUNTS.ACCOUNTS_RECEIVABLE;
            }

            if (!debitAccount) {
                console.warn('Journal entry skipped: Unknown payment method.', paymentMethod);
                return;
            }

            const journalEntry = {
                date: new Date(),
                memo: memo,
                entries: [
                    { accountId: debitAccount, amount: total, type: 'debit' },
                    { accountId: KUBUKA_ACCOUNTS.SALES_REVENUE, amount: total, type: 'credit' }
                ],
                ref: `orders/${orderRefId}`,
                refType: 'SALE',
                businessId: currentBusinessId,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                await db.collection('journal').doc(currentBusinessId).collection('entries').add(journalEntry);
                console.log('Journal entry created for sale:', orderRefId);
            } catch (error) {
                console.error('Failed to create journal entry:', error);
                showToast('Warning: Accounting entry failed.', true);
            }
        }

        async function getBusinessContext() {
            const user = auth.currentUser;
            if (!user) return null;
            if (window.dashboardCore) return await window.dashboardCore.getContext(user);
            const userDoc = await db.collection('users').doc(user.uid).get();
            return { businessId: userDoc.exists ? (userDoc.data().businessId || user.uid) : user.uid };
        }

        async function loadInitialData(){
            if(!currentBusinessId) return;
            const prodSnap = await db.collection('products').doc(currentBusinessId).collection('list').get();
            products = prodSnap.docs.map(doc => ({id: doc.id, ...doc.data()}));
            renderProducts(products);
            const custSnap = await db.collection('customers').where('businessId', '==', currentBusinessId).get();
            const custSelect = document.getElementById('existingCustomer');
            custSelect.innerHTML = '<option value="">Select Customer</option>';
            custSnap.docs.forEach(doc => {
                const c = doc.data();
                custSelect.innerHTML += `<option value="${doc.id}" data-name="${c.fullName}" data-phone="${c.mobile}">${c.fullName} - ${c.mobile}</option>`;
            });
            if (isKubukaTenant()) {
                document.getElementById('recentSalesSection').style.display = 'block';
                await loadRecentSales();
            }
        }

        function renderProducts(prods) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = prods.map(p => `
                <div class="product-card" onclick="addToCart('${p.id}')">
                    <div class="product-name">${p.name}</div>
                    <div class="price">${formatCurrency(p.price)}</div>
                    <div class="stock">Stock: ${p.stock}</div>
                </div>`).join('');
        }

        window.addToCart = (id) => {
            const p = products.find(p => p.id === id);
            const item = cart.find(i => i.id === id);
            if (item) item.quantity++; else cart.push({...p, quantity: 1});
            renderCart();
        };
        
        function renderCart(){
            const itemsDiv = document.getElementById('cartItems');
            if(cart.length === 0) { itemsDiv.innerHTML = '<div style="padding:40px;text-align:center;color:#adb5bd;">Cart is empty</div>'; updateTotals(); return; }
            itemsDiv.innerHTML = cart.map(i => `<div>${i.name} x ${i.quantity}</div>`).join('');
            updateTotals();
        }

        function updateTotals(){
            const subtotal = cart.reduce((s, i) => s + (i.price * i.quantity), 0);
            document.getElementById('subtotal').innerText = formatCurrency(subtotal);
            document.getElementById('totalAmount').innerText = formatCurrency(subtotal);
            document.getElementById('payTotal').innerText = formatCurrency(subtotal);
        }

        document.getElementById('clearCartBtn').onclick = () => { cart = []; renderCart(); };
        document.getElementById('checkoutBtn').onclick = () => { if(cart.length > 0) document.getElementById('customerModal').style.display = 'flex'; else showToast('Cart is empty', true); };
        document.getElementById('closeCustomerModal').onclick = () => document.getElementById('customerModal').style.display = 'none';
        
        document.querySelectorAll('input[name="customerType"]').forEach(r => r.onchange = (e) => {
            const isNew = e.target.value === 'new';
            document.getElementById('newCustomerDiv').style.display = isNew ? 'block' : 'none';
            document.getElementById('existingCustomerDiv').style.display = isNew ? 'none' : 'block';
        });

        document.getElementById('confirmCustomerBtn').onclick = async () => {
            const isNew = document.querySelector('input[name="customerType"]:checked').value === 'new';
            if (isNew) {
                const name = document.getElementById('newCustomerName').value;
                if (!name) { showToast('New customer name is required', true); return; }
                const ref = await db.collection('customers').add({ fullName: name, mobile: document.getElementById('newCustomerPhone').value, businessId: currentBusinessId });
                selectedCustomer = { id: ref.id, name: name, phone: document.getElementById('newCustomerPhone').value };
            } else {
                const sel = document.getElementById('existingCustomer');
                if (!sel.value) { showToast('Please select a customer', true); return; }
                const opt = sel.options[sel.selectedIndex];
                selectedCustomer = { id: sel.value, name: opt.dataset.name, phone: opt.dataset.phone };
            }
            document.getElementById('customerModal').style.display = 'none';
            document.getElementById('paymentModal').style.display = 'flex';
        };
        
        document.getElementById('paymentMethod').onchange = (e) => {
             if(isKubukaTenant()) {
                document.getElementById('creditFieldsDiv').style.display = e.target.value === 'credit' ? 'block' : 'none';
             }
             document.getElementById('cashDiv').style.display = e.target.value === 'cash' ? 'block' : 'none';
        };
        
        document.getElementById('closePaymentModal').onclick = () => document.getElementById('paymentModal').style.display = 'none';

        document.getElementById('completePaymentBtn').onclick = async () => {
            if (!selectedCustomer) { showToast('Customer not selected', true); return; }
            
            const paymentMethod = document.getElementById('paymentMethod').value;
            const total = amountNumber(document.getElementById('payTotal').innerText);
            let amountPaid = 0, balanceDue = total, dueDate = null;

            if (paymentMethod === 'cash') {
                amountPaid = amountNumber(document.getElementById('cashAmount').value);
                if (amountPaid < total) { showToast('Cash received is less than total', true); return; }
                balanceDue = 0;
            } else if (paymentMethod === 'card') {
                amountPaid = total;
                balanceDue = 0;
            } else if (paymentMethod === 'credit') {
                if (isKubukaTenant()) {
                    const dueDateValue = document.getElementById('creditDueDate').value;
                    if (!dueDateValue) { showToast('Please select a Due Date for credit sales', true); return; }
                    dueDate = new Date(dueDateValue);
                }
                amountPaid = 0;
                balanceDue = total;
            }

            try {
                const orderData = {
                    customer: selectedCustomer,
                    items: cart,
                    subtotal: total, total: total,
                    paymentMethod: paymentMethod,
                    orderType: document.querySelector('input[name="orderType"]:checked').value,
                    status: balanceDue > 0 ? 'unpaid' : 'completed',
                    createdAt: new Date(),
                    businessId: currentBusinessId,
                    amountPaid: amountPaid,
                    balanceDue: balanceDue,
                    dueDate: dueDate
                };

                const orderRef = await db.collection('orders').doc(currentBusinessId).collection('list').add(orderData);
                const invoiceNo = 'INV-' + orderRef.id.substring(0, 6).toUpperCase();
                await db.collection('orders').doc(currentBusinessId).collection('list').doc(orderRef.id).update({ invoiceNo: invoiceNo });
                
                if (isKubukaTenant()) {
                    await createJournalEntryForSale({...orderData, invoiceNo: invoiceNo}, orderRef.id);
                }
                
                showToast('Sale Completed Successfully!');
                document.getElementById('paymentModal').style.display = 'none';
                cart = [];
                renderCart();
                if (isKubukaTenant()) await loadRecentSales();
            } catch(e) { console.error(e); showToast('Error completing sale: ' + e.message, true); }
        };
        
        async function loadRecentSales() {
            const thirtyDaysAgo = new Date();
            thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);

            const snap = await db.collection('orders').doc(currentBusinessId).collection('list')
                               .where('createdAt', '>', thirtyDaysAgo)
                               .orderBy('createdAt', 'desc')
                               .get();
            
            const sales = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderRecentSalesTable(sales);
        }

        function renderRecentSalesTable(sales) {
            const body = document.getElementById('recentSalesBody');
            if (sales.length === 0) { body.innerHTML = '<tr><td colspan="6">No sales in last 30 days.</td></tr>'; return; }

            const today = new Date(); today.setHours(0,0,0,0);

            body.innerHTML = sales.map(s => {
                const balance = s.balanceDue || 0;
                const isPaid = balance < 0.01;
                const dueDate = s.dueDate ? s.dueDate.toDate() : null;
                const createdAtDate = s.createdAt.toDate();
                
                let rowClass = '';
                if (createdAtDate.toDateString() === today.toDateString()) rowClass = 'row-today';
                if (!isPaid && dueDate && dueDate < today) rowClass = 'row-overdue';

                return `<tr class="${rowClass}">
                    <td>${s.invoiceNo || 'N/A'}</td>
                    <td>${s.customer.name}</td>
                    <td>${formatCurrency(s.total)}</td>
                    <td>${formatCurrency(balance)}</td>
                    <td><span class="status-pill ${isPaid ? 'status-paid':'status-unpaid'}">${isPaid ? 'Paid' : 'Unpaid'}</span></td>
                    <td>${dueDate ? formatDate({seconds: dueDate.getTime()/1000}) : 'N/A'}</td>
                </tr>`;
            }).join('');
        }

        auth.onAuthStateChanged(async(user) => {
            if(!user) { window.location.href='../../auth/login.html'; return; }
            const ctx = await getBusinessContext();
            if(ctx && ctx.businessId) {
                 currentBusinessId = ctx.businessId;
                 if (!isKubukaTenant()) document.getElementById('orderTypeBox').style.display = 'none';
                 await loadInitialData();
            }
        });
    </script>
</body>
</html>
