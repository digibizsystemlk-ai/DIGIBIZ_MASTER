<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced POS - DIGIBIZ Retail</title>
    <style>html.digibiz-sidebar-reserved body{margin-left:260px;}@media (max-width:768px){html.digibiz-sidebar-reserved body{margin-left:0;}}</style>
    <script>document.documentElement.classList.add('digibiz-sidebar-reserved');</script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
    
    <script src="../../core/firebase-init.js?v=3"></script>
    <script src="../../core/event-validation.js?v=3"></script>
    <script src="../../core/event-bus.js?v=3"></script>
    <script src="../../core/accounts-core.js?v=3"></script>
    <script src="../../core/auth-roles.js?v=3"></script>
    <script src="../../core/business-types.js?v=3"></script>
    <script src="../../core/dashboard-core.js?v=3"></script>
    <script src="../../core/subscription-manager.js?v=3"></script>
    <script src="../../core/sidebar.js?v=30"></script>
    
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',sans-serif;background:#f5f6fa;color:#1a1a2e;overflow-x:hidden;}
        
        .main-content{padding:30px 35px;min-height:100vh;}
        @media (max-width:768px){.main-content{padding:20px;}}
        
        /* POS Layout */
        .pos-container{display:grid;grid-template-columns:1fr 380px;gap:25px;}
        @media (max-width:1000px){.pos-container{grid-template-columns:1fr;}}
        
        /* Left Panel - Products */
        .search-bar{background:white;border-radius:16px;padding:15px;margin-bottom:20px;display:flex;gap:12px;border:1px solid #e9ecef;}
        .search-bar input{flex:1;padding:12px;border:1px solid #e9ecef;border-radius:10px;font-size:14px;}
        .search-bar input:focus{outline:none;border-color:#10b981;}
        .search-bar button{background:#10b981;color:white;border:none;padding:12px 20px;border-radius:10px;cursor:pointer;}
        
        .category-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
        .category-btn{background:white;border:1px solid #e9ecef;padding:8px 16px;border-radius:30px;cursor:pointer;font-size:13px;}
        .category-btn.active{background:#10b981;color:white;border-color:#10b981;}
        
        .products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:15px;max-height:500px;overflow-y:auto;padding:5px;}
        .product-card{background:white;border-radius:16px;padding:15px;text-align:center;cursor:pointer;border:1px solid #e9ecef;transition:all 0.2s;}
        .product-card:hover{transform:translateY(-3px);box-shadow:0 5px 20px rgba(0,0,0,0.1);border-color:#10b981;}
        .product-card .product-name{font-weight:600;font-size:14px;margin:8px 0 4px;}
        .product-card .product-price{font-weight:700;color:#10b981;font-size:16px;}
        .product-card .product-stock{font-size:10px;color:#64748b;}
        .product-card.low-stock{border-left:3px solid #f59e0b;}
        
        /* Right Panel - Cart */
        .cart-panel{background:white;border-radius:20px;border:1px solid #e9ecef;display:flex;flex-direction:column;height:fit-content;position:sticky;top:30px;}
        .cart-header{padding:18px 20px;border-bottom:1px solid #e9ecef;background:#fafbfc;border-radius:20px 20px 0 0;}
        .cart-header h3{font-size:16px;font-weight:600;}
        .cart-items{max-height:350px;overflow-y:auto;}
        .cart-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #f0f0f0;}
        .cart-item-info{flex:1;}
        .cart-item-name{font-size:14px;font-weight:500;}
        .cart-item-price{font-size:12px;color:#64748b;}
        .cart-item-qty{display:flex;align-items:center;gap:8px;}
        .cart-item-qty button{width:28px;height:28px;border-radius:8px;border:1px solid #e9ecef;background:white;cursor:pointer;}
        .cart-item-total{font-weight:600;font-size:14px;min-width:70px;text-align:right;}
        .cart-item-remove{color:#ef4444;cursor:pointer;padding:5px;}
        
        .cart-summary{padding:16px;border-top:1px solid #e9ecef;background:#fafbfc;}
        .summary-row{display:flex;justify-content:space-between;margin-bottom:10px;font-size:14px;}
        .summary-row.total{font-size:18px;font-weight:700;color:#1a1a2e;margin-top:10px;padding-top:10px;border-top:1px solid #e9ecef;}
        
        .cart-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px;border-top:1px solid #e9ecef;}
        .btn-primary{background:#10b981;color:white;border:none;padding:12px;border-radius:10px;cursor:pointer;font-weight:500;}
        .btn-secondary{background:#64748b;color:white;border:none;padding:12px;border-radius:10px;cursor:pointer;}
        .btn-outline{background:transparent;border:1px solid #10b981;color:#10b981;padding:12px;border-radius:10px;cursor:pointer;}
        
        /* Modal */
        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:2000;justify-content:center;align-items:center;}
        .modal-content{background:white;border-radius:24px;padding:32px;width:90%;max-width:450px;}
        .modal-content input,.modal-content select{width:100%;padding:12px;margin-bottom:15px;border:1px solid #e9ecef;border-radius:10px;}
        .modal-buttons{display:flex;gap:12px;justify-content:flex-end;margin-top:15px;}
        
        /* Toast Notification */
        .toast{position:fixed;bottom:30px;right:30px;background:#1a1a2e;color:white;padding:12px 20px;border-radius:10px;z-index:3000;display:none;align-items:center;gap:10px;}
        .toast.show{display:flex;animation:slideIn 0.3s;}
        @keyframes slideIn{from{transform:translateX(100%);opacity:0;}to{transform:translateX(0);opacity:1;}}
        
        footer{text-align:center;padding:25px;color:#adb5bd;font-size:12px;margin-top:20px;}
    </style>
</head>
<body>
    <div class="main-content">
        <div class="pos-container">
            <!-- Left Panel: Products -->
            <div>
                <div class="search-bar">
                    <input type="text" id="productSearch" placeholder="🔍 Search by name, barcode or scan...">
                    <button id="scanBtn"><i class="fas fa-camera"></i> Scan</button>
                </div>
                <div class="category-tabs" id="categoryTabs">
                    <button class="category-btn active" data-cat="all">All Products</button>
                </div>
                <div class="products-grid" id="productsGrid">
                    <div style="text-align:center;padding:40px;">Loading products...</div>
                </div>
            </div>
            
            <!-- Right Panel: Cart -->
            <div class="cart-panel">
                <div class="cart-header">
                    <h3><i class="fas fa-shopping-cart"></i> Current Sale</h3>
                </div>
                <div class="cart-items" id="cartItems">
                    <div style="text-align:center;padding:40px;color:#adb5bd;">Cart is empty</div>
                </div>
                <div class="cart-summary">
                    <div class="summary-row"><span>Subtotal</span><span id="subtotal">Rs. 0</span></div>
                    <div class="summary-row"><span>Discount</span><span id="discountAmount">Rs. 0</span></div>
                    <div class="summary-row"><span>Tax (VAT)</span><span id="taxAmount">Rs. 0</span></div>
                    <div class="summary-row total"><span>Total</span><span id="totalAmount">Rs. 0</span></div>
                </div>
                <div class="cart-actions">
                    <button class="btn-outline" id="clearCartBtn"><i class="fas fa-trash"></i> Clear</button>
                    <button class="btn-primary" id="checkoutBtn"><i class="fas fa-credit-card"></i> Checkout</button>
                </div>
                <div class="cart-actions" style="grid-template-columns:1fr;">
                    <button class="btn-secondary" id="holdOrderBtn"><i class="fas fa-pause"></i> Hold Order</button>
                </div>
            </div>
        </div>
        <footer><p>© 2025 DIGIBIZ Universal - Advanced Point of Sale System</p></footer>
    </div>
    
    <!-- Customer Modal -->
    <div id="customerModal" class="modal">
        <div class="modal-content">
            <h3>Customer Details</h3>
            <select id="customerType">
                <option value="walkin">Walk-in Customer</option>
                <option value="existing">Existing Customer</option>
                <option value="new">New Customer</option>
            </select>
            <div id="existingCustomerDiv" style="display:none;"><select id="existingCustomer"><option>Select Customer</option></select></div>
            <div id="newCustomerDiv" style="display:none;"><input type="text" id="newCustomerName" placeholder="Customer Name"><input type="tel" id="newCustomerPhone" placeholder="Phone Number"></div>
            <div class="modal-buttons"><button class="btn-outline" id="closeCustomerModal">Cancel</button><button class="btn-primary" id="confirmCustomerBtn">Continue</button></div>
        </div>
    </div>
    
    <!-- Payment Modal -->
    <div id="paymentModal" class="modal">
        <div class="modal-content">
            <h3>Payment</h3>
            <div class="summary-row" style="margin-bottom:15px;"><span>Total Amount</span><span id="payTotal">Rs. 0</span></div>
            <select id="paymentMethod">
                <option value="cash">Cash</option>
                <option value="card">Card</option>
                <option value="credit">Credit</option>
            </select>
            <div id="cashDiv"><input type="number" id="cashAmount" placeholder="Amount Received"></div>
            <div id="changeDiv" style="margin-top:10px;font-size:18px;font-weight:700;color:#10b981;">Change: Rs. 0</div>
            <div class="modal-buttons"><button class="btn-outline" id="closePaymentModal">Cancel</button><button class="btn-primary" id="completePaymentBtn">Complete Sale</button></div>
        </div>
    </div>
    
    <!-- Invoice Modal -->
    <div id="invoiceModal" class="modal">
        <div class="modal-content" style="max-width:500px;">
            <h3><i class="fas fa-receipt"></i> Sale Completed!</h3>
            <p id="invoiceDetails"></p>
            <div class="modal-buttons"><button class="btn-primary" id="printInvoiceBtn"><i class="fas fa-print"></i> Print</button><button class="btn-outline" id="closeInvoiceModal">Close</button></div>
        </div>
    </div>
    
    <div id="toast" class="toast"><i class="fas fa-check-circle"></i><span id="toastMsg"></span></div>

    <script>
        let currentBusinessId = null;
        let products = [];
        let cart = [];
        let selectedCustomer = null;
        let currentInvoiceNo = 'INV-' + Date.now();
        let taxRate = 0;
        
        function showToast(msg, isError=false){
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerHTML = msg;
            toast.style.background = isError ? '#ef4444' : '#10b981';
            toast.classList.add('show');
            setTimeout(()=>toast.classList.remove('show'), 3000);
        }
        
        function formatCurrency(amt){ return 'Rs. ' + (amt||0).toLocaleString('en-LK'); }
        
        // Load products from Firestore
        async function loadProducts(){
            if(!currentBusinessId) return;
            const snapshot = await db.collection('products').doc(currentBusinessId).collection('list').get();
            products = [];
            snapshot.forEach(doc => products.push({id: doc.id, ...doc.data()}));
            if(products.length === 0){
                // Demo products
                products = [
                    { id: 'P001', name: 'Sugar 1kg', price: 250, stock: 50, barcode: '123456', category: 'groceries' },
                    { id: 'P002', name: 'Rice 5kg', price: 850, stock: 30, barcode: '123457', category: 'groceries' },
                    { id: 'P003', name: 'Milk Powder 400g', price: 650, stock: 20, barcode: '123458', category: 'dairy' },
                    { id: 'P004', name: 'Soap', price: 120, stock: 100, barcode: '123459', category: 'personal' },
                    { id: 'P005', name: 'Toothpaste', price: 180, stock: 45, barcode: '123460', category: 'personal' }
                ];
            }
            renderProducts(products);
            loadCategories();
        }
        
        function renderProducts(productList){
            const grid = document.getElementById('productsGrid');
            if(productList.length === 0){
                grid.innerHTML = '<div style="text-align:center;padding:40px;">No products found</div>';
                return;
            }
            grid.innerHTML = productList.map(p => `
                <div class="product-card ${p.stock < 10 ? 'low-stock' : ''}" onclick="addToCart('${p.id}')">
                    <div style="font-size:28px;">${p.category === 'groceries' ? '🛒' : p.category === 'dairy' ? '🥛' : '🧴'}</div>
                    <div class="product-name">${p.name}</div>
                    <div class="product-price">${formatCurrency(p.price)}</div>
                    <div class="product-stock">Stock: ${p.stock}</div>
                </div>
            `).join('');
        }
        
        function loadCategories(){
            const cats = [...new Set(products.map(p => p.category))];
            const container = document.getElementById('categoryTabs');
            container.innerHTML = '<button class="category-btn active" data-cat="all">All Products</button>' + cats.map(c => `<button class="category-btn" data-cat="${c}">${c}</button>`).join('');
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const cat = btn.dataset.cat;
                    if(cat === 'all') renderProducts(products);
                    else renderProducts(products.filter(p => p.category === cat));
                };
            });
        }
        
        // Search products
        document.getElementById('productSearch').oninput = (e) => {
            const search = e.target.value.toLowerCase();
            if(!search) renderProducts(products);
            else renderProducts(products.filter(p => p.name.toLowerCase().includes(search) || p.barcode?.includes(search)));
        };
        
        // Add to cart
        window.addToCart = (productId) => {
            const product = products.find(p => p.id === productId);
            if(!product) return;
            const existing = cart.find(i => i.id === productId);
            if(existing){
                if(existing.quantity + 1 > product.stock){
                    showToast('Not enough stock!', true);
                    return;
                }
                existing.quantity++;
            } else {
                cart.push({...product, quantity: 1});
            }
            renderCart();
            showToast(`${product.name} added to cart`);
        };
        
        function updateCartItemQty(id, delta){
            const item = cart.find(i => i.id === id);
            if(item){
                const newQty = item.quantity + delta;
                const product = products.find(p => p.id === id);
                if(newQty < 1){
                    cart = cart.filter(i => i.id !== id);
                } else if(newQty > product.stock){
                    showToast('Not enough stock!', true);
                    return;
                } else {
                    item.quantity = newQty;
                }
                renderCart();
            }
        }
        
        function removeCartItem(id){
            cart = cart.filter(i => i.id !== id);
            renderCart();
        }
        
        function renderCart(){
            const container = document.getElementById('cartItems');
            if(cart.length === 0){
                container.innerHTML = '<div style="text-align:center;padding:40px;color:#adb5bd;">Cart is empty</div>';
                updateTotals();
                return;
            }
            container.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div class="cart-item-info"><div class="cart-item-name">${item.name}</div><div class="cart-item-price">${formatCurrency(item.price)}</div></div>
                    <div class="cart-item-qty"><button onclick="updateCartItemQty('${item.id}', -1)">-</button><span>${item.quantity}</span><button onclick="updateCartItemQty('${item.id}', 1)">+</button></div>
                    <div class="cart-item-total">${formatCurrency(item.price * item.quantity)}</div>
                    <div class="cart-item-remove" onclick="removeCartItem('${item.id}')"><i class="fas fa-trash"></i></div>
                </div>
            `).join('');
            updateTotals();
        }
        
        function updateTotals(){
            const subtotal = cart.reduce((sum, i) => sum + (i.price * i.quantity), 0);
            const discount = 0;
            const tax = (subtotal - discount) * taxRate / 100;
            const total = subtotal - discount + tax;
            document.getElementById('subtotal').innerHTML = formatCurrency(subtotal);
            document.getElementById('discountAmount').innerHTML = formatCurrency(discount);
            document.getElementById('taxAmount').innerHTML = formatCurrency(tax);
            document.getElementById('totalAmount').innerHTML = formatCurrency(total);
        }
        
        document.getElementById('clearCartBtn').onclick = () => { cart = []; renderCart(); };
        
        // Checkout flow
        document.getElementById('checkoutBtn').onclick = () => {
            if(cart.length === 0){ showToast('Cart is empty', true); return; }
            document.getElementById('customerModal').style.display = 'flex';
        };
        
        document.getElementById('customerType').onchange = (e) => {
            const type = e.target.value;
            document.getElementById('existingCustomerDiv').style.display = type === 'existing' ? 'block' : 'none';
            document.getElementById('newCustomerDiv').style.display = type === 'new' ? 'block' : 'none';
        };
        
        document.getElementById('confirmCustomerBtn').onclick = () => {
            const type = document.getElementById('customerType').value;
            if(type === 'walkin') selectedCustomer = { name: 'Walk-in Customer', type: 'walkin' };
            else if(type === 'existing') selectedCustomer = { name: document.getElementById('existingCustomer').value, type: 'existing' };
            else selectedCustomer = { name: document.getElementById('newCustomerName').value, phone: document.getElementById('newCustomerPhone').value, type: 'new' };
            document.getElementById('customerModal').style.display = 'none';
            const total = cart.reduce((sum, i) => sum + (i.price * i.quantity), 0);
            const tax = total * taxRate / 100;
            document.getElementById('payTotal').innerHTML = formatCurrency(total + tax);
            document.getElementById('paymentModal').style.display = 'flex';
        };
        
        document.getElementById('closeCustomerModal').onclick = () => document.getElementById('customerModal').style.display = 'none';
        
        // Payment handling
        document.getElementById('paymentMethod').onchange = (e) => {
            const method = e.target.value;
            document.getElementById('cashDiv').style.display = method === 'cash' ? 'block' : 'none';
        };
        
        document.getElementById('cashAmount').oninput = () => {
            const total = parseFloat(document.getElementById('payTotal').innerHTML.replace(/[^0-9.-]+/g, '')) || 0;
            const cash = parseFloat(document.getElementById('cashAmount').value) || 0;
            document.getElementById('changeDiv').innerHTML = `Change: ${formatCurrency(cash - total)}`;
        };
        
        document.getElementById('completePaymentBtn').onclick = async () => {
            const subtotal = cart.reduce((sum, i) => sum + (i.price * i.quantity), 0);
            const tax = subtotal * taxRate / 100;
            const total = subtotal + tax;
            
            // Publish SALE_COMPLETED event
            window.eventBus.publish('SALE_COMPLETED', {
                invoiceNo: currentInvoiceNo,
                amount: total,
                businessId: currentBusinessId,
                customerName: selectedCustomer?.name || 'Walk-in Customer',
                items: cart.map(i => ({id: i.id, name: i.name, quantity: i.quantity, price: i.price}))
            });
            
            // Update stock
            for(const item of cart){
                const product = products.find(p => p.id === item.id);
                if(product){
                    product.stock -= item.quantity;
                    await db.collection('products').doc(currentBusinessId).collection('list').doc(item.id).update({stock: product.stock});
                }
            }
            
            document.getElementById('paymentModal').style.display = 'none';
            document.getElementById('invoiceDetails').innerHTML = `
                <p><strong>Invoice No:</strong> ${currentInvoiceNo}</p>
                <p><strong>Customer:</strong> ${selectedCustomer?.name || 'Walk-in Customer'}</p>
                <p><strong>Items:</strong> ${cart.reduce((s,i) => s + i.quantity, 0)}</p>
                <p><strong>Total:</strong> ${formatCurrency(total)}</p>
                <p><strong>Payment:</strong> ${document.getElementById('paymentMethod').value}</p>
            `;
            document.getElementById('invoiceModal').style.display = 'flex';
            
            // Save to orders
            await db.collection('orders').doc(currentBusinessId).collection('list').add({
                invoiceNo: currentInvoiceNo,
                customer: selectedCustomer,
                items: cart,
                subtotal: subtotal,
                tax: tax,
                total: total,
                paymentMethod: document.getElementById('paymentMethod').value,
                status: 'completed',
                createdAt: new Date()
            });
            
            cart = [];
            renderCart();
            loadProducts();
            currentInvoiceNo = 'INV-' + Date.now();
            showToast('Sale completed successfully!');
        };
        
        document.getElementById('closePaymentModal').onclick = () => document.getElementById('paymentModal').style.display = 'none';
        document.getElementById('printInvoiceBtn').onclick = () => { window.print(); document.getElementById('invoiceModal').style.display = 'none'; };
        document.getElementById('closeInvoiceModal').onclick = () => document.getElementById('invoiceModal').style.display = 'none';
        document.getElementById('holdOrderBtn').onclick = () => showToast('Hold order feature coming soon');
        document.getElementById('scanBtn').onclick = () => showToast('Barcode scanner feature coming soon');
        
        auth.onAuthStateChanged(async(user)=>{
            if(!user){ window.location.href='../../auth/login.html'; return; }
            const userDoc = await db.collection('users').doc(user.uid).get();
            currentBusinessId = userDoc.exists ? (userDoc.data().businessId || user.uid) : user.uid;
            await loadProducts();
        });
    </script>
</body>
</html>
