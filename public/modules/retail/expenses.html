<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="/core/pwa-init.js?v=1"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retail Expenses - DIGIBIZ</title>
    <style>html.digibiz-sidebar-reserved body{margin-left:260px;}@media (max-width:768px){html.digibiz-sidebar-reserved body{margin-left:0;}}</style>
    <script>document.documentElement.classList.add('digibiz-sidebar-reserved');</script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
    <script src="../../core/firebase-init.js?v=1"></script>
    <script src="../../core/event-validation.js?v=1"></script>
    <script src="../../core/event-bus.js?v=1"></script>
    <script src="../../core/auth-roles.js?v=1"></script>
    <script src="../../core/dashboard-core.js?v=1"></script>
    <script src="/core/sidebar.js?v=1"></script>
    <style>
        *{box-sizing:border-box}
        body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f3f4f6;color:#0f172a}
        .wrap{max-width:980px;padding:22px}
        .card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;box-shadow:0 4px 14px rgba(15,23,42,.05)}
        h1{margin:0 0 10px;font-size:24px}
        .grid{display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));gap:10px}
        .full{grid-column:1/-1}
        label{display:block;font-size:12px;color:#334155;font-weight:600;margin-bottom:5px}
        input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px}
        textarea{min-height:90px;resize:vertical}
        .btn{border:none;background:#0f766e;color:#fff;padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:600}
        .msg{margin-top:8px;font-size:13px}
        .err{color:#b91c1c}
        .ok{color:#065f46}
        .table{margin-top:14px;overflow:auto;border:1px solid #e2e8f0;border-radius:10px}
        table{width:100%;border-collapse:collapse;min-width:700px}
        th,td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:13px}
        thead th{background:#f8fafc}
        .num{text-align:right}
        .summary{margin-top:12px;font-size:14px;font-weight:700}
        .kubuka-field{display:none;}
        @media (max-width:768px){.wrap{padding:14px}.grid{grid-template-columns:1fr}}
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <h1>Expenses</h1>
        <div class="grid">
            <div>
                <label for="expenseCategory">Category</label>
                <select id="expenseCategory">
                    <option value="General">General</option>
                    <option value="Transport">Transport</option>
                    <option value="Utility">Utility</option>
                    <option value="Salary">Salary</option>
                    <option value="Maintenance">Maintenance</option>
                    <option value="Rent">Rent</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div>
                <label for="expenseAmount">Amount</label>
                <input id="expenseAmount" type="number" min="0" step="0.01" placeholder="0.00">
            </div>
            <div>
                <label for="expenseDate">Date</label>
                <input id="expenseDate" type="date">
            </div>
            <div id="kubukaPaymentModeWrapper" class="kubuka-field">
                <label for="paymentMode">Payment Mode</label>
                <select id="paymentMode">
                    <option value="CASH">Cash</option>
                    <option value="BANK">Bank</option>
                    <option value="CREDIT">Credit</option>
                </select>
            </div>
            <div class="full">
                <label for="expenseDescription">Description</label>
                <textarea id="expenseDescription" placeholder="Expense details"></textarea>
            </div>
        </div>
        <div style="margin-top:12px;">
            <button id="saveExpenseBtn" class="btn" type="button">Save Expense</button>
            <div id="msg" class="msg"></div>
        </div>
    </div>

    <div class="card" style="margin-top:14px;">
        <div class="table">
            <table>
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Category</th>
                    <th class="num">Amount</th>
                    <th>Description</th>
                </tr>
                </thead>
                <tbody id="expenseRows"></tbody>
            </table>
        </div>
        <div id="totalExpenses" class="summary">Total Expenses: Rs 0.00</div>
    </div>
</div>

<script>
(function () {
    let currentBusinessId = '';
    const KUBUKA_BID = '0Uled5estVeQVN8cChmMTNRDNIE3';
    const KUBUKA_ACCOUNTS = {
        CASH: 'AC-10100',
        BANK: 'AC-10200',
        ACCOUNTS_PAYABLE: 'AC-20100',
        OPERATING_EXPENSE: 'AC-50100'
    };
    let expensesCache = [];

    function showMsg(text, kind) {
        const el = document.getElementById('msg');
        el.className = 'msg ' + (kind || '');
        el.textContent = text || '';
    }

    function money(v) {
        return 'Rs ' + (Number(v) || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function isKubuka(){ return String(currentBusinessId || '') === KUBUKA_BID; }

    async function getBusinessContext() {
        const user = auth.currentUser;
        if (!user) return { businessId: currentBusinessId || '' };
        if (window.dashboardCore && typeof window.dashboardCore.getContext === 'function') {
            try {
                const ctx = await window.dashboardCore.getContext(user);
                if (ctx && ctx.businessId) {
                    currentBusinessId = ctx.businessId;
                    return ctx;
                }
            } catch (e) { /* ignore */ }
        }
        const userDoc = await db.collection('users').doc(user.uid).get();
        const businessId = userDoc.exists ? (userDoc.data().businessId || user.uid) : user.uid;
        currentBusinessId = businessId;
        return { businessId: businessId };
    }

    async function createJournalEntryForRetailExpense(expenseData) {
        const { amount, paymentMode, category, description, id } = expenseData;
        let creditAccount = null;

        switch(paymentMode) {
            case 'CASH': creditAccount = KUBUKA_ACCOUNTS.CASH; break;
            case 'BANK': creditAccount = KUBUKA_ACCOUNTS.BANK; break;
            case 'CREDIT': creditAccount = KUBUKA_ACCOUNTS.ACCOUNTS_PAYABLE; break;
        }

        if (!creditAccount) { console.warn('Journal entry skipped: Unknown payment mode.'); return; }

        const journalEntry = {
            date: new Date(),
            memo: `${category}: ${description}`,
            entries: [
                { accountId: KUBUKA_ACCOUNTS.OPERATING_EXPENSE, amount: amount, type: 'debit' },
                { accountId: creditAccount, amount: amount, type: 'credit' }
            ],
            ref: `expenses/${id}`,
            refType: 'EXPENSE',
            businessId: currentBusinessId,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };
        try {
            await db.collection('journal').doc(currentBusinessId).collection('entries').add(journalEntry);
        } catch (error) {
            console.error('Failed to create journal entry for expense:', error);
            showMsg('Warning: Accounting sync failed.', 'err');
        }
    }

    async function loadExpenses() {
        if (!currentBusinessId) return;
        const snap = await db.collection('expenses').doc(currentBusinessId).collection('list').orderBy('date', 'desc').get();
        let total = 0;
        expensesCache = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        
        const from = document.getElementById('expFromDate') ? document.getElementById('expFromDate').value : '';
        const to = document.getElementById('expToDate') ? document.getElementById('expToDate').value : '';
        const filtered = expensesCache.filter(r => {
            if (!from && !to) return true;
            const d = new Date((r.date || '') + 'T00:00:00');
            if (isNaN(d.getTime())) return false;
            if (from) {
                const f = new Date(from + 'T00:00:00');
                if (d < f) return false;
            }
            if (to) {
                const t = new Date(to + 'T23:59:59');
                if (d > t) return false;
            }
            return true;
        });
        filtered.forEach(r => { total += Number(r.amount) || 0; });
        document.getElementById('expenseRows').innerHTML = filtered.map(r => (
            `<tr><td>${r.date || '-'}</td><td>${r.category}</td><td class="num">${money(r.amount)}</td><td>${r.description}</td></tr>`
        )).join('') || '<tr><td colspan="4">No expenses yet.</td></tr>';
        document.getElementById('totalExpenses').textContent = 'Total Expenses: ' + money(total);
    }

    function exportExpensesCsv() {
        if (!isKubuka()) return;
        // ... existing export logic ...
    }

    async function saveExpense() {
        const category = document.getElementById('expenseCategory').value || 'General';
        const amount = Number(document.getElementById('expenseAmount').value);
        const description = String(document.getElementById('expenseDescription').value || '').trim();
        const date = document.getElementById('expenseDate').value || new Date().toISOString().slice(0, 10);
        if (isNaN(amount) || amount <= 0) { showMsg('Enter a valid amount.', 'err'); return; }
        if (!description) { showMsg('Description is required.', 'err'); return; }
        
        let paymentMode = null;
        if(isKubuka()) {
            paymentMode = document.getElementById('paymentMode').value;
        }

        try {
            const expenseData = {
                businessId: currentBusinessId,
                category: category,
                amount: amount,
                description: description,
                date: date,
                createdAt: new Date()
            };
            if (paymentMode) expenseData.paymentMode = paymentMode;

            const docRef = await db.collection('expenses').doc(currentBusinessId).collection('list').add(expenseData);
            
            if (isKubuka()) {
                await createJournalEntryForRetailExpense({ ...expenseData, id: docRef.id });
            }

            document.dispatchEvent(new CustomEvent('EXPENSE_CREATED', { detail: { ...expenseData, expenseId: docRef.id } }));
            if (window.eventBus) window.eventBus.publish('EXPENSE_MADE', { ...expenseData, expenseId: docRef.id, receiptNo: docRef.id });

            showMsg('Expense saved.', 'ok');
            document.getElementById('expenseAmount').value = '';
            document.getElementById('expenseDescription').value = '';
            await loadExpenses();
        } catch (e) {
            showMsg('Failed to save expense: ' + (e.message || String(e)), 'err');
        }
    }

    auth.onAuthStateChanged(async (user) => {
        if (!user) { window.location.href = '/'; return; }
        const ctx = await getBusinessContext();
        currentBusinessId = ctx.businessId;
        document.getElementById('expenseDate').value = new Date().toISOString().slice(0, 10);

        if (isKubuka()) {
            document.getElementById('kubukaPaymentModeWrapper').style.display = 'block';
            const tableCard = document.querySelector('.card[style*="margin-top:14px;"]');
            if (tableCard) {
                // ... existing filter/export UI logic ...
            }
        }
        
        document.getElementById('saveExpenseBtn').addEventListener('click', saveExpense);
        await loadExpenses();
    });
})();
</script>
</body>
</html>
