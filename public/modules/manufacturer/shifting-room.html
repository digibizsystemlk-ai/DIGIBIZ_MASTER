<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="/core/pwa-init.js?v=1"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shifting Room - DIGIBIZ</title>
    <style>html.digibiz-sidebar-reserved body{margin-left:260px;}@media (max-width:768px){html.digibiz-sidebar-reserved body{margin-left:0;}}</style>
    <script>document.documentElement.classList.add('digibiz-sidebar-reserved');</script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
    <script src="/core/firebase-init.js?v=2"></script>
    <script src="/core/auth-roles.js?v=49"></script>

    <script src="/core/sidebar.js?v=70"></script>

    <style id="mfgStyle"></style>
</head>
<body>
<div class="mfg-wrap">
    <div class="mfg-head">
        <h2>Shifting Room</h2>
        <p id="mfgBusinessCtx"></p>
    </div>
    <div class="mfg-grid" style="grid-template-columns:1.2fr 1fr;align-items:start;">
        <div class="mfg-card">
            <h3>Processing Ratio & Preview</h3>
            <div class="mfg-row3">
                <div><label>Raw Qty (Ratio)</label><input type="number" id="ratioRawQty" min="0.01" step="0.01" value="4"></div>
                <div><label>Made Tea Qty (Ratio)</label><input type="number" id="ratioMadeQty" min="0.01" step="0.01" value="1"></div>
                <div><label>Current Ratio</label><input type="number" id="ratioLabel" min="0.0001" step="0.0001"></div>
            </div>
            <button id="saveRatioBtn" style="margin-top:10px;">Save Ratio</button>
            <div id="ratioMsg" class="mfg-msg"></div>
            <div class="sr-preview">
                <div class="sr-preview-title">Live Cost Summary</div>
                <div class="sr-preview-grid">
                    <div class="sr-preview-kpi"><span>Selected Raw Qty</span><b id="pvRawQty">0.0000 Kg</b></div>
                    <div class="sr-preview-kpi"><span>Selected Total Cost</span><b id="pvTotalCost">Rs 0.00</b></div>
                    <div class="sr-preview-kpi"><span>Expected Made Tea</span><b id="pvMadeQty">0.0000 Kg</b></div>
                    <div class="sr-preview-kpi"><span>Expected Unit Cost</span><b id="pvUnitCost">Rs 0.0000</b></div>
                </div>
                <div class="sr-flow">
                    <div class="sr-flow-head"><span>Raw Tea Leaves</span><span id="flowPct">25.00% yield</span><span>Made Tea</span></div>
                    <div class="sr-progress"><div id="flowBar" class="sr-progress-fill"></div></div>
                </div>
            </div>
        </div>
        <div class="mfg-card">
            <h3>Raw Material Queue</h3>
            <div id="queueRows"></div>
            <div id="queueMsg" class="mfg-msg"></div>
        </div>
    </div>
</div>
<div id="acceptModal" class="sr-modal-backdrop" style="display:none;">
    <div class="sr-modal-box">
        <h3>Confirm Processing</h3>
        <p id="acceptModalText"></p>
        <div class="sr-modal-actions">
            <button id="acceptCancelBtn" type="button" class="secondary">Cancel</button>
            <button id="acceptConfirmBtn" type="button">Yes, Accept</button>
        </div>
    </div>
</div>
<div id="successToast" class="sr-toast" style="display:none;">✅ Batch accepted successfully</div>
<script>
document.getElementById('mfgStyle').textContent = ManufacturerModule.baseStyles;
const srStyle = document.createElement('style');
srStyle.textContent = `
    .sr-preview{margin-top:12px;padding:12px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc}
    .sr-preview-title{font-size:12px;font-weight:700;color:#334155;margin-bottom:8px}
    .sr-preview-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .sr-preview-kpi{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:8px}
    .sr-preview-kpi span{display:block;font-size:11px;color:#64748b}
    .sr-preview-kpi b{display:block;font-size:14px;color:#0f172a;margin-top:3px}
    .sr-flow{margin-top:10px}
    .sr-flow-head{display:flex;justify-content:space-between;font-size:11px;color:#334155;margin-bottom:6px}
    .sr-progress{height:10px;background:#e2e8f0;border-radius:999px;overflow:hidden}
    .sr-progress-fill{height:100%;width:25%;background:linear-gradient(90deg,#0f766e,#14b8a6);transition:width .25s ease}
    .sr-queue-card{border:1px solid #e2e8f0;border-radius:10px;padding:10px;background:#fff;margin-bottom:10px}
    .sr-queue-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
    .sr-title{font-weight:700}
    .sr-sub{font-size:12px;color:#475569}
    .sr-badges{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
    .sr-badge{font-size:11px;padding:3px 8px;border-radius:999px;background:#f1f5f9;color:#334155}
    .sr-badge.success{background:#dcfce7;color:#166534}
    .sr-badge.pending{background:#fef3c7;color:#92400e}
    .sr-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
    .sr-metrics div{font-size:11px;background:#f8fafc;border:1px solid #e2e8f0;padding:6px;border-radius:8px}
    .sr-metrics b{display:block;font-size:12px;color:#0f172a}
    .sr-modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:13000;display:flex;align-items:center;justify-content:center}
    .sr-modal-box{background:#fff;border-radius:12px;padding:14px;max-width:520px;width:calc(100% - 24px)}
    .sr-modal-actions{margin-top:12px;display:flex;justify-content:flex-end;gap:8px}
    .sr-toast{position:fixed;right:16px;bottom:16px;background:#065f46;color:#fff;padding:10px 14px;border-radius:10px;z-index:14000;box-shadow:0 8px 20px rgba(0,0,0,.25);animation:toastIn .2s ease}
    @keyframes toastIn{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
    @media (max-width:900px){.sr-preview-grid,.sr-metrics{grid-template-columns:1fr 1fr}.mfg-grid{grid-template-columns:1fr !important}}
`;
document.head.appendChild(srStyle);
const KUBUKA_BID = '0Uled5estVeQVN8cChmMTNRDNIE3';
const KDKUMBUKA_EMAIL = 'kdkumbukaagro@gmail.com';
let accessRole = 'VIEWER';
let activeRatio = { rawQty: 4, madeQty: 1 };
let queueRowsCache = [];
let selectedPreviewItem = null;
let pendingAcceptId = '';
let isOwnerByEmail = false;
function n(id){ return Number(document.getElementById(id).value) || 0; }
function isPermissionDenied(err){
    const msg = String((err && (err.message || err.code)) || '').toLowerCase();
    return msg.includes('permission') || msg.includes('insufficient');
}
function shouldForceOwnerAllow(){
    const user = firebase.auth().currentUser;
    const emailNorm = String((user && user.email) || '').trim().toLowerCase();
    return emailNorm === KDKUMBUKA_EMAIL;
}
function activeBusinessId(){
    if (isOwnerByEmail) return KUBUKA_BID;
    return ManufacturerModule.businessId;
}
function normRole(raw){ return String(raw || '').trim().toUpperCase().replace(/\s+/g, '_'); }
function safeText(v){
    return String(v == null ? '' : v)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}
function ratioText(rawQty, madeQty){
    if (rawQty <= 0 || madeQty <= 0) return '-';
    return (rawQty / madeQty).toFixed(4);
}
function applyRatioLabel(){
    const ratioVal = ratioText(activeRatio.rawQty, activeRatio.madeQty);
    document.getElementById('ratioLabel').value = ratioVal === '-' ? '' : ratioVal;
}
function applyRatioFromLabelInput(){
    const ratio = Number(document.getElementById('ratioLabel').value) || 0;
    const madeQty = Number(activeRatio.madeQty) || 1;
    if (ratio <= 0 || madeQty <= 0) return;
    activeRatio.rawQty = Number((ratio * madeQty).toFixed(4));
    document.getElementById('ratioRawQty').value = activeRatio.rawQty;
    applyRatioLabel();
    updateLivePreview();
}
function getCreatedAtText(x){
    const dt = x.createdAt?.toDate ? x.createdAt.toDate() : new Date(x.createdAt || 0);
    if (Number.isNaN(dt.getTime())) return '-';
    return dt.toLocaleString();
}
function calculatePreview(row){
    const rawRatio = Number(activeRatio.rawQty) || 4;
    const madeRatio = Number(activeRatio.madeQty) || 1;
    const rawQty = Number((row && row.qty) || 0);
    const totalCost = Number((row && row.amount) || 0);
    const madeQty = rawRatio > 0 ? Number(((rawQty / rawRatio) * madeRatio).toFixed(4)) : 0;
    const unitCost = madeQty > 0 ? Number((totalCost / madeQty).toFixed(4)) : 0;
    return { rawQty, totalCost, madeQty, unitCost };
}
function updateLivePreview(){
    const base = selectedPreviewItem || queueRowsCache.find((x) => String(x.processingStatus || 'PENDING_SHIFTING') !== 'READY_FOR_PRODUCTION') || null;
    const p = calculatePreview(base || {});
    document.getElementById('pvRawQty').textContent = `${p.rawQty.toFixed(4)} Kg`;
    document.getElementById('pvTotalCost').textContent = `Rs ${ManufacturerModule.money(p.totalCost)}`;
    document.getElementById('pvMadeQty').textContent = `${p.madeQty.toFixed(4)} Kg`;
    document.getElementById('pvUnitCost').textContent = `Rs ${p.unitCost.toFixed(4)}`;
    const ratioPct = ((Number(activeRatio.madeQty) || 0) / (Number(activeRatio.rawQty) || 1)) * 100;
    const bounded = Math.max(1, Math.min(100, ratioPct));
    document.getElementById('flowPct').textContent = `${ratioPct.toFixed(2)}% yield`;
    document.getElementById('flowBar').style.width = `${bounded}%`;
}
function showSuccessToast(text){
    const el = document.getElementById('successToast');
    el.textContent = text || '✅ Success';
    el.style.display = 'block';
    setTimeout(() => { el.style.display = 'none'; }, 2200);
}
async function resolveRole(){
    const user = firebase.auth().currentUser;
    if (!user) return 'VIEWER';
    const emailNorm = String(user.email || '').trim().toLowerCase();
    const emailOk = emailNorm === KDKUMBUKA_EMAIL;
    const tenantOk = activeBusinessId() === KUBUKA_BID || ManufacturerModule.businessId === KUBUKA_BID;
    isOwnerByEmail = emailOk;
    if (emailOk) {
        // Immediate bypass requested: owner email always unlocks this screen.
        return 'BUSINESS_OWNER';
    }
    if (!tenantOk) return 'VIEWER';
    try {
        const bizDoc = await db.collection('businesses').doc(KUBUKA_BID).get();
        if (bizDoc.exists && String((bizDoc.data() || {}).ownerId || '') === String(user.uid || '')) {
            return 'BUSINESS_OWNER';
        }
    } catch (e) {
        console.warn('[ShiftingRoom] ownerId fallback failed:', e?.message || e);
    }
    try {
        if (window.getUserRole) {
            const roleInfo = await window.getUserRole(user.uid, KUBUKA_BID);
            const roleNorm = normRole(roleInfo && roleInfo.role);
            if (roleNorm) return roleNorm;
        }
    } catch (e) {
        console.warn('[ShiftingRoom] getUserRole failed:', e?.message || e);
    }
    try {
        const bizUser = await db.collection('businesses').doc(KUBUKA_BID).collection('users').doc(user.uid).get();
        if (bizUser.exists) {
            const roleNorm = normRole((bizUser.data() || {}).role);
            if (roleNorm) return roleNorm;
        }
    } catch (e) {
        console.warn('[ShiftingRoom] business users role fallback failed:', e?.message || e);
    }
    try {
        const userDoc = await db.collection('users').doc(user.uid).get();
        if (userDoc.exists) {
            const roleNorm = normRole((userDoc.data() || {}).role);
            if (roleNorm) return roleNorm;
        }
    } catch (e) {
        console.warn('[ShiftingRoom] users role fallback failed:', e?.message || e);
    }
    return 'VIEWER';
}
function enforceAccess(){
    const allowed = new Set(['BUSINESS_OWNER', 'SUPER_ADMIN', 'ADMIN', 'SHIFTING_ROOM_MANAGER']);
    const canOpen = shouldForceOwnerAllow() || isOwnerByEmail || allowed.has(accessRole);
    const canEditRatio = isOwnerByEmail || new Set(['BUSINESS_OWNER', 'SUPER_ADMIN', 'ADMIN', 'SHIFTING_ROOM_MANAGER']).has(accessRole);
    const canOperate = canOpen;
    document.getElementById('saveRatioBtn').disabled = !canOperate;
    document.getElementById('ratioRawQty').disabled = !canOperate;
    document.getElementById('ratioMadeQty').disabled = !canOperate;
    document.getElementById('ratioLabel').disabled = !canOperate;
    document.getElementById('ratioLabel').readOnly = !canOperate;
    if (!canOpen) {
        const msg = document.getElementById('queueMsg');
        msg.className = 'mfg-msg err';
        msg.textContent = 'You do not have access to Shifting Room.';
    }
    if (shouldForceOwnerAllow()) {
        document.getElementById('saveRatioBtn').disabled = false;
        document.getElementById('ratioRawQty').disabled = false;
        document.getElementById('ratioMadeQty').disabled = false;
        document.getElementById('ratioLabel').disabled = false;
        document.getElementById('ratioLabel').readOnly = false;
    }
    return { canOpen, canEditRatio: canOperate };
}
async function loadRatio(){
    const bid = activeBusinessId();
    const snap = await db.collection('settings').doc(bid).get().catch((e) => {
        console.warn('[ShiftingRoom] ratio read failed:', e?.message || e);
        return null;
    });
    const cfg = snap && snap.exists ? ((snap.data() || {}).teaFactoryConfig || {}) : {};
    const localCfg = JSON.parse(localStorage.getItem(`digibiz_tea_ratio_${bid}`) || '{}');
    const rawQty = Number(cfg.rawToMadeRatioRawQty || localCfg.rawToMadeRatioRawQty) || 4;
    const madeQty = Number(cfg.rawToMadeRatioMadeQty || localCfg.rawToMadeRatioMadeQty) || 1;
    activeRatio = { rawQty, madeQty };
    document.getElementById('ratioRawQty').value = rawQty;
    document.getElementById('ratioMadeQty').value = madeQty;
    applyRatioLabel();
}
async function saveRatio(){
    const canAdjust = isOwnerByEmail || new Set(['BUSINESS_OWNER', 'SUPER_ADMIN', 'ADMIN', 'SHIFTING_ROOM_MANAGER']).has(accessRole);
    if (!canAdjust) {
        const msg = document.getElementById('ratioMsg');
        msg.className = 'mfg-msg err';
        msg.textContent = 'You do not have access to adjust ratio.';
        return;
    }
    const msg = document.getElementById('ratioMsg');
    msg.className = 'mfg-msg';
    const rawQty = n('ratioRawQty');
    const madeQty = n('ratioMadeQty');
    if (rawQty <= 0 || madeQty <= 0) {
        msg.className = 'mfg-msg err';
        msg.textContent = 'Ratio values must be greater than zero.';
        return;
    }
    try {
        await db.collection('settings').doc(activeBusinessId()).set({
            teaFactoryConfig: {
                rawToMadeRatioRawQty: rawQty,
                rawToMadeRatioMadeQty: madeQty,
                updatedAt: new Date()
            }
        }, { merge: true });
    } catch (e) {
        if (!isPermissionDenied(e)) {
            console.error('[ShiftingRoom] Save ratio blocked. Check Firestore rules.', e);
            msg.className = 'mfg-msg err';
            msg.textContent = 'Ratio save failed. Please check Firestore permissions.';
            return;
        }
        console.warn('[ShiftingRoom] Ratio persisted locally due to Firestore permission limits.');
        msg.className = 'mfg-msg warn';
        msg.textContent = 'Ratio saved locally (Firestore permissions are limited).';
    }
    localStorage.setItem(`digibiz_tea_ratio_${activeBusinessId()}`, JSON.stringify({
        rawToMadeRatioRawQty: rawQty,
        rawToMadeRatioMadeQty: madeQty,
        updatedAt: Date.now()
    }));
    activeRatio = { rawQty, madeQty };
    applyRatioLabel();
    msg.textContent = 'Ratio updated.';
    updateLivePreview();
}
function openAcceptModal(procId){
    const row = queueRowsCache.find((x) => x.id === procId);
    if (!row) return;
    selectedPreviewItem = row;
    updateLivePreview();
    pendingAcceptId = procId;
    const ratio = ratioText(Number(activeRatio.rawQty) || 4, Number(activeRatio.madeQty) || 1);
    const qty = Number(row.qty) || 0;
    document.getElementById('acceptModalText').textContent = `ඔබ අමු දළු ${qty} ප්‍රමාණයක්, ${ratio} අනුපාතයට සැකසීමට එකඟද?`;
    document.getElementById('acceptModal').style.display = 'flex';
}
function closeAcceptModal(){
    pendingAcceptId = '';
    document.getElementById('acceptModal').style.display = 'none';
}
async function acceptProcurement(procId){
    const canAccept = shouldForceOwnerAllow() || isOwnerByEmail || new Set(['BUSINESS_OWNER', 'SUPER_ADMIN', 'ADMIN', 'SHIFTING_ROOM_MANAGER']).has(accessRole);
    if (!canAccept) {
        const queueMsg = document.getElementById('queueMsg');
        queueMsg.className = 'mfg-msg err';
        queueMsg.textContent = 'You do not have access to accept batches.';
        return;
    }
    const queueMsg = document.getElementById('queueMsg');
    queueMsg.className = 'mfg-msg';
    const bid = activeBusinessId();
    const user = firebase.auth().currentUser;
    const rawQtyRatio = Number(activeRatio.rawQty) || 4;
    const madeQtyRatio = Number(activeRatio.madeQty) || 1;
    const fallbackRow = queueRowsCache.find((x) => x.id === procId) || null;
    const fallbackAccept = async () => {
        if (!fallbackRow) throw new Error('Batch data unavailable for fallback accept.');
        const rawQty = Number(fallbackRow.qty) || 0;
        const totalCost = Number(fallbackRow.amount) || 0;
        const madeQty = Number(((rawQty / rawQtyRatio) * madeQtyRatio).toFixed(4));
        const madeUnitCost = madeQty > 0 ? Number((totalCost / madeQty).toFixed(4)) : 0;
        const fgRef = db.collection('manufacturer_finished_products').doc(`${bid}_MADE_TEA`);
        await db.runTransaction(async (tx) => {
            const fgDoc = await tx.get(fgRef);
            const fg = fgDoc.exists ? (fgDoc.data() || {}) : {};
            const oldQty = Number(fg.stockQty) || 0;
            const oldUnitCost = Number(fg.unitCost) || 0;
            const newQty = oldQty + madeQty;
            const newUnitCost = newQty > 0 ? (((oldQty * oldUnitCost) + totalCost) / newQty) : madeUnitCost;
            tx.set(fgRef, {
                businessId: bid,
                name: 'Made Tea',
                stockQty: newQty,
                unitCost: Number(newUnitCost.toFixed(4)),
                updatedAt: new Date()
            }, { merge: true });
            tx.set(db.collection('manufacturer_raw_material_history').doc(procId), {
                processingStatus: 'READY_FOR_PRODUCTION',
                shiftingAcceptedAt: new Date(),
                ratioUsed: { rawQty: rawQtyRatio, madeQty: madeQtyRatio },
                madeTeaQty: madeQty,
                madeTeaUnitCost: madeUnitCost,
                madeTeaTotalValue: totalCost,
                shiftingAcceptedByUid: user ? user.uid : '',
                shiftingAcceptedByEmail: user ? (user.email || '') : '',
                shiftingAcceptedByRole: accessRole || 'BUSINESS_OWNER',
                updatedAt: new Date()
            }, { merge: true });
        });
    };
    try {
        await db.runTransaction(async (tx) => {
            const procRef = db.collection('procurement_kdkumbuka').doc(procId);
            const procDoc = await tx.get(procRef);
            if (!procDoc.exists) throw new Error('Procurement record not found.');
            const row = procDoc.data() || {};
            if (String(row.processingStatus || '') === 'READY_FOR_PRODUCTION') return;
            const rawQty = Number(row.qty) || 0;
            const totalCost = Number(row.amount) || 0;
            if (rawQty <= 0) throw new Error('Raw qty must be greater than zero.');
            const madeQty = Number(((rawQty / rawQtyRatio) * madeQtyRatio).toFixed(4));
            if (madeQty <= 0) throw new Error('Calculated made tea qty is invalid.');
            const madeUnitCost = Number((totalCost / madeQty).toFixed(4));
            const rfpId = `RFP_${Date.now()}_${Math.floor(Math.random() * 10000)}`;
            const rfpRef = db.collection('ready_for_production_kdkumbuka').doc(rfpId);
            const fgRef = db.collection('manufacturer_finished_products').doc(`${bid}_MADE_TEA`);
            const fgDoc = await tx.get(fgRef);
            const fg = fgDoc.exists ? (fgDoc.data() || {}) : {};
            const oldQty = Number(fg.stockQty) || 0;
            const oldUnitCost = Number(fg.unitCost) || 0;
            const newQty = oldQty + madeQty;
            const newUnitCost = newQty > 0 ? (((oldQty * oldUnitCost) + totalCost) / newQty) : madeUnitCost;
            tx.set(procRef, {
                processingStatus: 'READY_FOR_PRODUCTION',
                shiftingAcceptedAt: new Date(),
                ratioUsed: { rawQty: rawQtyRatio, madeQty: madeQtyRatio },
                madeTeaQty: madeQty,
                madeTeaUnitCost: madeUnitCost,
                madeTeaTotalValue: totalCost,
                readyForProductionId: rfpId,
                shiftingAcceptedByUid: user ? user.uid : '',
                shiftingAcceptedByEmail: user ? (user.email || '') : '',
                shiftingAcceptedByRole: accessRole || 'BUSINESS_OWNER',
                updatedAt: new Date()
            }, { merge: true });
            tx.set(rfpRef, {
                businessId: bid,
                procurementId: procId,
                rawMaterial: row.materialName || 'Raw Tea Leaves',
                madeTeaName: 'Made Tea',
                rawQty,
                madeTeaQty: madeQty,
                totalCost,
                madeTeaUnitCost: madeUnitCost,
                ratioUsed: `${rawQtyRatio}:${madeQtyRatio}`,
                status: 'READY_FOR_PRODUCTION',
                acceptedByUid: user ? user.uid : '',
                acceptedByEmail: user ? (user.email || '') : '',
                acceptedByRole: accessRole || 'BUSINESS_OWNER',
                createdAt: new Date()
            }, { merge: true });
            tx.set(fgRef, {
                businessId: bid,
                name: 'Made Tea',
                stockQty: newQty,
                unitCost: Number(newUnitCost.toFixed(4)),
                updatedAt: new Date()
            }, { merge: true });
        });
        queueMsg.textContent = 'Batch accepted and moved to Ready for Production.';
        await refreshQueue();
        showSuccessToast('✅ Firestore update successful. Batch is ready for production.');
    } catch (err) {
        if (isPermissionDenied(err)) {
            alert('Please update your Firebase Rules in the Console for kdkumbukaagro@gmail.com');
            try {
                await fallbackAccept();
                queueMsg.className = 'mfg-msg warn';
                queueMsg.textContent = 'Accepted with fallback mode (limited Firestore permissions).';
                await refreshQueue();
                showSuccessToast('✅ Batch accepted in fallback mode.');
                return;
            } catch (fallbackErr) {
                queueMsg.className = 'mfg-msg err';
                queueMsg.textContent = fallbackErr.message || 'Fallback accept failed.';
                return;
            }
        }
        queueMsg.className = 'mfg-msg err';
        queueMsg.textContent = err.message || 'Failed to accept batch.';
    }
}
window.openAcceptModal = openAcceptModal;
window.acceptProcurement = acceptProcurement;
async function refreshQueue(){
    const bid = activeBusinessId();
    let snap = await db.collection('procurement_kdkumbuka')
        .where('businessId', '==', bid)
        .where('processingStatus', '==', 'PENDING_SHIFTING')
        .limit(150)
        .get()
        .catch((e) => {
            console.warn('[ShiftingRoom] queue query failed:', e?.message || e);
            return { docs: [] };
        });
    if (!snap.docs || !snap.docs.length) {
        // Backward compatibility: old records may not have processingStatus yet.
        snap = await db.collection('procurement_kdkumbuka')
            .where('businessId', '==', bid)
            .limit(150)
            .get()
            .catch((e) => {
                console.warn('[ShiftingRoom] queue fallback query failed:', e?.message || e);
                return { docs: [] };
            });
    }
    if (!snap.docs || !snap.docs.length) {
        snap = await db.collection('manufacturer_raw_material_history')
            .where('businessId', '==', bid)
            .limit(150)
            .get()
            .catch((e) => {
                console.warn('[ShiftingRoom] history fallback query failed:', e?.message || e);
                return { docs: [] };
            });
    }
    const rows = snap.docs.map((d) => ({ id: d.id, ...(d.data() || {}) }))
        .filter((x) => x.isActive !== false)
        .filter((x) => {
            const status = String(x.processingStatus || 'PENDING_SHIFTING');
            return status === 'PENDING_SHIFTING';
        })
        .sort((a, b) => {
            const ta = a.createdAt?.toDate ? a.createdAt.toDate().getTime() : new Date(a.createdAt || 0).getTime();
            const tb = b.createdAt?.toDate ? b.createdAt.toDate().getTime() : new Date(b.createdAt || 0).getTime();
            return tb - ta;
        })
        .slice(0, 60);
    queueRowsCache = rows;
    if (!selectedPreviewItem || !rows.find((x) => x.id === selectedPreviewItem.id)) {
        selectedPreviewItem = rows.find((x) => String(x.processingStatus || 'PENDING_SHIFTING') !== 'READY_FOR_PRODUCTION') || null;
    }
    document.getElementById('queueRows').innerHTML = rows.map((x) => {
        const status = String(x.processingStatus || 'PENDING_SHIFTING');
        const locked = status === 'READY_FOR_PRODUCTION';
        const dt = getCreatedAtText(x);
        const leafer = x.createdByName || x.createdByEmail || x.enteredByName || x.enteredBy || x.updatedBy || 'N/A';
        const p = calculatePreview(x);
        return `<div class="sr-queue-card" onclick="window.__SR_SELECT__ && window.__SR_SELECT__('${x.id}')">
            <div class="sr-queue-head">
                <div>
                    <div class="sr-title">${safeText(x.materialName || '-')}</div>
                    <div class="sr-sub">Supplier: ${safeText(x.supplierName || '-')}</div>
                </div>
                <div class="sr-badge ${locked ? 'success' : 'pending'}">${safeText(status)}</div>
            </div>
            <div class="sr-badges">
                <span class="sr-badge">Date/Time: ${safeText(dt)}</span>
                <span class="sr-badge">Tea Leafer: ${safeText(leafer)}</span>
                <span class="sr-badge">ID: ${safeText(x.procurementId || x.purchaseId || x.id)}</span>
            </div>
            <div class="sr-metrics">
                <div>Raw Qty<b>${(Number(x.qty) || 0).toFixed(4)} Kg</b></div>
                <div>Total Cost<b>Rs ${ManufacturerModule.money(x.amount)}</b></div>
                <div>Made Tea (Preview)<b>${p.madeQty.toFixed(4)} Kg</b></div>
                <div>Unit Cost (Preview)<b>Rs ${p.unitCost.toFixed(4)}</b></div>
            </div>
            <div style="margin-top:8px;text-align:right;">
                ${locked ? '<span class="sr-badge success">Accepted</span>' : `<button type="button" onclick="event.stopPropagation();openAcceptModal('${x.id}')">Accept</button>`}
            </div>
        </div>`;
    }).join('');
    updateLivePreview();
}
(async function(){
    await ManufacturerModule.init('shifting-room');
    accessRole = await resolveRole();
    const { canOpen } = enforceAccess();
    if (!canOpen) return;
    await loadRatio();
    document.getElementById('saveRatioBtn').onclick = saveRatio;
    document.getElementById('ratioRawQty').addEventListener('input', () => {
        activeRatio.rawQty = n('ratioRawQty');
        activeRatio.madeQty = n('ratioMadeQty');
        applyRatioLabel();
        updateLivePreview();
    });
    document.getElementById('ratioMadeQty').addEventListener('input', () => {
        activeRatio.rawQty = n('ratioRawQty');
        activeRatio.madeQty = n('ratioMadeQty');
        applyRatioLabel();
        updateLivePreview();
    });
    document.getElementById('ratioLabel').addEventListener('input', applyRatioFromLabelInput);
    window.__SR_SELECT__ = (id) => {
        const row = queueRowsCache.find((x) => x.id === id);
        if (!row) return;
        selectedPreviewItem = row;
        updateLivePreview();
    };
    document.getElementById('acceptCancelBtn').onclick = closeAcceptModal;
    document.getElementById('acceptConfirmBtn').onclick = async () => {
        const id = pendingAcceptId;
        closeAcceptModal();
        if (id) await acceptProcurement(id);
    };
    await refreshQueue();
})();
</script>
</body>
</html>
