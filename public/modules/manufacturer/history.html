<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="/core/pwa-init.js?v=1"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manufacturer History & Intelligence - DIGIBIZ</title>
    <style>html.digibiz-sidebar-reserved body{margin-left:260px;}@media (max-width:768px){html.digibiz-sidebar-reserved body{margin-left:0;}}</style>
    <script>document.documentElement.classList.add('digibiz-sidebar-reserved');</script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
    <script src="/core/firebase-init.js?v=2"></script>
    <script src="/core/dashboard-core.js?v=70"></script>
    <script src="/core/sidebar.js?v=67"></script>
    <script src="/core/sms-wallet-core.js?v=4"></script>
    <script src="/modules/manufacturer/manufacturer-common.js?v=9"></script>
    <style id="mfgStyle"></style>
</head>
<body>
<div class="mfg-wrap">
    <div class="mfg-head">
        <h2>History & Intelligence</h2>
        <p id="mfgBusinessCtx"></p>
    </div>
    <div class="mfg-grid">
        <div class="mfg-card">
            <h3>Cost-Benefit Report (MTD)</h3>
            <table>
                <thead><tr><th>Metric</th><th>Value</th></tr></thead>
                <tbody id="intelRows"></tbody>
            </table>
        </div>
        <div class="mfg-card">
            <h3>Supplier & Company Intelligence</h3>
            <div class="mfg-row">
                <div>
                    <label>Suppliers (inbound count)</label>
                    <ul id="supplierList"></ul>
                </div>
                <div>
                    <label>Companies (outbound count)</label>
                    <ul id="companyList"></ul>
                </div>
            </div>
        </div>
        <div class="mfg-card">
            <h3>Deep History</h3>
            <div class="mfg-row">
                <div><label>Type</label><select id="typeFilter"><option value="">All</option><option value="PURCHASE">Purchase</option><option value="SALE">Sale</option></select></div>
                <div><label>Payment Status</label><select id="statusFilter"><option value="">All</option><option value="PAID">Paid</option><option value="PENDING">Pending</option><option value="PENDING_CLEARANCE">Pending Clearance</option></select></div>
            </div>
            <table style="margin-top:8px;">
                <thead><tr><th>Type</th><th>Party</th><th>Item</th><th>Amount</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead>
                <tbody id="historyRows"></tbody>
            </table>
        </div>
    </div>
</div>
<div id="editModal" class="mfg-modal" style="display:none;">
    <div class="mfg-modal-box">
        <h3>Edit History Record</h3>
        <div class="mfg-row">
            <div><label>Party</label><input id="editParty"></div>
            <div><label>Item</label><input id="editItem"></div>
        </div>
        <div class="mfg-row3" style="margin-top:8px;">
            <div><label>Amount</label><input type="number" id="editAmount" min="0" step="0.01"></div>
            <div><label>Payment Status</label><input id="editStatus"></div>
            <div></div>
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;">
            <button type="button" id="editCancelBtn">Cancel</button>
            <button type="button" id="editSaveBtn">Update</button>
        </div>
    </div>
</div>
<script>
document.getElementById('mfgStyle').textContent = ManufacturerModule.baseStyles;
let records = [];
let editingRec = null;
const modalStyle = document.createElement('style');
modalStyle.textContent = `.mfg-modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:12000;padding:14px}.mfg-modal-box{max-width:760px;width:100%;background:#fff;border-radius:12px;padding:14px}`;
document.head.appendChild(modalStyle);
function v(id){ return document.getElementById(id).value; }
function renderHistory(){
    const t=v('typeFilter'); const s=v('statusFilter');
    const rows = records.filter((x)=>x.isActive !== false && (!t || x.type===t) && (!s || x.paymentStatus===s));
    document.getElementById('historyRows').innerHTML = rows.map((x)=>`<tr><td>${x.type}</td><td class="wrap-name">${x.party}</td><td class="wrap-name">${x.item}</td><td>Rs ${ManufacturerModule.money(x.amount)}</td><td>${x.paymentStatus||'-'}</td><td>${ManufacturerModule.formatDate(x.createdAt)}</td><td><button type="button" onclick="openEditHistory('${x.key}')">✏️</button> <button type="button" onclick="deleteHistory('${x.key}')">🗑️</button></td></tr>`).join('');
}
function openEditHistory(key){
    editingRec = records.find((r) => r.key === key) || null;
    if (!editingRec) return;
    document.getElementById('editParty').value = editingRec.party || '';
    document.getElementById('editItem').value = editingRec.item || '';
    document.getElementById('editAmount').value = Number(editingRec.amount || 0);
    document.getElementById('editStatus').value = editingRec.paymentStatus || '';
    document.getElementById('editModal').style.display = 'flex';
}
function closeEditHistory(){
    editingRec = null;
    document.getElementById('editModal').style.display = 'none';
}
async function saveEditHistory(){
    if (!editingRec) return;
    const coll = editingRec.coll;
    const docId = editingRec.docId;
    const patch = {
        amount: Number(v('editAmount')) || 0,
        paymentStatus: String(v('editStatus') || '').trim(),
        updatedAt: new Date()
    };
    if (editingRec.type === 'PURCHASE') {
        patch.supplierName = v('editParty').trim();
        patch.materialName = v('editItem').trim();
    } else {
        patch.companyName = v('editParty').trim();
        patch.productName = v('editItem').trim();
    }
    await db.collection(coll).doc(docId).update(patch);
    closeEditHistory();
    await refresh();
}
async function deleteHistory(key){
    const rec = records.find((r) => r.key === key);
    if (!rec) return;
    if (!confirm('Are you sure you want to delete this record?')) return;
    await db.collection(rec.coll).doc(rec.docId).update({ isActive: false, deletedAt: new Date() });
    await refresh();
}
window.openEditHistory = openEditHistory;
window.deleteHistory = deleteHistory;
async function refresh(){
    const bid = ManufacturerModule.businessId;
    const [inb,out,exp] = await Promise.all([
        db.collection('manufacturer_raw_material_history').where('businessId','==',bid).get().catch(()=>({docs:[]})),
        db.collection('manufacturer_sales').where('businessId','==',bid).get().catch(()=>({docs:[]})),
        db.collection('manufacturer_expenses').where('businessId','==',bid).get().catch(()=>({docs:[]}))
    ]);
    const start = new Date(); start.setDate(1); start.setHours(0,0,0,0);
    let rm=0,sales=0,side=0,proc=0,op=0;
    const supplierMap = {};
    const companyMap = {};
    records = [];
    inb.docs.forEach((d)=>{
        const x=d.data()||{};
        if ((x.createdAt?.toDate ? x.createdAt.toDate() : new Date(x.createdAt||0)) >= start) rm += Number(x.amount)||0;
        supplierMap[x.supplierName||'Unknown'] = (supplierMap[x.supplierName||'Unknown']||0)+1;
        records.push({key:`PURCHASE_${d.id}`,coll:'manufacturer_raw_material_history',docId:d.id,type:'PURCHASE',party:x.supplierName||'-',item:x.materialName||'-',amount:Number(x.amount)||0,paymentStatus:x.paymentStatus||'-',createdAt:x.createdAt,isActive:x.isActive});
    });
    out.docs.forEach((d)=>{
        const x=d.data()||{};
        if ((x.createdAt?.toDate ? x.createdAt.toDate() : new Date(x.createdAt||0)) >= start) sales += Number(x.amount)||0;
        companyMap[x.companyName||'Unknown'] = (companyMap[x.companyName||'Unknown']||0)+1;
        records.push({key:`SALE_${d.id}`,coll:'manufacturer_sales',docId:d.id,type:'SALE',party:x.companyName||'-',item:x.productName||'-',amount:Number(x.amount)||0,paymentStatus:x.paymentStatus||'-',createdAt:x.createdAt,isActive:x.isActive});
    });
    exp.docs.forEach((d)=>{
        const x=d.data()||{};
        if ((x.createdAt?.toDate ? x.createdAt.toDate() : new Date(x.createdAt||0)) >= start) op += Number(x.amount)||0;
    });
    const pr = await db.collection('manufacturer_production_runs').where('businessId','==',bid).get().catch(()=>({docs:[]}));
    const si = await db.collection('manufacturer_side_income').where('businessId','==',bid).get().catch(()=>({docs:[]}));
    pr.docs.forEach((d)=>{ const x=d.data()||{}; if ((x.createdAt?.toDate ? x.createdAt.toDate() : new Date(x.createdAt||0)) >= start) proc += Number(x.processingCost)||0; });
    si.docs.forEach((d)=>{ const x=d.data()||{}; if ((x.date?.toDate ? x.date.toDate() : new Date(x.date||0)) >= start) side += Number(x.amount)||0; });
    const net = (sales + side) - (rm + proc + op);
    const intel = [
        ['Finished Goods Sales', sales],
        ['Side Income', side],
        ['Raw Material Cost', rm],
        ['Processing Cost', proc],
        ['Operational Cost', op],
        ['Net Profit', net]
    ];
    document.getElementById('intelRows').innerHTML = intel.map((r)=>`<tr><td>${r[0]}</td><td>Rs ${ManufacturerModule.money(r[1])}</td></tr>`).join('');
    document.getElementById('supplierList').innerHTML = Object.keys(supplierMap).sort().map((k)=>`<li>${k} (${supplierMap[k]})</li>`).join('');
    document.getElementById('companyList').innerHTML = Object.keys(companyMap).sort().map((k)=>`<li>${k} (${companyMap[k]})</li>`).join('');
    records.sort((a,b)=> (new Date(b.createdAt?.toDate ? b.createdAt.toDate() : b.createdAt||0)).getTime() - (new Date(a.createdAt?.toDate ? a.createdAt.toDate() : a.createdAt||0)).getTime());
    renderHistory();
}
(async function(){
    await ManufacturerModule.init('history');
    document.getElementById('editSaveBtn').onclick = saveEditHistory;
    document.getElementById('editCancelBtn').onclick = closeEditHistory;
    document.getElementById('typeFilter').onchange = renderHistory;
    document.getElementById('statusFilter').onchange = renderHistory;
    refresh();
})();
</script>
</body>
</html>
