<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <script src="/core/pwa-init.js?v=1"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - DIGIBIZ</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
    
    <script src="/core/firebase-init.js?v=100"></script>
    <script src="/scripts/admin-impersonation.js?v=100"></script>
    <script src="../../core/event-bus.js"></script>
    <script src="../../core/auth-roles.js?v=115"></script>
    <script src="../../core/business-types.js"></script>
    <script src="../../core/sidebar.js?v=1015"></script>
    
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',sans-serif;background:#f5f6fa;color:#1a1a2e;}
        
        .main-content{padding:30px 35px;min-height:100vh;}
        @media (max-width:768px){.main-content{padding:20px;}}
        
        .page-header{margin-bottom:30px;}
        .page-header h1{font-size:26px;font-weight:700;color:#1a1a2e;}
        .page-header h1 i{color:#10b981;margin-right:12px;}
        .page-header p{color:#64748b;margin-top:8px;font-size:14px;}
        
        .notification-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:25px;}
        .stat-card{background:white;border-radius:16px;padding:20px;border:1px solid #e9ecef;text-align:center;}
        .stat-card .count{font-size:32px;font-weight:700;color:#10b981;}
        .stat-card .label{font-size:13px;color:#64748b;margin-top:5px;}
        
        .notification-tabs{display:flex;gap:10px;margin-bottom:20px;border-bottom:2px solid #e9ecef;}
        .notif-tab{background:none;border:none;padding:12px 24px;font-size:14px;font-weight:500;cursor:pointer;color:#64748b;}
        .notif-tab i{margin-right:8px;}
        .notif-tab.active{color:#10b981;border-bottom:2px solid #10b981;}
        
        .tab-pane{display:none;}
        .tab-pane.active{display:block;}
        
        .notification-item{background:white;border-radius:12px;padding:16px 20px;margin-bottom:12px;border:1px solid #e9ecef;display:flex;justify-content:space-between;align-items:center;transition:all 0.2s;}
        .notification-item:hover{background:#f8f9fa;}
        .notification-item.unread{border-left:4px solid #10b981;background:#f0fdf4;}
        .notification-icon{width:45px;height:45px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;}
        .notification-icon.sale{background:#d1fae5;color:#10b981;}
        .notification-icon.stock{background:#fed7aa;color:#f59e0b;}
        .notification-icon.system{background:#e0e7ff;color:#3b82f6;}
        .notification-content{flex:1;margin-left:15px;}
        .notification-title{font-weight:600;font-size:14px;margin-bottom:4px;}
        .notification-message{font-size:12px;color:#64748b;}
        .notification-time{font-size:11px;color:#adb5bd;margin-top:4px;}
        .notification-actions{display:flex;gap:8px;}
        .btn-icon{background:none;border:none;padding:8px;cursor:pointer;color:#adb5bd;}
        .btn-icon:hover{color:#10b981;}
        
        .btn-primary{background:#10b981;color:white;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;}
        .btn-outline{background:transparent;border:1px solid #10b981;color:#10b981;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;}
        
        footer{text-align:center;padding:25px;color:#adb5bd;font-size:12px;border-top:1px solid #e9ecef;margin-top:20px;}
    </style>
</head>
<body>
    <div class="main-content">
        <div class="page-header">
            <h1><i class="fas fa-bell"></i> Notifications</h1>
            <p>Manage your business alerts and notifications</p>
        </div>
        
        <div class="notification-stats">
            <div class="stat-card"><div class="count" id="unreadCount">0</div><div class="label">Unread</div></div>
            <div class="stat-card"><div class="count" id="totalCount">0</div><div class="label">Total</div></div>
            <div class="stat-card"><div class="count" id="todayCount">0</div><div class="label">Today</div></div>
        </div>
        
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
            <div class="notification-tabs">
                <button class="notif-tab active" data-tab="all"><i class="fas fa-bell"></i> All</button>
                <button class="notif-tab" data-tab="unread"><i class="fas fa-envelope"></i> Unread</button>
                <button class="notif-tab" data-tab="sales"><i class="fas fa-chart-line"></i> Sales</button>
                <button class="notif-tab" data-tab="stock"><i class="fas fa-box"></i> Stock</button>
                <button class="notif-tab" data-tab="system"><i class="fas fa-cog"></i> System</button>
            </div>
            <div>
                <button class="btn-outline" id="markAllReadBtn"><i class="fas fa-check-double"></i> Mark All Read</button>
            </div>
        </div>
        
        <div id="tab-all" class="tab-pane active">
            <div id="allNotifications" style="margin-bottom:20px;">Loading...</div>
        </div>
        <div id="tab-unread" class="tab-pane"><div id="unreadNotifications">Loading...</div></div>
        <div id="tab-sales" class="tab-pane"><div id="salesNotifications">Loading...</div></div>
        <div id="tab-stock" class="tab-pane"><div id="stockNotifications">Loading...</div></div>
        <div id="tab-system" class="tab-pane"><div id="systemNotifications">Loading...</div></div>
        
        <footer><p>© 2025 DIGIBIZ Universal - Complete Business Management Platform</p></footer>
    </div>

    <script>
        let currentBusinessId = null;
        
        function formatTime(timestamp){
            if(!timestamp) return 'Just now';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            const now = new Date();
            const diff = Math.floor((now - date) / 1000 / 60);
            if(diff < 1) return 'Just now';
            if(diff < 60) return `${diff} minutes ago`;
            if(diff < 1440) return `${Math.floor(diff/60)} hours ago`;
            return date.toLocaleDateString();
        }
        
        function getNotificationIcon(type){
            if(type === 'sale') return '<div class="notification-icon sale"><i class="fas fa-chart-line"></i></div>';
            if(type === 'stock') return '<div class="notification-icon stock"><i class="fas fa-box"></i></div>';
            return '<div class="notification-icon system"><i class="fas fa-cog"></i></div>';
        }
        
        function renderNotification(notif){
            return `
                <div class="notification-item ${notif.read ? '' : 'unread'}" data-id="${notif.id}">
                    ${getNotificationIcon(notif.type)}
                    <div class="notification-content">
                        <div class="notification-title">${notif.title}</div>
                        <div class="notification-message">${notif.message}</div>
                        <div class="notification-time">${formatTime(notif.createdAt)}</div>
                    </div>
                    <div class="notification-actions">
                        ${!notif.read ? `<button class="btn-icon" onclick="markAsRead('${notif.id}')"><i class="fas fa-check"></i></button>` : ''}
                        <button class="btn-icon" onclick="deleteNotification('${notif.id}')"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `;
        }
        
        async function loadNotifications(filter = 'all'){
            if(!currentBusinessId) return;
            let query = db.collection('notifications').doc(currentBusinessId).collection('list').orderBy('createdAt', 'desc');
            const snapshot = await query.get();
            
            let notifications = [];
            snapshot.forEach(doc => notifications.push({id: doc.id, ...doc.data()}));
            
            if(filter === 'unread') notifications = notifications.filter(n => !n.read);
            if(filter === 'sales') notifications = notifications.filter(n => n.type === 'sale');
            if(filter === 'stock') notifications = notifications.filter(n => n.type === 'stock');
            if(filter === 'system') notifications = notifications.filter(n => n.type === 'system');
            
            const unreadCount = notifications.filter(n => !n.read).length;
            document.getElementById('unreadCount').innerHTML = unreadCount;
            document.getElementById('totalCount').innerHTML = notifications.length;
            document.getElementById('todayCount').innerHTML = notifications.filter(n => {
                const date = n.createdAt?.toDate?.() || new Date(n.createdAt);
                const today = new Date();
                return date.toDateString() === today.toDateString();
            }).length;
            
            const container = document.getElementById(`${filter}Notifications`);
            if(container){
                if(notifications.length === 0){
                    container.innerHTML = '<div style="text-align:center;padding:40px;color:#adb5bd;"><i class="fas fa-bell-slash"></i><p>No notifications</p></div>';
                } else {
                    container.innerHTML = notifications.map(renderNotification).join('');
                }
            }
            
            // Also update all tab if not the current filter
            if(filter !== 'all'){
                const allContainer = document.getElementById('allNotifications');
                const allSnapshot = await db.collection('notifications').doc(currentBusinessId).collection('list').orderBy('createdAt', 'desc').get();
                let allNotifs = [];
                allSnapshot.forEach(doc => allNotifs.push({id: doc.id, ...doc.data()}));
                allContainer.innerHTML = allNotifs.length === 0 ? '<div style="text-align:center;padding:40px;"><i class="fas fa-bell-slash"></i><p>No notifications</p></div>' : allNotifs.map(renderNotification).join('');
            }
        }
        
        window.markAsRead = async (id) => {
            await db.collection('notifications').doc(currentBusinessId).collection('list').doc(id).update({read: true, readAt: new Date()});
            loadNotifications(document.querySelector('.notif-tab.active').dataset.tab);
        };
        
        window.deleteNotification = async (id) => {
            await db.collection('notifications').doc(currentBusinessId).collection('list').doc(id).delete();
            loadNotifications(document.querySelector('.notif-tab.active').dataset.tab);
        };
        
        document.getElementById('markAllReadBtn').onclick = async () => {
            const snapshot = await db.collection('notifications').doc(currentBusinessId).collection('list').get();
            snapshot.forEach(async doc => {
                if(!doc.data().read){
                    await db.collection('notifications').doc(currentBusinessId).collection('list').doc(doc.id).update({read: true, readAt: new Date()});
                }
            });
            loadNotifications(document.querySelector('.notif-tab.active').dataset.tab);
        };
        
        // Tab switching
        document.querySelectorAll('.notif-tab').forEach(tab => {
            tab.onclick = () => {
                document.querySelectorAll('.notif-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(`tab-${tab.dataset.tab}`).classList.add('active');
                loadNotifications(tab.dataset.tab);
            };
        });
        
        auth.onAuthStateChanged(async(user)=>{
            if(!user){ window.location.href='/'; return; }
            const userDoc = await db.collection('users').doc(user.uid).get();
            currentBusinessId = userDoc.exists ? (userDoc.data().businessId || user.uid) : user.uid;
            await loadNotifications('all');
        });
        
        // Listen for new notifications via Event Bus
        if(window.eventBus){
            window.eventBus.subscribe('NEW_NOTIFICATION', () => loadNotifications(document.querySelector('.notif-tab.active').dataset.tab), 'Notifications');
        }
    </script>
</body>
</html>
