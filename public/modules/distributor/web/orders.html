<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="/core/pwa-init.js?v=1"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders - DIGIBIZ</title>
    <script>
        (function () {
            const MW_TRADING_BUSINESS_ID = 'YRMbB6aq4CMevSrLWkQvoVMtc8b2';
            const businessId =
                localStorage.getItem('currentBusinessId') ||
                sessionStorage.getItem('currentBusinessId') ||
                localStorage.getItem('selectedBusinessId') ||
                sessionStorage.getItem('selectedBusinessId') ||
                '';
            const isMWTrading = (businessId === MW_TRADING_BUSINESS_ID);
            if (!isMWTrading) {
                // other distributors unchanged
                window.location.replace('/modules/distributor/web/index.html?tab=approved');
                return;
            }

            // MW-only: pin canonical businessId so downstream queries hit the correct tenant.
            localStorage.setItem('currentBusinessId', MW_TRADING_BUSINESS_ID);
            sessionStorage.setItem('currentBusinessId', MW_TRADING_BUSINESS_ID);
            localStorage.setItem('selectedBusinessId', MW_TRADING_BUSINESS_ID);
            sessionStorage.setItem('selectedBusinessId', MW_TRADING_BUSINESS_ID);

            const sp = new URLSearchParams(window.location.search || '');
            const tab = sp.get('tab') || 'approved';
            const lorry = sp.get('lorry') || '';
            const out = new URL('/modules/distributor/web/index.html', window.location.origin);
            out.searchParams.set('tab', tab);
            out.searchParams.set('mwFix', '1');
            if (lorry) out.searchParams.set('lorry', lorry);
            window.location.replace(out.pathname + '?' + out.searchParams.toString());
        })();
    </script>
</head>
<body>
    <p style="font-family: system-ui, sans-serif; padding: 24px; color: #374151;">Redirecting to orders…</p>
</body>
</html>
