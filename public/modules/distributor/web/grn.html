<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="/core/pwa-init.js?v=1"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRN Product Entry - DIGIBIZ</title>
    <style>html.digibiz-sidebar-reserved body{margin-left:260px;}@media (max-width:768px){html.digibiz-sidebar-reserved body{margin-left:0;}}</style>
    <script>document.documentElement.classList.add('digibiz-sidebar-reserved');</script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="/core/firebase-init.js?v=61"></script>
    <script src="/core/dashboard-core.js?v=61"></script>
    <script src="/core/sidebar.js?v=69"></script>
    <style>
        *{box-sizing:border-box}
        body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f3f4f6}
        .wrap{padding:22px;max-width:980px}
        .card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;box-shadow:0 6px 20px rgba(0,0,0,.05)}
        h1{margin:0 0 6px;font-size:24px;color:#111827}
        .sub{margin:0 0 14px;color:#64748b;font-size:14px}
        .grid{display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));gap:12px}
        .full{grid-column:1/-1}
        label{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:6px}
        input{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;font-size:14px}
        .actions{margin-top:14px;display:flex;gap:10px;align-items:center}
        .btn{border:none;padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:600}
        .btn-save{background:#10b981;color:#fff}
        .msg{margin-top:10px;font-size:13px}
        .err{color:#b91c1c}
        .ok{color:#065f46}
        .history-card{margin-top:16px}
        .history-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
        .history-sub{margin:4px 0 0;color:#64748b;font-size:13px}
        .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:12px}
        .filters .fld{min-width:160px}
        .btn-lite{background:#eef2ff;color:#1e3a8a}
        .btn-ghost{background:#f3f4f6;color:#111827}
        .table-wrap{margin-top:12px;overflow:auto;border:1px solid #e5e7eb;border-radius:10px}
        table{width:100%;border-collapse:collapse;min-width:900px;background:#fff}
        th,td{padding:10px 12px;border-bottom:1px solid #e5e7eb;font-size:13px;text-align:left}
        thead th{background:#f9fafb;font-weight:700;color:#374151}
        td.num{text-align:right}
        tr.row-click{cursor:pointer}
        tr.row-click:hover{background:#f8fafc}
        .empty{padding:16px;color:#6b7280;font-size:13px}
        .hidden{display:none !important}
        .modal{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:40}
        .modal.open{display:flex}
        .modal-card{width:min(640px,100%);background:#fff;border-radius:14px;border:1px solid #e5e7eb;padding:16px}
        .modal-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
        .modal-title{margin:0;font-size:18px;color:#111827}
        .kv{display:grid;grid-template-columns:180px 1fr;gap:8px 10px;font-size:14px}
        .kv div:nth-child(odd){font-weight:600;color:#374151}
        .kv div:nth-child(even){color:#111827}
        @media (max-width:768px){.wrap{padding:14px}.grid{grid-template-columns:1fr}}
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <h1>GRN + Product Entry</h1>
        <p class="sub">Create/update product details and record GRN in one step.</p>
        <div class="grid">
            <div>
                <label for="supplierName">Supplier Name *</label>
                <input id="supplierName" type="text" placeholder="Supplier name">
            </div>
            <div>
                <label for="grnDate">Date *</label>
                <input id="grnDate" type="date">
            </div>

            <div class="full">
                <label for="productName">Product Name *</label>
                <input id="productName" type="text" placeholder="Product name">
            </div>
            <div>
                <label for="category">Category</label>
                <input id="category" type="text" placeholder="Category">
            </div>
            <div>
                <label for="brand">Brand</label>
                <input id="brand" type="text" placeholder="Brand">
            </div>
            <div>
                <label for="barcode">Barcode</label>
                <input id="barcode" type="text" placeholder="Barcode">
            </div>
            <div>
                <label for="sellingPrice">Selling Price *</label>
                <input id="sellingPrice" type="number" min="0" step="0.01" placeholder="0.00">
            </div>
            <div>
                <label for="buyingPrice">Buying Price *</label>
                <input id="buyingPrice" type="number" min="0" step="0.01" placeholder="0.00">
            </div>
            <div>
                <label for="currentStock">Current Stock</label>
                <input id="currentStock" type="number" min="0" step="1" value="0">
            </div>
            <div>
                <label for="minStockLevel">Min Stock Level</label>
                <input id="minStockLevel" type="number" min="0" step="1" value="10">
            </div>
            <div class="full">
                <label for="receivedQty">Received Quantity</label>
                <input id="receivedQty" type="number" min="0" step="1" value="0">
            </div>
        </div>
        <div class="actions">
            <button id="saveBtn" class="btn btn-save">Save GRN</button>
        </div>
        <div id="msg" class="msg"></div>
    </div>
    <div id="historySection" class="card history-card hidden">
        <div class="history-head">
            <div>
                <h2 style="margin:0;font-size:20px;color:#111827;">GRN List / History</h2>
                <p class="history-sub">Newest records first. Default range is last 90 days.</p>
            </div>
        </div>
        <div class="filters">
            <div class="fld">
                <label for="filterFromDate">From Date</label>
                <input id="filterFromDate" type="date">
            </div>
            <div class="fld">
                <label for="filterToDate">To Date</label>
                <input id="filterToDate" type="date">
            </div>
            <button id="last3MonthsBtn" class="btn btn-lite" type="button">Last 3 Months</button>
            <button id="showAllBtn" class="btn btn-ghost" type="button">Show All</button>
            <button id="applyFilterBtn" class="btn btn-save" type="button">Apply Filter</button>
        </div>
        <div id="historyMeta" class="msg"></div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Supplier</th>
                        <th>Product</th>
                        <th class="num">Quantity</th>
                        <th class="num">Buying Price</th>
                        <th class="num">Selling Price</th>
                        <th class="num">Total</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="historyBody"></tbody>
            </table>
            <div id="historyEmpty" class="empty hidden">No GRN records for selected range.</div>
        </div>
    </div>
</div>

<div id="grnDetailModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="grnDetailTitle">
    <div class="modal-card">
        <div class="modal-top">
            <h3 id="grnDetailTitle" class="modal-title">GRN Details</h3>
            <button id="closeGrnModalBtn" class="btn btn-ghost" type="button">Close</button>
        </div>
        <div id="grnDetailBody" class="kv"></div>
    </div>
</div>

<script>
(function () {
    var currentBusinessId = '';
    var currentUser = null;
    var historyRows = [];
    var visibleRows = [];
    var bdkTenantEmail = 'bdkariyapperuma@gmail.com';
    var grnHistoryUnsub = null;
    var editingGrnId = '';

    function showMsg(text, kind) {
        var el = document.getElementById('msg');
        el.className = 'msg ' + (kind === 'err' ? 'err' : kind === 'ok' ? 'ok' : '');
        el.textContent = text || '';
    }

    function normalizeText(v) { return String(v || '').trim(); }
    function esc(v) {
        return String(v == null ? '' : v)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/"/g, '&quot;');
    }
    function toNum(v) { return Number(v) || 0; }
    function asDateOnly(v) {
        var d = new Date(v);
        if (isNaN(d.getTime())) return null;
        d.setHours(0, 0, 0, 0);
        return d;
    }
    function fmtMoney(v) {
        return 'Rs ' + toNum(v).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function fmtDate(v) {
        var d = asDateOnly(v);
        return d ? d.toISOString().slice(0, 10) : '—';
    }
    function isBdkTenant() {
        return normalizeText(currentUser && currentUser.email).toLowerCase() === bdkTenantEmail;
    }
    function setDefaultRangeLast90Days() {
        var to = new Date();
        to.setHours(0, 0, 0, 0);
        var from = new Date(to);
        from.setDate(from.getDate() - 90);
        document.getElementById('filterFromDate').value = from.toISOString().slice(0, 10);
        document.getElementById('filterToDate').value = to.toISOString().slice(0, 10);
    }
    function renderHistoryMeta(text, kind) {
        var el = document.getElementById('historyMeta');
        if (!el) return;
        el.className = 'msg ' + (kind === 'err' ? 'err' : kind === 'ok' ? 'ok' : '');
        el.textContent = text || '';
    }
    function applyHistoryFilter() {
        var fromRaw = normalizeText(document.getElementById('filterFromDate').value);
        var toRaw = normalizeText(document.getElementById('filterToDate').value);
        var from = fromRaw ? asDateOnly(fromRaw) : null;
        var to = toRaw ? asDateOnly(toRaw) : null;
        if (to) to.setHours(23, 59, 59, 999);
        visibleRows = historyRows.filter(function (r) {
            var d = asDateOnly(r.date || r.dateText || (r.createdAt && r.createdAt.toDate ? r.createdAt.toDate() : r.createdAt));
            if (!d) return true;
            if (from && d < from) return false;
            if (to && d > to) return false;
            return true;
        });
        renderHistoryTable();
    }
    function renderHistoryTable() {
        var body = document.getElementById('historyBody');
        var empty = document.getElementById('historyEmpty');
        if (!body || !empty) return;
        if (!visibleRows.length) {
            body.innerHTML = '';
            empty.classList.remove('hidden');
            renderHistoryMeta('0 records', '');
            return;
        }
        empty.classList.add('hidden');
        body.innerHTML = visibleRows.map(function (r, idx) {
            return '<tr class="row-click" data-row="' + idx + '">' +
                '<td>' + fmtDate(r.date || r.dateText || (r.createdAt && r.createdAt.toDate ? r.createdAt.toDate() : r.createdAt)) + '</td>' +
                '<td>' + esc(normalizeText(r.supplier || r.supplierName || '—')) + '</td>' +
                '<td>' + esc(normalizeText(r.productName || '—')) + '</td>' +
                '<td class="num">' + toNum(r.quantity).toLocaleString() + '</td>' +
                '<td class="num">' + fmtMoney(r.buyingPrice) + '</td>' +
                '<td class="num">' + fmtMoney(r.sellingPrice) + '</td>' +
                '<td class="num">' + fmtMoney(r.total != null ? r.total : r.lineTotal) + '</td>' +
                '<td><button class="btn btn-ghost" type="button" data-action="edit" data-id="' + esc(r.id || '') + '">Edit</button> <button class="btn btn-ghost" type="button" data-action="delete" data-id="' + esc(r.id || '') + '">Delete</button></td>' +
                '</tr>';
        }).join('');
        renderHistoryMeta(String(visibleRows.length) + ' records', 'ok');
    }
    function startEditGrn(id) {
        var row = visibleRows.find(function (x) { return x.id === id; }) || historyRows.find(function (x) { return x.id === id; });
        if (!row) return;
        editingGrnId = id;
        document.getElementById('supplierName').value = normalizeText(row.supplier || row.supplierName);
        document.getElementById('grnDate').value = fmtDate(row.date || row.dateText || (row.createdAt && row.createdAt.toDate ? row.createdAt.toDate() : row.createdAt));
        document.getElementById('productName').value = normalizeText(row.productName);
        document.getElementById('category').value = normalizeText(row.category);
        document.getElementById('brand').value = normalizeText(row.brand);
        document.getElementById('barcode').value = normalizeText(row.barcode);
        document.getElementById('sellingPrice').value = String(toNum(row.sellingPrice));
        document.getElementById('buyingPrice').value = String(toNum(row.buyingPrice));
        document.getElementById('receivedQty').value = String(toNum(row.quantity));
        showMsg('Editing GRN row. Click Save GRN to update.', '');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    async function softDeleteGrn(id) {
        if (!confirm('Soft delete this GRN record?')) return;
        await db.collection('grn_history').doc(id).set({
            isActive: false,
            deletedAt: new Date(),
            updatedAt: new Date()
        }, { merge: true });
        await loadGrnList();
    }
    function openGrnDetailsModal(row) {
        var modal = document.getElementById('grnDetailModal');
        var body = document.getElementById('grnDetailBody');
        if (!modal || !body || !row) return;
        var allFields = [
            ['GRN ID', row.grnId || row.id || '—'],
            ['Date', fmtDate(row.date || row.dateText || (row.createdAt && row.createdAt.toDate ? row.createdAt.toDate() : row.createdAt))],
            ['Supplier', row.supplier || row.supplierName || '—'],
            ['Product ID', row.productId || '—'],
            ['Product', row.productName || '—'],
            ['Quantity', toNum(row.quantity).toLocaleString()],
            ['Buying Price', fmtMoney(row.buyingPrice)],
            ['Selling Price', fmtMoney(row.sellingPrice)],
            ['Total', fmtMoney(row.total != null ? row.total : row.lineTotal)],
            ['Business ID', row.businessId || '—'],
            ['Created At', row.createdAt && row.createdAt.toDate ? row.createdAt.toDate().toLocaleString() : (row.createdAt ? String(row.createdAt) : '—')]
        ];
        body.innerHTML = allFields.map(function (pair) {
            return '<div>' + esc(pair[0]) + '</div><div>' + esc(normalizeText(pair[1])) + '</div>';
        }).join('');
        modal.classList.add('open');
    }
    function closeGrnDetailsModal() {
        var modal = document.getElementById('grnDetailModal');
        if (modal) modal.classList.remove('open');
    }
    async function loadGrnList() {
        if (!isBdkTenant()) return;
        renderHistoryMeta('Loading history...', '');
        try {
            var snap = await db.collection('grn_history')
                .where('businessId', '==', currentBusinessId)
                .limit(1200)
                .get();
            historyRows = snap.docs.map(function (doc) {
                var d = doc.data() || {};
                d.id = doc.id;
                return d;
            }).filter(function (d) { return d.isActive !== false; });
            historyRows.sort(function (a, b) {
                var ad = new Date(a.date || a.dateText || (a.createdAt && a.createdAt.toDate ? a.createdAt.toDate() : a.createdAt) || 0).getTime();
                var bd = new Date(b.date || b.dateText || (b.createdAt && b.createdAt.toDate ? b.createdAt.toDate() : b.createdAt) || 0).getTime();
                return bd - ad;
            });
            applyHistoryFilter();
        } catch (e) {
            console.error('Failed to load GRN history', e);
            renderHistoryMeta('Failed to load history: ' + (e.message || String(e)), 'err');
        }
    }
    async function loadGrnHistory() { return loadGrnList(); }
    function attachGrnListRealtime() {
        if (!isBdkTenant() || !currentBusinessId) return;
        if (typeof grnHistoryUnsub === 'function') {
            try { grnHistoryUnsub(); } catch (eUn) {}
            grnHistoryUnsub = null;
        }
        grnHistoryUnsub = db.collection('grn_history')
            .where('businessId', '==', currentBusinessId)
            .limit(1200)
            .onSnapshot(function (snap) {
                historyRows = snap.docs.map(function (doc) {
                    var d = doc.data() || {};
                    d.id = doc.id;
                    return d;
                }).filter(function (d) { return d.isActive !== false; });
                historyRows.sort(function (a, b) {
                    var ad = new Date(a.date || a.dateText || (a.createdAt && a.createdAt.toDate ? a.createdAt.toDate() : a.createdAt) || 0).getTime();
                    var bd = new Date(b.date || b.dateText || (b.createdAt && b.createdAt.toDate ? b.createdAt.toDate() : b.createdAt) || 0).getTime();
                    return bd - ad;
                });
                applyHistoryFilter();
            }, function (err) {
                console.error('GRN realtime listener failed', err);
                renderHistoryMeta('Realtime sync failed: ' + (err.message || String(err)), 'err');
            });
    }

    async function resolveExistingProductByName(name) {
        var n = normalizeText(name).toLowerCase();
        var snap = await db.collection('products').where('businessId', '==', currentBusinessId).limit(500).get();
        var found = null;
        snap.forEach(function (d) {
            if (found) return;
            var x = d.data() || {};
            if (normalizeText(x.name).toLowerCase() === n) found = { id: d.id, data: x };
        });
        return found;
    }

    async function updateSupplierBalanceIfExists(supplierName, amount) {
        if (!supplierName || !amount) return;
        var sSnap = await db.collection('suppliers').where('businessId', '==', currentBusinessId).limit(500).get();
        var hit = null;
        sSnap.forEach(function (d) {
            if (hit) return;
            var x = d.data() || {};
            if (normalizeText(x.name).toLowerCase() === normalizeText(supplierName).toLowerCase()) {
                hit = { id: d.id, data: x };
            }
        });
        if (!hit) return;
        var cur = Number(hit.data.balance != null ? hit.data.balance : hit.data.outstandingBalance) || 0;
        var next = cur + amount;
        await db.collection('suppliers').doc(hit.id).set({
            balance: next,
            outstandingBalance: next,
            updatedAt: new Date()
        }, { merge: true });
        return { supplierId: hit.id, outstandingBalance: next };
    }

    async function upsertAccountBalance(accountName, delta, when) {
        var id = String(accountName || '').trim();
        if (!id) return;
        var ref = db.collection('account_balances').doc(currentBusinessId + '__' + id.replace(/\s+/g, '_').toUpperCase());
        await db.runTransaction(async function (tx) {
            var snap = await tx.get(ref);
            var cur = snap.exists ? (Number((snap.data() || {}).balance) || 0) : 0;
            var next = cur + (Number(delta) || 0);
            tx.set(ref, {
                businessId: currentBusinessId,
                account: id,
                balance: next,
                updatedAt: when || new Date()
            }, { merge: true });
        });
    }

    async function createAccountingEntries(grnId, grnDate, supplierName, supplierId, amount, qty, buyingPrice, productId, productName, when) {
        var refText = 'GRN/' + String(grnId || '').trim();
        var postingDate = grnDate || new Date().toISOString().slice(0, 10);
        var now = when || new Date();
        await Promise.all([
            db.collection('supplier_ledger').add({
                supplierId: supplierId || '',
                supplierName: supplierName || '',
                amount: Number(amount) || 0,
                type: 'credit',
                reference: refText,
                date: postingDate,
                businessId: currentBusinessId,
                createdAt: now
            }),
            db.collection('journal_entries').add({
                account: 'Purchases',
                amount: Number(amount) || 0,
                reference: refText,
                date: postingDate,
                businessId: currentBusinessId,
                entryType: 'debit',
                createdAt: now,
                meta: {
                    productId: productId || '',
                    productName: productName || '',
                    quantity: Number(qty) || 0,
                    buyingPrice: Number(buyingPrice) || 0
                }
            }),
            db.collection('journal_entries').add({
                account: 'Inventory',
                amount: Number(amount) || 0,
                reference: refText,
                date: postingDate,
                businessId: currentBusinessId,
                entryType: 'debit',
                createdAt: now
            })
        ]);
        await Promise.all([
            upsertAccountBalance('Purchases', amount, now),
            upsertAccountBalance('Inventory', amount, now),
            upsertAccountBalance('SupplierOutstanding', amount, now),
            upsertAccountBalance('StockValue', amount, now)
        ]);
    }

    async function saveGrn() {
        var supplierName = normalizeText(document.getElementById('supplierName').value);
        var grnDate = normalizeText(document.getElementById('grnDate').value);
        var productName = normalizeText(document.getElementById('productName').value);
        var category = normalizeText(document.getElementById('category').value);
        var brand = normalizeText(document.getElementById('brand').value);
        var barcode = normalizeText(document.getElementById('barcode').value);
        var sellingPrice = Number(document.getElementById('sellingPrice').value);
        var buyingPrice = Number(document.getElementById('buyingPrice').value);
        var currentStockInput = Math.max(0, parseInt(document.getElementById('currentStock').value, 10) || 0);
        var minStockLevel = Math.max(0, parseInt(document.getElementById('minStockLevel').value, 10) || 0);
        var receivedQty = Math.max(0, parseInt(document.getElementById('receivedQty').value, 10) || 0);

        if (!supplierName) return showMsg('Supplier Name is required.', 'err');
        if (!grnDate) return showMsg('Date is required.', 'err');
        if (!productName) return showMsg('Product Name is required.', 'err');
        if (isNaN(sellingPrice) || sellingPrice < 0) return showMsg('Selling Price is required.', 'err');
        if (isNaN(buyingPrice) || buyingPrice < 0) return showMsg('Buying Price is required.', 'err');

        var btn = document.getElementById('saveBtn');
        btn.disabled = true;
        showMsg('Saving GRN...', '');

        try {
            var now = new Date();
            var existing = await resolveExistingProductByName(productName);
            var productId = existing ? existing.id : db.collection('products').doc().id;
            var oldStock = existing ? (Number(existing.data.currentStock != null ? existing.data.currentStock : existing.data.stock) || 0) : currentStockInput;
            var newStock = oldStock + receivedQty;
            var productPayload = {
                businessId: currentBusinessId,
                name: productName,
                category: category,
                brand: brand,
                barcode: barcode,
                unitPrice: sellingPrice,
                buyingPrice: buyingPrice,
                lastBuyingPrice: buyingPrice,
                currentStock: newStock,
                stock: newStock,
                minStockLevel: minStockLevel,
                updatedAt: now
            };
            if (!existing) productPayload.createdAt = now;

            await db.collection('products').doc(productId).set(productPayload, { merge: true });

            var lineTotal = buyingPrice * receivedQty;
            var grnDocRef = editingGrnId ? db.collection('grn_history').doc(editingGrnId) : db.collection('grn_history').doc();
            await grnDocRef.set({
                grnId: grnDocRef.id,
                businessId: currentBusinessId,
                supplier: supplierName,
                supplierName: supplierName,
                date: grnDate,
                dateText: grnDate,
                productId: productId,
                productName: productName,
                category: category,
                brand: brand,
                barcode: barcode,
                quantity: receivedQty,
                buyingPrice: buyingPrice,
                sellingPrice: sellingPrice,
                total: lineTotal,
                oldStock: oldStock,
                newStock: newStock,
                lineTotal: lineTotal,
                createdAt: now,
                createdBy: currentUser ? currentUser.uid : ''
            });
            editingGrnId = '';

            var supplierUpdate = await updateSupplierBalanceIfExists(supplierName, lineTotal);
            await createAccountingEntries(
                grnDocRef.id,
                grnDate,
                supplierName,
                supplierUpdate && supplierUpdate.supplierId ? supplierUpdate.supplierId : '',
                lineTotal,
                receivedQty,
                buyingPrice,
                productId,
                productName,
                now
            );
            showMsg('GRN saved. Product created/updated successfully.', 'ok');
            document.getElementById('currentStock').value = String(newStock);
            document.getElementById('receivedQty').value = '0';
            await loadGrnList();
        } catch (e) {
            console.error(e);
            showMsg('Save failed: ' + (e.message || String(e)), 'err');
        } finally {
            btn.disabled = false;
        }
    }

    firebase.auth().onAuthStateChanged(async function (user) {
        if (!user) {
            window.location.href = '/auth/login.html';
            return;
        }
        currentUser = user;
        if (window.dashboardCore && typeof window.dashboardCore.getContext === 'function') {
            var ctx = await window.dashboardCore.getContext(user);
            currentBusinessId = ctx && ctx.businessId ? ctx.businessId : '';
        }
        if (!currentBusinessId) {
            currentBusinessId = localStorage.getItem('currentBusinessId') || sessionStorage.getItem('currentBusinessId') || '';
        }
        if (!currentBusinessId) {
            showMsg('No business selected. Select business first.', 'err');
            return;
        }
        localStorage.setItem('currentBusinessId', currentBusinessId);
        sessionStorage.setItem('currentBusinessId', currentBusinessId);
        localStorage.setItem('currentBusinessType', 'distributor');
        sessionStorage.setItem('currentBusinessType', 'distributor');
        document.getElementById('grnDate').value = new Date().toISOString().slice(0, 10);
        if (isBdkTenant()) {
            document.getElementById('historySection').classList.remove('hidden');
            setDefaultRangeLast90Days();
            await loadGrnList();
            attachGrnListRealtime();
        }
    });

    document.getElementById('saveBtn').addEventListener('click', saveGrn);
    document.getElementById('applyFilterBtn').addEventListener('click', applyHistoryFilter);
    document.getElementById('last3MonthsBtn').addEventListener('click', function () {
        setDefaultRangeLast90Days();
        applyHistoryFilter();
    });
    document.getElementById('showAllBtn').addEventListener('click', function () {
        document.getElementById('filterFromDate').value = '';
        document.getElementById('filterToDate').value = '';
        applyHistoryFilter();
    });
    document.getElementById('historyBody').addEventListener('click', function (ev) {
        var actionBtn = ev.target && ev.target.closest ? ev.target.closest('button[data-action]') : null;
        if (actionBtn) {
            var act = actionBtn.getAttribute('data-action');
            var id = actionBtn.getAttribute('data-id');
            if (act === 'edit') { startEditGrn(id); return; }
            if (act === 'delete') { softDeleteGrn(id); return; }
        }
        var tr = ev.target && ev.target.closest ? ev.target.closest('tr[data-row]') : null;
        if (!tr) return;
        var idx = parseInt(tr.getAttribute('data-row'), 10);
        if (isNaN(idx) || !visibleRows[idx]) return;
        openGrnDetailsModal(visibleRows[idx]);
    });
    document.getElementById('closeGrnModalBtn').addEventListener('click', closeGrnDetailsModal);
    document.getElementById('grnDetailModal').addEventListener('click', function (ev) {
        if (ev.target && ev.target.id === 'grnDetailModal') closeGrnDetailsModal();
    });
})();
</script>
</body>
</html>
