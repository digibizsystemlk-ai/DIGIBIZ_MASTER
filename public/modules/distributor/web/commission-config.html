<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="/core/pwa-init.js?v=1"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commission Config - DIGIBIZ</title>
    <style>html.digibiz-sidebar-reserved body{margin-left:260px;}@media(max-width:768px){html.digibiz-sidebar-reserved body{margin-left:0;}}</style>
    <script>document.documentElement.classList.add('digibiz-sidebar-reserved');</script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="/core/firebase-init.js?v=100"></script>
    <script src="/scripts/admin-impersonation.js?v=100"></script>
    <script src="/core/dashboard-core.js?v=46"></script>
    <script src="/core/distributor-lorry-stock.js?v=1"></script>
    <script src="/core/auth-roles.js?v=120"></script>
    <script src="/core/sidebar.js?v=1020"></script>
    <script src="/modules/distributor/web/commission-config.js?v=1"></script>
    <style>
        body{font-family:Inter,system-ui,sans-serif;background:#f3f4f6;margin:0;}
        .wrap{padding:22px;}
        .card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:16px;margin-bottom:12px;}
        .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;}
        input,select,textarea,button{font:inherit;}
        input,select,textarea{width:100%;padding:8px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;}
        button{padding:8px 12px;border:0;border-radius:8px;cursor:pointer;}
        .btn{background:#10b981;color:#fff;}
        .btn.alt{background:#e5e7eb;color:#111827;}
        table{width:100%;border-collapse:collapse;}
        th,td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:13px;}
        th{background:#f9fafb;}
        .muted{font-size:12px;color:#6b7280;}
    </style>
</head>
<body>
<div id="sidebar-container"></div>
<div class="wrap">
    <div class="card">
        <h2 style="margin:0 0 6px;">Rep Commission Configuration</h2>
        <p class="muted" id="gateMsg">Set percentage or tiered commission per rep.</p>
    </div>
    <div class="card" id="cfgCard">
        <div class="grid">
            <div><label>Rep</label><select id="repId"></select></div>
            <div><label>Commission Type</label><select id="type"><option value="percentage">percentage</option><option value="tiered">tiered</option></select></div>
            <div><label>Percentage Value (%)</label><input id="percentageValue" type="number" min="0" step="0.01"></div>
            <div style="grid-column:1/-1;"><label>Tiered Rules (JSON array)</label><textarea id="tiers" rows="4" placeholder='[{"threshold":100000,"rate":5},{"threshold":999999999,"rate":7}]'></textarea></div>
        </div>
        <div style="display:flex;gap:8px;margin-top:10px;">
            <button class="btn" id="btnSave">Save Config</button>
            <button class="btn alt" id="btnReset">Reset</button>
        </div>
    </div>
    <div class="card">
        <table>
            <thead><tr><th>Rep</th><th>Type</th><th>Percentage</th><th>Tiers</th><th>Updated</th><th>Actions</th></tr></thead>
            <tbody id="rows"><tr><td colspan="6">Loading...</td></tr></tbody>
        </table>
    </div>
</div>
</body>
</html>
