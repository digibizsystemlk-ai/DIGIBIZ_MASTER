<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="/core/pwa-init.js?v=1"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Appointments - DIGIBIZ Tire Center</title>
    <style>html.digibiz-sidebar-reserved body{margin-left:260px;}@media (max-width:768px){html.digibiz-sidebar-reserved body{margin-left:0;}}</style>
    <script>document.documentElement.classList.add('digibiz-sidebar-reserved');</script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
    
    <script src="/core/firebase-init.js?v=100"></script>
    <script src="/scripts/admin-impersonation.js?v=100"></script>
    <script src="../../core/event-validation.js?v=3"></script>
    <script src="../../core/event-bus.js?v=3"></script>
    <script src="../../core/accounts-core.js?v=3"></script>
    <script src="../../core/auth-roles.js?v=120"></script>
    <script src="../../core/business-types.js?v=4"></script>
    <script src="../../core/dashboard-core.js?v=3"></script>
    <script src="../../core/subscription-manager.js?v=3"></script>
    <script src="../../core/sidebar.js?v=1030"></script>
    
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',sans-serif;background:#f8fafc;color:#1e293b;padding:30px;}
        
        .header-section{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;}
        .header-title h2{font-size:24px;font-weight:800;color:#0f172a;}
        .header-title p{font-size:14px;color:#64748b;margin-top:4px;}
        
        .btn-primary{background:#3b82f6;color:white;border:none;padding:12px 24px;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 4px 12px rgba(59,130,246,0.25);transition:all 0.2s;}
        .btn-primary:hover{background:#2563eb;transform:translateY(-1px);}
        .btn-outline{background:white;border:1px solid #cbd5e1;color:#475569;padding:10px 20px;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;}
        .btn-outline:hover{background:#f8fafc;}
        .btn-danger{background:#ef4444;color:white;border:none;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:12px;}
        .btn-danger:hover{background:#dc2626;}

        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:30px;}
        .stat-card{background:white;border-radius:16px;padding:20px;border:1px solid #e2e8f0;display:flex;flex-direction:column;}
        .stat-card .label{font-size:13px;font-weight:600;color:#64748b;}
        .stat-card .value{font-size:28px;font-weight:800;color:#0f172a;margin-top:8px;}
        
        .filter-bar{background:white;border-radius:16px;padding:15px 20px;margin-bottom:25px;display:flex;gap:15px;flex-wrap:wrap;align-items:center;border:1px solid #e2e8f0;}
        .filter-bar input,.filter-bar select{flex:1;min-width:150px;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px;}
        .filter-bar button{background:#3b82f6;color:white;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;}
        
        .table-container{background:white;border-radius:20px;border:1px solid #e2e8f0;overflow:hidden;box-shadow:0 4px 6px -1px rgba(0,0,0,0.05);}
        .data-table{width:100%;border-collapse:collapse;}
        .data-table th,.data-table td{padding:14px 18px;text-align:left;border-bottom:1px solid #e2e8f0;font-size:13px;}
        .data-table th{background:#f8fafc;font-weight:600;color:#475569;}
        .data-table tr:hover{background:#f8fafc;}
        
        .badge{padding:4px 8px;border-radius:6px;font-size:11px;font-weight:700;}
        .badge-pending{background:#fef3c7;color:#d97706;}
        .badge-completed{background:#d1fae5;color:#059669;}
        .badge-cancelled{background:#fee2e2;color:#dc2626;}
        
        /* Modal Styles */
        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:2000;justify-content:center;align-items:center;}
        .modal-content{background:white;border-radius:24px;padding:32px;width:90%;max-width:500px;}
        .modal-content label{display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:5px;}
        .modal-content input,.modal-content select,.modal-content textarea{width:100%;padding:12px;margin-bottom:15px;border:1px solid #cbd5e1;border-radius:10px;font-size:13.5px;}
        .modal-buttons{display:flex;gap:12px;justify-content:flex-end;margin-top:15px;}
        
        .toast{position:fixed;bottom:20px;right:20px;background:#1e293b;color:white;padding:12px 24px;border-radius:10px;z-index:3000;box-shadow:0 10px 15px -3px rgba(0,0,0,0.1);display:none;font-weight:500;font-size:13.5px;}
        .toast.error{background:#ef4444;}
    </style>
</head>
<body>
    <div class="header-section">
        <div class="header-title">
            <h2>Service Appointments</h2>
            <p>Manage wheel alignments, tire replacements, and service slots</p>
        </div>
        <button class="btn-primary" onclick="openAddModal()">
            <i class="fas fa-plus"></i> Book Appointment
        </button>
    </div>
    
    <div class="stats-grid">
        <div class="stat-card">
            <span class="label">Total Bookings</span>
            <span class="value" id="statTotal">0</span>
        </div>
        <div class="stat-card">
            <span class="label">Pending</span>
            <span class="value" id="statPending" style="color:#d97706;">0</span>
        </div>
        <div class="stat-card">
            <span class="label">Completed</span>
            <span class="value" id="statCompleted" style="color:#059669;">0</span>
        </div>
        <div class="stat-card">
            <span class="label">Cancelled</span>
            <span class="value" id="statCancelled" style="color:#dc2626;">0</span>
        </div>
    </div>
    
    <div class="filter-bar">
        <input type="text" id="searchInput" placeholder="Search by name, phone or vehicle...">
        <select id="statusFilter">
            <option value="all">All Statuses</option>
            <option value="pending">Pending</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
        </select>
        <input type="date" id="dateFilter">
        <button onclick="clearFilters()" class="btn-outline" style="padding:10px 15px;">Clear</button>
    </div>
    
    <div class="table-container">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Customer</th>
                    <th>Phone</th>
                    <th>Vehicle No.</th>
                    <th>Service</th>
                    <th>Date</th>
                    <th>Time Slot</th>
                    <th>Status</th>
                    <th style="width:230px;">Actions</th>
                </tr>
            </thead>
            <tbody id="appointmentsList">
                <tr><td colspan="8" style="text-align:center;padding:40px;color:#64748b;">Loading appointments...</td></tr>
            </tbody>
        </table>
    </div>
    
    <!-- Book/Edit Modal -->
    <div id="appointmentModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle" style="margin-bottom:20px;font-size:18px;font-weight:700;">Book New Appointment</h3>
            
            <label for="custName">Customer Name</label>
            <input type="text" id="custName" placeholder="Enter customer name">
            
            <label for="custPhone">Customer Phone</label>
            <input type="text" id="custPhone" placeholder="Enter phone number">
            
            <label for="vehicleNo">Vehicle Number</label>
            <input type="text" id="vehicleNo" placeholder="Enter vehicle number (e.g. WP CAA-1234)">
            
            <label for="serviceSelect">Service Type</label>
            <select id="serviceSelect">
                <option value="">Select a service...</option>
            </select>
            
            <label for="appointmentDate">Date</label>
            <input type="date" id="appointmentDate">
            
            <label for="timeSlot">Time Slot</label>
            <select id="timeSlot">
                <option value="08:00 AM - 09:00 AM">08:00 AM - 09:00 AM</option>
                <option value="09:00 AM - 10:00 AM">09:00 AM - 10:00 AM</option>
                <option value="10:00 AM - 11:00 AM">10:00 AM - 11:00 AM</option>
                <option value="11:00 AM - 12:00 PM">11:00 AM - 12:00 PM</option>
                <option value="12:00 PM - 01:00 PM">12:00 PM - 01:00 PM</option>
                <option value="01:00 PM - 02:00 PM">01:00 PM - 02:00 PM</option>
                <option value="02:00 PM - 03:00 PM">02:00 PM - 03:00 PM</option>
                <option value="03:00 PM - 04:00 PM">03:00 PM - 04:00 PM</option>
                <option value="04:00 PM - 05:00 PM">04:00 PM - 05:00 PM</option>
            </select>
            
            <label for="notes">Notes</label>
            <textarea id="notes" placeholder="Optional notes (e.g. Wheel alignment and balancing)" rows="3" style="resize:none;"></textarea>
            
            <div class="modal-buttons">
                <button class="btn-outline" id="closeModalBtn">Cancel</button>
                <button class="btn-primary" id="saveAppointmentBtn">Save Booking</button>
            </div>
        </div>
    </div>
    
    <div id="toast" class="toast"></div>
    
    <script>
        let appointments = [];
        let services = [];
        let currentBusinessId = '';
        let editingId = null;
        
        function showToast(message, isError = false) {
            const t = document.getElementById('toast');
            t.textContent = message;
            t.className = 'toast' + (isError ? ' error' : '');
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }
        
        async function getBusinessContext() {
            if (window.Sidebar && typeof window.Sidebar.getBusinessContext === 'function') {
                return await window.Sidebar.getBusinessContext();
            }
            const user = firebase.auth().currentUser;
            return { businessId: user ? user.uid : null };
        }
        
        async function loadServices() {
            try {
                const snap = await db.collection('products').doc(currentBusinessId).collection('list')
                                   .where('isService', '==', true)
                                   .get();
                services = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                const select = document.getElementById('serviceSelect');
                select.innerHTML = '<option value="">Select a service...</option>';
                services.forEach(s => {
                    select.innerHTML += `<option value="${s.name}">${s.name} (Rs. ${s.price})</option>`;
                });
            } catch (e) {
                console.warn('Failed to load services:', e);
            }
        }
        
        async function loadAppointments() {
            try {
                const snap = await db.collection('appointments').doc(currentBusinessId).collection('list')
                                   .orderBy('createdAt', 'desc')
                                   .get();
                appointments = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                applyFilters();
                updateStats();
            } catch (e) {
                console.error(e);
                showToast('Failed to load appointments', true);
            }
        }
        
        function updateStats() {
            document.getElementById('statTotal').textContent = appointments.length;
            document.getElementById('statPending').textContent = appointments.filter(a => a.status === 'pending').length;
            document.getElementById('statCompleted').textContent = appointments.filter(a => a.status === 'completed').length;
            document.getElementById('statCancelled').textContent = appointments.filter(a => a.status === 'cancelled').length;
        }
        
        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const status = document.getElementById('statusFilter').value;
            const date = document.getElementById('dateFilter').value;
            
            const filtered = appointments.filter(a => {
                const matchesSearch = (a.customerName || '').toLowerCase().includes(search) || 
                                      (a.customerPhone || '').includes(search) || 
                                      (a.vehicleNo || '').toLowerCase().includes(search);
                const matchesStatus = status === 'all' || a.status === status;
                const matchesDate = !date || a.date === date;
                
                return matchesSearch && matchesStatus && matchesDate;
            });
            
            renderAppointments(filtered);
        }
        
        function renderAppointments(list) {
            const tbody = document.getElementById('appointmentsList');
            if (list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:40px;color:#64748b;">No appointments found.</td></tr>';
                return;
            }
            
            tbody.innerHTML = list.map(a => {
                const statusBadge = `<span class="badge badge-${a.status}">${a.status.toUpperCase()}</span>`;
                return `
                <tr>
                    <td><strong>${a.customerName}</strong></td>
                    <td>${a.customerPhone}</td>
                    <td><code>${a.vehicleNo || '-'}</code></td>
                    <td>${a.serviceName}</td>
                    <td>${a.date}</td>
                    <td>${a.timeSlot}</td>
                    <td>${statusBadge}</td>
                    <td>
                        <button class="btn-outline" onclick="editAppointment('${a.id}')" style="padding:6px 12px;margin-right:5px;"><i class="fas fa-edit"></i></button>
                        ${a.status === 'pending' ? `
                            <button class="btn-outline" onclick="changeStatus('${a.id}', 'completed')" style="padding:6px 12px;color:#059669;border-color:#d1fae5;background:#f0fdf4;margin-right:5px;"><i class="fas fa-check"></i></button>
                            <button class="btn-danger" onclick="changeStatus('${a.id}', 'cancelled')" style="padding:6px 12px;"><i class="fas fa-times"></i></button>
                        ` : ''}
                    </td>
                </tr>
                `;
            }).join('');
        }
        
        function openAddModal() {
            editingId = null;
            document.getElementById('modalTitle').textContent = 'Book New Appointment';
            document.getElementById('custName').value = '';
            document.getElementById('custPhone').value = '';
            document.getElementById('vehicleNo').value = '';
            document.getElementById('serviceSelect').value = '';
            document.getElementById('appointmentDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('timeSlot').selectedIndex = 0;
            document.getElementById('notes').value = '';
            document.getElementById('appointmentModal').style.display = 'flex';
        }
        
        window.editAppointment = (id) => {
            const a = appointments.find(x => x.id === id);
            if (!a) return;
            editingId = id;
            document.getElementById('modalTitle').textContent = 'Edit Appointment';
            document.getElementById('custName').value = a.customerName;
            document.getElementById('custPhone').value = a.customerPhone;
            document.getElementById('vehicleNo').value = a.vehicleNo || '';
            document.getElementById('serviceSelect').value = a.serviceName;
            document.getElementById('appointmentDate').value = a.date;
            document.getElementById('timeSlot').value = a.timeSlot;
            document.getElementById('notes').value = a.notes || '';
            document.getElementById('appointmentModal').style.display = 'flex';
        }
        
        async function saveAppointment() {
            const customerName = document.getElementById('custName').value.trim();
            const customerPhone = document.getElementById('custPhone').value.trim();
            const vehicleNo = document.getElementById('vehicleNo').value.trim();
            const serviceName = document.getElementById('serviceSelect').value;
            const date = document.getElementById('appointmentDate').value;
            const timeSlot = document.getElementById('timeSlot').value;
            const notes = document.getElementById('notes').value.trim();
            
            if (!customerName || !customerPhone || !serviceName || !date) {
                showToast('Name, Phone, Service, and Date are required!', true);
                return;
            }
            
            const btn = document.getElementById('saveAppointmentBtn');
            btn.disabled = true;
            
            const appointmentData = {
                customerName,
                customerPhone,
                vehicleNo,
                serviceName,
                date,
                timeSlot,
                notes,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };
            
            try {
                if (editingId) {
                    await db.collection('appointments').doc(currentBusinessId).collection('list').doc(editingId).update(appointmentData);
                    showToast('Appointment updated successfully!');
                } else {
                    appointmentData.status = 'pending';
                    appointmentData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                    const newRef = db.collection('appointments').doc(currentBusinessId).collection('list').doc();
                    await newRef.set({ id: newRef.id, ...appointmentData });
                    showToast('Appointment booked successfully!');
                }
                document.getElementById('appointmentModal').style.display = 'none';
                await loadAppointments();
            } catch (e) {
                console.error(e);
                showToast('Failed to save appointment', true);
            } finally {
                btn.disabled = false;
            }
        }
        
        window.changeStatus = async (id, status) => {
            const confirmMsg = `Mark this appointment as ${status}?`;
            if (confirm(confirmMsg)) {
                try {
                    await db.collection('appointments').doc(currentBusinessId).collection('list').doc(id).update({
                        status: status,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    showToast(`Appointment status updated to ${status}`);
                    await loadAppointments();
                } catch (e) {
                    console.error(e);
                    showToast('Failed to update status', true);
                }
            }
        }
        
        function clearFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('statusFilter').value = 'all';
            document.getElementById('dateFilter').value = '';
            applyFilters();
        }
        
        document.getElementById('closeModalBtn').onclick = () => document.getElementById('appointmentModal').style.display = 'none';
        document.getElementById('saveAppointmentBtn').onclick = saveAppointment;
        document.getElementById('searchInput').onkeyup = applyFilters;
        document.getElementById('statusFilter').onchange = applyFilters;
        document.getElementById('dateFilter').onchange = applyFilters;
        
        firebase.auth().onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = '/auth/login.html';
                return;
            }
            try {
                const ctx = await getBusinessContext();
                currentBusinessId = (ctx && ctx.businessId) ? ctx.businessId : user.uid;
                await loadServices();
                await loadAppointments();
            } catch (e) {
                console.error(e);
                currentBusinessId = user.uid;
                await loadServices();
                await loadAppointments();
            }
        });
    </script>
</body>
</html>
