<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DIGIBIZ Scan">
    <title>DIGIBIZ QR Mobile Attendance</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3595/3595568.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    
    <script src="../../core/firebase-init.js?v=3"></script>

    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        body{font-family:'Inter',sans-serif;background:#0f172a;color:#f8fafc;min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;padding:16px;overflow-x:hidden;}
        
        .header-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(30,41,59,0.7);backdrop-filter:blur(12px);border-radius:16px;border:1px solid rgba(255,255,255,0.1);margin-bottom:16px;}
        .brand-title{font-family:'Outfit',sans-serif;font-size:18px;font-weight:900;color:#60a5fa;letter-spacing:0.5px;}
        .user-chip{font-size:12px;font-weight:800;background:rgba(16,185,129,0.2);color:#34d399;padding:6px 12px;border-radius:30px;border:1px solid rgba(52,211,153,0.3);display:inline-flex;align-items:center;gap:6px;}

        .scan-card{background:rgba(30,41,59,0.8);backdrop-filter:blur(16px);border-radius:24px;border:1px solid rgba(255,255,255,0.1);padding:20px 16px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,0.4);margin-bottom:16px;}
        .scan-card h2{font-family:'Outfit',sans-serif;font-size:20px;font-weight:800;color:#fff;margin-bottom:4px;}
        .scan-card p{font-size:12.5px;color:#94a3b8;margin-bottom:12px;}

        .live-status-pill{background:rgba(15,23,42,0.8);border:1px solid rgba(59,130,246,0.3);color:#93c5fd;padding:10px 14px;border-radius:14px;font-size:12.5px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;justify-content:center;gap:8px;}

        /* Scanner Frame */
        #reader{width:100%;max-width:320px;margin:0 auto;border-radius:20px;overflow:hidden;border:3px solid #3b82f6;box-shadow:0 0 25px rgba(59,130,246,0.3);min-height:250px;background:#1e293b;}
        #reader video{object-fit:cover;border-radius:16px;}

        .mode-toggle{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
        .mode-btn{padding:14px 12px;border-radius:14px;border:1.5px solid transparent;font-weight:800;font-size:14px;cursor:pointer;transition:all 0.2s;color:white;display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(15,23,42,0.6);}
        .mode-btn.active-in{background:#10b981;border-color:#34d399;box-shadow:0 4px 16px rgba(16,185,129,0.4);}
        .mode-btn.active-out{background:#ef4444;border-color:#f87171;box-shadow:0 4px 16px rgba(239,68,68,0.4);}
        .mode-btn.active-gp{background:#8b5cf6;border-color:#a78bfa;box-shadow:0 4px 16px rgba(139,92,246,0.4);}

        /* Today Summary Bottom Card */
        .today-card{background:rgba(30,41,59,0.9);backdrop-filter:blur(12px);border-radius:20px;border:1px solid rgba(255,255,255,0.1);padding:18px;margin-top:8px;box-shadow:0 10px 25px rgba(0,0,0,0.3);}
        .today-card h3{font-family:'Outfit',sans-serif;font-size:14px;font-weight:800;color:#93c5fd;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
        .summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
        .summary-item{background:rgba(15,23,42,0.7);padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,0.05);}
        .summary-item .lbl{font-size:11px;color:#94a3b8;font-weight:600;display:block;margin-bottom:2px;}
        .summary-item .val{font-size:13.5px;color:#f8fafc;font-weight:800;}

        /* Success Overlay */
        .success-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,0.98);z-index:9999999;flex-direction:column;justify-content:center;align-items:center;padding:30px;backdrop-filter:blur(10px);}
        .success-icon{font-size:72px;color:#10b981;margin-bottom:20px;animation:pulse 1s infinite;}
        .success-overlay h3{font-family:'Outfit',sans-serif;font-size:26px;font-weight:900;color:white;margin-bottom:8px;}
        .success-overlay p{font-size:14px;color:#94a3b8;margin-bottom:24px;text-align:center;line-height:1.6;}
        .btn-done{background:#3b82f6;color:white;border:none;padding:14px 32px;border-radius:14px;font-weight:700;font-size:15px;cursor:pointer;}

        @keyframes pulse{0%{transform:scale(1);}50%{transform:scale(1.1);}100%{transform:scale(1);}}
    </style>
</head>
<body>
    <div>
        <div class="header-bar">
            <div class="brand-title"><i class="fa-solid fa-qrcode"></i> DIGIBIZ SCAN</div>
            <div class="user-chip" id="empChip"><i class="fa-solid fa-user-check"></i> <span id="chipName">Employee</span></div>
        </div>

        <div class="scan-card">
            <h2 id="mainEmpHeader">Scan Workplace QR Code</h2>
            <p id="subEmpTitle">ආයතන පරිශ්‍රයේ ඇති QR Code එක කැමරාවට පෙන්වන්න</p>

            <div class="live-status-pill" id="statusPill">
                <i class="fa-solid fa-circle-dot" style="color:#ef4444;"></i> <span id="statusPillText">Status: 🔴 Off-Duty</span>
            </div>

            <div id="reader" onclick="onScanSuccess('DIGIBIZ_WORKPLACE_ATTENDANCE', null)" style="cursor:pointer;" title="Point camera at QR poster or tap screen to scan"></div>

            <div class="mode-toggle">
                <button class="mode-btn active-in" id="btnModeIn" onclick="setScanMode('IN')">☀️ CHECK IN (පැමිණීම સටහන් කරන්න)</button>
                <button class="mode-btn" id="btnModeOut" onclick="setScanMode('OUT')" style="display:none;">🌙 CHECK OUT (පිටවීම સටහන් කරන්න)</button>
                <button class="mode-btn" id="btnModeGP" onclick="setScanMode('GATE_PASS_OUT')" style="display:none;">🚗 SHORT LEAVE / GATE PASS (එළියට යෑම)</button>
                <button class="mode-btn" id="btnModeGPReturn" onclick="setScanMode('GATE_PASS_IN')" style="display:none;">🏢 RETURN FROM SHORT LEAVE (නැවත පැමිණීම)</button>
            </div>
        </div>

        <!-- Today Summary Card -->
        <div class="today-card">
            <h3><i class="fa-solid fa-calendar-day"></i> අද දිනයේ පැමිණීමේ තත්ත්වය (Today Summary)</h3>
            <div class="summary-grid">
                <div class="summary-item">
                    <span class="lbl">☀️ Check-In වේලාව</span>
                    <span class="val" id="todayInTime">--:--</span>
                </div>
                <div class="summary-item">
                    <span class="lbl">🌙 Check-Out වේලාව</span>
                    <span class="val" id="todayOutTime">--:--</span>
                </div>
                <div class="summary-item">
                    <span class="lbl">⏱️ සේවය කළ පැය ගණන</span>
                    <span class="val" id="todayWorkHrs">0.0 hrs</span>
                </div>
                <div class="summary-item">
                    <span class="lbl">🚗 Short Outings</span>
                    <span class="val" id="todayGatePasses">0</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Success Result Screen -->
    <div class="success-overlay" id="successOverlay">
        <i class="fa-solid fa-circle-check success-icon"></i>
        <h3 id="resultTitle">ATTENDANCE MARKED!</h3>
        <p id="resultSub">Check-In Successful</p>
        <button class="btn-done" onclick="closeSuccess()">Done / Scan Again</button>
    </div>

    <script>
        let scanMode = 'IN';
        let html5QrCode = null;
        let isProcessing = false;

        let activeEmp = {
            empId: 'EMP-001',
            name: 'Employee',
            phone: '',
            bid: 'ATTENDANCE_BIZ_001'
        };

        document.addEventListener('DOMContentLoaded', () => {
            initEmpSession();
            updateLiveStatusAndTodaySummary();
            initScanner();
        });

        function initEmpSession() {
            const urlParams = new URLSearchParams(window.location.search);
            const urlEmpId = urlParams.get('empId') || '';
            const urlPhone = (urlParams.get('phone') || '').replace(/[^0-9]/g, '');
            const urlName = urlParams.get('name') ? decodeURIComponent(urlParams.get('name')) : '';
            const urlBid = urlParams.get('bid') || localStorage.getItem('currentBusinessId') || 'ATTENDANCE_BIZ_001';

            if (urlBid) localStorage.setItem('currentBusinessId', urlBid);

            if (urlEmpId || urlPhone) {
                activeEmp = {
                    empId: urlEmpId || 'EMP-001',
                    name: urlName || 'Employee',
                    phone: urlPhone || '',
                    bid: urlBid
                };
                localStorage.setItem('digibiz_emp_session', JSON.stringify(activeEmp));
            } else {
                const stored = localStorage.getItem('digibiz_emp_session');
                if (stored) {
                    try { activeEmp = JSON.parse(stored); } catch(e) {}
                }
            }

            document.getElementById('chipName').textContent = activeEmp.name || 'Employee';
            document.getElementById('mainEmpHeader').textContent = `Welcome, ${activeEmp.name || 'Employee'}`;
            document.getElementById('subEmpTitle').innerHTML = `Emp ID: <strong>${activeEmp.empId}</strong> | Phone: <strong>${activeEmp.phone}</strong>`;
        }

        function updateLiveStatusAndTodaySummary() {
            let logs = [];
            try {
                const stored = localStorage.getItem('digibiz_attendance_logs');
                if (stored) logs = JSON.parse(stored);
            } catch(e) {}

            let gatePasses = [];
            try {
                const storedGP = localStorage.getItem('digibiz_gate_passes');
                if (storedGP) gatePasses = JSON.parse(storedGP);
            } catch(e) {}

            const todayStr = new Date().toISOString().split('T')[0];
            const empLogsToday = logs.filter(l => (l && (l.empId === activeEmp.empId || l.phone === activeEmp.phone)) && l.date === todayStr);
            const empGPToday = gatePasses.filter(gp => (gp && (gp.empId === activeEmp.empId || gp.empName === activeEmp.name)) && gp.date === todayStr);

            const openGP = empGPToday.find(gp => gp.outTime && (!gp.inTime || gp.inTime === '--:--'));
            const lastLog = empLogsToday.length > 0 ? empLogsToday[0] : null;

            const btnIn = document.getElementById('btnModeIn');
            const btnOut = document.getElementById('btnModeOut');
            const btnGP = document.getElementById('btnModeGP');
            const btnGPReturn = document.getElementById('btnModeGPReturn');
            const pillText = document.getElementById('statusPillText');

            if (openGP) {
                // Currently Out on Short Leave / Gate Pass!
                scanMode = 'GATE_PASS_IN';
                btnIn.style.display = 'none';
                btnOut.style.display = 'none';
                btnGP.style.display = 'none';
                btnGPReturn.style.display = 'flex';
                btnGPReturn.className = 'mode-btn active-gp';
                pillText.innerHTML = `Status: 🚗 On Short Leave (Out at <strong>${openGP.outTime}</strong>)`;
            } else if (!lastLog || lastLog.mode === 'OUT' || (lastLog.outTime && lastLog.outTime !== '--:--')) {
                // Off-duty -> Primary action CHECK IN
                scanMode = 'IN';
                btnIn.style.display = 'flex';
                btnIn.className = 'mode-btn active-in';
                btnOut.style.display = 'none';
                btnGP.style.display = 'none';
                btnGPReturn.style.display = 'none';
                pillText.innerHTML = `Status: 🔴 Off-Duty (👉 ඊළඟ පියවර: ☀️ CHECK IN)`;
            } else {
                // Checked In / On Duty -> Primary actions CHECK OUT and SHORT LEAVE!
                scanMode = 'OUT';
                btnIn.style.display = 'none';
                btnOut.style.display = 'flex';
                btnOut.className = 'mode-btn active-out';
                btnGP.style.display = 'flex';
                btnGP.className = 'mode-btn active-gp';
                btnGPReturn.style.display = 'none';
                pillText.innerHTML = `Status: 🟢 Checked In at <strong>${lastLog.inTime || lastLog.time}</strong>`;
            }

            // Update Today Summary Numbers
            if (empLogsToday.length > 0) {
                const firstLog = empLogsToday[empLogsToday.length - 1];
                const latestLog = empLogsToday[0];
                document.getElementById('todayInTime').textContent = firstLog.inTime || firstLog.time || '--:--';
                document.getElementById('todayOutTime').textContent = (latestLog.outTime && latestLog.outTime !== '--:--') ? latestLog.outTime : '--:--';
                
                let totalWorkMins = 0;
                empLogsToday.forEach(l => {
                    if (l.inTime && l.outTime && l.outTime !== '--:--') {
                        const [inH, inM] = l.inTime.split(':').map(Number);
                        const [outH, outM] = l.outTime.split(':').map(Number);
                        let diff = (outH * 60 + outM) - (inH * 60 + inM);
                        if (diff > 0) totalWorkMins += diff;
                    }
                });
                document.getElementById('todayWorkHrs').textContent = totalWorkMins > 0 ? (totalWorkMins / 60).toFixed(1) + ' hrs' : (lastLog && (!lastLog.outTime || lastLog.outTime === '--:--') ? 'In Progress' : '0.0 hrs');
            } else {
                document.getElementById('todayInTime').textContent = '--:--';
                document.getElementById('todayOutTime').textContent = '--:--';
                document.getElementById('todayWorkHrs').textContent = '0.0 hrs';
            }

            document.getElementById('todayGatePasses').textContent = empGPToday.length + (openGP ? ' (Active)' : '');
        }

        function setScanMode(mode) {
            scanMode = mode;
            document.getElementById('btnModeIn').className = 'mode-btn' + (mode === 'IN' ? ' active-in' : '');
            document.getElementById('btnModeOut').className = 'mode-btn' + (mode === 'OUT' ? ' active-out' : '');
            document.getElementById('btnModeGP').className = 'mode-btn' + (mode === 'GATE_PASS_OUT' ? ' active-gp' : '');
            document.getElementById('btnModeGPReturn').className = 'mode-btn' + (mode === 'GATE_PASS_IN' ? ' active-gp' : '');
        }

        let isScannerStarted = false;

        function initScanner() {
            if (isScannerStarted && html5QrCode) return;
            
            const qrRegionId = "reader";
            try {
                if (html5QrCode) html5QrCode.clear();
            } catch(e) {}
            
            html5QrCode = new Html5Qrcode(qrRegionId);

            const config = { 
                fps: 15, 
                qrbox: function(viewfinderWidth, viewfinderHeight) {
                    let minDim = Math.min(viewfinderWidth, viewfinderHeight);
                    let qrSize = Math.floor(minDim * 0.90);
                    return { width: qrSize, height: qrSize };
                },
                aspectRatio: 1.0,
                experimentalFeatures: {
                    useBarCodeDetectorIfSupported: true
                }
            };

            const qrCodeSuccessCallback = (decodedText, decodedResult) => {
                onScanSuccess(decodedText, decodedResult);
            };

            html5QrCode.start({ facingMode: "environment" }, config, qrCodeSuccessCallback)
                .then(() => { isScannerStarted = true; })
                .catch(err => {
                    console.warn("Environment camera fallback to any video camera:", err);
                    html5QrCode.start({ facingMode: "user" }, config, qrCodeSuccessCallback)
                        .then(() => { isScannerStarted = true; })
                        .catch(e => console.warn("Camera init failed:", e));
                });
        }

        function onScanSuccess(decodedText, decodedResult) {
            if (isProcessing) return;
            isProcessing = true;

            // Pause camera feed immediately
            if (html5QrCode) {
                try { html5QrCode.pause(true); } catch(e) {}
            }

            try {
                // Audio Beep Feedback
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.15);
                } catch(e) {}

                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

                const now = new Date();
                const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const dateStr = now.toISOString().split('T')[0];
                const empId = activeEmp.empId || 'EMP-001';
                const empName = activeEmp.name || 'Employee';
                const empPhone = activeEmp.phone || '';

                let logs = [];
                try {
                    const stored = localStorage.getItem('digibiz_attendance_logs');
                    if (stored) logs = JSON.parse(stored);
                } catch(e) {}

                // Handle Short Leave / Gate Pass
                if (scanMode === 'GATE_PASS_OUT') {
                    let passes = [];
                    try {
                        const stored = localStorage.getItem('digibiz_gate_passes');
                        if (stored) passes = JSON.parse(stored);
                    } catch(e) {}

                    const newPass = {
                        id: 'GP-' + Date.now(),
                        empId: empId,
                        empName: empName,
                        date: dateStr,
                        outTime: timeStr,
                        inTime: '--:--',
                        durationHours: 'In Progress',
                        deductMethod: 'LEAVE',
                        reason: 'Personal Short Leave (Mobile QR Scan)',
                        timestamp: Date.now()
                    };
                    passes.unshift(newPass);
                    localStorage.setItem('digibiz_gate_passes', JSON.stringify(passes));

                    const targetBid = activeEmp.bid || localStorage.getItem('currentBusinessId') || 'ATTENDANCE_BIZ_001';
                    const firestoreDb = window.db || (window.firebase && window.firebase.firestore ? window.firebase.firestore() : null);
                    if (firestoreDb) {
                        firestoreDb.collection('businesses').doc(targetBid).collection('gate_passes').doc(newPass.id).set(newPass, { merge: true });
                    }

                    document.getElementById('resultTitle').textContent = 'SHORT LEAVE RECORDED!';
                    document.getElementById('resultSub').innerHTML = `Employee: <strong>${empName}</strong><br>Out Time: <strong>${timeStr}</strong><br>Gate Pass created automatically.`;
                    document.getElementById('successOverlay').style.display = 'flex';
                    updateLiveStatusAndTodaySummary();
                    return;
                }

                if (scanMode === 'GATE_PASS_IN') {
                    let passes = [];
                    try {
                        const stored = localStorage.getItem('digibiz_gate_passes');
                        if (stored) passes = JSON.parse(stored);
                    } catch(e) {}

                    const openGPIndex = passes.findIndex(gp => (gp && (gp.empId === empId || gp.empName === empName)) && gp.date === dateStr && (!gp.inTime || gp.inTime === '--:--'));
                    if (openGPIndex !== -1) {
                        const targetGP = passes[openGPIndex];
                        targetGP.inTime = timeStr;
                        
                        const [outH, outM] = targetGP.outTime.split(':').map(Number);
                        const parts = timeStr.split(' ');
                        let [inH, inM] = parts[0].split(':').map(Number);
                        if (parts[1] && parts[1].toUpperCase() === 'PM' && inH < 12) inH += 12;
                        if (parts[1] && parts[1].toUpperCase() === 'AM' && inH === 12) inH = 0;

                        let diffMins = (inH * 60 + inM) - (outH * 60 + outM);
                        if (diffMins < 0) diffMins += 24 * 60;

                        targetGP.durationHours = (diffMins / 60).toFixed(1);
                        targetGP.timestamp = Date.now();

                        localStorage.setItem('digibiz_gate_passes', JSON.stringify(passes));

                        const targetBid = activeEmp.bid || localStorage.getItem('currentBusinessId') || 'ATTENDANCE_BIZ_001';
                        const firestoreDb = window.db || (window.firebase && window.firebase.firestore ? window.firebase.firestore() : null);
                        if (firestoreDb) {
                            firestoreDb.collection('businesses').doc(targetBid).collection('gate_passes').doc(targetGP.id).set(targetGP, { merge: true });
                        }

                        document.getElementById('resultTitle').textContent = 'RETURNED FROM SHORT LEAVE!';
                        document.getElementById('resultSub').innerHTML = `Outing Duration: <strong>${targetGP.durationHours} hrs</strong><br>Welcome back!`;
                        document.getElementById('successOverlay').style.display = 'flex';
                        updateLiveStatusAndTodaySummary();
                        return;
                    }
                }

                let targetLog = null;
                const isOut = scanMode === 'OUT';

                if (isOut) {
                    const openLogIndex = logs.findIndex(l => (l && (l.empId === empId || l.phone === empPhone)) && l.date === dateStr && (l.inTime && l.inTime !== '--:--') && (!l.outTime || l.outTime === '--:--'));
                    if (openLogIndex !== -1) {
                        targetLog = logs[openLogIndex];
                        targetLog.outTime = timeStr;
                        targetLog.mode = 'OUT';
                        targetLog.status = 'Shift Completed';
                        targetLog.timestamp = Date.now();
                    }
                }

                if (!targetLog) {
                    targetLog = {
                        id: 'LOG-' + Date.now(),
                        empId: empId,
                        empName: empName,
                        phone: empPhone,
                        date: dateStr,
                        time: timeStr,
                        inTime: !isOut ? timeStr : '--:--',
                        outTime: isOut ? timeStr : '--:--',
                        workHours: !isOut ? 'In Progress' : '0.3 hrs',
                        ot: '0.0 Hours',
                        timestamp: Date.now(),
                        shift: '12h Day Shift',
                        mode: scanMode,
                        method: 'Mobile QR Scan',
                        status: !isOut ? 'Present (Checked In)' : 'Shift Completed'
                    };
                    logs.unshift(targetLog);
                }

                localStorage.setItem('digibiz_attendance_logs', JSON.stringify(logs));

                // Cloud Sync
                const targetBid = activeEmp.bid || localStorage.getItem('currentBusinessId') || 'ATTENDANCE_BIZ_001';
                const firestoreDb = window.db || (window.firebase && window.firebase.firestore ? window.firebase.firestore() : null);
                if (firestoreDb) {
                    firestoreDb.collection('attendance_logs').doc(targetLog.id).set(targetLog, { merge: true }).catch(e => console.warn(e));
                    firestoreDb.collection('businesses').doc(targetBid).collection('attendance_logs').doc(targetLog.id).set(targetLog, { merge: true }).catch(e => console.warn(e));
                }

                document.getElementById('resultTitle').textContent = scanMode === 'IN' ? 'CHECK-IN SUCCESSFUL!' : 'CHECK-OUT SUCCESSFUL!';
                document.getElementById('resultSub').innerHTML = `Employee: <strong>${empName}</strong> (${empPhone})<br>Time: <strong>${timeStr}</strong> (${dateStr})<br>Mode: <strong>${scanMode === 'IN' ? '☀️ Check In' : '🌙 Check Out'}</strong>`;
                document.getElementById('successOverlay').style.display = 'flex';
                updateLiveStatusAndTodaySummary();

            } catch(err) {
                console.error("onScanSuccess Error:", err);
                alert(`⚠️ Scanner Error:\n\n${err.message}`);
                isProcessing = false;
                if (html5QrCode) {
                    try { html5QrCode.resume(); } catch(e) {}
                }
            }
        }

        function closeSuccess() {
            document.getElementById('successOverlay').style.display = 'none';
            isProcessing = false;
            if (html5QrCode) {
                try { html5QrCode.resume(); } catch(e) {}
            }
        }
    </script>
</body>
</html>
