<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="/core/pwa-init.js?v=1"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Directory & Profiles - DIGIBIZ</title>
    <style>html.digibiz-sidebar-reserved body{margin-left:260px;}@media (max-width:768px){html.digibiz-sidebar-reserved body{margin-left:0;}}</style>
    <script>document.documentElement.classList.add('digibiz-sidebar-reserved');</script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
    
    <script src="../../core/firebase-init.js?v=3"></script>
    <script src="../../core/auth-roles.js?v=3"></script>
    <script src="../../core/business-types.js?v=4"></script>
    <script src="../../core/sidebar.js?v=1010"></script>
    
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',sans-serif;background:#f8fafc;color:#1e293b;padding:30px;}
        
        .header-section{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;}
        .header-title h2{font-size:24px;font-weight:800;color:#0f172a;}
        .header-title p{font-size:14px;color:#64748b;margin-top:4px;}

        .btn-primary{background:#3b82f6;color:white;border:none;padding:12px 24px;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 4px 12px rgba(59,130,246,0.25);transition:all 0.2s;}
        .btn-primary:hover{background:#2563eb;transform:translateY(-1px);}

        .card-box{background:white;border-radius:20px;border:1px solid #e2e8f0;overflow:hidden;box-shadow:0 4px 6px -1px rgba(0,0,0,0.05);}
        .table-custom{width:100%;border-collapse:collapse;}
        .table-custom th,.table-custom td{padding:14px 18px;text-align:left;border-bottom:1px solid #e2e8f0;font-size:13px;}
        .table-custom th{background:#f8fafc;font-weight:700;color:#475569;}
        .table-custom tr:hover{background:#f8fafc;}

        .emp-name strong{font-weight:700;color:#0f172a;font-size:14px;}
        .phone-badge{font-size:12px;font-weight:600;color:#2563eb;background:#eff6ff;padding:4px 8px;border-radius:6px;display:inline-flex;align-items:center;gap:4px;}
        
        .badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block;}
        .badge-active{background:#dcfce7;color:#15803d;}

        .action-btns{display:flex;gap:8px;align-items:center;}
        .btn-edit,.btn-delete,.btn-link{border:none;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:all 0.2s;}
        .btn-link{background:#f3e8ff;color:#7e22ce;}
        .btn-link:hover{background:#e9d5ff;}
        .btn-edit{background:#e0f2fe;color:#0369a1;}
        .btn-edit:hover{background:#bae6fd;}
        .btn-delete{background:#fee2e2;color:#b91c1c;}
        .btn-delete:hover{background:#fecaca;}

        /* Modal Overlay Styles */
        .modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,0.7);z-index:9999;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px);}
        .modal-card{background:white;border-radius:20px;padding:28px;width:100%;max-width:520px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.25);}
        .modal-card h3{font-size:18px;font-weight:800;color:#0f172a;margin-bottom:16px;}
        .form-group{margin-bottom:14px;}
        .form-group label{display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:6px;}
        .form-group input{width:100%;padding:10px 14px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px;}
        .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
        .btn-cancel{background:#f1f5f9;color:#475569;border:none;padding:10px 18px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;}
    </style>
</head>
<body>
    <div class="header-section">
        <div class="header-title">
            <h2>👥 Employee Profiles & Identity Management</h2>
            <p>සේවක ගිණුම් සෑදීම, තොරතුරු යාවත්කාලීන කිරීම සහ පෞද්ගලික Mobile PWA Links ලබාගැනීම</p>
        </div>
        <button class="btn-primary" onclick="openAddEmpModal()"><i class="fa-solid fa-user-plus"></i> Add New Employee</button>
    </div>

    <div class="card-box">
        <table class="table-custom">
            <thead>
                <tr>
                    <th>Emp ID</th>
                    <th>Full Name</th>
                    <th>Mobile Number</th>
                    <th>Designation</th>
                    <th>Basic Salary</th>
                    <th>OT Hourly Rate</th>
                    <th>Bank Details</th>
                    <th>Status</th>
                    <th>Actions & Unique PWA Links</th>
                </tr>
            </thead>
            <tbody id="empTableBody">
                <!-- Populated dynamically -->
            </tbody>
        </table>
    </div>

    <!-- Modal for Adding / Editing Employee -->
    <div class="modal-overlay" id="addEmpModal">
        <div class="modal-card">
            <h3 id="modalTitle">👤 Add New Employee Profile</h3>
            <input type="hidden" id="editingEmpId" value="">
            <div class="form-group">
                <label>Full Name (සේවකයාගේ නම)</label>
                <input type="text" id="empName" placeholder="e.g. K. A. Perera">
            </div>
            <div class="form-group">
                <label>Phone / Mobile Number (දුරකථන අංකය)</label>
                <input type="tel" id="empPhone" placeholder="0771234567">
            </div>
            <div class="form-group">
                <label>Designation (තනතුර)</label>
                <input type="text" id="empDesignation" placeholder="e.g. Machine Operator">
            </div>
            <div class="form-group">
                <label>Basic Salary (මූලික වැටුප Rs.)</label>
                <input type="number" id="empBasic" placeholder="45000">
            </div>
            <div class="form-group">
                <label>OT Hourly Rate (පැයක අතිකාල ගාස්තුව Rs.)</label>
                <input type="number" id="empOtRate" placeholder="350">
            </div>
            <div class="form-group">
                <label>Bank Name & Account No (බැංකු විස්තර)</label>
                <input type="text" id="empBank" placeholder="BOC - 88472910">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeAddEmpModal()">Cancel</button>
                <button class="btn-primary" onclick="saveEmpProfile()" id="modalSaveBtn">Save Employee Profile</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderEmployeeDirectory();
            initFirestoreEmployeeListener();
        });

        function initFirestoreEmployeeListener() {
            const firestoreDb = window.db || (window.firebase && window.firebase.firestore ? window.firebase.firestore() : null);
            if (firestoreDb) {
                const bizId = localStorage.getItem('currentBusinessId') || 'ATTENDANCE_BIZ_001';
                firestoreDb.collection('businesses').doc(bizId).onSnapshot(doc => {
                    if (doc.exists) {
                        const data = doc.data();
                        if (data && Array.isArray(data.registered_employees)) {
                            localStorage.setItem('digibiz_registered_employees', JSON.stringify(data.registered_employees));
                            renderEmployeeDirectory();
                        }
                    }
                }, err => console.warn('Firestore employee sync error:', err));
            }
        }

        function getEmployeesFromStorage() {
            const raw = localStorage.getItem('digibiz_registered_employees');
            if (raw !== null) {
                try {
                    return JSON.parse(raw);
                } catch(e) {}
            }
            // First time initialization seed
            const defaultSeed = [
                { empId: 'EMP-001', name: 'K. A. Perera', phone: '0771234567', designation: 'Machine Operator', basic: 45000, otRate: 350, bank: 'BOC - 88472910' },
                { empId: 'EMP-002', name: 'S. D. Silva', phone: '0719876543', designation: 'Technician', basic: 50000, otRate: 400, bank: 'Commercial Bank - 10928374' },
                { empId: 'EMP-003', name: 'M. N. Fernando', phone: '0755551212', designation: 'Supervisor', basic: 65000, otRate: 500, bank: 'Sampath Bank - 00293847' }
            ];
            localStorage.setItem('digibiz_registered_employees', JSON.stringify(defaultSeed));
            return defaultSeed;
        }

        function saveEmployeesToStorage(list) {
            localStorage.setItem('digibiz_registered_employees', JSON.stringify(list));
            
            // Sync to Firestore
            const firestoreDb = window.db || (window.firebase && window.firebase.firestore ? window.firebase.firestore() : null);
            if (firestoreDb) {
                const bizId = localStorage.getItem('currentBusinessId') || 'ATTENDANCE_BIZ_001';
                firestoreDb.collection('businesses').doc(bizId).set({ registered_employees: list }, { merge: true }).catch(e => console.warn(e));
            }
        }

        function renderEmployeeDirectory() {
            const tbody = document.getElementById('empTableBody');
            const employees = getEmployeesFromStorage();

            let html = '';
            if (employees && employees.length > 0) {
                employees.forEach(emp => {
                    const basicStr = emp.basic ? `Rs. ${Number(emp.basic).toLocaleString('en-US', {minimumFractionDigits: 2})}` : 'Rs. 0.00';
                    const otStr = emp.otRate ? `Rs. ${Number(emp.otRate).toLocaleString('en-US', {minimumFractionDigits: 2})} / hr` : 'Rs. 0.00 / hr';
                    const safeName = emp.name.replace(/'/g, "\\'");

                    html += `
                        <tr>
                            <td><strong>${emp.empId}</strong></td>
                            <td class="emp-name"><strong>${emp.name}</strong></td>
                            <td><span class="phone-badge"><i class="fa-solid fa-phone"></i> ${emp.phone}</span></td>
                            <td>${emp.designation || 'Staff'}</td>
                            <td>${basicStr}</td>
                            <td>${otStr}</td>
                            <td>${emp.bank || 'N/A'}</td>
                            <td><span class="badge badge-active">Active</span></td>
                            <td>
                                <div class="action-btns">
                                    <button class="btn-link" onclick="copyPwaLink('${emp.empId}', '${emp.phone}', '${safeName}')"><i class="fa-solid fa-mobile-screen"></i> Copy PWA Link</button>
                                    <button class="btn-edit" onclick="openEditEmpModal('${emp.empId}')"><i class="fa-solid fa-pen"></i> Edit</button>
                                    <button class="btn-delete" onclick="deleteEmpRow('${emp.empId}', '${safeName}')"><i class="fa-solid fa-trash"></i> Delete</button>
                                </div>
                            </td>
                        </tr>
                    `;
                });
            } else {
                html = `
                    <tr>
                        <td colspan="9" style="text-align:center;color:#64748b;padding:32px;font-weight:600;">
                            ⚠️ මෙතෙක් කිසිදු සේවකයෙකු ලියාපදිංචි කර නොමැත. ("Add New Employee" බොත්තම ඔබා නව සේවකයෙකු එක් කරන්න).
                        </td>
                    </tr>
                `;
            }
            tbody.innerHTML = html;
        }

        function copyPwaLink(empId, phone, name) {
            const cleanPhone = phone.replace(/[^0-9]/g, '');
            const bizId = localStorage.getItem('currentBusinessId') || 'ATTENDANCE_BIZ_001';
            const uniqueLink = `${window.location.origin}/modules/attendance_payroll/mobile-scan.html?empId=${empId}&phone=${cleanPhone}&name=${encodeURIComponent(name)}&bid=${bizId}`;
            
            navigator.clipboard.writeText(uniqueLink).then(() => {
                alert(`📱 Copied Unique Mobile PWA Link for ${name}!\n\nLink: ${uniqueLink}\n\nමෙම ලින්ක් එක සේවකයාට (WhatsApp/SMS මගින්) යවා ඔවුන්ගේ ෆෝන් එකෙන් Log වෙන ලෙස දන්වන්න.`);
            }).catch(() => {
                prompt(`Unique Mobile PWA Link for ${name}:`, uniqueLink);
            });
        }

        function openAddEmpModal() {
            document.getElementById('modalTitle').textContent = '👤 Add New Employee Profile';
            document.getElementById('modalSaveBtn').textContent = 'Save Employee Profile';
            document.getElementById('editingEmpId').value = '';
            document.getElementById('empName').value = '';
            document.getElementById('empPhone').value = '';
            document.getElementById('empDesignation').value = '';
            document.getElementById('empBasic').value = '';
            document.getElementById('empOtRate').value = '';
            document.getElementById('empBank').value = '';
            document.getElementById('addEmpModal').style.display = 'flex';
        }

        function openEditEmpModal(empId) {
            const employees = getEmployeesFromStorage();
            const emp = employees.find(e => e.empId === empId);
            if (!emp) return;

            document.getElementById('modalTitle').textContent = '✏️ Edit Employee Profile';
            document.getElementById('modalSaveBtn').textContent = 'Update Employee Profile';
            document.getElementById('editingEmpId').value = emp.empId;
            document.getElementById('empName').value = emp.name;
            document.getElementById('empPhone').value = emp.phone;
            document.getElementById('empDesignation').value = emp.designation || '';
            document.getElementById('empBasic').value = emp.basic || '';
            document.getElementById('empOtRate').value = emp.otRate || '';
            document.getElementById('empBank').value = emp.bank || '';
            document.getElementById('addEmpModal').style.display = 'flex';
        }

        function closeAddEmpModal() {
            document.getElementById('addEmpModal').style.display = 'none';
        }

        function saveEmpProfile() {
            const editingEmpId = document.getElementById('editingEmpId').value;
            const name = document.getElementById('empName').value.trim();
            const rawPhone = document.getElementById('empPhone').value.trim();
            const phone = rawPhone.replace(/[^0-9]/g, '');
            const des = document.getElementById('empDesignation').value.trim();
            const basic = document.getElementById('empBasic').value;
            const ot = document.getElementById('empOtRate').value;
            const bank = document.getElementById('empBank').value.trim();

            if (!name || !phone) {
                alert('⚠️ කරුණාකර සේවකයාගේ නම සහ දුරකථන අංකය ඇතුළත් කරන්න.');
                return;
            }

            let employees = getEmployeesFromStorage();

            if (editingEmpId) {
                // Update existing
                const index = employees.findIndex(e => e.empId === editingEmpId);
                if (index !== -1) {
                    employees[index] = {
                        ...employees[index],
                        name: name,
                        phone: phone,
                        designation: des,
                        basic: basic ? Number(basic) : 0,
                        otRate: ot ? Number(ot) : 0,
                        bank: bank
                    };
                }
            } else {
                // Add new employee
                const newEmpId = `EMP-${Math.floor(100 + Math.random() * 900)}`;
                employees.push({
                    empId: newEmpId,
                    name: name,
                    phone: phone,
                    designation: des || 'Staff',
                    basic: basic ? Number(basic) : 0,
                    otRate: ot ? Number(ot) : 0,
                    bank: bank || 'N/A'
                });
            }

            saveEmployeesToStorage(employees);
            renderEmployeeDirectory();
            closeAddEmpModal();
        }

        function deleteEmpRow(empId, name) {
            if (confirm(`ඔබට "${name}" (${empId}) සේවක ගිණුම පද්ධතියෙන් ස්ථිරවම ඉවත් (Delete) කිරීමට අවශ්‍ය බව තහවුරු කරන්න?`)) {
                let employees = getEmployeesFromStorage();
                employees = employees.filter(e => e.empId !== empId);
                saveEmployeesToStorage(employees);
                renderEmployeeDirectory();
            }
        }
    </script>
</body>
</html>
