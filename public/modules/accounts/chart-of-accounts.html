<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <script src="/core/pwa-init.js?v=1"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart of Accounts - DIGIBIZ Universal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
    <script src="../../core/firebase-init.js"></script>
    <script src="../../core/dashboard-core.js"></script>
    <script src="../../core/auth-roles.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',sans-serif;background:#f0fdf4;color:#1a1a2e;}
        
        .navbar{position:fixed;top:0;width:100%;background:rgba(255,255,255,0.98);backdrop-filter:blur(10px);z-index:1000;padding:1rem 5%;box-shadow:0 2px 20px rgba(0,0,0,0.05);}
        .nav-container{max-width:1400px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;}
        .logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
        .logo-icon{font-size:28px;}
        .logo-text{font-size:22px;font-weight:800;background:linear-gradient(135deg,#10b981 0%,#059669 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
        .back-btn{background:#64748b;color:white;border:none;padding:10px 24px;border-radius:40px;font-weight:600;cursor:pointer;}
        
        .main-content{padding:100px 5% 60px;}
        .container{max-width:1400px;margin:0 auto;}
        
        /* Page Header */
        .page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;flex-wrap:wrap;gap:15px;}
        .page-header h1{font-size:28px;font-weight:800;background:linear-gradient(135deg,#10b981 0%,#059669 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
        .btn-primary{background:linear-gradient(135deg,#10b981 0%,#059669 100%);color:white;border:none;padding:12px 24px;border-radius:10px;font-weight:600;cursor:pointer;}
        
        /* Account Types Tabs */
        .tabs{display:flex;gap:10px;margin-bottom:30px;flex-wrap:wrap;}
        .tab{background:#f1f5f9;color:#64748b;border:none;padding:12px 24px;border-radius:40px;font-weight:600;cursor:pointer;}
        .tab.active{background:#10b981;color:white;}
        
        /* Account Table */
        .account-table{background:white;border-radius:20px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,0.05);border:1px solid #e2e8f0;}
        table{width:100%;border-collapse:collapse;}
        th{text-align:left;padding:16px;background:#f8fafc;color:#1a1a2e;font-weight:600;border-bottom:1px solid #e2e8f0;}
        td{padding:12px 16px;border-bottom:1px solid #e2e8f0;color:#4a5568;}
        tr:hover{background:#f0fdf4;}
        .account-code{font-family:monospace;font-weight:600;color:#10b981;}
        .account-name{font-weight:500;}
        .balance-positive{color:#10b981;font-weight:600;}
        .balance-negative{color:#ef4444;font-weight:600;}
        
        /* Modal */
        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:2000;justify-content:center;align-items:center;}
        .modal-content{background:white;border-radius:24px;padding:32px;width:90%;max-width:500px;}
        .modal-content h3{margin-bottom:20px;color:#1a1a2e;}
        .modal-content input,.modal-content select{width:100%;padding:12px;margin-bottom:16px;border:1px solid #e2e8f0;border-radius:8px;}
        .modal-buttons{display:flex;gap:12px;justify-content:flex-end;}
        .modal-buttons button{padding:10px 20px;border-radius:8px;cursor:pointer;}
        .btn-save{background:#10b981;color:white;border:none;}
        .btn-cancel{background:#e2e8f0;color:#64748b;border:none;}
        
        /* Stats */
        .stats-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:30px;}
        .stat-summary-card{background:white;border-radius:16px;padding:16px;text-align:center;border:1px solid #e2e8f0;}
        .stat-summary-card .label{font-size:12px;color:#64748b;margin-bottom:5px;}
        .stat-summary-card .value{font-size:24px;font-weight:700;}
        .stat-summary-card.asset .value{color:#10b981;}
        .stat-summary-card.liability .value{color:#ef4444;}
        .stat-summary-card.equity .value{color:#f59e0b;}
        
        @media (max-width:768px){.stats-summary{grid-template-columns:repeat(2,1fr);}th,td{font-size:12px;padding:10px;}}
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a class="logo" href="../../index.html"><div class="logo-icon">🚀</div><div class="logo-text">DIGIBIZ Universal</div></a>
            <button class="back-btn" onclick="window.location.href='../retail/retail-complete.html'">← Back to Dashboard</button>
        </div>
    </nav>

    <div class="main-content">
        <div class="container">
            <div class="page-header">
                <h1>📊 Chart of Accounts (ගිණුම් සටහන)</h1>
                <button class="btn-primary" id="addAccountBtn">+ Add New Account</button>
            </div>

            <!-- Summary Stats -->
            <div class="stats-summary">
                <div class="stat-summary-card asset"><div class="label">Total Assets</div><div class="value" id="totalAssets">රු. 0</div></div>
                <div class="stat-summary-card liability"><div class="label">Total Liabilities</div><div class="value" id="totalLiabilities">රු. 0</div></div>
                <div class="stat-summary-card equity"><div class="label">Total Equity</div><div class="value" id="totalEquity">රු. 0</div></div>
                <div class="stat-summary-card"><div class="label">Total Accounts</div><div class="value" id="totalAccounts">0</div></div>
            </div>

            <!-- Account Type Tabs -->
            <div class="tabs">
                <button class="tab active" data-type="ALL">📋 All Accounts</button>
                <button class="tab" data-type="ASSET">💰 Assets</button>
                <button class="tab" data-type="LIABILITY">📋 Liabilities</button>
                <button class="tab" data-type="EQUITY">🏦 Equity</button>
                <button class="tab" data-type="INCOME">📈 Income</button>
                <button class="tab" data-type="EXPENSE">📉 Expenses</button>
            </div>

            <!-- Account Table -->
            <div class="account-table">
                <table>
                    <thead>
                        <tr><th>Account Code</th><th>Account Name</th><th>Type</th><th>Category</th><th>Balance (රු.)</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="accountsList"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add/Edit Account Modal -->
    <div id="accountModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Add New Account</h3>
            <input type="text" id="accountCode" placeholder="Account Code (e.g., 1-1010-01)">
            <input type="text" id="accountName" placeholder="Account Name">
            <select id="accountType">
                <option value="ASSET">Asset (වත්කම්)</option>
                <option value="LIABILITY">Liability (වගකීම්)</option>
                <option value="EQUITY">Equity (හිමිකාරත්වය)</option>
                <option value="INCOME">Income (ආදායම්)</option>
                <option value="EXPENSE">Expense (වියදම්)</option>
            </select>
            <select id="accountCategory">
                <option value="CURRENT">Current</option>
                <option value="FIXED">Fixed</option>
                <option value="INTANGIBLE">Intangible</option>
            </select>
            <input type="number" id="openingBalance" placeholder="Opening Balance" value="0">
            <div class="modal-buttons">
                <button class="btn-cancel" id="closeModalBtn">Cancel</button>
                <button class="btn-save" id="saveAccountBtn">Save Account</button>
            </div>
        </div>
    </div>

    <script>
        let currentCompanyId = null;
        let currentUserId = null;
        let editingAccountId = null;
        let currentFilter = 'ALL';

        // Predefined Chart of Accounts for any business
        const PREDEFINED_ACCOUNTS = {
            ASSET: [
                { code: "1-1010-01", name: "Cash - Main", category: "CURRENT", type: "ASSET" },
                { code: "1-1020-01", name: "Bank - Current Account", category: "CURRENT", type: "ASSET" },
                { code: "1-1030-01", name: "Accounts Receivable", category: "CURRENT", type: "ASSET" },
                { code: "1-1030-10", name: "A/R — Hand loans (given)", category: "CURRENT", type: "ASSET" },
                { code: "1-1030-11", name: "A/R — No-interest loans", category: "CURRENT", type: "ASSET" },
                { code: "1-1030-12", name: "A/R — Interest loans (10%)", category: "CURRENT", type: "ASSET" },
                { code: "1-1030-13", name: "A/R — Advanced (investor) loans", category: "CURRENT", type: "ASSET" },
                { code: "1-1040-01", name: "Inventory", category: "CURRENT", type: "ASSET" },
                { code: "1-1060-01", name: "Supplier Advances (Scrap)", category: "CURRENT", type: "ASSET" },
                { code: "1-2010-01", name: "Furniture & Equipment", category: "FIXED", type: "ASSET" },
                { code: "1-2020-01", name: "Vehicles", category: "FIXED", type: "ASSET" }
            ],
            LIABILITY: [
                { code: "2-2010-01", name: "Accounts Payable", category: "CURRENT", type: "LIABILITY" },
                { code: "2-2010-10", name: "A/P — Hand loans (received)", category: "CURRENT", type: "LIABILITY" },
                { code: "2-2020-01", name: "Bank Loan", category: "FIXED", type: "LIABILITY" },
                { code: "2-2030-01", name: "Tax Payable", category: "CURRENT", type: "LIABILITY" },
                { code: "2-2060-01", name: "Temporary Investor Funds Payable", category: "CURRENT", type: "LIABILITY" },
                { code: "2-2060-10", name: "Investor funds payable — Advanced loans", category: "CURRENT", type: "LIABILITY" }
            ],
            EQUITY: [
                { code: "3-3010-01", name: "Capital", category: "CURRENT", type: "EQUITY" },
                { code: "3-3010-11", name: "Equity — No-interest opening import", category: "CURRENT", type: "EQUITY" },
                { code: "3-3020-01", name: "Retained Earnings", category: "CURRENT", type: "EQUITY" }
            ],
            INCOME: [
                { code: "4-4010-01", name: "Sales Revenue", category: "CURRENT", type: "INCOME" },
                { code: "4-4020-01", name: "Service Income", category: "CURRENT", type: "INCOME" },
                { code: "4-4020-12", name: "Service income — Interest loans", category: "CURRENT", type: "INCOME" },
                { code: "4-4030-01", name: "Discount Received", category: "CURRENT", type: "INCOME" }
            ],
            EXPENSE: [
                { code: "5-5010-01", name: "Cost of Goods Sold", category: "CURRENT", type: "EXPENSE" },
                { code: "5-5020-01", name: "Salary Expense", category: "CURRENT", type: "EXPENSE" },
                { code: "5-5030-01", name: "Rent Expense", category: "CURRENT", type: "EXPENSE" },
                { code: "5-5040-01", name: "Utilities Expense", category: "CURRENT", type: "EXPENSE" },
                { code: "5-5050-01", name: "Marketing Expense", category: "CURRENT", type: "EXPENSE" }
            ]
        };

        // Initialize and setup predefined accounts
        async function initializeAccounts(companyId) {
            for (const [type, accounts] of Object.entries(PREDEFINED_ACCOUNTS)) {
                for (const acc of accounts) {
                    const accountRef = db.collection('accounts').doc(companyId).collection('list').doc(acc.code);
                    const existing = await accountRef.get();
                    if (!existing.exists) {
                        await accountRef.set({
                            ...acc,
                            openingBalance: 0,
                            currentBalance: 0,
                            isSystemAccount: true,
                            createdAt: new Date(),
                            createdBy: currentUserId
                        });
                    }
                }
            }
            console.log('✅ Predefined accounts initialized');
        }

        // Load accounts from Firestore
        async function loadAccounts() {
            if (!currentCompanyId) return;
            
            const snapshot = await db.collection('accounts').doc(currentCompanyId).collection('list').get();
            let accounts = [];
            snapshot.forEach(doc => accounts.push({ id: doc.id, ...doc.data() }));
            
            // Filter by type if needed
            if (currentFilter !== 'ALL') {
                accounts = accounts.filter(a => a.type === currentFilter);
            }
            
            displayAccounts(accounts);
            updateStats(accounts);
        }

        function displayAccounts(accounts) {
            const tbody = document.getElementById('accountsList');
            if (accounts.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;">No accounts found. Add your first account!</td></tr>';
                return;
            }
            
            tbody.innerHTML = accounts.map(acc => `
                <tr>
                    <td class="account-code">${acc.code}</td>
                    <td class="account-name">${acc.name}</td>
                    <td>${acc.type}</td>
                    <td>${acc.category || '-'}</td>
                    <td class="${acc.currentBalance >= 0 ? 'balance-positive' : 'balance-negative'}">රු. ${(acc.currentBalance || acc.openingBalance || 0).toLocaleString()}</td>
                    <td>
                        <button onclick="editAccount('${acc.id}')" style="background:#10b98120;color:#10b981;border:none;padding:5px 12px;border-radius:6px;cursor:pointer;margin-right:5px;">✏️</button>
                        <button onclick="deleteAccount('${acc.id}')" style="background:#ef444420;color:#ef4444;border:none;padding:5px 12px;border-radius:6px;cursor:pointer;">🗑️</button>
                    </td>
                </tr>
            `).join('');
        }

        async function updateStats(accounts) {
            let totalAssets = 0, totalLiabilities = 0, totalEquity = 0;
            accounts.forEach(acc => {
                const balance = acc.currentBalance || acc.openingBalance || 0;
                if (acc.type === 'ASSET') totalAssets += balance;
                if (acc.type === 'LIABILITY') totalLiabilities += balance;
                if (acc.type === 'EQUITY') totalEquity += balance;
            });
            document.getElementById('totalAssets').innerHTML = `රු. ${totalAssets.toLocaleString()}`;
            document.getElementById('totalLiabilities').innerHTML = `රු. ${totalLiabilities.toLocaleString()}`;
            document.getElementById('totalEquity').innerHTML = `රු. ${totalEquity.toLocaleString()}`;
            document.getElementById('totalAccounts').innerHTML = accounts.length;
        }

        // Add/Edit account functions
        function openModal(account = null) {
            document.getElementById('accountModal').style.display = 'flex';
            if (account) {
                document.getElementById('modalTitle').innerText = 'Edit Account';
                document.getElementById('accountCode').value = account.code;
                document.getElementById('accountName').value = account.name;
                document.getElementById('accountType').value = account.type;
                document.getElementById('accountCategory').value = account.category || 'CURRENT';
                document.getElementById('openingBalance').value = account.openingBalance || 0;
                editingAccountId = account.id;
            } else {
                document.getElementById('modalTitle').innerText = 'Add New Account';
                document.getElementById('accountCode').value = '';
                document.getElementById('accountName').value = '';
                document.getElementById('accountType').value = 'ASSET';
                document.getElementById('accountCategory').value = 'CURRENT';
                document.getElementById('openingBalance').value = 0;
                editingAccountId = null;
            }
        }

        async function saveAccount() {
            const code = document.getElementById('accountCode').value;
            const name = document.getElementById('accountName').value;
            const type = document.getElementById('accountType').value;
            const category = document.getElementById('accountCategory').value;
            const openingBalance = parseFloat(document.getElementById('openingBalance').value) || 0;
            
            if (!code || !name) {
                alert('Please fill all required fields');
                return;
            }
            
            const accountRef = db.collection('accounts').doc(currentCompanyId).collection('list').doc(code);
            
            if (editingAccountId) {
                await accountRef.update({ name, type, category, openingBalance });
            } else {
                await accountRef.set({
                    code, name, type, category, openingBalance, currentBalance: openingBalance,
                    isSystemAccount: false, createdAt: new Date(), createdBy: currentUserId
                });
            }
            
            closeModal();
            loadAccounts();
        }

        async function deleteAccount(accountId) {
            if (confirm('Are you sure you want to delete this account?')) {
                await db.collection('accounts').doc(currentCompanyId).collection('list').doc(accountId).delete();
                loadAccounts();
            }
        }

        function closeModal() {
            document.getElementById('accountModal').style.display = 'none';
            editingAccountId = null;
        }

        // Event listeners
        document.getElementById('addAccountBtn').onclick = () => openModal();
        document.getElementById('saveAccountBtn').onclick = saveAccount;
        document.getElementById('closeModalBtn').onclick = closeModal;
        document.querySelectorAll('.tab').forEach(tab => {
            tab.onclick = () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentFilter = tab.dataset.type;
                loadAccounts();
            };
        });
        window.editAccount = async (id) => {
            const doc = await db.collection('accounts').doc(currentCompanyId).collection('list').doc(id).get();
            if (doc.exists) openModal({ id: doc.id, ...doc.data() });
        };
        window.deleteAccount = deleteAccount;

        // Auth check
        auth.onAuthStateChanged(async (user) => {
            if (!user) { window.location.href = '../../auth/login.html'; return; }
            currentUserId = user.uid;
            
            if (window.dashboardCore) {
                const context = await window.dashboardCore.getContext(user);
                currentCompanyId = context.businessId;
            } else {
                currentCompanyId = user.uid; // Fallback
            }
            
            if (currentCompanyId) {
                await initializeAccounts(currentCompanyId);
                await loadAccounts();
            }
        });
    </script>
</body>
</html>
