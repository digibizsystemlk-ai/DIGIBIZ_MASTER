<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <script src="/core/pwa-init.js?v=1"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Log - DIGIBIZ</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
    
    <script src="/core/firebase-init.js?v=100"></script>
    <script src="/scripts/admin-impersonation.js?v=100"></script>
    <script src="/core/event-bus.js"></script>
    <script src="/core/auth-roles.js?v=120"></script>
    <script src="/core/business-types.js"></script>
    <script src="/core/sidebar.js?v=2001"></script>
    
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',sans-serif;background:#f5f6fa;color:#1a1a2e;}
        
        .main-content{padding:30px 35px;min-height:100vh;}
        @media (max-width:768px){.main-content{padding:20px;}}
        
        .page-header{margin-bottom:30px;}
        .page-header h1{font-size:26px;font-weight:700;color:#1a1a2e;}
        .page-header h1 i{color:#10b981;margin-right:12px;}
        .page-header p{color:#64748b;margin-top:8px;font-size:14px;}
        
        .filter-bar{background:white;border-radius:16px;padding:20px;margin-bottom:25px;display:flex;gap:15px;flex-wrap:wrap;align-items:flex-end;border:1px solid #e9ecef;}
        .filter-group{flex:1;min-width:150px;}
        .filter-group label{display:block;font-size:12px;color:#64748b;margin-bottom:5px;}
        .filter-group input,.filter-group select{width:100%;padding:10px;border:1px solid #e9ecef;border-radius:8px;font-size:14px;}
        .btn-primary{background:#10b981;color:white;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;}
        
        .activity-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:25px;}
        .stat-card{background:white;border-radius:16px;padding:20px;border:1px solid #e9ecef;text-align:center;}
        .stat-card .count{font-size:28px;font-weight:700;color:#10b981;}
        .stat-card .label{font-size:12px;color:#64748b;margin-top:5px;}
        
        .card{background:white;border-radius:20px;border:1px solid #e9ecef;overflow:hidden;}
        .card-header{padding:18px 22px;border-bottom:1px solid #e9ecef;background:#fafbfc;display:flex;justify-content:space-between;}
        .card-header h3{font-size:16px;font-weight:600;}
        .card-header h3 i{margin-right:10px;color:#10b981;}
        .card-body{padding:0;overflow-x:auto;}
        
        .data-table{width:100%;border-collapse:collapse;}
        .data-table th,.data-table td{padding:14px 18px;text-align:left;border-bottom:1px solid #e9ecef;font-size:13px;}
        .data-table th{background:#fafbfc;font-weight:600;}
        
        .badge{padding:4px 10px;border-radius:30px;font-size:11px;}
        .badge-create{background:#d1fae5;color:#059669;}
        .badge-update{background:#e0e7ff;color:#3b82f6;}
        .badge-delete{background:#fee2e2;color:#dc2626;}
        .badge-login{background:#fed7aa;color:#ea580c;}
        
        footer{text-align:center;padding:25px;color:#adb5bd;font-size:12px;border-top:1px solid #e9ecef;margin-top:20px;}
    </style>
</head>
<body>
    <div class="main-content">
        <div class="page-header">
            <h1><i class="fas fa-history"></i> Activity Log</h1>
            <p>Track all user actions and system events</p>
        </div>
        
        <div class="activity-stats">
            <div class="stat-card"><div class="count" id="totalActivities">0</div><div class="label">Total Activities</div></div>
            <div class="stat-card"><div class="count" id="todayActivities">0</div><div class="label">Today</div></div>
            <div class="stat-card"><div class="count" id="userActivities">0</div><div class="label">Your Activities</div></div>
            <div class="stat-card"><div class="count" id="systemActivities">0</div><div class="label">System Events</div></div>
        </div>
        
        <div class="filter-bar">
            <div class="filter-group"><label>Start Date</label><input type="date" id="startDate"></div>
            <div class="filter-group"><label>End Date</label><input type="date" id="endDate"></div>
            <div class="filter-group"><label>Action Type</label>
                <select id="actionType">
                    <option value="all">All Actions</option>
                    <option value="create">Create</option>
                    <option value="update">Update</option>
                    <option value="delete">Delete</option>
                    <option value="login">Login</option>
                </select>
            </div>
            <div class="filter-group"><label>User</label><input type="text" id="userIdFilter" placeholder="User ID or Email"></div>
            <button class="btn-primary" id="applyFilterBtn"><i class="fas fa-search"></i> Search</button>
            <button class="btn-primary" id="exportLogBtn" style="background:#64748b;"><i class="fas fa-download"></i> Export</button>
        </div>
        
        <div class="card">
            <div class="card-header"><h3><i class="fas fa-list"></i> Activity Timeline</h3><span id="recordCount"></span></div>
            <div class="card-body">
                <table class="data-table" id="activityTable">
                    <thead><tr><th>Time</th><th>User</th><th>Action</th><th>Module</th><th>Description</th><th>IP Address</th></tr></thead>
                    <tbody id="activityList"><tr><td colspan="6" style="text-align:center;padding:40px;">Loading activities...</td></tr></tbody>
                </table>
            </div>
        </div>
        
        <footer><p>© 2025 DIGIBIZ Universal - Complete Business Management Platform</p></footer>
    </div>

    <script>
        let currentBusinessId = null;
        let currentUserId = null;
        
        function formatTime(timestamp){
            if(!timestamp) return '-';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return date.toLocaleString();
        }
        
        function getActionBadge(action){
            const badges = {
                create: '<span class="badge badge-create"><i class="fas fa-plus"></i> Create</span>',
                update: '<span class="badge badge-update"><i class="fas fa-edit"></i> Update</span>',
                delete: '<span class="badge badge-delete"><i class="fas fa-trash"></i> Delete</span>',
                login: '<span class="badge badge-login"><i class="fas fa-sign-in-alt"></i> Login</span>'
            };
            return badges[action] || '<span class="badge">' + action + '</span>';
        }
        
        async function loadActivities(){
            if(!currentBusinessId) return;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const actionType = document.getElementById('actionType').value;
            const userIdFilter = document.getElementById('userIdFilter').value;
            
            let query = db.collection('activityLogs').doc(currentBusinessId).collection('entries').orderBy('createdAt', 'desc');
            
            if(startDate){
                const start = new Date(startDate);
                start.setHours(0,0,0,0);
                query = query.where('createdAt', '>=', start);
            }
            if(endDate){
                const end = new Date(endDate);
                end.setHours(23,59,59,999);
                query = query.where('createdAt', '<=', end);
            }
            
            const snapshot = await query.get();
            let activities = [];
            snapshot.forEach(doc => activities.push({id: doc.id, ...doc.data()}));
            
            if(actionType !== 'all') activities = activities.filter(a => a.action === actionType);
            if(userIdFilter) activities = activities.filter(a => a.userId?.includes(userIdFilter) || a.userEmail?.includes(userIdFilter));
            
            document.getElementById('totalActivities').innerHTML = activities.length;
            document.getElementById('todayActivities').innerHTML = activities.filter(a => {
                const date = a.createdAt?.toDate?.() || new Date(a.createdAt);
                const today = new Date();
                return date.toDateString() === today.toDateString();
            }).length;
            document.getElementById('userActivities').innerHTML = activities.filter(a => a.userId === currentUserId).length;
            document.getElementById('systemActivities').innerHTML = activities.filter(a => a.userId === 'system').length;
            document.getElementById('recordCount').innerHTML = `${activities.length} records`;
            
            let html = '';
            for(const act of activities){
                html += `<tr>
                    <td>${formatTime(act.createdAt)}</td>
                    <td>${act.userEmail || act.userId?.substring(0,8) || 'System'}</td>
                    <td>${getActionBadge(act.action)}</td>
                    <td>${act.module || '-'}</td>
                    <td>${act.description || '-'}</td>
                    <td>${act.ipAddress || '-'}</td>
                </table>`;
            }
            document.getElementById('activityList').innerHTML = html || '<tr><td colspan="6" style="text-align:center;padding:40px;">No activities found</td></tr>';
        }
        
        function exportLog(){
            alert('Export feature coming soon - will export as CSV');
        }
        
        // Set default dates
        const today = new Date();
        const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
        document.getElementById('startDate').value = firstDay.toISOString().split('T')[0];
        document.getElementById('endDate').value = today.toISOString().split('T')[0];
        
        document.getElementById('applyFilterBtn').onclick = loadActivities;
        document.getElementById('exportLogBtn').onclick = exportLog;
        
        auth.onAuthStateChanged(async(user)=>{
            if(!user){ window.location.href='/'; return; }
            currentUserId = user.uid;
            const userDoc = await db.collection('users').doc(user.uid).get();
            currentBusinessId = userDoc.exists ? (userDoc.data().businessId || user.uid) : user.uid;
            await loadActivities();
        });
        
        // Log activity when page loads
        if(window.eventBus){
            window.eventBus.subscribe('ACTIVITY_LOGGED', () => loadActivities(), 'ActivityLog');
        }
    </script>
</body>
</html>
