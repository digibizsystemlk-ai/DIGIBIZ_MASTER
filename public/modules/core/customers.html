<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="/core/pwa-init.js?v=1"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Customers - DIGIBIZ</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        html.digibiz-sidebar-reserved body{margin-left:260px;}
        @media (max-width:768px){html.digibiz-sidebar-reserved body{margin-left:0;}}
        
        :root {
            --primary: #0ea5e9;
            --primary-dark: #0284c7;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 16px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        body{font-family:'Outfit', system-ui, sans-serif; background:var(--bg); margin:0; color:var(--text); -webkit-font-smoothing:antialiased;}
        .wrap{padding:30px; max-width:1600px; margin:0 auto;}
        
        .head{margin-bottom:30px; display:flex; justify-content:space-between; align-items:flex-end;}
        .head h1{margin:0; font-size:32px; font-weight:800; color:var(--text); letter-spacing:-0.02em;}
        .head p{margin:4px 0 0; color:var(--text-muted); font-size:15px;}
        
        .grid{display:grid; grid-template-columns:380px 1fr; gap:24px; align-items:start;}
        .card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:24px; box-shadow:var(--shadow); transition:transform 0.2s, box-shadow 0.2s;}
        .card:hover{box-shadow:var(--shadow-lg);}
        
        .section-title{font-size:18px; font-weight:700; margin:0 0 20px; display:flex; align-items:center; gap:8px; color:var(--text);}
        .section-title i { color: var(--primary); }

        .form-group{margin-bottom:16px;}
        label{font-size:13px; font-weight:600; color:var(--text-muted); display:block; margin-bottom:6px; text-transform:uppercase; letter-spacing:0.02em;}
        input, select, textarea{
            width:100%; padding:12px 14px; border:1.5px solid var(--border); border-radius:12px; 
            font-family:inherit; font-size:15px; color:var(--text); transition:all 0.2s; background:#fff;
            box-sizing:border-box;
        }
        input:focus, select:focus, textarea:focus{outline:none; border-color:var(--primary); box-shadow:0 0 0 4px rgba(14, 165, 233, 0.1);}
        
        .row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
        
        button{
            border:none; border-radius:12px; padding:12px 20px; background:var(--primary); color:#fff; 
            font-weight:700; font-size:15px; cursor:pointer; transition:all 0.2s; display:inline-flex; align-items:center; justify-content:center; gap:8px;
        }
        button:hover{background:var(--primary-dark); transform:translateY(-1px); box-shadow:0 4px 12px rgba(14, 165, 233, 0.3);}
        button:active{transform:translateY(0);}

        .table-card{padding:0; overflow:hidden;}
        .table-header{padding:20px 24px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; background:#fafafa;}
        .search-wrap{position:relative; width:300px;}
        .search-wrap input{padding-left:40px; background:#fff;}
        .search-wrap::before{content:'🔍'; position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:14px; opacity:0.5;}

        .table-wrap{overflow-x:auto;}
        table{width:100%; border-collapse:collapse; font-size:14px;}
        th{background:#f8fafc; padding:16px 24px; text-align:left; font-weight:700; color:var(--text-muted); text-transform:uppercase; font-size:11px; letter-spacing:0.05em; border-bottom:1px solid var(--border);}
        td{padding:16px 24px; border-bottom:1px solid var(--border); vertical-align:middle;}
        tr:hover{background:#f1f5f9/30;}
        
        .name-cell{font-weight:600; color:var(--text);}
        .phone-cell{font-family:monospace; font-size:13px; color:var(--text-muted);}
        
        .whatsapp-link{
            display:inline-flex; align-items:center; gap:6px; text-decoration:none; color:#16a34a; 
            font-weight:600; font-size:13px; background:#dcfce7; padding:4px 10px; border-radius:8px; transition:all 0.2s;
        }
        .whatsapp-link:hover{background:#bbf7d0; transform:scale(1.05);}

        .tag{font-size:11px; padding:4px 10px; border-radius:8px; font-weight:700; text-transform:uppercase; display:inline-block; letter-spacing:0.02em;}
        .tag-supplier{background:#e0f2fe; color:#0369a1;}
        .tag-buyer{background:#fef3c7; color:#92400e;}
        .tag-customer{background:#f1f5f9; color:#475569;}
        
        .actions{display:flex; gap:8px;}
        .btn-icon{
            background:none; border:none; padding:8px; border-radius:8px; cursor:pointer; 
            transition:all 0.2s; font-size:16px; width:36px; height:36px; display:flex; align-items:center; justify-content:center;
        }
        .btn-edit{color:var(--primary); background:rgba(14, 165, 233, 0.1);}
        .btn-edit:hover{background:var(--primary); color:#fff;}
        .btn-del{color:#ef4444; background:rgba(239, 68, 68, 0.1);}
        .btn-del:hover{background:#ef4444; color:#fff;}

        .muted{color:var(--text-muted); font-size:12px; margin-top:8px;}
        #msg, #bulkMsg{font-size:13px; font-weight:600; margin-top:12px; padding:8px 12px; border-radius:8px; display:none;}

        /* Modal Styles */
        .modal{display:none; position:fixed; inset:0; z-index:10000; background:rgba(15,23,42,0.6); backdrop-filter:blur(4px); align-items:center; justify-content:center; padding:16px;}
        .modal.is-open{display:flex !important;}
        .modal-content{background:#fff; border-radius:24px; max-width:500px; width:100%; padding:30px; box-shadow:0 25px 50px -12px rgba(0,0,0,0.25); position:relative; animation:modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);}
        @keyframes modalPop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-close{position:absolute; top:20px; right:20px; cursor:pointer; font-size:24px; color:var(--text-muted); line-height:1; transition:color 0.2s;}
        .modal-close:hover{color:var(--text);}
        .modal-header{margin-bottom:24px;}
        .modal-header h3{margin:0; font-size:22px; font-weight:800;}

        @media (max-width:1100px){ .grid{grid-template-columns:1fr;} .card-sticky{position:static;} }
        .card-sticky{position:sticky; top:30px;}
    </style>
</head>
<body>
<script>document.documentElement.classList.add('digibiz-sidebar-reserved');</script>
<div class="wrap">
    <div class="head">
        <div>
            <h1>Customer Directory</h1>
            <p>Manage your business contacts, suppliers, and buyers in one place.</p>
        </div>
    </div>

    <div class="grid">
        <div class="card-sticky">
            <div class="card">
                <h3 class="section-title">👤 Add / Update Customer</h3>
                <datalist id="mwCustomerNameDatalist"></datalist>
                
                <div class="form-group">
                    <label>Full Name</label>
                    <input id="fullName" placeholder="Enter name..." autocomplete="name">
                </div>
                
                <div class="row">
                    <div class="form-group">
                        <label>Mobile</label>
                        <input id="mobile" placeholder="07XXXXXXXX">
                    </div>
                    <div class="form-group">
                        <label>WhatsApp</label>
                        <input id="whatsapp" placeholder="07XXXXXXXX">
                    </div>
                </div>

                <div class="form-group">
                    <label>Contact Type</label>
                    <select id="context">
                        <option value="Supplier">Supplier</option>
                        <option value="Buyer">Buyer</option>
                        <option value="Customer">Customer</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Address</label>
                    <input id="address" placeholder="Physical address...">
                </div>

                <button id="saveBtn" style="width:100%;">Save Customer Details</button>
                <div id="msg"></div>
                <p class="muted">First name is auto-extracted for personalized SMS.</p>
            </div>

            <div class="card" id="bulkBox" style="margin-top:24px; display:none;">
                <h3 class="section-title">📦 Bulk Import (Scrap)</h3>
                <div class="form-group">
                    <label>Import Type</label>
                    <select id="bulkType">
                        <option value="Registered Supplier">Registered Supplier</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Paste List (Name Phone)</label>
                    <textarea id="bulkList" placeholder="John 077...\nJane 071..." style="height:100px;"></textarea>
                </div>
                <button id="bulkImportBtn" style="width:100%; background:#64748b;">Import List</button>
                <div id="bulkMsg"></div>
            </div>
        </div>

        <div class="card table-card">
            <div class="table-header">
                <h3 style="margin:0; font-size:18px; font-weight:700;">Directory Entries</h3>
                <div class="search-wrap">
                    <input id="search" placeholder="Search by name, phone...">
                </div>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Phone</th>
                            <th>WhatsApp</th>
                            <th>Type</th>
                            <th>Address</th>
                            <th>Spent</th>
                            <th style="width:80px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="rows">
                        <tr><td colspan="7" style="text-align:center; padding:40px; color:var(--text-muted);">Loading contacts...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div id="editCustomerModal" class="modal">
    <div class="modal-content">
        <span class="modal-close edit-modal-close">&times;</span>
        <div class="modal-header">
            <h3>Edit Profile</h3>
        </div>
        <input type="hidden" id="editCustomerId">
        <input type="hidden" id="editCustomerType">
        
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="editCustomerName" autocomplete="name">
        </div>
        
        <div class="row">
            <div class="form-group">
                <label>Mobile</label>
                <input type="text" id="editCustomerPhone" autocomplete="tel">
            </div>
            <div class="form-group">
                <label>WhatsApp</label>
                <input type="text" id="editCustomerWhatsapp" autocomplete="tel">
            </div>
        </div>
        
        <div class="form-group">
            <label>Address</label>
            <input type="text" id="editCustomerAddress">
        </div>
        
        <div class="row">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="editCustomerEmail" autocomplete="email">
            </div>
            <div class="form-group">
                <label>Credit Limit</label>
                <input type="number" id="editCustomerCreditLimit" step="0.01">
            </div>
        </div>
        
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:10px;">
            <button type="button" id="saveCustomerEditBtn">Update Profile</button>
            <button type="button" id="cancelCustomerEditBtn" style="background:#f1f5f9; color:var(--text-muted);">Cancel</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
<script src="/core/firebase-init.js?v=1"></script>
<script src="/core/auth-roles.js?v=47"></script>
<script src="/core/mw-trading-dsl-config.js?v=2"></script>
<script src="/core/dashboard-core.js?v=63"></script>
<script src="/core/sidebar.js?v=62"></script>
<script src="/modules/core/customers.js?v=6"></script>
</body>
</html>
