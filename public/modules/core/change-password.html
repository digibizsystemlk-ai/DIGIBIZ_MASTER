<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="/core/pwa-init.js?v=1"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - DIGIBIZ</title>
    <style>html.digibiz-sidebar-reserved body{margin-left:260px;}@media (max-width:768px){html.digibiz-sidebar-reserved body{margin-left:0;}}</style>
    <script>document.documentElement.classList.add('digibiz-sidebar-reserved');</script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
    <script src="/core/firebase-init.js?v=100"></script>
    <script src="/scripts/admin-impersonation.js?v=100"></script>
    <script src="/core/sidebar.js?v=1030"></script>
    <style>
        body{font-family:Inter,system-ui,sans-serif;background:#f3f4f6;margin:0;color:#0f172a;}
        .wrap{max-width:560px;margin:24px auto;padding:20px;}
        .card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
        .card h2{margin:0 0 8px;}
        .sub{color:#64748b;font-size:13px;margin-bottom:12px;}
        label{display:block;font-size:12px;color:#334155;margin-bottom:4px;}
        input{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;margin-bottom:10px;box-sizing:border-box;}
        button{background:#0f766e;color:#fff;border:none;border-radius:8px;padding:10px 12px;cursor:pointer;width:100%;}
        .msg{margin-top:10px;font-size:13px;min-height:18px;}
        .ok{color:#166534}.err{color:#b91c1c}.warn{color:#92400e}
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <h2>Change Password</h2>
        <p class="sub" id="forceMsg"></p>
        <label>Current Password</label>
        <input type="password" id="currentPassword" placeholder="Enter current password">
        <label>New Password (min 6 characters)</label>
        <input type="password" id="newPassword" placeholder="Enter new password">
        <label>Confirm New Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm new password">
        <button id="saveBtn">Update Password</button>
        <div class="msg" id="msg"></div>
    </div>
</div>
<script src="/modules/core/change-password.js?v=1"></script>
</body>
</html>
