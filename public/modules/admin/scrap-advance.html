        body{font-family:Inter,Segoe UI,sans-serif;background:#f5f7fb;color:#0f172a;}
        .page{padding:20px;}
        .card{background:#fff;border:1px solid #dbe4ee;border-radius:12px;padding:16px;margin-bottom:12px;}
        .workspace{display:grid;grid-template-columns:minmax(340px, 440px) 1fr;gap:12px;align-items:start;}

<body>
<div class="page">
    <div class="workspace">
        <div class="card">
            <h1 style="margin:0 0 6px;">Advance</h1>
            <p class="muted" style="margin:0 0 10px;">Record cash advances to suppliers (Current Asset).</p>
            <div class="form-grid">
                <div>
                    <input id="supplierName" list="supplierList" placeholder="Supplier Name (Registered only)">
                    <datalist id="supplierList"></datalist>
                </div>
                <input id="advanceAmount" type="number" step="0.01" placeholder="Amount">
                <select id="issueMethod"><option value="CASH">Cash</option><option value="BANK">Bank</option></select>
                <input id="advanceNote" placeholder="Note">
                <button id="issueAdvanceBtn">Issue Advance</button>
            </div>
            <div class="sub-box">
                <h4 style="margin:0 0 6px;">Receive Advance Back</h4>
                <div class="form-grid">
                    <input id="receiveSupplierName" list="supplierList" placeholder="Supplier Name">
                    <input id="receiveAmount" type="number" step="0.01" min="0" placeholder="Received Amount">
                    <select id="receiveMethod"><option value="CASH">Cash</option><option value="BANK">Bank</option></select>
                    <input id="receiveNote" placeholder="Note">
                    <button id="receiveAdvanceBtn" style="background:#1d4ed8;">Receive Advance</button>
                </div>
            </div>
            <div id="advMsg" class="msg muted"></div>
            <div id="smsDebugBadge" class="small" style="margin-top:8px;display:none;padding:8px;border-radius:8px;"></div>
        </div>
        <div class="card">
            <h3 style="margin:0 0 8px;">Current Advance Balances</h3>
            <div class="muted" style="margin:6px 0 10px;">Total Advances (Asset): <b id="advTotal">LKR 0.00</b></div>
            <table><thead><tr><th>Supplier</th><th>Balance</th><th>Updated</th><th>Action</th></tr></thead><tbody id="balanceBody"></tbody></table>
        </div>
    </div>
</div>
<div id="advanceDetailModal" class="modal">
    <div class="modal-card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
            <h3 id="advanceDetailTitle" style="margin:0;">Last 14 Days - Advance Details</h3>
            <button id="closeAdvanceDetailBtn" style="background:#334155;padding:6px 10px;">Close</button>
        </div>
        <div id="advanceDetailHint" class="muted" style="margin-top:6px;">Loading...</div>
        <div style="overflow:auto;margin-top:8px;">
            <table>
                <thead><tr><th>Date</th><th>Type</th><th>Change</th><th>Total After</th><th>Note</th></tr></thead>
                <tbody id="advanceDetailBody"><tr><td colspan="5">No supplier selected.</td></tr></tbody>
            </table>
        </div>
    </div>
</div>
<script>
const OWNER_UID = 'oDhSDYHQ2dV1DP33koysmZAqaY13';
const fmt = (v) => `LKR ${(Number(v)||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}`;
function advId(name){ return `ADV_${OWNER_UID}_${String(name||'').trim().toUpperCase().replace(/[^A-Z0-9]+/g,'_')}`; }
let registeredByName = {};
async function findSupplierPhoneByName(name) {
    const clean = String(name || '').trim();
    if (!clean) return '';
    const reg = registeredByName[clean.toLowerCase()];
    if (reg && (reg.mobile || reg.phone)) return String(reg.mobile || reg.phone || '').trim();
    const snap = await db.collection('customers')
        .where('businessId', '==', OWNER_UID)
        .where('fullName', '==', clean)
        .limit(1)
        .get()
        .catch(() => ({ empty: true, docs: [] }));
    if (!snap.empty) {
        const row = snap.docs[0].data() || {};
        return String(row.mobile || row.phone || '').trim();
    }
    return '';
}
function setAdvMsg(text, ok) {
    const el = document.getElementById('advMsg');
    if (!el) return;
    el.textContent = text || '';
    el.style.color = ok ? '#166534' : '#b91c1c';
}
function smsSkipReasonText(code) {
    if (code === 'event_disabled') return 'SMS skipped: advance event toggle is OFF.';
    if (code === 'no_phone') return 'SMS skipped: supplier phone number missing.';
    if (code === 'wallet_exhausted') return 'SMS skipped: SMS wallet exhausted.';
    if (code === 'quota_exhausted') return 'SMS skipped: Firestore quota exceeded (billing / daily limit).';
    if (code === 'permission') return 'SMS skipped: permission denied for SMS queue.';
    if (code === 'invalid_input') return 'SMS skipped: invalid phone/message input.';
    if (code === 'db_unavailable') return 'SMS skipped: database unavailable.';
    if (code === 'firestore_error') return 'SMS skipped: queue write failed (see detail below).';
    return `SMS skipped: ${code || 'unknown reason'}`;
}
function showSmsDebug(result, extraReason) {
    const el = document.getElementById('smsDebugBadge');
    if (!el) return;
    let ok = false;
    let txt = '';
    if (result && result.ok) {
        ok = true;
        if (result.via === 'rtdb_quota_fallback') {
            txt = 'SMS queued via Realtime Database (Firestore write quota exceeded). Gateway app should send; cloud wallet was not debited — reconcile when Firestore is available again.';
        } else if (result.fallback) {
            txt = 'SMS queued via direct gateway fallback.';
        } else {
            txt = 'SMS queued successfully.';
        }
    } else {
        txt = smsSkipReasonText(extraReason || (result && result.skipped));
        if (result && result.error) {
            txt += ' — ' + String(result.error);
        }
    }
    el.style.display = 'block';
    el.style.background = ok ? '#dcfce7' : '#fee2e2';
    el.style.color = ok ? '#14532d' : '#7f1d1d';
    el.style.border = `1px solid ${ok ? '#86efac' : '#fca5a5'}`;
    el.textContent = txt;
}
async function loadRegisteredSuppliers(){
    const snap = await db.collection('customers').where('businessId','==',OWNER_UID).limit(800).get().catch(()=>({docs:[]}));
    const list = document.getElementById('supplierList');
    registeredByName = {};
    const rows = snap.docs.map(d=>d.data()||{}).filter((r)=>r.archived !== true);
    const reg = rows.filter((r)=>String(r.type||r.context||'').toLowerCase().includes('registered'));
    if (list) {
        list.innerHTML = reg.map((r)=>{
            const name = String(r.fullName||'').trim();
            if (!name) return '';
            registeredByName[name.toLowerCase()] = r;
            return `<option value="${name.replace(/\"/g,'&quot;')}"></option>`;
        }).join('');
    }
}
async function loadBalances() {
    // Fallback-safe load: some older records may miss businessId or use customerName field.
    const snap = await db.collection('scrap_advances').limit(1200).get().catch(()=>({docs:[]}));
    const rows = snap.docs.map((d) => ({ id:d.id, ...(d.data()||{}) }))
        .filter((r)=>{
            const bid = String(r.businessId || '').trim();
            const isOwnerDoc = String((r.id || '')).startsWith(`ADV_${OWNER_UID}_`);
            return r.archived !== true && (bid === OWNER_UID || isOwnerDoc || !bid);
        })
        .map((r)=>({
            ...r,
            supplierName: String(r.supplierName || r.customerName || '').trim()
        }))
        .filter((r)=>!!r.supplierName && Number(r.balance || 0) > 0)
        .sort((a,b)=>String(a.supplierName||'').localeCompare(String(b.supplierName||'')));
    const total = rows.reduce((s,r)=>s + (Number(r.balance)||0), 0);
    const totalEl = document.getElementById('advTotal');
    if (totalEl) totalEl.textContent = fmt(total);
    document.getElementById('balanceBody').innerHTML = rows.map((r) => `<tr>
        <td><button data-name="${String(r.supplierName||'').replace(/"/g,'&quot;')}" style="padding:0;border:none;background:none;color:#1d4ed8;cursor:pointer;text-decoration:underline;">${r.supplierName||'-'}</button></td>
        <td>${fmt(r.balance||0)}</td>
        <td>${r.updatedAt?.toDate ? r.updatedAt.toDate().toLocaleString() : '-'}</td>
        <td><button data-edit="${r.id}" style="padding:6px 10px;background:#334155;">Edit</button></td>
    </tr>`).join('') || '<tr><td colspan="4">No balances</td></tr>';

    document.querySelectorAll('#balanceBody button[data-edit]').forEach((btn)=>{
        btn.addEventListener('click', async ()=>{
            const id = btn.getAttribute('data-edit');
            if (!id) return;
            const docRef = db.collection('scrap_advances').doc(id);
            const snap = await docRef.get().catch(()=>null);
            if (!snap || !snap.exists) return;
            const row = snap.data() || {};
            const prev = Number(row.balance) || 0;
            const name = String(row.supplierName || '').trim();
            const txt = prompt(`Enter new advance balance for ${name}:`, String(prev));
            if (txt == null) return;
            const next = Number(String(txt).replace(/,/g,''));
            if (!Number.isFinite(next) || next < 0) return alert('Invalid amount.');
            const delta = next - prev;
            if (!confirm(`Save new balance ${fmt(next)} (change: ${fmt(delta)}) ?`)) return;

            await docRef.set({
                balance: next,
                adjusted: true,
                adjustedAt: new Date().toISOString(),
                archived: false,
                archivedAt: null,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });

            await db.collection('scrap_advance_history').add({
                businessId: OWNER_UID,
                supplierName: name,
                amount: delta,
                note: 'Manual balance adjustment',
                date: new Date().toISOString(),
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                type: 'ADJUST'
            });

            if (window.scrapVbaCore?.postJournalEntry && Math.abs(delta) > 0.0001) {
                // Adjustment updates cash vs advance asset to reflect real-time settlement/issue.
                const entries = delta > 0
                    ? [
                        { accountCode: '1-1060-01', accountName: 'Supplier Advances (Scrap)', debit: Math.abs(delta), credit: 0 },
                        { accountCode: '1-1010-01', accountName: 'Cash', debit: 0, credit: Math.abs(delta) }
                    ]
                    : [
                        { accountCode: '1-1010-01', accountName: 'Cash', debit: Math.abs(delta), credit: 0 },
                        { accountCode: '1-1060-01', accountName: 'Supplier Advances (Scrap)', debit: 0, credit: Math.abs(delta) }
                    ];
                await window.scrapVbaCore.postJournalEntry(OWNER_UID, {
                    description: `Advance balance adjustment - ${name}`,
                    reference: name,
                    referenceType: 'SCRAP_ADVANCE_ADJUST',
                    date: new Date().toISOString(),
                    entries
                });
            }

            if (window.scrapVbaCore?.enqueuePendingSmsForScrap || window.scrapVbaCore?.enqueuePendingSms) {
                const enabled = window.scrapVbaCore.isScrapSmsEventEnabled
                    ? await window.scrapVbaCore.isScrapSmsEventEnabled(OWNER_UID, 'advance')
                    : false;
                const phone = String(row.supplierMobile || row.mobile || '') || await findSupplierPhoneByName(name);
                if (enabled && phone) {
                    const smsSnap = await db.collection('scrap_sms_settings').doc(OWNER_UID).get().catch(()=>null);
                    const sms = smsSnap && smsSnap.exists ? (smsSnap.data()||{}) : {};
                    const tpl = String(sms.tplAdvance || 'Hi {{name}},\nYour Advance Balance Updated.\nAdv due : {{amount}}\nDate: {{date}}');
                    const msg = window.scrapVbaCore.renderTemplate
                        ? window.scrapVbaCore.renderTemplate(tpl, {
                            name,
                            amount: `Rs. ${Math.round(next).toLocaleString()}/=`,
                            date: new Date().toLocaleString()
                        })
                        : window.scrapVbaCore.buildAdvanceBalanceMessage(name, next, new Date().toISOString());
                    const smsRes = await (typeof window.scrapVbaCore.enqueuePendingSmsForScrap === 'function'
                        ? window.scrapVbaCore.enqueuePendingSmsForScrap(phone, msg)
                        : window.scrapVbaCore.enqueuePendingSms(OWNER_UID, phone, msg));
                    showSmsDebug(smsRes);
                } else {
                    showSmsDebug(null, enabled ? 'no_phone' : 'event_disabled');
                }
            }

            await loadBalances();
        });
    });
    document.querySelectorAll('#balanceBody button[data-name]').forEach((btn)=>{
        btn.addEventListener('click', async ()=>{
            const name = String(btn.getAttribute('data-name') || '').trim();
            if (!name) return;
            await loadAdvanceDetails(name);
        });
    });
}
async function loadAdvanceDetails(supplierName){
    const hint = document.getElementById('advanceDetailHint');
    const body = document.getElementById('advanceDetailBody');
    if (!body) return;
    const snap = await db.collection('scrap_advance_history')
        .where('businessId','==',OWNER_UID)
        .where('supplierName','==',supplierName)
        .limit(2000)
        .get()
        .catch(()=>({docs:[]}));
    const rowsAsc = snap.docs.map((d)=>({ id:d.id, ...(d.data() || {}) }))
        .sort((a,b)=>String(a.date || '').localeCompare(String(b.date || '')));
    let running = 0;
    let lastZeroIdx = -1;
    const withTotals = rowsAsc.map((x, idx)=>{
        const amt = Number(x.amount || 0);
        running += amt;
        if (Math.abs(running) < 0.0001) lastZeroIdx = idx;
        return { ...x, runningAfter: running };
    });
    const cycleRows = withTotals.slice(lastZeroIdx + 1);
    const rows = cycleRows.slice().sort((a,b)=>String(b.date || '').localeCompare(String(a.date || '')));
    if (hint) hint.textContent = `Supplier: ${supplierName} | Active cycle records: ${rows.length} (history resets after balance reaches 0)`;
    const title = document.getElementById('advanceDetailTitle');
    if (title) title.textContent = `Advance Details (${supplierName})`;
    body.innerHTML = rows.map((x)=>{
        const dt = x.date ? new Date(x.date).toLocaleString() : '-';
        const amt = Number(x.amount || 0);
        const sign = amt >= 0 ? '+' : '-';
        const tone = amt >= 0 ? '#166534' : '#b91c1c';
        const type = String(x.type || (amt >= 0 ? 'ISSUE' : 'ADJUST')).toUpperCase();
        const note = String(x.note || '-');
        return `<tr><td>${dt}</td><td>${type}</td><td style="color:${tone};font-weight:700;">${sign} ${fmt(Math.abs(amt))}</td><td><b>${fmt(x.runningAfter)}</b></td><td>${note}</td></tr>`;
    }).join('') || '<tr><td colspan="5">No records for active cycle.</td></tr>';
    const modal = document.getElementById('advanceDetailModal');
    if (modal) modal.classList.add('open');
}
async function issueAdvance() {
    const supplierName = String(document.getElementById('supplierName').value||'').trim();
    const amount = Number(document.getElementById('advanceAmount').value)||0;
    const note = String(document.getElementById('advanceNote').value||'').trim();
    if (!supplierName || amount <= 0) { setAdvMsg('Supplier and amount required.', false); return; }
    const pick = registeredByName[supplierName.toLowerCase()];
    if (!pick) { setAdvMsg('Select a Registered supplier from the dropdown.', false); return; }
    if (!confirm(`Confirm advance issue?\n\nSupplier: ${supplierName}\nAmount: ${fmt(amount)}\nNote: ${note || '-'}`)) return;
    const ref = db.collection('scrap_advances').doc(advId(supplierName));
    const snap = await ref.get();
    const prev = snap.exists ? (Number(snap.data().balance)||0) : 0;
    const next = prev + amount;
    await ref.set({
        businessId: OWNER_UID,
        supplierName,
        supplierMobile: String(pick.mobile||''),
        balance: next,
        note,
        archived: false,
        archivedAt: null,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
    await db.collection('scrap_advance_history').add({ businessId: OWNER_UID, supplierName, amount, note, date: new Date().toISOString(), createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    if (window.scrapVbaCore?.postJournalEntry) {
        const issueMethod = String(document.getElementById('issueMethod')?.value || 'CASH').toUpperCase();
        const creditLine = issueMethod === 'BANK'
            ? { accountCode: '1-1020-01', accountName: 'Bank - Current Account', debit: 0, credit: amount }
            : { accountCode: '1-1010-01', accountName: 'Cash - Main', debit: 0, credit: amount };
        await window.scrapVbaCore.postJournalEntry(OWNER_UID, {
            description: `Advance issued - ${supplierName}`,
            reference: supplierName,
            referenceType: 'SCRAP_ADVANCE_ISSUE',
            date: new Date().toISOString(),
            entries: [
                { accountCode: '1-1060-01', accountName: 'Supplier Advances (Scrap)', debit: amount, credit: 0 },
                creditLine
            ]
        });
    }

    if (window.scrapVbaCore?.enqueuePendingSmsForScrap || window.scrapVbaCore?.enqueuePendingSms) {
        const enabled = window.scrapVbaCore.isScrapSmsEventEnabled
            ? await window.scrapVbaCore.isScrapSmsEventEnabled(OWNER_UID, 'advance')
            : false;
        const phone = String(pick.mobile || '') || await findSupplierPhoneByName(supplierName);
        if (enabled && phone) {
            const smsSnap = await db.collection('scrap_sms_settings').doc(OWNER_UID).get().catch(()=>null);
            const sms = smsSnap && smsSnap.exists ? (smsSnap.data()||{}) : {};
            const tpl = String(sms.tplAdvance || 'Hi {{name}},\nYour Advance Balance Updated.\nAdv due : {{amount}}\nDate: {{date}}');
            const msg = window.scrapVbaCore.renderTemplate
                ? window.scrapVbaCore.renderTemplate(tpl, {
                    name: supplierName,
                    amount: `Rs. ${Math.round(next).toLocaleString()}/=`,
                    date: new Date().toLocaleString()
                })
                : window.scrapVbaCore.buildAdvanceBalanceMessage(supplierName, next, new Date().toISOString());
            const smsRes = await (typeof window.scrapVbaCore.enqueuePendingSmsForScrap === 'function'
                ? window.scrapVbaCore.enqueuePendingSmsForScrap(phone, msg)
                : window.scrapVbaCore.enqueuePendingSms(OWNER_UID, phone, msg));
            showSmsDebug(smsRes);
        } else {
            showSmsDebug(null, enabled ? 'no_phone' : 'event_disabled');
        }
    }

    document.getElementById('advanceAmount').value = '';
    document.getElementById('advanceNote').value = '';
    await loadBalances();
    setAdvMsg(`Advance saved for ${supplierName}.`, true);
}
async function receiveAdvanceBack(supplierNameArg, amountArg, noteArg) {
    const supplierName = String(supplierNameArg || document.getElementById('receiveSupplierName').value || '').trim();
    const amount = Number(amountArg != null ? amountArg : document.getElementById('receiveAmount').value) || 0;
    const note = String(noteArg != null ? noteArg : document.getElementById('receiveNote').value || '').trim();
    if (!supplierName || amount <= 0) { setAdvMsg('Receive section: supplier and amount required.', false); return; }
    const ref = db.collection('scrap_advances').doc(advId(supplierName));
    const snap = await ref.get();
    if (!snap.exists) { setAdvMsg(`No advance balance found for ${supplierName}.`, false); return; }
    const row = snap.data() || {};
    const prev = Number(row.balance || 0);
    if (prev <= 0) { setAdvMsg(`${supplierName} has no pending advance balance.`, false); return; }
    if (amount > prev) { setAdvMsg(`Received amount cannot exceed current balance (${fmt(prev)}).`, false); return; }
    const next = prev - amount;
    if (!confirm(`Confirm receiving advance back?\n\nSupplier: ${supplierName}\nReceived: ${fmt(amount)}\nCurrent: ${fmt(prev)}\nRemaining: ${fmt(next)}`)) return;

    await ref.set({
        businessId: OWNER_UID,
        supplierName,
        supplierMobile: String(row.supplierMobile || await findSupplierPhoneByName(supplierName) || ''),
        balance: next,
        archived: false,
        archivedAt: null,
        note: note || row.note || '',
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
    await db.collection('scrap_advance_history').add({
        businessId: OWNER_UID,
        supplierName,
        amount: -Math.abs(amount),
        note: note || 'Advance received back',
        date: new Date().toISOString(),
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        type: 'RECEIVED'
    });
    if (window.scrapVbaCore?.postJournalEntry) {
        const receiveMethod = String(document.getElementById('receiveMethod')?.value || 'CASH').toUpperCase();
        const debitLine = receiveMethod === 'BANK'
            ? { accountCode: '1-1020-01', accountName: 'Bank - Current Account', debit: Math.abs(amount), credit: 0 }
            : { accountCode: '1-1010-01', accountName: 'Cash - Main', debit: Math.abs(amount), credit: 0 };
        await window.scrapVbaCore.postJournalEntry(OWNER_UID, {
            description: `Advance received back - ${supplierName}`,
            reference: supplierName,
            referenceType: 'SCRAP_ADVANCE_RECEIVED',
            date: new Date().toISOString(),
            entries: [
                debitLine,
                { accountCode: '1-1060-01', accountName: 'Supplier Advances (Scrap)', debit: 0, credit: Math.abs(amount) }
            ]
        });
    }

    if (window.scrapVbaCore?.enqueuePendingSmsForScrap || window.scrapVbaCore?.enqueuePendingSms) {
        const enabled = window.scrapVbaCore.isScrapSmsEventEnabled
            ? await window.scrapVbaCore.isScrapSmsEventEnabled(OWNER_UID, 'advance')
            : false;
        const phone = String(row.supplierMobile || await findSupplierPhoneByName(supplierName) || '');
        if (enabled && phone) {
            const smsSnap = await db.collection('scrap_sms_settings').doc(OWNER_UID).get().catch(()=>null);
            const sms = smsSnap && smsSnap.exists ? (smsSnap.data()||{}) : {};
            const tpl = String(sms.tplAdvance || 'Hi {{name}},\nYour Advance Balance Updated.\nAdv due : {{amount}}\nDate: {{date}}');
            const msg = window.scrapVbaCore.renderTemplate
                ? window.scrapVbaCore.renderTemplate(tpl, {
                    name: supplierName,
                    amount: `Rs. ${Math.round(next).toLocaleString()}/=`,
                    date: new Date().toLocaleString()
                })
                : window.scrapVbaCore.buildAdvanceBalanceMessage(supplierName, next, new Date().toISOString());
            const smsRes = await (typeof window.scrapVbaCore.enqueuePendingSmsForScrap === 'function'
                ? window.scrapVbaCore.enqueuePendingSmsForScrap(phone, msg)
                : window.scrapVbaCore.enqueuePendingSms(OWNER_UID, phone, msg));
            showSmsDebug(smsRes);
        } else {
            showSmsDebug(null, enabled ? 'no_phone' : 'event_disabled');
        }
    }

    document.getElementById('receiveSupplierName').value = '';
    document.getElementById('receiveAmount').value = '';
    document.getElementById('receiveNote').value = '';
    await loadBalances();
    setAdvMsg(`Advance received back from ${supplierName}.`, true);
}
document.getElementById('issueAdvanceBtn').addEventListener('click', issueAdvance);
document.getElementById('receiveAdvanceBtn').addEventListener('click', ()=>receiveAdvanceBack());
document.getElementById('closeAdvanceDetailBtn').addEventListener('click', ()=>{
    const modal = document.getElementById('advanceDetailModal');
    if (modal) modal.classList.remove('open');
});
document.getElementById('advanceDetailModal').addEventListener('click', (e)=>{
    if (e.target && e.target.id === 'advanceDetailModal') {
        e.currentTarget.classList.remove('open');
    }
});
auth.onAuthStateChanged(async (user) => {
    if (!user) { window.location.href='../../auth/login.html'; return; }
    const userDoc = await db.collection('users').doc(user.uid).get();
    const businessId = userDoc.exists ? (userDoc.data().businessId || user.uid) : user.uid;
    const bizDoc = await db.collection('businesses').doc(businessId).get();
    const businessType = bizDoc.exists ? String(bizDoc.data().businessType || '').toLowerCase() : '';
    if (user.uid !== OWNER_UID || businessType !== 'scrap_collection_center') { window.location.href = '/modules/core/dashboard.html'; return; }
    await loadRegisteredSuppliers();
    await loadBalances();
});
</script>
</body>
</html>
