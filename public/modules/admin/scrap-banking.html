<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <script src="/core/pwa-init.js?v=1"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>බැංකු සහ හුවමාරු (Banking) — Scrap</title>
    <style>html.digibiz-sidebar-reserved body{margin-left:260px;}@media (max-width:768px){html.digibiz-sidebar-reserved body{margin-left:0;}}</style>
    <script>document.documentElement.classList.add('digibiz-sidebar-reserved');</script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
    <script src="/core/firebase-init.js?v=100"></script>
    <script src="/scripts/admin-impersonation.js?v=100"></script>
    <script src="../../core/auth-roles.js?v=120"></script>
    <script src="../../core/sidebar.js?v=1020"></script>
    <script src="../../core/scrap-vba-core.js?v=76"></script>
    <style>
        body{font-family:Inter,Segoe UI,sans-serif;background:#f0f9ff;color:#0f172a;margin:0;}
        .page{padding:15px;max-width:900px;margin:0 auto;}
        .header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .header-icon { background: #0369a1; color: #fff; width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 4px 12px rgba(3,105,161,0.2); }
        .card{background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:24px;margin-bottom:15px;box-shadow:0 4px 6px -1px rgba(0,0,0,0.05);}
        h1{font-size:22px;color:#0f172a;margin:0;}
        p.subtitle { color: #64748b; font-size: 14px; margin: 5px 0 0; }
        label{display:block;font-size:11px;font-weight:700;color:#64748b;margin-top:16px;text-transform:uppercase;letter-spacing:0.05em;}
        input,select,textarea{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:12px;box-sizing:border-box;font-size:15px;transition:all 0.2s;background: #f8fafc;}
        input:focus,select:focus,textarea:focus{border-color:#0369a1;outline:none;box-shadow:0 0 0 4px rgba(3,105,161,0.1); background: #fff;}
        .type-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
        .type-btn { padding: 15px; border-radius: 12px; border: 2px solid #e2e8f0; cursor: pointer; text-align: center; transition: all 0.2s; background: #fff; }
        .type-btn i { display: block; font-size: 20px; margin-bottom: 5px; font-style: normal; }
        .type-btn span { font-weight: 700; font-size: 13px; }
        .type-btn.active { border-color: #0369a1; background: #f0f9ff; color: #0369a1; }
        
        button#saveBtn { background: #0369a1; color: #fff; border: none; padding: 16px 20px; border-radius: 14px; cursor: pointer; font-weight: 700; font-size: 16px; margin-top: 24px; width: 100%; transition: all 0.2s; box-shadow: 0 4px 12px rgba(3,105,161,0.2); }
        button#saveBtn:hover { background: #075985; transform: translateY(-1px); }
        button#saveBtn:active { transform: translateY(0); }
        button#saveBtn:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }

        table{width:100%;border-collapse:collapse;font-size:14px;margin-top:15px;}
        th,td{padding:14px 12px;border-bottom:1px solid #f1f5f9;text-align:left;}
        th{background:#f8fafc;font-weight:700;color:#64748b;text-transform:uppercase;font-size:11px;letter-spacing:0.05em;}
        .num{text-align:right;font-weight:700; font-family: 'JetBrains Mono', monospace;}
        .badge { display: inline-block; padding: 4px 8px; border-radius: 8px; font-size: 11px; font-weight: 700; }
        .badge-c2b { background: #dcfce7; color: #166534; }
        .badge-b2c { background: #fee2e2; color: #991b1b; }
        
        @media (max-width:600px) {
            .mobile-hide { display: none !important; }
            th, td { padding: 12px 6px; }
        }
    </style>
</head>
<body>
<div class="page">
    <div class="header">
        <div class="header-icon">🏦</div>
        <div>
            <h1>බැංකු සහ මුදල් හුවමාරු (Banking)</h1>
            <p class="subtitle">අතේ ඇති මුදල් සහ බැංකු ගිණුම අතර ගනුදෙනු කළමනාකරණය.</p>
        </div>
    </div>

    <div class="card">
        <label>හුවමාරු වර්ගය (Transfer Type)</label>
        <div class="type-selector">
            <div class="type-btn active" onclick="setType('C2B', this)">
                <i>📥</i>
                <span>අතේ මුදල් බැංකුවට<br>(Cash to Bank)</span>
            </div>
            <div class="type-btn" onclick="setType('B2C', this)">
                <i>📤</i>
                <span>බැංකුවෙන් අතට මුදල්<br>(Bank to Cash)</span>
            </div>
        </div>
        
        <label for="transDate">දිනය</label>
        <input type="date" id="transDate">
        
        <label for="amount">මුදල (Rs)</label>
        <input type="number" id="amount" step="0.01" min="0" placeholder="0.00">
        
        <label for="note">සටහන (Note)</label>
        <textarea id="note" rows="2" placeholder="අමතර විස්තර..."></textarea>
        
        <button type="button" id="saveBtn">හුවමාරුව තහවුරු කරන්න (Confirm Transfer)</button>
    </div>

    <div class="card">
        <h2 style="font-size:17px;margin:0 0 15px; color:#1e293b;">මෑත ගනුදෙනු (Recent Transfers)</h2>
        <div style="overflow:auto;">
            <table>
                <thead>
                    <tr>
                        <th>දිනය</th>
                        <th>වර්ගය</th>
                        <th class="num">මුදල</th>
                        <th class="mobile-hide">සටහන</th>
                    </tr>
                </thead>
                <tbody id="transList">
                    <tr><td colspan="4" style="text-align:center; padding:30px; color:#94a3b8;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
let SCRAP_BUSINESS_ID = '';
let currentType = 'C2B';

function setType(type, el) {
    currentType = type;
    document.querySelectorAll('.type-btn').forEach(btn => btn.classList.remove('active'));
    el.classList.add('active');
}

const fmt = (v) => `Rs ${(Number(v) || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

async function loadHistory() {
    if (!SCRAP_BUSINESS_ID) return;
    try {
        const snap = await db.collection('scrap_banking_transfers')
            .where('businessId', '==', SCRAP_BUSINESS_ID)
            .limit(100)
            .get();
        
        let rows = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        // Sort locally to avoid index requirement
        rows.sort((a, b) => {
            const timeA = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0;
            const timeB = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0;
            return timeB - timeA;
        });

        document.getElementById('transList').innerHTML = rows.length 
            ? rows.map(r => `
                <tr>
                    <td><div style="font-size:13px; font-weight:600;">${r.date || '-'}</div></td>
                    <td>
                        <span class="badge ${r.type === 'C2B' ? 'badge-c2b' : 'badge-b2c'}">
                            ${r.type === 'C2B' ? 'Cash to Bank' : 'Bank to Cash'}
                        </span>
                    </td>
                    <td class="num">${fmt(r.amount).replace('Rs ','')}</td>
                    <td class="mobile-hide" style="font-size:12px; color:#64748b;">${String(r.note || '').slice(0, 40)}</td>
                </tr>
            `).join('')
            : '<tr><td colspan="4" style="text-align:center; padding:30px; color:#94a3b8;">තවම ගනුදෙනු නොමැත.</td></tr>';
    } catch (e) {
        console.error(e);
        document.getElementById('transList').innerHTML = '<tr><td colspan="4" style="color:red; text-align:center;">Error loading history.</td></tr>';
    }
}

document.getElementById('saveBtn').onclick = async function() {
    if (!SCRAP_BUSINESS_ID) return;
    const date = document.getElementById('transDate').value;
    const amount = Number(document.getElementById('amount').value) || 0;
    const note = document.getElementById('note').value.trim();

    if (!date) return alert('කරුණාකර දිනය තෝරන්න.');
    if (amount <= 0) return alert('කරුණාකර වලංගු මුදලක් ඇතුළත් කරන්න.');

    const confirmMsg = currentType === 'C2B' 
        ? `Rs. ${amount.toFixed(2)} ක මුදලක් බැංකුවට තැන්පත් කිරීම තහවුරු කරනවාද?` 
        : `Rs. ${amount.toFixed(2)} ක මුදලක් බැංකුවෙන් ලබා ගැනීම තහවුරු කරනවාද?`;

    if (!confirm(confirmMsg)) return;

    const btn = this;
    btn.disabled = true;
    btn.textContent = 'සුරකිමින් පවතී...';

    try {
        const payload = {
            businessId: SCRAP_BUSINESS_ID,
            type: currentType,
            amount: amount,
            date: date,
            note: note,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        await db.collection('scrap_banking_transfers').add(payload);

        // Post to Accounting (Journal)
        if (window.scrapVbaCore && typeof window.scrapVbaCore.postJournalEntry === 'function') {
            const GL_CASH = { accountCode: '1-1010-01', accountName: 'Cash - Main' };
            const GL_BANK = { accountCode: '1-1020-01', accountName: 'Bank - Current Account' };
            
            let entries = [];
            if (currentType === 'C2B') {
                // Cash to Bank: Bank Debit, Cash Credit
                entries = [
                    { ...GL_BANK, debit: amount, credit: 0 },
                    { ...GL_CASH, debit: 0, credit: amount }
                ];
            } else {
                // Bank to Cash: Cash Debit, Bank Credit
                entries = [
                    { ...GL_CASH, debit: amount, credit: 0 },
                    { ...GL_BANK, debit: 0, credit: amount }
                ];
            }

            await window.scrapVbaCore.postJournalEntry(SCRAP_BUSINESS_ID, {
                description: `Internal Transfer: ${currentType === 'C2B' ? 'Cash to Bank' : 'Bank to Cash'}`,
                reference: date,
                referenceType: 'INTERNAL_TRANSFER',
                date: date,
                entries: entries
            });
        }

        alert('ගනුදෙනුව සාර්ථකව සුරකින ලදී.');
        document.getElementById('amount').value = '';
        document.getElementById('note').value = '';
        await loadHistory();
    } catch (e) {
        console.error(e);
        alert('දෝෂයක් සිදුවිය: ' + e.message);
    } finally {
        btn.disabled = false;
        btn.textContent = 'හුවමාරුව තහවුරු කරන්න (Confirm Transfer)';
    }
};

auth.onAuthStateChanged(async (user) => {
    if (!user) { window.location.href = '/'; return; }
    
    let businessId = user.uid;
    if (window.dashboardCore && typeof window.dashboardCore.getContext === 'function') {
        const ctx = await window.dashboardCore.getContext(user);
        businessId = String((ctx && ctx.businessId) || user.uid);
    } else {
        const userDoc = await db.collection('users').doc(user.uid).get();
        businessId = userDoc.exists ? (userDoc.data().businessId || user.uid) : user.uid;
    }
    
    SCRAP_BUSINESS_ID = businessId;
    
    // Set local date correctly (Sri Lanka Time)
    const now = new Date();
    const offset = now.getTimezoneOffset() * 60000;
    const localNow = new Date(now.getTime() - offset);
    document.getElementById('transDate').value = localNow.toISOString().slice(0, 10);
    
    await loadHistory();
});
</script>
</body>
</html>
