<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGIBIZ - Scrap Workbench</title>
    <style>html.digibiz-sidebar-reserved body{margin-left:260px;}@media (max-width:768px){html.digibiz-sidebar-reserved body{margin-left:0;}}</style>
    <script>document.documentElement.classList.add('digibiz-sidebar-reserved');</script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-database-compat.js"></script>
    <script src="../../core/firebase-init.js?v=58"></script>
    <script src="../../core/event-validation.js?v=58"></script>
    <script src="../../core/event-bus.js?v=58"></script>
    <script src="../../core/accounts-core.js?v=58"></script>
    <script src="../../core/auth-roles.js?v=58"></script>
    <script src="../../core/business-types.js?v=58"></script>
    <script src="../../core/dashboard-core.js?v=58"></script>
    <script src="../../core/subscription-manager.js?v=58"></script>
    <script src="../../core/sidebar.js?v=64"></script>
    <script src="../../core/sms-wallet-core.js?v=4"></script>
    <script src="../../core/scrap-vba-core.js?v=78"></script>
    <style>
        body{font-family:Inter,Segoe UI,sans-serif;background:#f5f7fb;color:#0f172a;}
        .page{padding:20px;}
        .card{background:#fff;border:1px solid #dbe4ee;border-radius:12px;padding:16px;margin-bottom:12px;}
        table{width:100%;border-collapse:collapse;font-size:13px;}
        th,td{padding:8px;border-bottom:1px solid #eef2f7;text-align:left;}
        th{background:#f8fafc;}
        .kpi{font-size:22px;font-weight:800;color:#0f3b2c;}
        .small{font-size:12px;color:#64748b;}
        input,button{padding:9px;border:1px solid #cbd5e1;border-radius:8px;}
        button{background:#0f3b2c;color:#fff;border:none;cursor:pointer;}
        .danger{background:#b91c1c;}
        .modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:10000;}
        .modal-card{background:#fff;border-radius:12px;padding:14px;border:1px solid #dbe4ee;min-width:360px;max-width:540px;}
        .summary-grid{display:grid;grid-template-columns:repeat(3,minmax(180px,1fr));gap:8px;margin-bottom:10px;}
        .summary-card{border:1px solid #dbe4ee;border-radius:10px;padding:10px;background:#fff;}
        .bill-workspace{display:flex;gap:14px;align-items:flex-start;}
        .bill-left{width:560px;max-width:100%;}
        .bill-right{flex:1;min-height:40px;}
        .bill-sheet{border:1px solid #0f172a;border-radius:10px;background:#fff;overflow:hidden;}
        .bill-head{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;border-bottom:1px solid #0f172a;}
        .bill-meta{display:grid;grid-template-columns:120px 1fr;gap:6px 8px;align-items:center;font-size:12px;}
        .bill-meta label{font-weight:700;}
        .bill-meta input{padding:6px 8px;border:1px solid #94a3b8;border-radius:8px;font-size:12px;}
        .bill-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;}
        .bill-table{width:100%;border-collapse:collapse;font-size:12px;}
        .bill-table th,.bill-table td{border:1px solid #0f172a;padding:6px;}
        .bill-table th{background:#f8fafc;font-weight:800;}
        .bill-table td:nth-child(2), .bill-table td:nth-child(3), .bill-table th:nth-child(2), .bill-table th:nth-child(3){text-align:right;}
        .bill-table input{width:100%;padding:4px 6px;border:0;border-radius:0;text-align:right;outline:none;font-size:12px;}
        .bill-foot{display:grid;grid-template-columns:1fr 220px;gap:10px;padding:10px;border-top:1px solid #0f172a;align-items:end;}
        .bill-total{display:grid;grid-template-columns:120px 1fr;gap:6px 8px;align-items:center;font-size:12px;}
        .bill-total label{font-weight:900;}
        .bill-actions{display:flex;gap:8px;justify-content:flex-end;}
        .bill-actions button{padding:8px 10px;}
        .bill-muted{color:#64748b;font-size:12px;}
        @media (max-width:980px){
            .bill-workspace{flex-direction:column;}
            .bill-left{width:100%;}
            .bill-grid{grid-template-columns:1fr;}
            .bill-foot{grid-template-columns:1fr;}
            .bill-actions{justify-content:flex-start;}
        }
        .indika-highlight {
            color: #2563eb !important;
            font-weight: 800 !important;
        }
        .stock-name-cell {
            cursor: pointer;
            user-select: none;
        }
    </style>
</head>
<body>
<div class="page">
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;">
        <div>
            <h1 id="viewTitle" style="margin:0;">SCRAP WORKBENCH</h1>
            <p class="small" id="viewDesc" style="margin:4px 0 0;">VBA sheet style operational view.</p>
        </div>
        <div id="profitPoolStatus" style="font-weight:800; font-size:14px; padding:8px 16px; border-radius:20px; border:2px solid #0f172a; min-width:150px; text-align:center; background:#f8fafc;">Pool: Loading...</div>
    </div>
    <div id="smsDebugBadge" class="small" style="margin-top:8px;display:none;padding:8px;border-radius:8px;"></div>
    <div class="card" id="viewBody"></div>
<script>
let SCRAP_BUSINESS_ID = '';
let isBulkEditMode = false;
let isReorderMode = false;
let currentUser = null;

function escHtml(s) { return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
const VIEW_META = {
    BILL: { title: 'BILL', desc: 'Create selling/billing entries (web equivalent).' },
    STOCK: { title: 'STOCK', desc: 'Stock foundation list (65 items).' },
    BUY: { title: 'BUY', desc: 'Supplier purchase history (horizontal sheet).' },
    LOAN: { title: 'LOAN', desc: 'Loan control; use Scrap Debts for full management.' },
    DAILYTR: { title: 'DAILYTR', desc: 'Daily transaction log view.' },
    PERFORMANCE: { title: 'PERFORMANCE', desc: 'Performance summary from history.' },
    RISK_MONITOR: { title: 'RISK_MONITOR', desc: 'Risk dashboard & daily recovery equivalent.' },
    RWD: { title: 'RWD', desc: 'Rewards/bonus dashboard.' },
    PT: { title: 'PT', desc: 'PT engine summary view.' }
};

function qView() {
    const v = new URLSearchParams(window.location.search).get('view');
    return (v || 'BILL').toUpperCase();
}
function fmt(v) { return `LKR ${(Number(v)||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}`; }
function advId(name){ return `ADV_${SCRAP_BUSINESS_ID}_${String(name||'').trim().toUpperCase().replace(/[^A-Z0-9]+/g,'_')}`; }
function showLoading(show) {
    let el = document.getElementById('digibizLoadingOverlay');
    if (!el && show) {
        el = document.createElement('div');
        el.id = 'digibizLoadingOverlay';
        el.style = 'position:fixed;inset:0;background:rgba(255,255,255,0.7);z-index:99999;display:flex;align-items:center;justify-content:center;font-weight:700;';
        el.innerHTML = 'Processing...';
        document.body.appendChild(el);
    }
    if (el) el.style.display = show ? 'flex' : 'none';
}


function smsSkipReasonText(code) {
    if (code === 'event_disabled') return 'SMS skipped: event toggle is OFF.';
    if (code === 'no_phone') return 'SMS skipped: customer phone number missing.';
    if (code === 'wallet_exhausted') return 'SMS skipped: SMS wallet exhausted.';
    if (code === 'quota_exhausted') return 'SMS skipped: Firestore quota exceeded (billing / daily limit).';
    if (code === 'permission') return 'SMS skipped: permission denied for SMS queue.';
    if (code === 'invalid_input') return 'SMS skipped: invalid phone/message input.';
    if (code === 'db_unavailable') return 'SMS skipped: database unavailable.';
    if (code === 'firestore_error') return 'SMS skipped: queue write failed (see detail below).';
    return `SMS skipped: ${code || 'unknown reason'}`;
}
function showSmsDebug(result, extraReason) {
    const el = document.getElementById('smsDebugBadge');
    if (!el) return;
    let ok = false;
    let txt = '';
    if (result && result.ok) {
        ok = true;
        if (result.via === 'rtdb_quota_fallback') {
            txt = 'SMS queued via Realtime Database (Firestore write quota exceeded). Gateway app should send; cloud wallet was not debited — reconcile when Firestore is available again.';
        } else if (result.fallback) {
            txt = 'SMS queued via direct gateway fallback.';
        } else {
            txt = 'SMS queued successfully.';
        }
    } else {
        txt = smsSkipReasonText(extraReason || (result && result.skipped));
        if (result && result.error) {
            txt += ' — ' + String(result.error);
        }
    }
    el.style.display = 'block';
    el.style.background = ok ? '#dcfce7' : '#fee2e2';
    el.style.color = ok ? '#14532d' : '#7f1d1d';
    el.style.border = `1px solid ${ok ? '#86efac' : '#fca5a5'}`;
    el.textContent = txt;
}

async function renderSTOCK(body) {
    const [snap] = await Promise.all([
        db.collection('scrap_items').where('businessId','==',SCRAP_BUSINESS_ID).get(),
    ]);
    const rows = snap.docs.map(d=>({ id: d.id, ...d.data() })).sort((a,b) => {
        if (a.sortOrder !== undefined && b.sortOrder !== undefined) return a.sortOrder - b.sortOrder;
        if (a.sortOrder !== undefined) return -1;
        if (b.sortOrder !== undefined) return 1;
        return String(a.itemName||'').localeCompare(String(b.itemName||''));
    });
    const unitCost = (r) => {
        const cp = Number(r.costPrice);
        if (Number.isFinite(cp) && cp > 0) return cp;
        return 0;
    };
    const stockValue = rows.reduce((sum, r) => sum + ((Number(r.currentStock) || 0) * unitCost(r)), 0);
    const totalSalesValue = rows.reduce((sum, r) => sum + ((Number(r.currentStock) || 0) * (Number(r.sellingPrice) || 0)), 0);
    const expectedProfit = totalSalesValue - stockValue;
    const indikaValue = rows.reduce((sum, r) => sum + (r.indikaSelected === true ? ((Number(r.currentStock) || 0) * (Number(r.sellingPrice) || 0)) : 0), 0);

    body.innerHTML = `<div class="summary-grid" style="grid-template-columns: repeat(4, minmax(180px, 1fr));">
      <div class="summary-card" style="border-color:#2563eb; background:#f0f9ff;"><div class="small" style="color:#2563eb; font-weight:700;">INDIKA (Highlighted Stock Value)</div><div class="kpi" style="color:#1d4ed8;">${fmt(indikaValue)}</div></div>
      <div class="summary-card"><div class="small">Total Purchase Value</div><div class="kpi">${fmt(stockValue)}</div></div>
      <div class="summary-card"><div class="small">Total Sales Value</div><div class="kpi">${fmt(totalSalesValue)}</div></div>
      <div class="summary-card"><div class="small">Expected Profit on Stock</div><div class="kpi">${fmt(expectedProfit)}</div></div>
    </div>
    <div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:10px;">
      <input id="stockNewName" placeholder="Item Name">
      <input id="stockNewQty" type="number" step="0.01" placeholder="Stock">
      <input id="stockNewProfit" type="number" step="0.01" placeholder="Profit">
      <input id="stockNewSell" type="number" step="0.01" placeholder="Sell Price">
      <button id="stockAddBtn">Add Item</button>
      <button id="resetAllStockBtn" class="danger" style="white-space:nowrap;">Reset All Stock to 0</button>
      <button id="bulkEditBtn" style="background:#0ea5e9;">${isBulkEditMode ? 'Cancel Bulk Edit' : 'Bulk Edit Mode'}</button>
      <button id="reorderBtn" style="background:#7c3aed;">${isReorderMode ? 'Cancel Reorder' : 'Reorder Items'}</button>
      ${isBulkEditMode ? '<button id="saveBulkBtn" style="background:#16a34a;">Save All Changes</button>' : ''}
      ${isReorderMode ? '<button id="saveOrderBtn" style="background:#16a34a;">Save New Order</button>' : ''}
    </div>
    <table><thead><tr><th>Item Name</th><th>Current Stock</th><th>Growing Price</th><th>Buying Price</th><th>Down Buying Price / ඩවුන් මිල</th><th>Profit</th><th>Sell Price</th><th>Action</th></tr></thead><tbody>${
        rows.map(r => {
            const isIndika = r.indikaSelected === true;
            const highlightClass = isIndika ? 'indika-highlight' : '';
            if (isBulkEditMode) {
                const buy = (Number(r.sellingPrice)||0) - (Number(r.profit)||0);
                return `<tr>
                    <td class="stock-name-cell ${highlightClass}" data-id="${r.id}"><input data-bulk-name="${r.id}" value="${escHtml(r.itemName)}" style="width:100%;box-sizing:border-box;padding:4px;"></td>
                    <td>${Number(r.currentStock||0).toFixed(1)}</td>
                    <td>${r.growingPrice !== undefined && r.growingPrice !== null ? Number(r.growingPrice) : '-'}</td>
                    <td data-bulk-buy-display="${r.id}">${buy.toFixed(2)}</td>
                    <td>${r.downBuyingPrice !== undefined && r.downBuyingPrice !== null ? Number(r.downBuyingPrice) : '-'}</td>
                    <td><input type="number" step="0.01" data-bulk-profit="${r.id}" value="${Number(r.profit)||0}" style="width:80px;padding:4px;"></td>
                    <td><input type="number" step="0.01" data-bulk-sell="${r.id}" value="${Number(r.sellingPrice)||0}" style="width:80px;padding:4px;"></td>
                    <td>-</td>
                </tr>`;
            }
            if (isReorderMode) {
                return `<tr>
                    <td class="stock-name-cell ${highlightClass}" data-id="${r.id}">${escHtml(r.itemName)}</td>
                    <td>${Number(r.currentStock||0).toFixed(1)}</td>
                    <td>${r.growingPrice !== undefined && r.growingPrice !== null ? Number(r.growingPrice) : '-'}</td>
                    <td>${Number(unitCost(r) || 0)}</td>
                    <td>${r.downBuyingPrice !== undefined && r.downBuyingPrice !== null ? Number(r.downBuyingPrice) : '-'}</td>
                    <td>${Number(r.profit||0)}</td>
                    <td>${Number(r.sellingPrice||0)}</td>
                    <td>
                        <button data-move-up="${r.id}" style="padding:4px 8px;background:#6366f1;">▲</button>
                        <button data-move-down="${r.id}" style="padding:4px 8px;background:#6366f1;">▼</button>
                    </td>
                </tr>`;
            }
            
            let growingPriceHtml = '';
            if (r.growingPrice !== undefined && r.growingPrice !== null) {
                growingPriceHtml = `<span class="growing-price-text" data-id="${r.id}" style="cursor: pointer; display: inline-block; min-width: 60px; min-height: 20px; font-weight: bold; color: #059669;">${r.growingPrice}</span>`;
            } else {
                growingPriceHtml = `<input type="number" step="0.01" placeholder="Add Price" class="growing-price-input" data-id="${r.id}" style="width: 80px; padding: 4px;">`;
            }
            
            let downBuyHtml = '';
            if (r.downBuyingPrice !== undefined && r.downBuyingPrice !== null) {
                downBuyHtml = `<span class="down-price-text" data-id="${r.id}" style="cursor: pointer; display: inline-block; min-width: 60px; min-height: 20px; font-weight: bold; color: #b91c1c;">${r.downBuyingPrice}</span>`;
            } else {
                downBuyHtml = `<input type="number" step="0.01" placeholder="Add Down Price" class="down-price-input" data-id="${r.id}" style="width: 100px; padding: 4px;">`;
            }
            
            return `<tr>
                <td class="stock-name-cell ${highlightClass}" data-id="${r.id}">${r.itemName||'-'}</td>
                <td>${Number(r.currentStock||0).toFixed(1)}</td>
                <td>${growingPriceHtml}</td>
                <td>${Number(unitCost(r) || 0)}</td>
                <td>${downBuyHtml}</td>
                <td>${Number(r.profit||0)}</td>
                <td>${Number(r.sellingPrice||0)}</td>
                <td><button data-edit="${r.id}" style="padding:4px 8px;">Edit</button></td>
            </tr>`;
        }).join('') || '<tr><td colspan="7">No items</td></tr>'
    }</tbody></table>`;
    document.getElementById('stockAddBtn').addEventListener('click', async () => {
        const itemName = String(document.getElementById('stockNewName').value || '').trim();
        const currentStock = Number(document.getElementById('stockNewQty').value) || 0;
        const profit = Number(document.getElementById('stockNewProfit').value) || 0;
        const sellingPrice = Number(document.getElementById('stockNewSell').value) || 0;
        if (!itemName) return alert('Item name is required.');
        await db.collection('scrap_items').add({
            businessId: SCRAP_BUSINESS_ID,
            itemName,
            currentStock,
            profit,
            sellingPrice,
            costPrice: sellingPrice - profit,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        if (window.scrapVbaCore?.syncInventoryAssetWithStock) {
            await window.scrapVbaCore.syncInventoryAssetWithStock(SCRAP_BUSINESS_ID);
        }
        await renderSTOCK(body);
    });
    document.getElementById('resetAllStockBtn').addEventListener('click', async () => {
        if (!confirm('WARNING: This will set current stock to 0 for ALL items. Continue?')) return;
        const nukeTxt = prompt('Type "RESET" to confirm:');
        if (nukeTxt !== 'RESET') return;
        
        try {
            const batch = db.batch();
            rows.forEach((r) => {
                const ref = db.collection('scrap_items').doc(r.id);
                batch.update(ref, {
                    currentStock: 0,
                    totalBuyingValue: 0,
                    totalSellingValue: 0,
                    potentialProfitValue: 0,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            });
            await batch.commit();
            if (window.scrapVbaCore?.syncInventoryAssetWithStock) {
                await window.scrapVbaCore.syncInventoryAssetWithStock(OWNER_UID);
            }
            alert('All stock levels reset to 0.');
            await renderSTOCK(body);
        } catch (e) {
            alert('Error resetting stock: ' + e.message);
        }
    });
    document.getElementById('bulkEditBtn').addEventListener('click', () => {
        isBulkEditMode = !isBulkEditMode;
        renderSTOCK(body);
    });
    if (isBulkEditMode) {
        const updateBuy = (id) => {
            const p = Number(body.querySelector(`[data-bulk-profit="${id}"]`)?.value) || 0;
            const s = Number(body.querySelector(`[data-bulk-sell="${id}"]`)?.value) || 0;
            const disp = body.querySelector(`[data-bulk-buy-display="${id}"]`);
            if (disp) disp.textContent = (s - p).toFixed(2);
        };
        body.querySelectorAll('[data-bulk-profit], [data-bulk-sell]').forEach((inp) => {
            inp.addEventListener('input', () => updateBuy(inp.dataset.bulkProfit || inp.dataset.bulkSell));
        });

        document.getElementById('saveBulkBtn').addEventListener('click', async () => {
            const batch = db.batch();
            let count = 0;
            rows.forEach((r) => {
                const nameInp = body.querySelector(`[data-bulk-name="${r.id}"]`);
                const profitInp = body.querySelector(`[data-bulk-profit="${r.id}"]`);
                const sellInp = body.querySelector(`[data-bulk-sell="${r.id}"]`);
                if (!nameInp || !profitInp || !sellInp) return;
                
                const newName = String(nameInp.value || '').trim();
                const newProfit = Number(profitInp.value) || 0;
                const newSell = Number(sellInp.value) || 0;
                const newCost = newSell - newProfit;
                
                if (newName !== r.itemName || newProfit !== r.profit || newSell !== r.sellingPrice) {
                    const ref = db.collection('scrap_items').doc(r.id);
                    batch.update(ref, {
                        itemName: newName,
                        profit: newProfit,
                        sellingPrice: newSell,
                        costPrice: newCost,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    count++;
                }
            });
            if (count > 0) {
                await batch.commit();
                if (window.scrapVbaCore?.syncInventoryAssetWithStock) {
                    await window.scrapVbaCore.syncInventoryAssetWithStock(OWNER_UID);
                }
                alert(`Saved changes for ${count} items.`);
            }
            isBulkEditMode = false;
            renderSTOCK(body);
        });
    }
    document.getElementById('reorderBtn').addEventListener('click', () => {
        isReorderMode = !isReorderMode;
        isBulkEditMode = false;
        renderSTOCK(body);
    });
    if (isReorderMode) {
        let dragSrcIndex = null;
        function handleDragStart(e) {
            dragSrcIndex = Number(this.dataset.index);
            e.dataTransfer.effectAllowed = 'move';
            this.style.opacity = '0.4';
        }
        function handleDragOver(e) {
            if (e.preventDefault) e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            return false;
        }
        function handleDrop(e) {
            if (e.stopPropagation) e.stopPropagation();
            const targetIndex = Number(this.dataset.index);
            if (dragSrcIndex !== null && dragSrcIndex !== targetIndex) {
                const item = rows.splice(dragSrcIndex, 1)[0];
                rows.splice(targetIndex, 0, item);
                renderUpdatedRows();
            }
            return false;
        }

        document.querySelectorAll('button[data-move-up]').forEach((btn) => {
            btn.addEventListener('click', () => {
                const id = btn.dataset.moveUp;
                const idx = rows.findIndex(x => x.id === id);
                if (idx > 0) {
                    [rows[idx], rows[idx - 1]] = [rows[idx - 1], rows[idx]];
                    renderUpdatedRows();
                }
            });
        });
        document.querySelectorAll('button[data-move-down]').forEach((btn) => {
            btn.addEventListener('click', () => {
                const id = btn.dataset.moveDown;
                const idx = rows.findIndex(x => x.id === id);
                if (idx < rows.length - 1) {
                    [rows[idx], rows[idx + 1]] = [rows[idx + 1], rows[idx]];
                    renderUpdatedRows();
                }
            });
        });
        function renderUpdatedRows() {
            const tbody = body.querySelector('tbody');
            tbody.innerHTML = rows.map((r, idx) => `<tr draggable="true" data-index="${idx}" style="cursor:move;">
                <td>${escHtml(r.itemName)}</td>
                <td>${Number(r.currentStock||0).toFixed(1)}</td>
                <td>${r.growingPrice !== undefined && r.growingPrice !== null ? Number(r.growingPrice) : '-'}</td>
                <td>${Number(unitCost(r) || 0)}</td>
                <td>${r.downBuyingPrice !== undefined && r.downBuyingPrice !== null ? Number(r.downBuyingPrice) : '-'}</td>
                <td>${Number(r.profit||0)}</td>
                <td>${Number(r.sellingPrice||0)}</td>
                <td>
                    <button data-move-up="${r.id}" style="padding:4px 8px;background:#6366f1;">▲</button>
                    <button data-move-down="${r.id}" style="padding:4px 8px;background:#6366f1;">▼</button>
                </td>
            </tr>`).join('');
            
            tbody.querySelectorAll('tr').forEach(tr => {
                tr.addEventListener('dragstart', handleDragStart);
                tr.addEventListener('dragover', handleDragOver);
                tr.addEventListener('drop', handleDrop);
                tr.addEventListener('dragend', function() { this.style.opacity = '1'; });
            });

            tbody.querySelectorAll('button[data-move-up]').forEach((btn) => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.moveUp;
                    const idx = rows.findIndex(x => x.id === id);
                    if (idx > 0) {
                        [rows[idx], rows[idx - 1]] = [rows[idx - 1], rows[idx]];
                        renderUpdatedRows();
                    }
                });
            });
            tbody.querySelectorAll('button[data-move-down]').forEach((btn) => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.moveDown;
                    const idx = rows.findIndex(x => x.id === id);
                    if (idx < rows.length - 1) {
                        [rows[idx], rows[idx + 1]] = [rows[idx + 1], rows[idx]];
                        renderUpdatedRows();
                    }
                });
            });
        }
        renderUpdatedRows(); // Initialize drag handlers
        document.getElementById('saveOrderBtn').addEventListener('click', async () => {
            const batch = db.batch();
            rows.forEach((r, idx) => {
                const ref = db.collection('scrap_items').doc(r.id);
                batch.update(ref, { sortOrder: idx, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
            });
            await batch.commit();
            alert('New order saved.');
            isReorderMode = false;
            renderSTOCK(body);
        });
    }
    document.querySelectorAll('button[data-edit]').forEach((btn) => {
        btn.addEventListener('click', () => {
            const id = btn.dataset.edit;
            const row = rows.find((r) => r.id === id);

            </div>`;
            document.body.appendChild(wrap);
            const mUpdateBuy = () => {
                const p = Number(wrap.querySelector('#mProfit').value) || 0;
                const s = Number(wrap.querySelector('#mSell').value) || 0;
                wrap.querySelector('#mBuyDisp').textContent = (s - p).toFixed(2);
            };
            wrap.querySelector('#mProfit').addEventListener('input', mUpdateBuy);
            wrap.querySelector('#mSell').addEventListener('input', mUpdateBuy);
            wrap.querySelector('#mClose').addEventListener('click', () => wrap.remove());
            wrap.querySelector('#mSave').addEventListener('click', async () => {
                const currentStock = Number(wrap.querySelector('#mQty').value) || 0;
                const profit = Number(wrap.querySelector('#mProfit').value) || 0;
                const sellingPrice = Number(wrap.querySelector('#mSell').value) || 0;
                const downVal = wrap.querySelector('#mDown').value.trim();
                const updateData = {
                    currentStock, profit, sellingPrice,
                    costPrice: sellingPrice - profit,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                };
                if (downVal === '') {
                    updateData.downBuyingPrice = firebase.firestore.FieldValue.delete();
                } else {
                    const downPrice = Number(downVal);
                    if (isNaN(downPrice) || downPrice < 0) {
                        alert('Please enter a valid positive number for Down Price');

                    updateData.downBuyingPrice = downPrice;

async function renderBUY(body) {
    const [buySnap, itemSnap] = await Promise.all([
        db.collection('buying_history').where('businessId', '==', SCRAP_BUSINESS_ID).get(),
        db.collection('scrap_items').where('businessId', '==', SCRAP_BUSINESS_ID).get()
    ]);
    const itemNames = itemSnap.docs.map((d) => String(d.data().itemName || '').trim()).filter(Boolean).sort((a, b) => a.localeCompare(b));
    const rows = buySnap.docs.map((d) => {
        const data = d.data();
        return { id: d.id, ...data };
    }).sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));

    body.innerHTML = `
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;background:#fff;padding:12px;border:1px solid #dbe4ee;border-radius:10px;">
        <div style="display:flex;flex-direction:column;gap:4px;">
            <label class="small" style="font-weight:700;">Supplier Name / නම</label>
            <input id="buySearchName" placeholder="Search by name..." style="min-width:220px;padding:8px;font-size:13px;">
        </div>
        <div style="display:flex;flex-direction:column;gap:4px;">
            <label class="small" style="font-weight:700;">From Date / ආරම්භක දිනය</label>
            <input id="buySearchFrom" type="date" style="padding:8px;font-size:13px;">
        </div>
        <div style="display:flex;flex-direction:column;gap:4px;">
            <label class="small" style="font-weight:700;">To Date / අවසාන දිනය</label>
            <input id="buySearchTo" type="date" style="padding:8px;font-size:13px;">
        </div>
        <div style="display:flex;align-items:flex-end;height:100%;margin-top:18px;">
            <button id="buySearchReset" style="background:#64748b;font-weight:700;padding:9px 15px;">Reset / පැහැදිලි කරන්න</button>
        </div>
        <div style="margin-left:auto;text-align:right;align-self:flex-end;margin-top:18px;">
            <span class="small" style="font-weight:700;">Records / ගනුදෙනු ගණන: <b id="buyFilteredCount" style="color:#0f3b2c;font-size:14px;">0</b></span>
        </div>
      </div>
      <div style="overflow:auto;border:1px solid #e2e8f0;border-radius:10px;">
        <table style="min-width:${Math.max(1200, 750 + (itemNames.length * 110))}px;">
          <thead>
            <tr>
              <th>Date</th><th>Name</th><th>Total Weight</th><th>Total Amount</th>
              ${itemNames.map((n) => `<th>${n}</th>`).join('')}
            </tr>
          </thead>
          <tbody id="buyTableBody"></tbody>
        </table>
      </div>`;

    const nameInput = document.getElementById('buySearchName');
    const fromInput = document.getElementById('buySearchFrom');
    const toInput = document.getElementById('buySearchTo');
    const resetBtn = document.getElementById('buySearchReset');
    const tbody = document.getElementById('buyTableBody');
    const countEl = document.getElementById('buyFilteredCount');

    const formatDate = (isoStr) => {
        if (!isoStr) return '';
        const d = new Date(isoStr);
        if (isNaN(d.getTime())) return '';
        return d.toLocaleDateString('en-CA'); // YYYY-MM-DD
    };

    function applyFilters() {
        const nameVal = nameInput.value.trim().toLowerCase();
        const fromVal = fromInput.value;
        const toVal = toInput.value;

        const filtered = rows.filter((r) => {
            // Name match
            if (nameVal) {
                const supplierName = String(r.supplierName || '').toLowerCase();
                const walkInName = String(r.walkInName || '').toLowerCase();
                if (!supplierName.includes(nameVal) && !walkInName.includes(nameVal)) {
                    return false;
                }
            }

            // Date match
            if (fromVal || toVal) {
                const dateStr = r.date || r.billDateTime || '';
                const rowDate = formatDate(dateStr);
                if (!rowDate) return false;
                if (fromVal && rowDate < fromVal) return false;
                if (toVal && rowDate > toVal) return false;
            }

            return true;
        });

        countEl.textContent = filtered.length;

        const todayIso = new Date().toLocaleDateString('en-CA');
        const yesterdayIso = new Date(Date.now() - 86400000).toLocaleDateString('en-CA');

        tbody.innerHTML = filtered.map((r) => {
            const weights = {};
            (Array.isArray(r.items) ? r.items : []).forEach((line) => {
                weights[String(line.itemName || '').trim()] = Number(line.weight) || 0;
            });

            let dateHtml = '-';
            if (r.date) {
                const rDateObj = new Date(r.date);
                const rIso = rDateObj.toLocaleDateString('en-CA');
                const timeStr = rDateObj.toLocaleString();
                
                if (rIso === todayIso) {
                    dateHtml = `<span style="color:#16a34a; font-weight:700;">${timeStr}</span>`;
                } else if (rIso === yesterdayIso) {
                    dateHtml = `<span style="color:#a16207; font-weight:700;">${timeStr}</span>`;
                } else {
                    dateHtml = timeStr;
                }
            }

            return `<tr>
              <td>${dateHtml}</td>
              <td><a href="#" onclick="viewFullBill('${r.id || ''}', ${JSON.stringify(r).replace(/"/g, '&quot;')}); return false;" style="color:#0ea5e9; font-weight:700; text-decoration:none;">${r.supplierName || '-'}</a></td>
              <td>${(Number(r.totalWeight) || 0).toFixed(2)}</td>
              <td>${fmt(r.totalAmount || 0)}</td>
              ${itemNames.map((name) => `<td>${(weights[name] || 0).toFixed(2)}</td>`).join('')}
            </tr>`;
        }).join('') || `<tr><td colspan="${4 + itemNames.length}" style="text-align:center;padding:20px;color:#64748b;">No matching records found / ගැලපෙන ගනුදෙනු සොයාගත නොහැක</td></tr>`;
    }

    // Event listeners
    nameInput.addEventListener('input', applyFilters);
    fromInput.addEventListener('change', applyFilters);
    toInput.addEventListener('change', applyFilters);
    resetBtn.addEventListener('click', () => {
        nameInput.value = '';
        fromInput.value = '';
        toInput.value = '';
        applyFilters();
    });

    // Initial render
    applyFilters();
}

async function renderDAILYTR(body) {
    const [ev, buy, sell, journal, extSettle, advHist, exp] = await Promise.all([
        db.collection('scrap_event_log').where('businessId','==',SCRAP_BUSINESS_ID).limit(200).get(),
        db.collection('buying_history').where('businessId','==',SCRAP_BUSINESS_ID).limit(200).get(),
        db.collection('selling_history').where('businessId','==',SCRAP_BUSINESS_ID).limit(200).get(),
        db.collection('journal').doc(SCRAP_BUSINESS_ID).collection('entries').limit(200).get(),
        db.collection('scrap_external_settlements').where('businessId','==',SCRAP_BUSINESS_ID).limit(200).get(),
        db.collection('scrap_advance_history').where('businessId','==',SCRAP_BUSINESS_ID).limit(200).get(),
        db.collection('scrap_expenses').where('businessId','==',SCRAP_BUSINESS_ID).limit(200).get()
    ]);
    const events = [];
    const minDate = new Date();
    minDate.setDate(minDate.getDate() - 60);
    ev.forEach(d=>events.push({id:d.id,t:'EVENT',dt:d.data().createdAt?.toDate?.()?.toISOString()||'',d:d.data(),refType:''}));
    buy.forEach(d=>{
        const row = d.data();
        const at = row.createdAt?.toDate ? row.createdAt.toDate().toISOString() : String(row.date || '');
        events.push({id:d.id,t:'BUY',dt:at,d:row,refType:'SCRAP_BUYING'});
    });
    sell.forEach(d=>{
        const row = d.data();
        const at = row.createdAt?.toDate ? row.createdAt.toDate().toISOString() : String(row.date || '');
        events.push({id:d.id,t:'SELL',dt:at,d:row,refType:'SCRAP_BILL'});
    });

    extSettle.forEach((d) => {
        const row = d.data();
        events.push({
            id: d.id,
            t: 'EXT',

            dt: String(row.date || ''),
            d: {
                action: 'EXTERNAL_SETTLEMENT',
                detail: `${row.customerName || '-'} (${row.note || ''})`,
                amount: Number(row.amount) || 0
            },
            refType: 'SCRAP_EXT_SETTLEMENT'
        });
    });
    advHist.forEach((d) => {
        const row = d.data();
        const at = row.date || (row.createdAt?.toDate ? row.createdAt.toDate().toISOString() : '');
        events.push({
            id: d.id,
            t: 'ADV',

            dt: at,
            d: {
                action: row.type || (Number(row.amount) > 0 ? 'ISSUE' : 'ADJUST'),
                detail: `${row.supplierName || '-'} (${row.note || ''})`,
                amount: Number(row.amount) || 0
            },
            refType: 'SCRAP_ADVANCE'
        });

    });
    
    exp.forEach((d) => {
        const row = d.data();
        const at = row.createdAt?.toDate ? row.createdAt.toDate().toISOString() : String(row.expenseDate || '');
        events.push({
            id: d.id,
            t: 'EXP',
            dt: at,
            d: {
                action: 'EXPENSE',
                detail: `${row.category || '-'} (${row.note || ''})`,
                amount: Number(row.amount) || 0,
                paymentMethod: row.paymentMethod
            },
            refType: 'SCRAP_EXPENSE'
        });
    });
    journal.forEach((d) => {
        const row = d.data();
        const refType = String(row.referenceType || '');
        if (['SCRAP_ADVANCE_ISSUE', 'SCRAP_ADVANCE_RECEIVED', 'SCRAP_EXT_SETTLEMENT', 'SCRAP_ADVANCE_ADJUST', 'SCRAP_BUYING', 'SCRAP_BILL'].includes(refType)) return;
        
        const lines = Array.isArray(row.entries) ? row.entries : [];
        const totalAmount = lines.reduce((s, l) => s + (Number(l.debit) || 0), 0);
        
        let dtStr = '';
        try {
            if (row.date?.toDate) dtStr = row.date.toDate().toISOString();
            else if (row.date) dtStr = new Date(row.date).toISOString();
        } catch(e) {}

        events.push({
            id: d.id,
            t: 'ACC',

            dt: dtStr,
            d: {
                action: refType === 'CAPITAL_INJECTION' ? 'FUND INJECTION' : (row.referenceType || 'JOURNAL'),
                detail: row.description || '',
                amount: totalAmount
            },
            refType
        });
    });
    events.sort((a,b)=>String(b.dt).localeCompare(String(a.dt)));
    const typeOptions = ['ALL', 'EVENT', 'BUY', 'SELL', 'EXT', 'ADV', 'ACC', 'EXP'];
    const refTypes = Array.from(new Set(events.map((e) => String(e.refType || '').trim()).filter(Boolean))).sort();
    const today = new Date();
    const todayIso = today.toISOString().slice(0, 10);
    const sevenDaysAgo = new Date();
    sevenDaysAgo.setDate(today.getDate() - 7);
    const sevenDaysAgoIso = sevenDaysAgo.toISOString().slice(0, 10);

        <select id="dailyTypeFilter">${typeOptions.map((t) => `<option value="${t}">${t}</option>`).join('')}</select>
        <select id="dailyRefFilter"><option value="ALL">ALL_REF_TYPES</option>${refTypes.map((r) => `<option value="${r}">${r}</option>`).join('')}</select>
        <input id="dailyFromDate" type="date" value="${sevenDaysAgoIso}">
        <input id="dailyToDate" type="date" value="${todayIso}">
        <button id="dailyExportBtn" style="background:#2563eb;">Export CSV</button>
        <button id="addFundsBtn" style="background:#10b981;" onclick="openAddFundsModal()">+ Add Funds</button>
        <button id="withdrawFundsBtn" style="background:#f59e0b;" onclick="openWithdrawFundsModal()">- Withdraw / Adjust</button>
        <div class="small">Rows: <b id="dailyRowsCount">${events.length}</b></div>
        <div class="small">Total: <b id="dailyRowsTotal">${fmt(0)}</b></div>
        
        <button id="dailyClearAllBtn" style="background:#ef4444;margin-left:auto;">Clear All History</button>
      </div>
      <div id="addFundsModal" class="modal" style="display:none;">
        <div class="modal-card">
            <h3>Add Capital Funds</h3>
            <p class="small">Inject cash or bank assets into the business.</p>
            <div style="margin-top:12px;">
                <label class="small">Amount (LKR)</label>
                <input type="number" id="fundAmount" style="width:100%;margin-bottom:10px;" placeholder="0.00">
                <label class="small">Payment Method</label>
                <select id="fundMethod" style="width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px;margin-bottom:10px;">
                    <option value="CASH">Cash - Main (1-1010-01)</option>
                    <option value="BANK">Bank - Current Account (1-1020-01)</option>
                </select>
                <label class="small">Note</label>
                <input type="text" id="fundNote" style="width:100%;margin-bottom:10px;" placeholder="Reason for injection">
                <label class="small">Confirm Password</label>

    const filteredRows = () => {
        const selected = document.getElementById('dailyTypeFilter').value;
        const refSelected = document.getElementById('dailyRefFilter').value;
        const from = document.getElementById('dailyFromDate').value;
        const to = document.getElementById('dailyToDate').value;
        return events.filter((r) => {
            if (!r.dt) return false;
            const stamp = new Date(r.dt);
            if (Number.isNaN(stamp.getTime()) || stamp < minDate) return false;
            if (selected !== 'ALL' && r.t !== selected) return false;
            if (refSelected !== 'ALL' && String(r.refType || '') !== refSelected) return false;
            if (!from && !to) return true;
            const day = String(r.dt).slice(0, 10);
            if (from && day < from) return false;
            if (to && day > to) return false;
            return true;
        });
    };
    const renderRows = () => {
        const rows = filteredRows();
        const countEl = document.getElementById('dailyRowsCount');
        if (countEl) countEl.textContent = rows.length;
        const total = rows.reduce((sum, r) => {
            if (r.t === 'EVENT') return sum;
            const action = String(r.d.action || r.t).toUpperCase();
            const associate = r.d.supplierName || r.d.customerName || r.d.detail || '';
            const detail = associate ? `${action}: ${associate}` : action;
            const detailUpper = detail.toUpperCase();
            const isOut = (() => {
                const rt = String(r.refType || '');
                const t = String(r.t || '');
                const det = detailUpper;

                // 1. Explicit Outgoing Types
                if (['BUY', 'EXP'].includes(t)) return true;
                if (rt.includes('COGS')) return true;
                if (rt === 'CAPITAL_WITHDRAWAL') return true;
                if (rt === 'SCRAP_EXPENSE' || rt === 'SCRAP_BUYING') return true;
                if (rt === 'ADV_INVESTOR_REMIT') return true;
                if (rt === 'HAND_LOAN_RECEIVED_SETTLE') return true; // Paying back a loan we took
                if (rt === 'HAND_LOAN_GIVEN') return true; // Issuing a new loan

                // 2. Explicit Incoming Types
                if (rt === 'CAPITAL_INJECTION') return false;
                if (rt === 'SCRAP_BILL') return false;
                if (rt === 'HAND_LOAN_RECEIVED') return false; // Taking a new loan
                if (rt === 'HAND_LOAN_GIVEN_SETTLE') return false; // Getting back a loan we gave
                if (rt === 'LOAN_INTEREST_REPAY' || rt === 'LOAN_NO_INTEREST_REPAY' || rt === 'ADV_LOAN_REPAY') return false;

                // 3. Fallback logic based on keywords
                if (t === 'ADV' && (Number(r.d.amount) || 0) > 0) return true;
                if (t === 'ACC') {
                    if (det.includes('GIVEN') || det.includes('ISSUE') || det.includes('REPAYMENT PAID') || det.includes('PAID BACK') || det.includes('WITHDRAWAL')) return true;
                }
                if (t === 'EVENT') {
                    if (det.includes('BUYING') || det.includes('PURCHASE')) return true;
                }
                return false;
            })();
            
            let amt = 0;
            if (r.t === 'BUY') {
                amt = Math.abs(Number(r.d.cashPaid ?? (r.d.billGrandTotal || r.d.totalAmount || 0)));
            } else {
                amt = Math.abs(Number(r.d.billGrandTotal || r.d.totalAmount || r.d.amount || 0));
            }
            return sum + (isOut ? -amt : amt);
        }, 0);

        const totalEl = document.getElementById('dailyRowsTotal');
        if (totalEl) totalEl.textContent = fmt(total);

        const bodyEl = document.getElementById('dailyTrBody');
        if (bodyEl) {
            let lastDate = '';
            let html = '';
            
            const formatDate = (isoStr) => {
                if (!isoStr) return '-';
                const d = new Date(isoStr);
                if (isNaN(d.getTime())) return isoStr;
                return d.toLocaleDateString('en-CA'); // YYYY-MM-DD
            };

            const formatTime = (isoStr) => {
                if (!isoStr) return '-';
                const d = new Date(isoStr);
                if (isNaN(d.getTime())) return '-';
                return d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
            };

            const todayIso = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Colombo' });

            rows.slice(0, 500).forEach((r) => {
                const currentDate = formatDate(r.dt);
                if (currentDate !== lastDate) {
                    const isToday = currentDate === todayIso;
                    if (isToday) {
                        html += `<tr style="background: linear-gradient(90deg, #0f3b2c 0%, #1e5c4a 100%);">
                            <td colspan="7" style="padding:15px; border-top: 2px solid #0f3b2c;">
                                <div style="display:flex; align-items:center; gap:10px;">
                                    <span style="background:#ffd966; color:#0f3b2c; padding:4px 12px; border-radius:20px; font-weight:900; font-size:12px; letter-spacing:1px;">TODAY</span>
                                    <span style="color:#fff; font-weight:700; font-size:15px;">📅 ${currentDate}</span>
                                </div>
                            </td>
                        </tr>`;
                    } else {
                        html += `<tr style="background:#f1f5f9;">
                            <td colspan="7" style="font-weight:900; color:#1e293b; padding:10px 15px; border-top: 2px solid #cbd5e1;">
                                <div style="display:flex; align-items:center; gap:8px;">
                                    <span>📅</span>
                                    <span>${currentDate}</span>
                                </div>
                            </td>
                        </tr>`;
                    }
                    lastDate = currentDate;
                }

                const action = String(r.d.action || r.t).toUpperCase();
                const associate = r.d.supplierName || r.d.customerName || r.d.detail || '';
                const detail = associate ? `${action}: ${associate}` : action;
                let amount = 0;
                if (r.t === 'BUY') {
                    amount = Number(r.d.cashPaid ?? (r.d.billGrandTotal || r.d.totalAmount || 0));
                } else {
                    amount = Number(r.d.billGrandTotal || r.d.totalAmount || r.d.amount || 0);
                }
                const detailUpper = detail.toUpperCase();
                const isOut = (() => {
                    const rt = String(r.refType || '');
                    const t = String(r.t || '');
                    const det = detailUpper;
                    if (['BUY', 'EXP'].includes(t)) return true;
                    if (rt.includes('COGS')) return true;
                    if (rt === 'CAPITAL_WITHDRAWAL') return true;
                    if (rt === 'SCRAP_EXPENSE' || rt === 'SCRAP_BUYING') return true;
                    if (rt === 'ADV_INVESTOR_REMIT') return true;
                    if (rt === 'HAND_LOAN_RECEIVED_SETTLE') return true;
                    if (rt === 'HAND_LOAN_GIVEN') return true;
                    if (rt === 'CAPITAL_INJECTION') return false;
                    if (rt === 'SCRAP_BILL') return false;
                    if (rt === 'HAND_LOAN_RECEIVED') return false;
                    if (rt === 'HAND_LOAN_GIVEN_SETTLE') return false;
                    if (rt === 'LOAN_INTEREST_REPAY' || rt === 'LOAN_NO_INTEREST_REPAY' || rt === 'ADV_LOAN_REPAY') return false;
                    if (t === 'ADV' && (Number(r.d.amount) || 0) > 0) return true;
                    if (t === 'ACC') {
                        if (det.includes('GIVEN') || det.includes('ISSUE') || det.includes('REPAYMENT PAID') || det.includes('PAID BACK') || det.includes('WITHDRAWAL')) return true;
                    }
                    if (t === 'EVENT') {
                        if (det.includes('BUYING') || det.includes('PURCHASE')) return true;
                    }
                    return false;
                })();
                
                const direction = isOut ? '<span class="badge" style="background:#fee2e2;color:#b91c1c;">GIVEN</span>' : '<span class="badge" style="background:#dcfce7;color:#15803d;">TAKEN</span>';
                
                let method = r.d.paymentMethod || r.d.method || '-';
                if (r.t === 'ACC' && r.d.detail) {
                    const detailStr = String(r.d.detail).toUpperCase();
                    if (detailStr.includes('CASH')) method = 'CASH';
                    else if (detailStr.includes('BANK')) method = 'BANK';
                }
                if (method === 'CASH') method = '<span style="color:#059669;font-weight:700;">CASH</span>';
                if (method === 'BANK') method = '<span style="color:#2563eb;font-weight:700;">BANK</span>';

                const displayAmount = (r.t === 'ADV' || r.t === 'EVENT') ? Math.abs(Number(r.d.amount || 0)) : amount;
                const sign = displayAmount ? (isOut ? `- ${fmt(displayAmount)}` : `+ ${fmt(displayAmount)}`) : '-';
                const color = isOut ? '#b91c1c' : '#15803d';
                const time = formatTime(r.dt);
                const isRowToday = currentDate === todayIso;

                const undoBtn = `<button class="btn-sm" style="background:#b91c1c;padding:2px 8px;font-size:10px;" onclick="undoDailyTr('${r.t}', '${r.id}')">DELETE</button>`;

                html += `<tr style="${isRowToday ? 'background:rgba(16,185,129,0.03);' : ''}">
                    <td>${time}</td>
                    <td><span style="font-weight:700; color:#475569;">${r.t}</span></td>
                    <td>${direction}</td>
                    <td>${method}</td>
                    <td style="font-weight:500;">${detail}</td>
                    <td class="num" style="color:${displayAmount ? color : '#0f172a'};font-weight:${displayAmount ? '900' : '400'}; font-size:14px;">${sign}</td>
                    <td>${undoBtn}</td>
                </tr>`;

                // Add a separator line if this was the last 'Today' row
                const nextRow = rows[rows.indexOf(r) + 1];
                const nextDate = nextRow ? formatDate(nextRow.dt) : '';
                if (isRowToday && nextDate && nextDate !== todayIso) {
                    html += `<tr style="height:15px; background:#fff;"><td colspan="7" style="border-bottom: 8px solid #0f3b2c; padding:0;"></td></tr>
                            <tr style="height:15px; background:#fff;"><td colspan="7" style="padding:0;"></td></tr>`;
                }
            });
            
            bodyEl.innerHTML = html || '<tr><td colspan="7">No transactions</td></tr>';
        }
    };
    const advanceDocId = (name) => `ADV_${SCRAP_BUSINESS_ID}_${String(name||'').trim().toUpperCase().replace(/[^A-Z0-9]+/g,'_')}`;

    window.undoDailyTr = async (type, id) => {
        const confirmMsg = type === 'ACC' 
            ? `Are you sure you want to UNDO this Accounting transaction?\nThis will reverse the ledger balances and delete the record.`
            : `Are you sure you want to UNDO this ${type} transaction?\nThis will reverse stock, balances, and delete the record.`;
            
        if (!confirm(confirmMsg)) return;
        
        // Security: Ask for password when undoing critical financial entries
        let password = null;
        if (type === 'ACC' || type === 'EXT' || type === 'ADV' || type === 'EXP') {
            password = prompt("Security Check: Enter your login password to confirm this reversal:");
            if (!password) return;
        }
        
        try {
            showLoading(true);
            
            // Verify Password if provided
            if (password) {
                const credential = firebase.auth.EmailAuthProvider.credential(currentUser.email, password);
                await currentUser.reauthenticateWithCredential(credential);
            }

            const batch = db.batch();
            const num = (v) => Number(v) || 0;
            
            if (type === 'EVENT') {
                batch.delete(db.collection('scrap_event_log').doc(id));
            } else if (type === 'BUY') {
                const doc = await db.collection('buying_history').doc(id).get();
                if (!doc.exists) throw new Error("Transaction not found.");
                const data = doc.data();
                
                // 1. Reverse Stock
                if (Array.isArray(data.items)) {
                    for (const item of data.items) {
                        const iRef = db.collection('scrap_items').doc(item.itemId || item.id);
                        batch.update(iRef, { currentStock: firebase.firestore.FieldValue.increment(-num(item.weight)) });
                    }
                }
                // 2. Reverse Advance
                if (num(data.advanceApplied) > 0) {
                    const aRef = db.collection('scrap_advances').doc(advanceDocId(data.supplierName));
                    batch.update(aRef, { balance: firebase.firestore.FieldValue.increment(num(data.advanceApplied)) });
                }
                // 3. Delete Buy Record
                batch.delete(doc.ref);
                
                // 4. Delete associated Journal Entries and decrement ledger
                const jSnap = await db.collection('journal').doc(SCRAP_BUSINESS_ID).collection('entries')
                    .where('referenceType', '==', 'SCRAP_BUYING')
                    .where('reference', '==', id)
                    .get();
                
                let targetJournalDocs = jSnap.docs;
                if (targetJournalDocs.length === 0) {
                    // Fallback for old records using supplier name as reference
                    const nameSnap = await db.collection('journal').doc(SCRAP_BUSINESS_ID).collection('entries')
                        .where('referenceType', '==', 'SCRAP_BUYING')
                        .where('reference', '==', data.supplierName)
                        .get();
                    // Filter by approximate time match to be safer
                    targetJournalDocs = nameSnap.docs.filter(j => Math.abs(num((j.data().entries || []).reduce((s,l)=>s+num(l.debit),0)) - num(data.billGrandTotal || data.totalAmount)) < 1);
                }

                for (const jDoc of targetJournalDocs) {
                    const jData = jDoc.data();
                    if (Array.isArray(jData.entries)) {
                        const ledgerBase = db.collection("journal").doc(SCRAP_BUSINESS_ID).collection("account_ledger");
                        for (const line of jData.entries) {
                            const code = String(line.accountCode || "").trim() || "UNKNOWN";
                            const docId = code.replace(/\//g, "_");
                            batch.update(ledgerBase.doc(docId), {
                                totalDebit: firebase.firestore.FieldValue.increment(-num(line.debit)),
                                totalCredit: firebase.firestore.FieldValue.increment(-num(line.credit)),
                                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                            });
                        }
                    }
                    batch.delete(jDoc.ref);
                }
            } else if (type === 'EXT') {
                const doc = await db.collection('scrap_external_settlements').doc(id).get();
                if (!doc.exists) throw new Error("Settlement record not found.");
                const data = doc.data();
                batch.delete(doc.ref);

                const jSnap = await db.collection('journal').doc(SCRAP_BUSINESS_ID).collection('entries')
                    .where('referenceType', '==', 'SCRAP_EXT_SETTLEMENT')
                    .where('reference', '==', id)
                    .get();
                
                let targetJournalDocs = jSnap.docs;
                if (targetJournalDocs.length === 0) {
                    const nameSnap = await db.collection('journal').doc(SCRAP_BUSINESS_ID).collection('entries')
                        .where('referenceType', '==', 'SCRAP_EXT_SETTLEMENT')
                        .where('reference', '==', data.customerName)
                        .get();
                    targetJournalDocs = nameSnap.docs.filter(j => Math.abs(num((j.data().entries || []).reduce((s,l)=>s+num(l.debit),0)) - Math.abs(num(data.amount))) < 0.01);
                }

                for (const jDoc of targetJournalDocs) {
                    const jData = jDoc.data();
                    if (Array.isArray(jData.entries)) {
                        const ledgerBase = db.collection("journal").doc(SCRAP_BUSINESS_ID).collection("account_ledger");
                        for (const line of jData.entries) {
                            const code = String(line.accountCode || "").trim() || "UNKNOWN";
                            const docId = code.replace(/\//g, "_");
                            batch.update(ledgerBase.doc(docId), {
                                totalDebit: firebase.firestore.FieldValue.increment(-num(line.debit)),
                                totalCredit: firebase.firestore.FieldValue.increment(-num(line.credit)),
                                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                            });
                        }
                    }
                    batch.delete(jDoc.ref);
                }
            } else if (type === 'ADV') {
                const doc = await db.collection('scrap_advance_history').doc(id).get();
                if (!doc.exists) throw new Error("Advance record not found.");
                const data = doc.data();
                const aRef = db.collection('scrap_advances').doc(advanceDocId(data.supplierName));
                
                // Reverse balance: If we issued (+), we subtract. If we applied (-), we add.
                batch.update(aRef, { balance: firebase.firestore.FieldValue.increment(-num(data.amount)) });
                batch.delete(doc.ref);

                // Delete associated Journal Entries and decrement ledger
                const jSnap = await db.collection('journal').doc(SCRAP_BUSINESS_ID).collection('entries')
                    .where('referenceType', '==', 'SCRAP_ADVANCE_ISSUE')
                    .where('reference', '==', data.supplierName)
                    .get();
                
                for (const jDoc of jSnap.docs) {
                    const jData = jDoc.data();
                    const totalDebit = (jData.entries || []).reduce((s,l)=>s+num(l.debit), 0);
                    if (Math.abs(totalDebit - Math.abs(num(data.amount))) > 0.01) continue;

                    if (Array.isArray(jData.entries)) {
                        const ledgerBase = db.collection("journal").doc(SCRAP_BUSINESS_ID).collection("account_ledger");
                        for (const line of jData.entries) {
                            const code = String(line.accountCode || "").trim() || "UNKNOWN";
                            const docId = code.replace(/\//g, "_");
                            batch.update(ledgerBase.doc(docId), {
                                totalDebit: firebase.firestore.FieldValue.increment(-num(line.debit)),
                                totalCredit: firebase.firestore.FieldValue.increment(-num(line.credit)),
                                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                            });
                        }
                    }
                    batch.delete(jDoc.ref);
                }
            } else if (type === 'SELL') {
                const doc = await db.collection('selling_history').doc(id).get();
                if (!doc.exists) throw new Error("Sale record not found.");
                const data = doc.data();
                
                // Put stock back
                if (Array.isArray(data.items)) {
                    for (const item of data.items) {
                        const iRef = db.collection('scrap_items').doc(item.id);
                        batch.update(iRef, { currentStock: firebase.firestore.FieldValue.increment(num(item.weight)) });
                    }
                }
                batch.delete(doc.ref);

                // Delete associated Journal Entries
                const jSnap = await db.collection('journal').doc(SCRAP_BUSINESS_ID).collection('entries')
                    .where('referenceType', '==', 'SCRAP_BILL')
                    .where('reference', '==', id)
                    .get();
                for (const jDoc of jSnap.docs) {
                    const jData = jDoc.data();
                    if (Array.isArray(jData.entries)) {
                        const ledgerBase = db.collection("journal").doc(SCRAP_BUSINESS_ID).collection("account_ledger");
                        for (const line of jData.entries) {
                            const code = String(line.accountCode || "").trim() || "UNKNOWN";
                            const docId = code.replace(/\//g, "_");
                            batch.update(ledgerBase.doc(docId), {
                                totalDebit: firebase.firestore.FieldValue.increment(-num(line.debit)),
                                totalCredit: firebase.firestore.FieldValue.increment(-num(line.credit)),
                                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                            });
                        }
                    }
                    batch.delete(jDoc.ref);
                }
            } else if (type === 'ACC') {
                const doc = await db.collection('journal').doc(SCRAP_BUSINESS_ID).collection('entries').doc(id).get();
                if (!doc.exists) throw new Error("Journal entry not found.");
                const data = doc.data();
                
                // Properly reverse the ledger
                if (Array.isArray(data.entries)) {
                    const ledgerBase = db.collection("journal").doc(SCRAP_BUSINESS_ID).collection("account_ledger");
                    for (const line of data.entries) {
                        const code = String(line.accountCode || "").trim() || "UNKNOWN";
                        const docId = code.replace(/\//g, "_");
                        batch.update(ledgerBase.doc(docId), {
                            totalDebit: firebase.firestore.FieldValue.increment(-num(line.debit)),
                            totalCredit: firebase.firestore.FieldValue.increment(-num(line.credit)),
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    }
                }
                batch.delete(doc.ref);
            } else if (type === 'EXP') {
                const doc = await db.collection('scrap_expenses').doc(id).get();
                if (!doc.exists) throw new Error("Expense record not found.");
                const data = doc.data();
                batch.delete(doc.ref);

                const jSnap = await db.collection('journal').doc(SCRAP_BUSINESS_ID).collection('entries')
                    .where('referenceType', '==', 'SCRAP_EXPENSE')
                    .get();
                
                for (const jDoc of jSnap.docs) {
                    const jData = jDoc.data();
                    if (Math.abs(num((jData.entries || []).reduce((s,l)=>s+num(l.debit),0)) - num(data.amount)) > 0.01) continue;
                    if (jData.reference !== data.expenseDate) continue;

                    if (Array.isArray(jData.entries)) {
                        const ledgerBase = db.collection("journal").doc(SCRAP_BUSINESS_ID).collection("account_ledger");
                        for (const line of jData.entries) {
                            const code = String(line.accountCode || "").trim() || "UNKNOWN";
                            const docId = code.replace(/\//g, "_");
                            batch.update(ledgerBase.doc(docId), {
                                totalDebit: firebase.firestore.FieldValue.increment(-num(line.debit)),
                                totalCredit: firebase.firestore.FieldValue.increment(-num(line.credit)),
                                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                            });
                        }
                    }
                    batch.delete(jDoc.ref);
                }
            }
            
            await batch.commit();
            alert("Transaction deleted and ledger adjusted successfully.");
            location.reload();
        } catch (e) {
            console.error("Delete failed:", e);
            alert("Error deleting transaction: " + e.message);
        }
    };

    document.getElementById('dailyTypeFilter').addEventListener('change', renderRows);
    document.getElementById('dailyRefFilter').addEventListener('change', renderRows);
    document.getElementById('dailyFromDate').addEventListener('change', renderRows);
    document.getElementById('dailyToDate').addEventListener('change', renderRows);
    document.getElementById('dailyExportBtn').addEventListener('click', () => {
        const rows = filteredRows();
        const csv = ['time,type,detail,amount'].concat(rows.map((r) => {
            const detail = String(r.d.action || r.d.supplierName || r.d.customerName || r.d.detail || '-').replace(/"/g, '""');
            const amount = Number(r.d.totalAmount || r.d.amount || 0);
            return `"${r.dt || ''}","${r.t}","${detail}",${amount}`;
        })).join('\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `dailytr_${new Date().toISOString().slice(0, 10)}.csv`;
        a.click();
        URL.revokeObjectURL(a.href);
    });

    document.getElementById('dailyClearAllBtn').addEventListener('click', async () => {
        const code = prompt('WARNING: This will permanently delete ALL buying, selling, events, and accounting history for this business.\n\nType "CONFIRM" to proceed:');
        if (code !== 'CONFIRM') return;

        const btn = document.getElementById('dailyClearAllBtn');
        const oldTxt = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Clearing...';

        try {
            const collections = [
                'buying_history',
                'selling_history',
                'scrap_event_log',
                'scrap_external_settlements',
                'scrap_advances',
                'scrap_advance_history',
                'scrap_expenses'
            ];

            for (const coll of collections) {
                const snap = await db.collection(coll).where('businessId', '==', SCRAP_BUSINESS_ID).get();
                const batch = db.batch();
                snap.docs.forEach(doc => batch.delete(doc.ref));
                await batch.commit();
            }

            // Journal entries and ledger summaries
            const journalRef = db.collection('journal').doc(SCRAP_BUSINESS_ID);
            const journalSnap = await journalRef.collection('entries').get();
            const jBatch = db.batch();
            journalSnap.docs.forEach(doc => jBatch.delete(doc.ref));
            await jBatch.commit();

            const ledgerSnap = await journalRef.collection('account_ledger').get();
            const lBatch = db.batch();
            ledgerSnap.docs.forEach(doc => lBatch.delete(doc.ref));
            await lBatch.commit();

            alert('Business history and accounting records cleared.');
            location.reload();
        } catch (err) {
            console.error('Clear All failed:', err);
            alert('Error clearing data: ' + err.message);
            btn.disabled = false;
            btn.textContent = oldTxt;
        }
    });

    renderRows();
}
