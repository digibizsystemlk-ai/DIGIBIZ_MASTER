<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="/core/pwa-init.js?v=1"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGIBIZ - History</title>
    <style>html.digibiz-sidebar-reserved body{margin-left:260px;}@media (max-width:768px){html.digibiz-sidebar-reserved body{margin-left:0;}}</style>
    <script>document.documentElement.classList.add('digibiz-sidebar-reserved');</script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
    <script src="/core/firebase-init.js?v=100"></script>
    <script src="/scripts/admin-impersonation.js?v=100"></script>
    <script src="../../core/event-validation.js?v=58"></script>
    <script src="../../core/event-bus.js?v=58"></script>
    <script src="../../core/accounts-core.js?v=58"></script>
    <script src="../../core/auth-roles.js?v=120"></script>
    <script src="../../core/business-types.js?v=58"></script>
    <script src="../../core/dashboard-core.js?v=58"></script>
    <script src="../../core/subscription-manager.js?v=58"></script>
    <script src="../../core/sidebar.js?v=2000"></script>
    <style>
        body{font-family:Inter,Segoe UI,sans-serif;background:#f5f7fb;color:#0f172a;}
        .page{padding:20px;}
        .card{background:#fff;border:1px solid #dbe4ee;border-radius:12px;padding:16px;margin-bottom:12px;}
        .small{font-size:12px;color:#64748b;}
        table{width:100%;border-collapse:collapse;font-size:13px;}
        th,td{padding:8px;border-bottom:1px solid #eef2f7;text-align:left;}
        th{background:#f8fafc;}
    </style>
</head>
<body>
<div class="page">
    <div class="card"><h1>History</h1><p class="small">Selling history in horizontal layout (latest first).</p></div>
    <div class="card" style="overflow:auto;"><table id="historyTable"></table></div>
</div>
<script>
let SCRAP_BUSINESS_ID = '';
const fmt = (v) => `LKR ${(Number(v)||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}`;
async function loadHistory() {
    if (!SCRAP_BUSINESS_ID) return;
    const [itemSnap, sellSnap] = await Promise.all([
        db.collection('scrap_items').where('businessId','==',SCRAP_BUSINESS_ID).get(),
        db.collection('selling_history').where('businessId','==',SCRAP_BUSINESS_ID).get()
    ]);
    const itemNames = itemSnap.docs.map((d)=>String(d.data().itemName||'').trim()).filter(Boolean).sort((a,b)=>a.localeCompare(b));
    const rows = sellSnap.docs.map((d)=>({ id:d.id, ...(d.data()||{}) }))
        .filter((r)=>r.archived !== true)
        .sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
    document.getElementById('historyTable').innerHTML = `
      <thead><tr><th>Date</th><th>Buyer Name</th><th>Total Weight</th><th>Total Amount</th>${itemNames.map((n)=>`<th>${n}</th>`).join('')}<th>Action</th></tr></thead>
      <tbody>
        ${rows.map((r)=>{
            const map = {};
            (Array.isArray(r.items)?r.items:[]).forEach((line)=>{ map[String(line.itemName||'').trim()] = Number(line.qty)||0; });
            return `<tr><td>${r.date ? new Date(r.date).toLocaleString() : '-'}</td><td>${r.buyerName||'-'}</td><td>${(Number(r.totalWeight)||0).toFixed(2)}</td><td>${fmt(r.totalAmount||0)}</td>${itemNames.map((n)=>`<td>${(map[n]||0).toFixed(2)}</td>`).join('')}<td><button data-del="${r.id}" style="padding:6px 10px;background:#dc2626;color:#fff;border:none;border-radius:8px;cursor:pointer;">Delete</button></td></tr>`;
        }).join('') || `<tr><td colspan="${5+itemNames.length}">No selling history</td></tr>`}
      </tbody>`;

    document.querySelectorAll('#historyTable button[data-del]').forEach((btn)=>{
        btn.addEventListener('click', async () => {
            const id = btn.getAttribute('data-del');
            if (!id) return;
            if (!confirm('Delete this selling history record?')) return;
            await db.collection('selling_history').doc(id).set({
                archived: true,
                archivedAt: new Date().toISOString(),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
            await loadHistory();
        });
    });
}
auth.onAuthStateChanged(async (user) => {
    if (!user) { window.location.href='/'; return; }
    
    // Dynamic Business Context
    let businessId = user.uid;
    if (window.dashboardCore && typeof window.dashboardCore.getContext === 'function') {
        const ctx = await window.dashboardCore.getContext(user);
        businessId = String((ctx && ctx.businessId) || user.uid);
    } else {
        const userDoc = await db.collection('users').doc(user.uid).get();
        businessId = userDoc.exists ? (userDoc.data().businessId || user.uid) : user.uid;
    }
    
    const bizDoc = await db.collection('businesses').doc(businessId).get();
    const businessType = bizDoc.exists ? String(bizDoc.data().businessType || '').toLowerCase() : '';
    
    if (businessType !== 'scrap_collection_center') {
        window.location.href = '/modules/core/dashboard.html';
        return;
    }
    
    SCRAP_BUSINESS_ID = businessId;
    await loadHistory();
});
</script>
</body>
</html>
