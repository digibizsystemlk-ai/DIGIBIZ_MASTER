name: digibiz_sms_gateway
description: "A new Flutter project for DigiBiz SMS Gateway."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.1.0
  firebase_database: ^11.0.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  permission_handler: ^11.3.1
  # මෙන්න මෙතනයි ලොකුම වෙනස කළේ. 
  # Huawei Nova 2i සහ ZTE දෙකටම 'Namespace' ප්‍රශ්න නැතුව වැඩ කරන්නේ මේකයි.
  telephony: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true