apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: digibiz-e2e-runner
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    spec:
      taskCount: 1
      template:
        spec:
          maxRetries: 0
          timeoutSeconds: 3600
          serviceAccountName: digibiz-e2e-runner@PROJECT_ID.iam.gserviceaccount.com
          containers:
            - image: REGION-docker.pkg.dev/PROJECT_ID/digibiz/e2e-runner:latest
              env:
                - name: PLAYWRIGHT_BASE_URL
                  value: https://digibiz-sys.web.app
                - name: E2E_RESULTS_BUCKET
                  value: PROJECT_ID-e2e-results
                # Set in job or Secret Manager:
                # - E2E_BDK_PASSWORD
                # Runtime override from callable function:
                # - RUN_ID
                # - E2E_SELECTED_TESTS
                # - E2E_TARGET_EMAIL
                # - E2E_TARGET_BUSINESS_ID
