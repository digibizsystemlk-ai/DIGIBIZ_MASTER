<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGIBIZ - Cash Counting (Rasika Special)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
    <script src="../../core/firebase-init.js?v=60"></script>
    <script src="../../core/dashboard-core.js?v=117"></script>
    <script src="../../core/sidebar.js?v=1008"></script>
    <script src="../../core/scrap-vba-core.js?v=78"></script>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --bg: #f8fafc;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--primary);
            display: flex;
        }

        #sidebar-container { width: 260px; flex-shrink: 0; }

        .content {
            flex: 1;
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 900;
            margin: 0;
            letter-spacing: -1px;
            color: #0f172a;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .summary-card {
            background: #fff;
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .summary-card label {
            display: block;
            font-size: 13px;
            font-weight: 800;
            color: #64748b;
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .summary-card .value {
            font-size: 32px;
            font-weight: 900;
            font-family: 'Inter', monospace;
        }

        .denom-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .denom-card {
            background: #fff;
            padding: 24px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            border: 1px solid #e2e8f0;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
        }

        .denom-card:focus-within {
            border-color: var(--accent);
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.1);
            transform: translateY(-2px);
        }

        .denom-label {
            width: 90px;
            font-size: 20px;
            font-weight: 900;
            color: #1e293b;
            background: #f1f5f9;
            padding: 10px;
            border-radius: 12px;
            text-align: center;
        }

        .denom-input-wrap {
            flex: 1;
        }

        .denom-input-wrap input {
            width: 100%;
            border: 2px solid #e2e8f0;
            padding: 14px;
            border-radius: 14px;
            font-size: 24px;
            font-weight: 800;
            text-align: right;
            outline: none;
            color: #0f172a;
            background: #fafafa;
        }

        .denom-input-wrap input:focus {
            background: #fff;
            border-color: var(--accent);
        }

        .denom-total {
            width: 110px;
            text-align: right;
            font-size: 18px;
            font-weight: 800;
            color: #94a3b8;
        }

        .actions {
            margin-top: 50px;
            display: flex;
            gap: 20px;
            padding-bottom: 60px;
        }

        button {
            padding: 18px 40px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary { 
            background: var(--accent); 
            color: #fff;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.2);
        }
        
        .btn-danger { 
            background: #fff; 
            color: var(--danger); 
            border: 2px solid #fee2e2;
        }
        
        button:hover { 
            transform: translateY(-2px); 
            filter: brightness(1.1);
        }

        .btn-danger:hover {
            background: #fef2f2;
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar-container { width: 100%; }
            .content { padding: 20px; }
            .summary-grid { grid-template-columns: 1fr; }
            .denom-grid { grid-template-columns: 1fr; }
        }

        @media print {
            #sidebar-container, .actions, .header { display: none !important; }
            .content { padding: 0; width: 100%; }
            .summary-card { box-shadow: none; border: 1px solid #ccc; }
            .denom-card { break-inside: avoid; }
        }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>

    <div class="content">
        <div class="header">
            <h1>Cash Counting</h1>
            <div id="lastSync" style="font-size: 14px; font-weight: 600; color: #64748b; background: #fff; padding: 8px 16px; border-radius: 20px; border: 1px solid #e2e8f0;">සජීවීව යාවත්කාලීන වේ...</div>
        </div>

        <div class="summary-grid">
            <div class="summary-card" id="physicalCard">
                <label>අතේ ඇති මුදල (Physical)</label>
                <div class="value" id="physicalTotal">Rs 0.00</div>
            </div>
            <div class="summary-card" style="background: #f0f7ff;">
                <label>පද්ධතියේ මුදල (System)</label>
                <div class="value" id="systemTotal" style="color: var(--accent);">Rs 0.00</div>
            </div>
            <div class="summary-card" id="diffCard">
                <label>වෙනස (Difference)</label>
                <div class="value" id="diffTotal">Rs 0.00</div>
            </div>
        </div>

        <div class="denom-grid" id="denomGrid">
            <!-- Denominations -->
        </div>

        <div class="actions">
            <button class="btn-danger" onclick="clearAll()">
                <span>🗑️</span> Clear All Data
            </button>
        </div>
    </div>

    <script>
        let SCRAP_BUSINESS_ID = null;
        let systemBalance = 0;
        let physicalBalance = 0;

        const denoms = [5000, 1000, 500, 100, 50, 20, 10, 5, 2, 1];

        function initGrid() {
            const container = document.getElementById('denomGrid');
            container.innerHTML = denoms.map(d => `
                <div class="denom-card">
                    <div class="denom-label">Rs ${d}</div>
                    <div class="denom-input-wrap">
                        <input type="number" class="denom-input" data-val="${d}" placeholder="0" oninput="calculate()">
                    </div>
                    <div class="denom-total" id="total_${d}">0</div>
                </div>
            `).join('');
            loadSaved();
        }

        async function calculate() {
            let total = 0;
            const counts = {};
            document.querySelectorAll('.denom-input').forEach(input => {
                const val = Number(input.dataset.val);
                const qty = Number(input.value) || 0;
                const sub = val * qty;
                total += sub;
                counts[val] = qty;
                document.getElementById(`total_${val}`).textContent = sub.toLocaleString();
            });

            physicalBalance = total;
            document.getElementById('physicalTotal').textContent = `Rs ${total.toLocaleString(undefined, {minimumFractionDigits:2})}`;
            
            const diff = physicalBalance - systemBalance;
            const diffEl = document.getElementById('diffTotal');
            const diffCard = document.getElementById('diffCard');
            
            diffEl.textContent = `Rs ${diff.toLocaleString(undefined, {minimumFractionDigits:2})}`;
            
            if (Math.abs(diff) < 0.01) {
                diffEl.style.color = 'var(--success)';
                diffCard.style.borderColor = 'var(--success)';
                diffCard.style.background = '#f0fdf4';
            } else if (diff > 0) {
                diffEl.style.color = 'var(--accent)';
                diffCard.style.borderColor = 'var(--accent)';
                diffCard.style.background = '#f0f7ff';
            } else {
                diffEl.style.color = 'var(--danger)';
                diffCard.style.borderColor = 'var(--danger)';
                diffCard.style.background = '#fef2f2';
            }

            localStorage.setItem('scrap_cash_counts', JSON.stringify(counts));
        }

        async function fetchSystemBalance() {
            if (!SCRAP_BUSINESS_ID) return;
            try {
                if (window.dashboardCore && typeof window.dashboardCore.getMetrics === 'function') {
                    const ctx = { businessId: SCRAP_BUSINESS_ID, businessType: 'scrap_collection_center' };
                    const metrics = await window.dashboardCore.getMetrics(ctx);
                    systemBalance = Number(metrics.cashBalance) || 0;
                    document.getElementById('systemTotal').textContent = `Rs ${systemBalance.toLocaleString(undefined, {minimumFractionDigits:2})}`;
                    calculate();
                    document.getElementById('lastSync').textContent = 'යාවත්කාලීන විය: ' + new Date().toLocaleTimeString();
                }
            } catch (e) { console.warn(e); }
        }

        function loadSaved() {
            try {
                const saved = localStorage.getItem('scrap_cash_counts');
                if (saved) {
                    const counts = JSON.parse(saved);
                    document.querySelectorAll('.denom-input').forEach(input => {
                        const val = input.dataset.val;
                        if (counts[val]) input.value = counts[val];
                    });
                    calculate();
                }
            } catch (e) {}
        }

        function clearAll() {
            if (confirm('සියලුම දත්ත මකා දැමීමට ඔබට සහතිකද?')) {
                document.querySelectorAll('.denom-input').forEach(i => i.value = '');
                calculate();
            }
        }

        firebase.auth().onAuthStateChanged(async (user) => {
            if (!user) { window.location.href = '/'; return; }
            
            if (window.dashboardCore && typeof window.dashboardCore.getContext === 'function') {
                const ctx = await window.dashboardCore.getContext(user);
                SCRAP_BUSINESS_ID = ctx.businessId;
            } else {
                const ud = await db.collection('users').doc(user.uid).get();
                SCRAP_BUSINESS_ID = ud.exists ? ud.data().businessId : user.uid;
            }
            
            // Sidebar Init
            if (window.Sidebar) {
                new Sidebar();
            }

            await fetchSystemBalance();
            setInterval(fetchSystemBalance, 30000); 
        });

        initGrid();
    </script>
</body>
</html>
