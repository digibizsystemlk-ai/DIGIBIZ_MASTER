<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f3b2c"/>
      <stop offset="100%" stop-color="#062118"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="112" stroke="url(#emeraldGrad)" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Shopping Bag Body -->
  <g filter="url(#shadow)">
    <!-- Bag Handles -->
    <path d="M206 170 C206 120, 306 120, 306 170" stroke="url(#goldGrad)" stroke-width="24" stroke-linecap="round" fill="none"/>
    
    <!-- Main Bag Body -->
    <path d="M146 170 H366 L386 390 C386 406, 372 420, 356 420 H156 C140 420, 126 406, 126 390 L146 170 Z" fill="url(#emeraldGrad)"/>
    
    <!-- Barcode Stripes on Bag -->
    <rect x="180" y="230" width="12" height="120" rx="4" fill="#ffffff" opacity="0.9"/>
    <rect x="204" y="230" width="20" height="120" rx="4" fill="#ffffff" opacity="0.9"/>
    <rect x="236" y="230" width="8" height="120" rx="4" fill="#ffffff" opacity="0.9"/>
    <rect x="256" y="230" width="24" height="120" rx="4" fill="#ffffff" opacity="0.9"/>
    <rect x="292" y="230" width="12" height="120" rx="4" fill="#ffffff" opacity="0.9"/>
    <rect x="316" y="230" width="16" height="120" rx="4" fill="#ffffff" opacity="0.9"/>

    <!-- Glowing Checkmark Circle Badge -->
    <circle cx="340" cy="340" r="54" fill="url(#goldGrad)"/>
    <path d="M316 340 L332 356 L366 322" stroke="#0f3b2c" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
