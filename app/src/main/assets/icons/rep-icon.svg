<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="repBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f3b2c"/>
      <stop offset="50%" stop-color="#09281e"/>
      <stop offset="100%" stop-color="#04140f"/>
    </linearGradient>
    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="emeraldHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="120" fill="url(#repBgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="112" stroke="url(#emeraldHighlight)" stroke-opacity="0.4" stroke-width="6"/>

  <!-- Sales Rep Head / Avatar -->
  <circle cx="256" cy="140" r="55" fill="url(#goldHighlight)"/>
  
  <!-- Rep Suit / Collar -->
  <path d="M140 270 C140 200, 372 200, 372 270 L350 280 L256 240 L162 280 Z" fill="url(#emeraldHighlight)"/>

  <!-- Order Tablet held by Rep -->
  <rect x="156" y="230" width="200" height="240" rx="20" fill="#ffffff" stroke="url(#goldHighlight)" stroke-width="8"/>
  <rect x="176" y="255" width="160" height="24" rx="6" fill="#0f766e"/>
  
  <!-- Tablet Checkmark & Lines -->
  <path d="M190 310 L205 325 L235 295" stroke="#10b981" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="250" y="305" width="76" height="12" rx="6" fill="#64748b"/>
  
  <path d="M190 360 L205 375 L235 345" stroke="#10b981" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="250" y="355" width="76" height="12" rx="6" fill="#64748b"/>
  
  <rect x="190" y="410" width="136" height="30" rx="10" fill="url(#goldHighlight)"/>
  <text x="256" y="430" font-family="'Inter', sans-serif" font-weight="900" font-size="14" fill="#0f3b2c" text-anchor="middle">DIGIBIZ REP</text>
</svg>
