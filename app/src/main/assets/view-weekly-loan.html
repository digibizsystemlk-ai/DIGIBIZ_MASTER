<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Summary - DIGIBIZ</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
    <script src="/core/firebase-init.js?v=201"></script>
    <script src="/core/scrap-weekly-loans.js?v=201"></script>

    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f1f5f9;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--primary);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 500px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            padding: 32px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        .logo { font-weight: 800; font-size: 24px; text-align: center; margin-bottom: 32px; letter-spacing: -1px; }
        .logo span { color: var(--accent); }

        .customer-name { font-size: 22px; font-weight: 800; margin-bottom: 8px; text-align: center; }
        .loan-id { font-size: 11px; color: #64748b; text-align: center; margin-bottom: 32px; text-transform: uppercase; letter-spacing: 1px; }

        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 32px; }
        .stat-item { background: #f8fafc; padding: 16px; border-radius: 16px; text-align: center; border: 1px solid #e2e8f0; }
        .stat-label { font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 4px; }
        .stat-val { font-size: 18px; font-weight: 800; }

        .schedule-title { font-size: 14px; font-weight: 700; margin-bottom: 16px; color: #64748b; text-transform: uppercase; }
        .schedule-item { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid #f1f5f9; }
        .schedule-date { font-weight: 600; font-size: 14px; }
        .schedule-amt { font-weight: 800; font-size: 15px; }

        .status-badge { font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 6px; text-transform: uppercase; }
        .status-pending { background: #fef3c7; color: #92400e; }
        .status-paid { background: #dcfce7; color: #166534; }
        .status-overdue { background: #fee2e2; color: #991b1b; }
        .pro-rata-badge { font-size: 9px; background: #dbeafe; color: #1e40af; padding: 2px 6px; border-radius: 4px; margin-left: 6px; font-weight: 800; }

        .footer { font-size: 12px; color: #64748b; text-align: center; max-width: 400px; }
        #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 100; font-weight: 800; }
    </style>
</head>
<body>

    <div id="loading">දත්ත ලබාගනිමින් පවතී...</div>

    <div class="card" id="mainCard" style="display: none;">
        <div class="logo" style="color: var(--accent); margin-bottom: 5px;">අපේ කඩේ</div>
        <div style="text-align: center; font-size: 12px; font-weight: 800; color: #64748b; margin-bottom: 30px; letter-spacing: 2px;">WEEKLY LOAN</div>
        
        <div class="customer-name" id="customerName">-</div>
        <div class="loan-id" id="loanId">-</div>

        <div class="stat-grid">
            <div class="stat-item">
                <div class="stat-label">Principal</div>
                <div class="stat-val" id="valPrincipal">Rs. 0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Weekly Pay</div>
                <div class="stat-val" id="valWeekly" style="color: var(--accent);">Rs. 0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Total Paid</div>
                <div class="stat-val" id="valPaid" style="color: var(--success);">Rs. 0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Remaining</div>
                <div class="stat-val" id="valRemain">Rs. 0</div>
            </div>
        </div>

        <div id="preferredDayInfo" style="text-align: center; font-size: 13px; font-weight: 600; color: var(--accent); margin-bottom: 24px;"></div>

        <div class="schedule-title">Installment Schedule</div>
        <div id="scheduleContainer"></div>
    </div>

    <div class="footer">
        මෙය ස්වයංක්‍රීයව උත්පාදනය කරන ලද වාර්තාවකි. කිසියම් ගැටළුවක් ඇත්නම් කරුණාකර ඔබගේ සේවා සපයන්නා අමතන්න.
        <br><br>
        Powered by DIGIBIZ™
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const loanId = urlParams.get('id');
        const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

        document.addEventListener('DOMContentLoaded', async () => {
            if (!loanId) {
                console.error("[ViewLoan] No Loan ID provided in URL");
                document.getElementById('loading').textContent = 'Invalid Loan ID';
                return;
            }

            try {
                const db = window.db;
                if (!db) throw new Error("Firebase DB not initialized");

                console.log("[ViewLoan] Fetching loan:", loanId);
                const doc = await db.collection('weekly_loans').doc(loanId).get();
                if (!doc.exists) {
                    console.error("[ViewLoan] Loan not found in Firestore:", loanId);
                    document.getElementById('loading').textContent = 'Loan record not found';
                    return;
                }

                let data = doc.data();
                console.log("[ViewLoan] Data loaded:", data.customerName);

                if (window.WeeklyLoanCore) {
                    data = window.WeeklyLoanCore.refreshScheduleStatus(data);
                }

                renderData(data);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('mainCard').style.display = 'block';
            } catch (e) {
                console.error("[ViewLoan] FATAL ERROR:", e);
                document.getElementById('loading').textContent = 'Error loading data: ' + e.message;
            }
        });

        function renderData(l) {
            document.getElementById('customerName').textContent = l.customerName;
            document.getElementById('loanId').textContent = `Loan Ref: ${loanId.slice(-8)}`;
            
            document.getElementById('valPrincipal').textContent = `Rs. ${l.principal.toLocaleString()}`;
            document.getElementById('valWeekly').textContent = `Rs. ${l.standardWeekly.toLocaleString()}`;
            
            const totalPaid = l.schedule.reduce((s, i) => s + (i.paidAmount || 0), 0);
            document.getElementById('valPaid').textContent = `Rs. ${totalPaid.toLocaleString()}`;
            document.getElementById('valRemain').textContent = `Rs. ${(l.totalPayable - totalPaid).toLocaleString()}`;

            if (l.preferredDay !== undefined) {
                document.getElementById('preferredDayInfo').textContent = `Preferred Payment Day: ${DAYS[l.preferredDay]}`;
            }

            const container = document.getElementById('scheduleContainer');
            container.innerHTML = l.schedule.map(i => {
                const penalty = Math.round(i.overdueInterest || 0);
                const hasPenalty = penalty > 0;
                return `
                    <div class="schedule-item">
                        <div>
                            <div class="schedule-date">${i.dueDate} ${i.isProRata ? '<span class="pro-rata-badge">Pro-rata</span>' : ''}</div>
                            <div style="font-size: 11px; color: #64748b;">Installment #${i.installmentNo}</div>
                            ${i.paidAmount ? `<div style="font-size: 11px; color: var(--success); font-weight: 600; margin-top: 4px;">Paid: Rs. ${Number(i.paidAmount).toLocaleString()}${i.paymentDate ? ` on ${i.paymentDate}` : ''}</div>` : ''}
                            ${i.paidPenalty ? `<div style="font-size: 11px; color: var(--warning); font-weight: 600; margin-top: 2px;">Penalty Paid: Rs. ${Number(i.paidPenalty).toLocaleString()}</div>` : ''}
                            ${hasPenalty ? `<div style="font-size: 10px; color: var(--danger); margin-top: 4px;">Base: Rs. ${i.amount.toLocaleString()} + Penalty: Rs. ${penalty.toLocaleString()} (${i.daysOverdue} days overdue, 10%/mo compounded daily)</div>` : ''}
                        </div>
                        <div style="text-align: right;">
                            <div class="schedule-amt">Rs. ${Math.round(i.amount + penalty).toLocaleString()}</div>
                            <span class="status-badge status-${i.status.toLowerCase()}">${i.status}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
