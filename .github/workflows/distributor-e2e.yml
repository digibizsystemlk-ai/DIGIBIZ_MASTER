name: Distributor E2E (Playwright)

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BASE_URL: https://digibiz-sys.web.app
      E2E_BDK_EMAIL: ${{ secrets.E2E_BDK_EMAIL }}
      E2E_BDK_PASSWORD: ${{ secrets.E2E_BDK_PASSWORD }}
      E2E_BDK_BUSINESS_ID: ${{ secrets.E2E_BDK_BUSINESS_ID }}
      E2E_REP_ID: ${{ secrets.E2E_REP_ID }}
      E2E_SHOP_ID: ${{ secrets.E2E_SHOP_ID }}
      E2E_LORRY_ID: ${{ secrets.E2E_LORRY_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Write Firebase service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > serviceAccountKey.json

      - name: Bootstrap E2E data
        run: npm run e2e:setup-data

      - name: Run distributor E2E suite
        run: npx playwright test tests/e2e --project=chromium

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-distributor-e2e
          path: playwright-report/
          retention-days: 14
